[package]
name = "komira_libc"
version = "0.1.0"
description = "The libc and POSIX layer every package shares: one getenv, the access probes and pthread_self, file and memory-map syscall wrappers with the C shim symbols they call, chunked large writes, an RAII file descriptor."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.0.0"]

[native.komira_libc_posix]
kind = "static"
srcs = ["native/komira_libc_posix.c"]

[targets]
lib = { path = "src/komira_libc" }
tests = ["tests"]
