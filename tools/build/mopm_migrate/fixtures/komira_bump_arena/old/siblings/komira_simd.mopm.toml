[package]
name = "komira_simd"
version = "0.1.0"
description = "SIMD primitives in Mojo with no dependencies: byte-class masks, substring search, popcount, bit-unpacking, validity packing, compress, gather, blend, horizontal adds and a bulk byte copy."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.0.0"]

[targets]
lib = { path = "src/komira_simd" }
tests = ["tests"]
