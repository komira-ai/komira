syntax = "proto3";

package komira.test.refuse.bytes_in_url;

import "google/api/annotations.proto";

service S {
  rpc M(Req) returns (Req) {
    option (google.api.http) = { get: "/v1/things/{blob}" };
  }
}

// `blob` is a path variable: proto3 JSON writes `bytes` as base64, whose `/`
// and `+` this client does not put into a path segment. (A `bytes` query
// field is sent, base64 and percent-encoded.)
message Req {
  bytes blob = 1;
}
