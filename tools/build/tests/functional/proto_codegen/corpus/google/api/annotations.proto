// The `(google.api.http)` method option, for the REST goldens: only what
// protoc-gen-mojo reads, under the import path, package, field numbers and
// extension number of googleapis' google/api/http.proto and
// google/api/annotations.proto, so a fixture imports it as a real API does.
syntax = "proto3";

package google.api;

import "google/protobuf/descriptor.proto";

extend google.protobuf.MethodOptions {
  HttpRule http = 72295728;
}

message HttpRule {
  string selector = 1;
  oneof pattern {
    string get = 2;
    string put = 3;
    string post = 4;
    string delete = 5;
    string patch = 6;
  }
  string body = 7;
  repeated HttpRule additional_bindings = 11;
}
