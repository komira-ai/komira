// The `(google.api.default_host)` service option, for the REST goldens: only
// what protoc-gen-mojo reads, under the import path, package and extension
// number of googleapis' google/api/client.proto, so a fixture imports it as
// a real API does.
syntax = "proto3";

package google.api;

import "google/protobuf/descriptor.proto";

extend google.protobuf.ServiceOptions {
  string default_host = 1049;
}
