// The tiny gRPC API of komira//tools/build/proto-codegen/gcp_grpc (its
// example/tiny/v1/tiny.proto, whose generated client is compiled and tested
// there), one method of each streaming shape, for the text golden of a
// Google Cloud gRPC client (`gcp=true`).
syntax = "proto3";

package example.tiny.v1;

service TinyService {
  rpc GetThing(GetThingRequest) returns (Thing);
  rpc WatchThings(WatchThingsRequest) returns (stream Thing);
  rpc UploadThings(stream Thing) returns (UploadThingsResponse);
  rpc SyncThings(stream Thing) returns (stream Thing);
}

message GetThingRequest {
  string name = 1;
}

message WatchThingsRequest {
  string prefix = 1;
}

message Thing {
  string name = 1;
  int64 size = 2;
}

message UploadThingsResponse {
  int64 count = 1;
}
