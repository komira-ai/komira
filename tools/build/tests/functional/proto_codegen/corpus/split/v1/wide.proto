// A proto library too large for one generated file: its ten messages of
// fourteen fields each come to well over 1000 lines of Mojo, so the plugin
// writes `wide.mojo` as a facade and the messages in `_parts/`. Wide10 holds
// a Wide01 and Wide01 a Wide10 (and Wide06 a Shade), so each of the two parts
// imports the other.
syntax = "proto3";

package komira.split.v1;

enum Shade {
  SHADE_UNSET = 0;
  SHADE_LIGHT = 1;
  SHADE_DARK = 2;
}

message Wide01 {
  int32 count = 1;
  string label = 2;
  bool flag = 3;
  double ratio = 4;
  bytes payload = 5;
  repeated string tags = 6;
  int64 total = 7;
  uint32 mask = 8;
  float weight = 9;
  string note = 10;
  repeated int32 steps = 11;
  bool done = 12;
  string owner = 13;
  int32 rank = 14;
  Wide10 last = 15;
}

