# fixture_v1.yaml below its header comment, with one line added:
# `response_body: done` on the CancelOperation rule.
type: google.api.Service
config_version: 3
name: fixture.googleapis.com
title: Fixture API

apis:
- name: fixture.v1.Things

documentation:
  summary: |-
    Not read by the generator: a block scalar outside `http`.

http:
  rules:
  - selector: mixin.v1.Operations.GetOperation
    get: '/v9/{name=projects/*/operations/*}'
    additional_bindings:
    - get: '/v9/{name=folders/*/operations/*}'
  - selector: mixin.v1.Operations.WaitOperation
    post: '/v9/{name=projects/*/operations/*}:wait'
    body: '*'
  - selector: mixin.v1.Operations.CancelOperation
    post: '/v9/{name=projects/*/operations/*}:cancel'
    body: spec
    response_body: done
  - selector: mixin.v1.Operations.ListOperations
    get: '/v9/{name=projects/*}/operations'
  - selector: mixin.v1.Operations.DeleteOperation
    delete: '/v9/{name=projects/*/operations/*}'
