# actionlint configuration (read by //:workflow_lint).
#
# No workflow runs on a self-hosted runner: every workflow uses a GitHub-hosted
# runner, joined to the farm's tailnet where it builds (docs/ci.md, "The
# runner"), so no self-hosted runner label is declared. A workflow that names
# one is then an actionlint finding.
self-hosted-runner:
  labels: []
