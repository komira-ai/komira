# main-red: when a push run of main fails, find the pull requests that
# could have broken it and open an issue `main red: <target>`; when a later
# run of main is green, close it (docs/ci.md, "main_red.yml"). There is no
# merge queue: a red main is fixed forward or the culprit reverted within
# the hour, and this issue is what starts that clock.
#
# It runs on `workflow_run` of the workflows named below completing on main,
# so it runs once per run that ends, whatever its conclusion; the program
# reads the run back and acts only on a run started by a PUSH to main (a
# manual run may build another revision):
#   failure, timed_out, startup_failure  open the issue, or comment on the
#                                        open one, with the run, the head,
#                                        the last green commit, the culprit
#                                        pull requests, the failing targets
#                                        and the key log lines
#   success                              close every open `main-red` issue
#                                        whose recorded heads it contains
#   cancelled, skipped                   nothing
# The program is //release/ci:main_red (release/ci/main_red.zig; its header
# is the issue contract), built on the farm by the step below and run as the
# binary that build produced; its cases are //release/ci/tests:test_main_red,
# which the build runs. It names no workflow itself: every workflow it reads
# is a `--workflow <name>` flag of the step, and each must also be in
# `workflows:` of the trigger (a name in only one of them is never read, or
# never started). A push-to-main workflow is added to both lists in the pull
# request that introduces it, so no run of main goes unwatched in between.
# `release` is the release workflow's name. `kci` is the name of the release
# workflow it replaced: its file is deleted and it starts no run, but GitHub
# keeps a deleted workflow and its runs in the API, so the program still reads
# its successful pushes to main as last-green candidates, and the first red run
# of `release` names its culprits from kci's last green instead of "unknown".
# Drop `kci` from both lists once `release` has a green push of its own.
#
# WHY NO RED IS HIDDEN. The push runs of the watched workflows share a
# concurrency group with cancel-in-progress false: a running release is
# never cancelled, and a newer push replaces only a PENDING run, which never
# started. The run that replaces it builds main at a later commit, which
# carries every change of the replaced one, and the culprits are read from
# the whole range since the last green commit, so a replaced commit's pull
# request is still named. This workflow has NO concurrency group: no run of
# it is ever replaced or cancelled by another, so every run that ends is
# seen; if two red runs race, the program closes the newer issue as a
# duplicate of the older. A run of this workflow that fails (an API error,
# or the build) is itself red in the Actions tab.
#
# It runs no code from any pull request: `workflow_run` runs this file as it
# is on main, and the checkout is main's. The build runs on the farm like the
# pull request's check, so the job holds the `id-token: write` the farm
# connection exchanges and no more than the issues need: `issues: write`
# (the issue, its comments and the label), `actions: read` (the run, its jobs
# and their logs), `contents: read` (the checkout, the compare and the
# commits' pull requests). Every action is pinned.
name: main-red

on:
  workflow_run:
    workflows: [release, kci]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  alert:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      issues: write
      actions: read
      contents: read
      # for farm-connect only: the token Tailscale trusts
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/farm-connect
        with:
          ts-client-id: ${{ vars.TS_CLIENT_ID }}
          ts-audience: ${{ vars.TS_AUDIENCE }}
          farm-address: ${{ vars.FARM_ADDRESS }}
          farm-instance: ${{ vars.FARM_INSTANCE }}
          farm-properties: ${{ vars.FARM_LINUX_X86_64_PROPERTIES }}
          tls: ${{ vars.FARM_TLS || 'false' }}
      - name: the buckconfig names the farm (else this job would build on the runner)
        run: |
          ./buck2 audit config komira_re.linux_x86_64_properties --style json | grep -q '": *"[^"]'
      - name: build //release/ci:main_red
        run: ./buck2 build //release/ci:main_red --out "$RUNNER_TEMP/main_red"
      - name: main_red
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: '"$RUNNER_TEMP/main_red" --repo "$GITHUB_REPOSITORY" --run-id "$RUN_ID" --workflow release --workflow kci'
      - name: Stop buck2
        if: always()
        run: ./buck2 kill || true
