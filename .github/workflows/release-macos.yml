# The macOS arm64 build of komira's mopm packages, on the farm's macOS workers (docs/ci.md, "The macOS
# build of the release"). It builds //release:mopm_darwin_libs (release/darwin_libs.bzl: the library of
# every mopm package that builds for macOS, each with its welded tests) for `--target-platforms
# komira//tools/build/platforms:darwin-arm64`: the compiles and the tests run on the farm's macOS
# workers through the farm connection, never on a GitHub-hosted macOS runner (the job runs on an ubuntu
# runner and only asks the farm). The whole set is built here, after the merge (the macOS Python harness
# tests are in it too): this workflow has no pull_request, pull_request_target or merge_group trigger.
# Before the merge, pr.yml's macOS part builds only the libraries of the set a change reaches (docs/ci.md,
# "The macOS part of the check"), so a merge group's commit leaves this build those actions in the cache;
# no other workflow that runs on a pull request names the macOS worker set (//:release_macos_cases says
# so). pr.yml's last step also configures and analyses the whole set and the Python harness tests for
# darwin-arm64, running no action
# (release/darwin_analysis.bxl).
#
# ITS OWN WORKFLOW. release.yml is one concurrency group in which a running release is never cancelled;
# this workflow is in the group `release-macos-<ref>` with `cancel-in-progress: true`: a newer push
# replaces a running macOS build instead of queueing behind it, and nothing in release.yml waits on it
# or reads its result, so its Python harness tests never hold a release. The packages the release
# publishes for macOS are another build of this set, inside release.yml's mopm-stage
# (//release:mopm_release_artifacts), so a stalled Mac build there does hold the release.
#
# Triggers: the same as release.yml's, so it builds the same commit once per release (never per pull
# request): a push to main (not a documentation-only one) and a manual run, and nothing else.
#
# NOT BLOCKING: nothing waits on this workflow. A red macOS build is a failed run of this
# workflow (and a line in its summary), and the release and main-red do not read it: none of them
# `needs` it or reads its result. The job is not `continue-on-error`, which would end a failed build
# green. The macOS packages the release publishes are not taken from here: release.yml's `mopm-stage`
# builds this set again, in the same configuration (so from this workflow's cache), as the osx-arm64
# half of //release:mopm_release_artifacts, and a failure there stops the publish (docs/ci.md, "The
# macOS build of the release"). Bounded: 90 minutes.
# The last job, release-macos-result, makes a build that never ran (its job skipped) end the run
# failed too, with "the macOS build did not run", and for a failed build says which step failed and,
# when it was a buck2 step, what buck2 said (release/ci:buck2_failure reads the step's log).
#
# It needs the repository variables FARM_DARWIN_ARM64_PROPERTIES and FARM_DARWIN_MACOS_HOSTS (and may
# take FARM_MACOS_LIBRARY_DIRS), docs/ci.md; without them the step after the connection fails the job
# and says so, instead of building on the runner.
#
# The job holds `contents: read` and the `id-token: write` that the farm connection exchanges for the
# tailnet, nothing else, in the environment `build`. Every action is pinned.
name: release-macos

on:
  push:
    branches: [main]
    # documentation only: no release, so no macOS build (the same paths as release.yml)
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-macos:
    runs-on: ubuntu-24.04
    environment: build
    timeout-minutes: 90
    permissions:
      contents: read
      # for farm-connect only: the token Tailscale trusts
      id-token: write
    # What release-macos-result prints for a failed build, ready as one line: buck2_failure's message
    # when a buck2 step failed (what buck2 printed, escaped for a workflow command), else the first
    # named step that failed; empty when none did (the checkout or farm-connect failed).
    outputs:
      report: ${{ steps.said.outputs.message || (steps.config.outcome == 'failure' && 'step `the buckconfig names the farm and its macOS workers` failed (its log says why)') || (steps.assert.outcome == 'failure' && 'step `build the farm assertion` failed (its log says why)') || (steps.reader.outcome == 'failure' && 'step `build the failure reader` failed (its log says why)') || (steps.build.outcome == 'failure' && 'step `build the macOS set` failed (its log says why)') || (steps.python.outcome == 'failure' && 'step `build the macOS Python harness tests` failed (its log says why)') || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/farm-connect
        with:
          ts-client-id: ${{ vars.TS_CLIENT_ID }}
          ts-audience: ${{ vars.TS_AUDIENCE }}
          farm-address: ${{ vars.FARM_ADDRESS }}
          farm-instance: ${{ vars.FARM_INSTANCE }}
          farm-properties: ${{ vars.FARM_LINUX_X86_64_PROPERTIES }}
          darwin-properties: ${{ vars.FARM_DARWIN_ARM64_PROPERTIES }}
          darwin-macos-hosts: ${{ vars.FARM_DARWIN_MACOS_HOSTS }}
          macos-library-dirs: ${{ vars.FARM_MACOS_LIBRARY_DIRS }}
          tls: ${{ vars.FARM_TLS || 'false' }}
          # main's release work queues behind the pull-request checks when the farm is full
          farm-qos: batch
      # Without the macOS worker set the build would fail analysis, and without the linux set
      # (the toolchain unpack runs on a linux worker of the farm) it would run on this runner.
      - name: the buckconfig names the farm and its macOS workers
        id: config
        run: |
          for key in linux_x86_64_properties darwin_arm64_properties darwin_macos_hosts; do
            ./buck2 audit config "komira_re.$key" --style json | grep -q '": *"[^"]' ||
              { echo "::error::the machine buckconfig sets no [komira_re] $key: the macOS build has no farm worker to run on (docs/ci.md, repository variables)"; exit 1; }
          done
      - name: build the farm assertion
        id: assert
        run: echo "path=$(./buck2 build komira//tools/build/ci:assert_remote --show-full-simple-output)" >> "$GITHUB_OUTPUT"
      # The reader of a failed build's log (release/ci/buck2_failure.zig), built before the build so
      # that a failed build can still say what buck2 said.
      - name: build the failure reader
        id: reader
        run: ./buck2 build //release/ci:buck2_failure --out "$RUNNER_TEMP/buck2_failure"
      # The library of every package that builds for macOS, its welded tests run on the macOS
      # workers. `--keep-going`: one package's failure does not hide the others'.
      - name: build the macOS set
        id: build
        uses: ./.github/actions/buck2-farm
        with:
          args: build --target-platforms komira//tools/build/platforms:darwin-arm64 --keep-going //release:mopm_darwin_libs
          assert-remote: ${{ steps.assert.outputs.path }}
      # The Python test harness on macOS arm64: the macOS CPython and macOS wheels install on a macOS
      # worker and the hello binding test (pyarrow, and a Mojo shared library loaded by path) runs
      # there, with its three twins that must fail the way they name; and every common-task example
      # (python/docs/tasks) on the macOS arm64 wheel. Release only: no pull request runs a macOS action.
      # The targets are DARWIN_PYTHON_HARNESS of release/darwin_libs.bzl, which pr.yml analyses for
      # darwin-arm64 (//:release_macos_cases holds the two to one list).
      - name: build the macOS Python harness tests
        id: python
        uses: ./.github/actions/buck2-farm
        with:
          args: build --target-platforms komira//tools/build/platforms:darwin-arm64 --keep-going komira//tools/build/examples/python_binding:hello komira//tools/build/examples/python_binding:refuses_missing_lib komira//tools/build/examples/python_binding:refuses_wrong_add komira//tools/build/examples/python_binding:refuses_wrong_sum komira//python/docs/tasks:examples_macos_arm64
          assert-remote: ${{ steps.assert.outputs.path }}
      - name: the macOS build failed
        if: failure()
        run: |
          echo "release-macos FAILED on ${GITHUB_SHA}. The macOS arm64 build of //release:mopm_darwin_libs on the farm macOS workers did not pass. It does not block the release or the publish." >> "$GITHUB_STEP_SUMMARY"
      # What buck2 said, from the log the buck2-farm action tees (each buck2 step overwrites it, and a
      # failed step skips the ones after it, so it is the failed step's): to the summary, and as the
      # output `message` that release-macos-result prints.
      - name: what the build said
        id: said
        if: failure() && steps.reader.outcome == 'success' && (steps.build.outcome == 'failure' || steps.python.outcome == 'failure')
        env:
          FAILED_STEP: ${{ steps.build.outcome == 'failure' && 'build the macOS set' || 'build the macOS Python harness tests' }}
        run: '"$RUNNER_TEMP/buck2_failure" --log "$RUNNER_TEMP/buck2-farm.log" --step "$FAILED_STEP" --github-output "$GITHUB_OUTPUT" --summary-file "$GITHUB_STEP_SUMMARY"'
      - name: Stop buck2
        if: always()
        run: ./buck2 kill || true

  # A skipped build job is not a failed one, and a run whose jobs were all skipped ends green. This job
  # runs whatever happened to the build and fails unless it succeeded, so the run list, the commit
  # status and the badge say that the macOS build did not pass. Nothing in release.yml needs it.
  release-macos-result:
    needs: release-macos
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: the macOS build ran and passed
        env:
          BUILD_RESULT: ${{ needs.release-macos.result }}
          REPORT: ${{ needs.release-macos.outputs.report }}
        run: |
          case "$BUILD_RESULT" in
            success) ;;
            skipped)
              echo "::error title=release-macos::the macOS build did not run: its job was skipped (a condition of the job was false, or an earlier job it waits on did not succeed)"
              exit 1 ;;
            cancelled)
              echo "::warning title=release-macos::the macOS build was cancelled (a newer push replaces a running build)" ;;
            *)
              echo "::error title=release-macos::the macOS build did not pass: ${REPORT:-its job ended $BUILD_RESULT before the buckconfig check (the checkout or farm-connect failed; the log of the job says why)}"
              exit 1 ;;
          esac
