# Build-system self-tests: tools/build/tests/run_tests.sh, on a schedule and on
# demand. It tests buck2's own behaviour (where actions ran, cache identity
# across checkouts, analysis-time refusals, a `buck2 run` from a fresh clone,
# targets that must fail by design) and is NOT the gate: the gate is the build
# (the check kci / pr), where building a target runs the tests welded to it. This workflow
# has no push or pull_request trigger, so it never holds up a change. See
# docs/ci.md, "Build-system self-tests".
#
# It reaches the farm as kci.yml's pr job does, through the local action
# .github/actions/farm-connect, and holds `id-token: write` for that alone.
name: build-system-selftests

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions: {}

concurrency:
  # Two runs never overlap; a run in progress is left to finish.
  group: build-system-selftests
  cancel-in-progress: false

jobs:
  selftests:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/farm-connect
        with:
          ts-client-id: ${{ vars.TS_CLIENT_ID }}
          ts-audience: ${{ vars.TS_AUDIENCE }}
          farm-address: ${{ vars.FARM_ADDRESS }}
          farm-instance: ${{ vars.FARM_INSTANCE }}
          farm-properties: ${{ vars.FARM_LINUX_X86_64_PROPERTIES }}
      # The pinned pixi the conda install cases (33a, 33b) run: the platform
      # table's linux-x86_64 pin (tools/build/platforms/table.bzl), which
      # buck2 downloads and keeps only at the pin's sha256. With
      # --require-install below, no pixi on PATH (or no network) FAILs those
      # cases instead of skipping them.
      - name: the pinned pixi
        run: |
          out=$(./buck2 build //tools/build/toolchains:pixi --materializations all --show-full-output | sed -n 's/^[^ ]* //p' | tail -n 1)
          [ -x "$out" ] || { echo "the pinned pixi is not an executable file: '$out'"; exit 1; }
          mkdir -p "$RUNNER_TEMP/pixi"
          cp "$out" "$RUNNER_TEMP/pixi/pixi"
          "$RUNNER_TEMP/pixi/pixi" --version
          echo "$RUNNER_TEMP/pixi" >> "$GITHUB_PATH"
      - name: tools/build/tests/run_tests.sh --require-install
        run: |
          mkdir -p "$RUNNER_TEMP/tests"
          TMPDIR="$RUNNER_TEMP/tests" tools/build/tests/run_tests.sh --require-install
      - name: Stop buck2
        if: always()
        run: ./buck2 kill || true
