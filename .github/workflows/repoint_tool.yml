# What is left of the komira_core split: the tool that rewrites an importer of the
# deleted komira_core onto the packages that replaced it (tools/core_split/README.md),
# its self-tests, and the check that nothing names komira_core again. A separate file
# so that nothing here can conflict with ci.yml.
name: repoint_tool

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

env:
  # The checks are python; keep their bytecode out of the checkout.
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  # One run per pull request, cancelling a superseded one; every other run has
  # a group of its own commit (the reason is in ci.yml).
  group: repoint_tool-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    # Pure python, so no farm and no secrets: a pull request from a fork runs it too.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Each rewrite the tool must do, seeded; a second run must change nothing, and an
      # import the map cannot resolve must make --strict red.
      - name: split_selftest, repoint_selftest
        run: |
          python3 tools/core_split/split_selftest.py
          python3 tools/core_split/repoint_selftest.py

      # A pull request that adds an import of komira_core (or of komira_core_ffi, now
      # komira_libc) is red until `python3 tools/core_split/repoint.py` has been run on it.
      - name: no file names komira_core or komira_core_ffi
        run: python3 tools/core_split/repoint.py --check
