# The publish of komira's Python package, the wheel `komira` (docs/ci.md, "pypi.yml: publishing the
# Python package"; the package is python/, docs/design/python_package.md): its Linux x86_64 wheel and its
# macOS arm64 wheel, both from this file. Two halves in one file:
#
#   EVERY PUSH TO MAIN THAT CHANGES CODE (`push`, the TestPyPI half): builds the Linux wheel on the farm,
#   installs the wheel file on fresh runners on every supported Python, uploads it to TestPyPI,
#   installs it from TestPyPI on fresh runners on every supported Python and runs the quickstart, and,
#   when every one of those passed, saves the record of the version (below). Beside it, the macOS chain:
#   asks TestPyPI whether it lists this version's macOS wheel and, only when it does not, builds the
#   wheel and its checks on the farm's macOS workers, uploads it to TestPyPI, installs it from TestPyPI on
#   a hosted macOS runner on every supported Python and runs the quickstart, and saves its own record. It
#   never touches PyPI.
#   ONCE A DAY (`schedule`) AND ON A MANUAL RUN (`workflow_dispatch`), the promotion, once per wheel: takes
#   the newest record of a version whose TestPyPI smoke passed for that wheel, downloads that version's
#   file from TestPyPI, checks its sha256 and size against what the build recorded, uploads those same
#   bytes to PyPI and smokes PyPI the same way. It builds nothing and never touches TestPyPI's files.
#
# HOW A RUN KNOWS ITS HALF: `github.event_name`. Every job of the TestPyPI half is gated on
# `github.event_name == 'push'` and every job of the promotion on `github.event_name != 'push'`, so a
# run is exactly one half and the other half's jobs are skipped (a skipped job is not a failure).
#
# The version is 0.1.<N>, N the build number of `release_json stamp`, so each code commit is a new
# version. The two wheels of a commit carry the same stamp (each build job runs the same stamp step on
# the same commit) and so the same version: komira-0.1.<N>-py3-none-manylinux_2_35_x86_64.whl and
# komira-0.1.<N>-py3-none-macosx_11_0_arm64.whl. Each wheel carries the Mojo runtime libraries and
# requires no distribution of Modular's; its requirements are pyarrow and protobuf.
#
# TWO CHAINS, ONE RUN. The Linux jobs and the macOS jobs (the ones whose names end in `-macos-arm64`) are
# two chains that share no job, artifact or record: no job of one needs a job of the other or reads its
# result, so a failure of one chain never skips, holds back or changes an upload of the other. The run
# is green only when both chains are; each chain's verdict job names its own failures, under the title
# `pypi` for the Linux wheel and `pypi-macos-arm64` for the macOS one.
#
# THE RECORD. The build writes `built.txt` (the wheel's file name, sha256 and size, `pypi_smoke dist
# --record`) beside the driver, the quickstart, its expected output, its data, the ABI table and the
# list of the supported Pythons; that directory is the smoke artifact. When every TestPyPI smoke job
# of the version passed, `testpypi-passed` saves it in the Actions cache of main under the key
# `pypi-passed-linux-x86_64-<version>` (a cache key is written once; a run on a pull request cannot
# write main's cache), and `testpypi-passed-macos-arm64` the macOS one under
# `pypi-passed-macos-arm64-<version>`. Each promotion restores the most recently created entry of its own
# prefix (the newest version that passed, unless a re-run of an older run passed later: docs/ci.md, "The
# record of a version that passed"): so "passed" is the push run's own verdict for that wheel, recorded
# only when it passed, and the promotion smokes PyPI with the driver, quickstart and Pythons of the
# version it promotes, not of today's main. Each wheel promotes the newest version of its own that
# passed, so on a day the newest version's macOS wheel did not pass, PyPI gets the Linux file of that
# version and the macOS file of an older one, or none (docs/ci.md, "What a Mac user gets").
#
# THE JOBS (a job that fails stops every job that needs it):
#   push, the Linux wheel:
#   `build`           on the farm: the stamped wheel (//python:komira_wheel), its install test
#                     (//python:wheel_install_test), the driver (//python/smoke:pypi_smoke) and the list of
#                     the supported Pythons (//python:supported_pythons[linux-x86_64]); the dist directory
#                     and the record as two artifacts; the job matrix (output `matrix`). No upload step.
#   `wheel-user-test` one job per supported Python, on a fresh runner with no checkout: `pip install`s the
#                     wheel file from the dist directory alone and runs the quickstart. A wheel that fails it
#                     is never uploaded, so it never takes a file name or space on TestPyPI.
#   `testpypi`        prints the project's size on both indexes, asks TestPyPI which state the version is in
#                     (below) and, for `absent`, uploads the dist directory with trusted publishing.
#   `testpypi-smoke`  (not for `differs`) one job per supported Python: `verify`s that TestPyPI serves the
#                     wheel as built, then `install`s it from TestPyPI into an empty environment and runs the
#                     quickstart.
#   `testpypi-passed` after every TestPyPI smoke job passed: saves the record in the cache.
#   `result-testpypi` the verdict of the Linux push chain.
#   push, the macOS wheel:
#   `build-macos-arm64` on an ubuntu runner that only asks the farm (the Macs are farm workers): builds the
#                     wheel's file name, asks TestPyPI whether it lists that file (`pypi_smoke present`), and
#                     only when it does not builds the wheel (//python:komira_wheel_macos_arm64), its install
#                     test, its read-back checks (its libraries load from it alone; it is the Linux wheel's
#                     package) and the macOS driver on the Macs; its output `version` is empty when nothing
#                     was built.
#   `testpypi-macos-arm64` the state and the upload, with the Linux driver.
#   `testpypi-smoke-macos-arm64` on the hosted runner macos-15, with the macOS driver, one job per Python.
#   `testpypi-passed-macos-arm64` the record; `result-testpypi-macos-arm64` the verdict of the macOS chain.
#   schedule and manual run, the Linux wheel:
#   `promote`         restores the newest record, prints the project's size on both indexes, and
#                     `pypi_smoke promote`: names every newer version TestPyPI holds with no record (its
#                     smoke failed, or its run has not ended) and skips it, refuses a record older than PyPI's
#                     newest version, downloads the recorded file from TestPyPI and refuses it unless its
#                     sha256 and size are the record's. The dist directory and the record as two artifacts.
#   `pypi`            asks PyPI which state the version is in and, for `absent`, uploads the downloaded file.
#   `pypi-smoke`      (not for `differs`) the same as `testpypi-smoke` against PyPI.
#   `result-pypi`     the verdict of the Linux promotion.
#   schedule and manual run, the macOS wheel: `promote-macos-arm64`, `pypi-macos-arm64`,
#   `pypi-smoke-macos-arm64` (on macos-15), `result-pypi-macos-arm64`, the same from the macOS record. No
#   storage steps: `testpypi` and `promote` print the project's size.
#
# THE THREE STATES of the version on an index, asked before any upload (`pypi_smoke state`): `absent`
# (no file of that name: upload, then the smoke), `same` (the file is there with the same sha256: no
# upload, the smoke runs: a re-run, a push that changed only what the stamp ignores, or a day with no new
# version, whose promotion is the PyPI smoke and the notice `already published`) and `differs` (the file
# is there with other bytes: on TestPyPI, a commit the stamp ignores that changed the wheel's description;
# nothing is uploaded, there is no index smoke, a notice; on PyPI it is an error, since the promotion
# sends TestPyPI's own bytes). A file is never deleted or overwritten by this workflow; a bad release is
# yanked by the PyPI owner (docs/ci.md).
#
# STORAGE. An index holds a project to a size limit (10 GiB unless raised) and takes a file name once.
# `pypi_smoke storage` sums the sizes the JSON API lists for every file of the project, writes the total
# of each index to the job summary, and its output `over` is `true` above 80 percent of the limit; the
# result job then ends the run red, so the lead prunes old TestPyPI versions or asks for a higher limit
# before uploads fail (docs/ci.md, "Storage on the indexes").
#
# ONE FILE FOR BOTH WHEELS: trusted publishing binds an index's publisher to the workflow file name and
# the environment, so the one publisher each index holds for this file (environment `testpypi` on
# TestPyPI, `pypi` on PyPI) trusts the upload jobs of both wheels, and release.yml holds no publishing
# credential. `id-token: write` is held by `build` and `build-macos-arm64` (for farm-connect alone, in
# the environment `build`, which no index trusts; no upload step) and by the four upload jobs `testpypi`,
# `testpypi-macos-arm64`, `pypi` and `pypi-macos-arm64` (for the upload alone, each in the environment of
# its index; no farm, no build). Every other job holds no permission. No secret and no API token: nothing
# is stored.
#
# TRIGGERS AND CONCURRENCY. A push to main that changes more than documentation (`paths-ignore`, the
# list release.yml has), one run a day at a fixed time (`schedule`, one cron entry) and a manual run
# (`workflow_dispatch`, no input); never a pull request. Every job runs on main only. A push run is in
# the group `pypi-testpypi`, a promotion in `pypi-promote`, each with cancel-in-progress false: a running
# run is never cancelled, and GitHub keeps one pending run per group, the newest, replacing a pending one.
# So when merges land faster than a run, only the newest waiting commit gets a TestPyPI version (it
# carries the replaced commits' changes; their version numbers are skipped), and a push never replaces a
# waiting promotion. To stop the promotion: disable the workflow (Actions > pypi > Disable workflow), or
# delete the `schedule:` entry in a pull request (docs/ci.md, "The promotion").
#
# WHAT THE SMOKE PROVES: the index serves the bytes that were built, with the METADATA that was built,
# and `pip install komira==<version>` into an empty environment (the dependencies from the real PyPI,
# komira from the index under test, nothing else) gives a package that imports, reports its version and
# the engine's ABI version, and registers a Parquet file in a session and closes it: on Linux x86_64 and
# on the hosted runner's macOS arm64, on every supported CPython (python/pythons.bzl holds the exact
# versions). WHAT IT DOES NOT PROVE: any query result, another platform, a macOS older than the runner's
# (the macOS wheel claims 11.0), or a patch release of a supported Python other than the one its job
# installs.
name: pypi

# The push filter is release.yml's: a push of documentation alone starts no run (the stamp does not
# count it either).
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pypi-${{ github.event_name == 'push' && 'testpypi' || 'promote' }}
  cancel-in-progress: false

jobs:
  # ---- the Linux wheel, push: build, upload to TestPyPI, smoke, record ----

  # Builds on the farm and keeps the bytes that the push run uploads and checks, and the record. The
  # job holds `contents: read` and the `id-token: write` that the farm connection exchanges for the
  # tailnet, nothing else, in the environment `build`. It has no upload step.
  build:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: build
    timeout-minutes: 120
    permissions:
      contents: read
      # for farm-connect only: the token Tailscale trusts
      id-token: write
    outputs:
      version: ${{ steps.dist.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      # The commit the run started on, with the full history: the stamp is
      # derived from git and refuses a shallow clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # The farm connection: tailnet join, refusal unless the farm answers, and
      # the machine buckconfig, from repository variables (docs/ci.md).
      - uses: ./.github/actions/farm-connect
        with:
          ts-client-id: ${{ vars.TS_CLIENT_ID }}
          ts-audience: ${{ vars.TS_AUDIENCE }}
          farm-address: ${{ vars.FARM_ADDRESS }}
          farm-instance: ${{ vars.FARM_INSTANCE }}
          farm-properties: ${{ vars.FARM_LINUX_X86_64_PROPERTIES }}
          tls: ${{ vars.FARM_TLS || 'false' }}
          # the publish queues behind the pull-request checks when the farm is full
          farm-qos: batch
      # A guard on the file farm-connect wrote: without the linux property set
      # a build would run on this runner.
      - name: the buckconfig names the farm
        run: |
          ./buck2 audit config komira_re.linux_x86_64_properties --style json | grep -q '": *"[^"]'
      # The tool the buck2-farm action runs over each step's output; its path
      # is the step's output.
      - name: build the farm assertion
        id: assert
        run: echo "path=$(./buck2 build komira//tools/build/ci:assert_remote --show-full-simple-output)" >> "$GITHUB_OUTPUT"
      - name: build the release tool
        uses: ./.github/actions/buck2-farm
        with:
          args: build //release/ci:release_json --out ${{ runner.temp }}/pypi/release_json
          assert-remote: ${{ steps.assert.outputs.path }}
      # The stamp the wheel carries: the build number, the commit it counts and its commit time,
      # from git.
      - name: the stamp
        id: stamp
        run: '"$RUNNER_TEMP/pypi/release_json" stamp --revision "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"'
      # The wheel, stamped: its version is 0.1.<build number>.
      - name: build the wheel
        uses: ./.github/actions/buck2-farm
        with:
          args: build -c komira.package_stamp=${{ steps.stamp.outputs.build_number }} -c komira.package_commit=${{ steps.stamp.outputs.source_commit }} -c komira.package_timestamp_ms=${{ steps.stamp.outputs.timestamp_ms }} //python:komira_wheel[release] --out ${{ runner.temp }}/pypi/built/komira.whl
          assert-remote: ${{ steps.assert.outputs.path }}
      # The install test of the same wheel (built from the same stamp, so the same bytes):
      # installs it into an empty environment and loads the library, on the farm, before anything is
      # uploaded.
      - name: the install test on the wheel
        uses: ./.github/actions/buck2-farm
        with:
          args: build -c komira.package_stamp=${{ steps.stamp.outputs.build_number }} -c komira.package_commit=${{ steps.stamp.outputs.source_commit }} -c komira.package_timestamp_ms=${{ steps.stamp.outputs.timestamp_ms }} //python:wheel_install_test
          assert-remote: ${{ steps.assert.outputs.path }}
      # The driver every later job runs: the state of the version, the storage, the verify, the
      # install smoke and, in the promotion, the promote.
      - name: build the smoke driver
        uses: ./.github/actions/buck2-farm
        with:
          args: build -c komira.package_stamp=${{ steps.stamp.outputs.build_number }} -c komira.package_commit=${{ steps.stamp.outputs.source_commit }} -c komira.package_timestamp_ms=${{ steps.stamp.outputs.timestamp_ms }} //python/smoke:pypi_smoke --out ${{ runner.temp }}/pypi/smoke/pypi_smoke
          assert-remote: ${{ steps.assert.outputs.path }}
      # The supported Pythons: the exact versions python/pythons.bzl gives for Linux x86_64, as a
      # JSON list beside the driver (the record keeps it for the PyPI smoke of this version).
      - name: build the list of the supported Pythons
        uses: ./.github/actions/buck2-farm
        with:
          args: build //python:supported_pythons[linux-x86_64] --out ${{ runner.temp }}/pypi/smoke/pythons.json
          assert-remote: ${{ steps.assert.outputs.path }}
      # The directory the upload sends: the wheel under its file name, read from the wheel itself, and
      # the record of its file name, sha256 and size beside the driver.
      - name: the dist directory and the record
        id: dist
        run: '"$RUNNER_TEMP/pypi/smoke/pypi_smoke" dist --wheel "$RUNNER_TEMP/pypi/built/komira.whl" --out "$RUNNER_TEMP/pypi/dist" --record "$RUNNER_TEMP/pypi/smoke/built.txt" --github-output "$GITHUB_OUTPUT"'
      # What the user test and the smoke jobs run and hold the output to, beside the driver: those jobs
      # have no checkout, and the promotion of this version runs the same files.
      - name: the quickstart, its expected output, its data and the ABI table
        run: cp python/examples/quickstart.py python/examples/quickstart.expected python/examples/readings.parquet src/so/abi/komira.tsv "$RUNNER_TEMP/pypi/smoke/"
      # One entry of `wheel-user-test` and of the TestPyPI smoke per supported Python.
      - name: the Pythons of the user test and the smoke
        id: matrix
        run: '"$RUNNER_TEMP/pypi/smoke/pypi_smoke" matrix --pythons "$RUNNER_TEMP/pypi/smoke/pythons.json" --platform linux-x86_64 --github-output "$GITHUB_OUTPUT"'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-${{ steps.dist.outputs.version }}-dist
          path: ${{ runner.temp }}/pypi/dist
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-${{ steps.dist.outputs.version }}-smoke
          path: ${{ runner.temp }}/pypi/smoke
          if-no-files-found: error
          retention-days: 14
      - name: Stop buck2
        if: always()
        run: ./buck2 kill || true

  # The user test of the wheel file, before any upload, on the bytes this run built and will upload.
  # One job per supported Python (build's output `matrix`, from python/pythons.bzl), each on a fresh
  # hosted runner with no checkout: pip installs the wheel from the dist directory alone into an empty
  # environment, and the quickstart must print what python/examples/quickstart.expected says.
  # `testpypi` needs it, so a wheel that failed it is never uploaded. No identity, no permission.
  wheel-user-test:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions: {}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-${{ needs.build.outputs.version }}-dist
          path: ${{ runner.temp }}/wheel/dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-${{ needs.build.outputs.version }}-smoke
          path: ${{ runner.temp }}/wheel/smoke
      - name: the driver is executable
        run: chmod +x "$RUNNER_TEMP/wheel/smoke/pypi_smoke"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: ${{ matrix.python }}
      - name: pip installs the wheel file into an empty environment and the quickstart prints what it should
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: '"$RUNNER_TEMP/wheel/smoke/pypi_smoke" install --index dist --dist "$RUNNER_TEMP/wheel/dist" --python "$PYTHON" --example "$RUNNER_TEMP/wheel/smoke/quickstart.py" --expect "$RUNNER_TEMP/wheel/smoke/quickstart.expected" --data "$RUNNER_TEMP/wheel/smoke/readings.parquet" --abi-table "$RUNNER_TEMP/wheel/smoke/komira.tsv" --work "$RUNNER_TEMP/wheel/install"'

  # TestPyPI: prints the size of the project on both indexes, asks which state the version is in and
  # uploads for `absent`. The job holds the `id-token: write` that TestPyPI exchanges for an upload
  # (trusted publishing, the environment `testpypi`), and nothing else: no checkout, no farm, no build.
  # The upload action keeps its defaults (no skipping of an existing file, attestations on). The dist
  # directory is downloaded into the workspace, `dist`, holding the wheel alone: the action runs in a
  # container that sees the workspace and not the runner's temporary directory, and it uploads every
  # file of its packages directory.
  testpypi:
    needs: [build, wheel-user-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: testpypi
    timeout-minutes: 30
    permissions:
      # trusted publishing: the token TestPyPI exchanges for an upload
      id-token: write
    outputs:
      state: ${{ steps.state.outputs.state }}
      testpypi_storage: ${{ steps.testpypi_storage.outputs.over }}
      pypi_storage: ${{ steps.pypi_storage.outputs.over }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-${{ needs.build.outputs.version }}-dist
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-${{ needs.build.outputs.version }}-smoke
          path: ${{ runner.temp }}/pypi/smoke
      - name: the driver is executable
        run: chmod +x "$RUNNER_TEMP/pypi/smoke/pypi_smoke"
      # before the upload, so the numbers are in the summary when an upload is refused for size
      - name: the size of the project on TestPyPI
        id: testpypi_storage
        run: '"$RUNNER_TEMP/pypi/smoke/pypi_smoke" storage --index testpypi --project komira --limit-gib 10 --over-percent 80 --summary "$GITHUB_STEP_SUMMARY" --github-output "$GITHUB_OUTPUT"'
      - name: the size of the project on PyPI
        id: pypi_storage
        run: '"$RUNNER_TEMP/pypi/smoke/pypi_smoke" storage --index pypi --project komira --limit-gib 10 --over-percent 80 --summary "$GITHUB_STEP_SUMMARY" --github-output "$GITHUB_OUTPUT"'
      # absent, same or differs: asked of the index, before any upload
      - name: the wheel on TestPyPI
        id: state
        run: '"$RUNNER_TEMP/pypi/smoke/pypi_smoke" state --index testpypi --dist dist --github-output "$GITHUB_OUTPUT"'
      - name: upload to TestPyPI
        if: steps.state.outputs.state == 'absent'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist

  # The smoke on TestPyPI, on a fresh runner with the Python a user has, one job per supported Python.
  # The quickstart, its data and the ABI table are the record's (the smoke artifact); the wheel it
  # installs comes from the index, never from the artifact. No checkout, no identity, no permission.
  testpypi-smoke:
    needs: [build, testpypi]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.testpypi.outputs.state != 'differs'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # one job per supported Python; each runs to the end whatever the others do
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-${{ needs.build.outputs.version }}-dist
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-${{ needs.build.outputs.version }}-smoke
          path: ${{ runner.temp }}/pypi/smoke
      - name: the driver is executable
        run: chmod +x "$RUNNER_TEMP/pypi/smoke/pypi_smoke"
      - name: TestPyPI serves the wheel as built
        run: '"$RUNNER_TEMP/pypi/smoke/pypi_smoke" verify --index testpypi --dist dist --attempts 5 --delay 30'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: ${{ matrix.python }}
      - name: pip installs komira from TestPyPI and the quickstart prints what it should
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: '"$RUNNER_TEMP/pypi/smoke/pypi_smoke" install --index testpypi --dist dist --python "$PYTHON" --example "$RUNNER_TEMP/pypi/smoke/quickstart.py" --expect "$RUNNER_TEMP/pypi/smoke/quickstart.expected" --data "$RUNNER_TEMP/pypi/smoke/readings.parquet" --abi-table "$RUNNER_TEMP/pypi/smoke/komira.tsv" --work "$RUNNER_TEMP/pypi/install" --attempts 5 --delay 30'

  # The record that this version passed: it runs only when every TestPyPI smoke job succeeded (a
  # matrix job succeeds when each of its entries did), and saves the smoke artifact, which holds
  # built.txt, under the key the promotion restores the newest of. No identity, no permission.
  testpypi-passed:
    needs: [build, testpypi-smoke]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-${{ needs.build.outputs.version }}-smoke
          path: ${{ runner.temp }}/pypi/passed
      - name: the record of the version that passed
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pypi/passed
          key: pypi-passed-linux-x86_64-${{ needs.build.outputs.version }}

  # The verdict of the Linux push chain. A job that was skipped because one before it failed would
  # otherwise leave the run looking finished: this job fails the run, naming the stage that did not
  # succeed, and holds no permission. The job results reach the steps through `env:`, never inside a `run:`.
  result-testpypi:
    needs: [build, wheel-user-test, testpypi, testpypi-smoke, testpypi-passed]
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: the build, the user test of the wheel and the TestPyPI upload succeeded
        if: needs.build.result != 'success' || needs.wheel-user-test.result != 'success' || needs.testpypi.result != 'success'
        env:
          BUILD: ${{ needs.build.result }}
          USER_TEST: ${{ needs.wheel-user-test.result }}
          TESTPYPI: ${{ needs.testpypi.result }}
        run: 'echo "::error title=pypi::the build, the user test of the wheel or the TestPyPI upload job did not succeed (build $BUILD, wheel-user-test $USER_TEST, testpypi $TESTPYPI)" && exit 1'
      - name: the bytes differ at the same version
        if: needs.testpypi.outputs.state == 'differs'
        run: 'echo "::notice title=pypi::bytes differ at the same version: a commit that changed only what the stamp ignores changed the wheel; a code commit raises the version"'
      - name: the TestPyPI smoke and the record succeeded
        if: needs.testpypi.outputs.state != 'differs' && (needs.testpypi-smoke.result != 'success' || needs.testpypi-passed.result != 'success')
        env:
          TESTPYPI_SMOKE: ${{ needs.testpypi-smoke.result }}
          PASSED: ${{ needs.testpypi-passed.result }}
        run: 'echo "::error title=pypi::the TestPyPI smoke or the record job did not succeed (testpypi-smoke $TESTPYPI_SMOKE, testpypi-passed $PASSED): this version is never promoted to PyPI" && exit 1'
      - name: the indexes are under 80 percent of their size limit
        if: needs.testpypi.outputs.testpypi_storage == 'true' || needs.testpypi.outputs.pypi_storage == 'true'
        run: 'echo "::error title=pypi::an index holds over 80 percent of the size limit of komira (the summary of the job testpypi says which): prune old versions on TestPyPI or ask for a higher limit, docs/ci.md, Storage on the indexes" && exit 1'
      # Last, so it prints only when no step above failed: a re-run, or a push the stamp ignores.
      - name: the version is on TestPyPI already
        if: needs.testpypi.outputs.state == 'same'
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: 'echo "::notice title=pypi::already on TestPyPI: komira $VERSION is on TestPyPI with the bytes built; nothing was uploaded, and the smoke passed"'

  # ---- the macOS arm64 wheel, push: build on the farm's Macs, upload to TestPyPI, smoke on macOS, record ----

  # Push: asks TestPyPI whether it lacks this version's macOS wheel and builds it on the farm's macOS
  # workers only when it does. The job runs on an ubuntu runner and only asks the farm (the Macs are
  # farm workers). The first build steps run on Linux workers: the release tool, the stamp, the Linux
  # smoke driver (which asks the index), the list of the supported Pythons and the wheel's file name. A
  # Mac build starts only after TestPyPI was asked, so a re-run builds nothing on the Macs. The job
  # holds `contents: read` and the `id-token: write` that the farm connection exchanges for the
  # tailnet, nothing else, in the environment `build`. It has no upload step. Its output `version` is
  # empty when nothing was built. It builds //python:komira_wheel_macos_arm64.
  build-macos-arm64:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: build
    timeout-minutes: 120
    permissions:
      contents: read
      # for farm-connect only: the token Tailscale trusts
      id-token: write
    outputs:
      version: ${{ steps.dist.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      # The commit the run started on, with the full history: the stamp is
      # derived from git and refuses a shallow clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # The farm connection with the macOS worker set, as release-macos.yml makes it.
      - uses: ./.github/actions/farm-connect
        with:
          ts-client-id: ${{ vars.TS_CLIENT_ID }}
          ts-audience: ${{ vars.TS_AUDIENCE }}
          farm-address: ${{ vars.FARM_ADDRESS }}
          farm-instance: ${{ vars.FARM_INSTANCE }}
          farm-properties: ${{ vars.FARM_LINUX_X86_64_PROPERTIES }}
          darwin-properties: ${{ vars.FARM_DARWIN_ARM64_PROPERTIES }}
          darwin-macos-hosts: ${{ vars.FARM_DARWIN_MACOS_HOSTS }}
          macos-library-dirs: ${{ vars.FARM_MACOS_LIBRARY_DIRS }}
          tls: ${{ vars.FARM_TLS || 'false' }}
          # the publish queues behind the pull-request checks when the farm is full
          farm-qos: batch
      # No guard step of its own: without the linux set farm-connect refuses, and every build
      # below is the buck2-farm action, which fails a step that ran anything on this runner;
      # without the macOS worker set or hosts the first darwin build (the wheel's file name)
      # fails analysis, naming the `[komira_re]` key that is not set.
      - name: build the farm assertion
        id: assert
        run: echo "path=$(./buck2 build komira//tools/build/ci:assert_remote --show-full-simple-output)" >> "$GITHUB_OUTPUT"
      - name: build the release tool
        uses: ./.github/actions/buck2-farm
        with:
          args: build //release/ci:release_json --out ${{ runner.temp }}/pypi-macos-arm64/release_json
          assert-remote: ${{ steps.assert.outputs.path }}
      # The stamp the wheel carries: the build number, the commit it counts and its commit time,
      # from git. The same step as the job `build`'s, on the same commit, so the same stamp.
      - name: the stamp
        id: stamp
        run: '"$RUNNER_TEMP/pypi-macos-arm64/release_json" stamp --revision "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"'
      # The Linux build of the driver: it asks the index below and, in the upload jobs, the state; the
      # promotion of this version runs it from the record.
      - name: build the smoke driver
        uses: ./.github/actions/buck2-farm
        with:
          args: build -c komira.package_stamp=${{ steps.stamp.outputs.build_number }} -c komira.package_commit=${{ steps.stamp.outputs.source_commit }} -c komira.package_timestamp_ms=${{ steps.stamp.outputs.timestamp_ms }} //python/smoke:pypi_smoke --out ${{ runner.temp }}/pypi-macos-arm64/smoke/pypi_smoke
          assert-remote: ${{ steps.assert.outputs.path }}
      # The Pythons the macOS smoke jobs install, one job each: the exact versions python/pythons.bzl
      # gives for macOS arm64 (a Linux build of a list), beside the driver, written by the Linux driver
      # as the job matrix, the job's output `matrix`, on every run.
      - name: build the list of the supported Pythons
        uses: ./.github/actions/buck2-farm
        with:
          args: build //python:supported_pythons[macos-arm64] --out ${{ runner.temp }}/pypi-macos-arm64/smoke/pythons.json
          assert-remote: ${{ steps.assert.outputs.path }}
      - name: the Pythons of the macOS smoke
        id: matrix
        run: '"$RUNNER_TEMP/pypi-macos-arm64/smoke/pypi_smoke" matrix --pythons "$RUNNER_TEMP/pypi-macos-arm64/smoke/pythons.json" --platform macos-arm64 --github-output "$GITHUB_OUTPUT"'
      # The wheel's file name, written at analysis, without building the wheel.
      - name: build the file name of the macOS wheel
        uses: ./.github/actions/buck2-farm
        with:
          args: build --target-platforms komira//tools/build/platforms:darwin-arm64 -c komira.package_stamp=${{ steps.stamp.outputs.build_number }} -c komira.package_commit=${{ steps.stamp.outputs.source_commit }} -c komira.package_timestamp_ms=${{ steps.stamp.outputs.timestamp_ms }} //python:komira_wheel_macos_arm64[file_name] --out ${{ runner.temp }}/pypi-macos-arm64/file_name
          assert-remote: ${{ steps.assert.outputs.path }}
      # present or not: asked of TestPyPI for this file name, before anything is built on a Mac
      - name: the macOS wheel on TestPyPI
        id: testpypi_file
        run: '"$RUNNER_TEMP/pypi-macos-arm64/smoke/pypi_smoke" present --index testpypi --name-file "$RUNNER_TEMP/pypi-macos-arm64/file_name" --github-output "$GITHUB_OUTPUT"'
      # Every step from here on runs only when TestPyPI lacks the file.
      - name: build the macOS wheel
        if: steps.testpypi_file.outputs.present != 'true'
        uses: ./.github/actions/buck2-farm
        with:
          args: build --target-platforms komira//tools/build/platforms:darwin-arm64 -c komira.package_stamp=${{ steps.stamp.outputs.build_number }} -c komira.package_commit=${{ steps.stamp.outputs.source_commit }} -c komira.package_timestamp_ms=${{ steps.stamp.outputs.timestamp_ms }} //python:komira_wheel_macos_arm64[release] --out ${{ runner.temp }}/pypi-macos-arm64/built/komira.whl
          assert-remote: ${{ steps.assert.outputs.path }}
      # The install test of the same wheel (the same stamp, so the same bytes), on a macOS worker.
      - name: the install test on the macOS wheel
        if: steps.testpypi_file.outputs.present != 'true'
        uses: ./.github/actions/buck2-farm
        with:
          args: build --target-platforms komira//tools/build/platforms:darwin-arm64 -c komira.package_stamp=${{ steps.stamp.outputs.build_number }} -c komira.package_commit=${{ steps.stamp.outputs.source_commit }} -c komira.package_timestamp_ms=${{ steps.stamp.outputs.timestamp_ms }} //python:wheel_install_test_macos_arm64
          assert-remote: ${{ steps.assert.outputs.path }}
      # The macOS wheel read back (python/BUCK, "The macOS wheel, read back"), the same stamp so the same
      # wheel: every load command of its libraries resolves inside it or to a macOS system library, and it
      # is the Linux wheel's package (the same Python files, metadata and Python tags), its native libraries
      # aside. Each Mach-O member's architecture, minimum macOS and code signature the wheel rule holds.
      - name: the macOS wheel read back
        if: steps.testpypi_file.outputs.present != 'true'
        uses: ./.github/actions/buck2-farm
        with:
          args: build --target-platforms komira//tools/build/platforms:darwin-arm64 -c komira.package_stamp=${{ steps.stamp.outputs.build_number }} -c komira.package_commit=${{ steps.stamp.outputs.source_commit }} -c komira.package_timestamp_ms=${{ steps.stamp.outputs.timestamp_ms }} //python:wheel_libs_macos_arm64 //python:wheel_same_macos_arm64
          assert-remote: ${{ steps.assert.outputs.path }}
      # The driver the macOS smoke jobs run: cross-compiled on the farm, run on a hosted macOS runner.
      - name: build the macOS smoke driver
        if: steps.testpypi_file.outputs.present != 'true'
        uses: ./.github/actions/buck2-farm
        with:
          args: build --target-platforms komira//tools/build/platforms:darwin-arm64 -c komira.package_stamp=${{ steps.stamp.outputs.build_number }} -c komira.package_commit=${{ steps.stamp.outputs.source_commit }} -c komira.package_timestamp_ms=${{ steps.stamp.outputs.timestamp_ms }} //python/smoke:pypi_smoke_macos_arm64 --out ${{ runner.temp }}/pypi-macos-arm64/smoke/pypi_smoke_macos_arm64
          assert-remote: ${{ steps.assert.outputs.path }}
      # The directory the upload sends: the wheel under its file name, read from the wheel itself, and
      # its record beside the drivers.
      - name: the dist directory and the record
        id: dist
        if: steps.testpypi_file.outputs.present != 'true'
        run: '"$RUNNER_TEMP/pypi-macos-arm64/smoke/pypi_smoke" dist --wheel "$RUNNER_TEMP/pypi-macos-arm64/built/komira.whl" --out "$RUNNER_TEMP/pypi-macos-arm64/dist" --record "$RUNNER_TEMP/pypi-macos-arm64/smoke/built.txt" --github-output "$GITHUB_OUTPUT"'
      # What the macOS smoke jobs run and hold the output to, beside the drivers: they have no checkout.
      - name: the quickstart, its expected output, its data and the ABI table
        if: steps.testpypi_file.outputs.present != 'true'
        run: cp python/examples/quickstart.py python/examples/quickstart.expected python/examples/readings.parquet src/so/abi/komira.tsv "$RUNNER_TEMP/pypi-macos-arm64/smoke/"
      - name: keep the dist directory
        if: steps.testpypi_file.outputs.present != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-${{ steps.dist.outputs.version }}-macos-arm64-dist
          path: ${{ runner.temp }}/pypi-macos-arm64/dist
          if-no-files-found: error
          retention-days: 14
      - name: keep the drivers and the record
        if: steps.testpypi_file.outputs.present != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-${{ steps.dist.outputs.version }}-macos-arm64-smoke
          path: ${{ runner.temp }}/pypi-macos-arm64/smoke
          if-no-files-found: error
          retention-days: 14
      - name: Stop buck2
        if: always()
        run: ./buck2 kill || true

  # TestPyPI for the macOS wheel: the same as `testpypi` without the storage steps, on the
  # macOS dist. It runs only when the build made a wheel.
  testpypi-macos-arm64:
    needs: build-macos-arm64
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.build-macos-arm64.outputs.version != ''
    runs-on: ubuntu-24.04
    environment: testpypi
    timeout-minutes: 30
    permissions:
      # trusted publishing: the token TestPyPI exchanges for an upload
      id-token: write
    outputs:
      state: ${{ steps.state.outputs.state }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-${{ needs.build-macos-arm64.outputs.version }}-macos-arm64-dist
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-${{ needs.build-macos-arm64.outputs.version }}-macos-arm64-smoke
          path: ${{ runner.temp }}/pypi-macos-arm64/smoke
      # the Linux driver: this job runs on Linux and only asks the index
      - name: the driver is executable
        run: chmod +x "$RUNNER_TEMP/pypi-macos-arm64/smoke/pypi_smoke"
      # absent, same or differs: asked of the index, before any upload
      - name: the macOS wheel on TestPyPI
        id: state
        run: '"$RUNNER_TEMP/pypi-macos-arm64/smoke/pypi_smoke" state --index testpypi --dist dist --github-output "$GITHUB_OUTPUT"'
      - name: upload the macOS wheel to TestPyPI
        if: steps.state.outputs.state == 'absent'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist

  # The smoke on TestPyPI for the macOS wheel, on a hosted Apple-silicon runner with the Python a user
  # has. The driver is the macOS build, the quickstart files the record's. The wheel it installs comes
  # from the index, never from the artifact.
  # Hosted, not on a farm Mac: a farm action has no network, and the install from TestPyPI is the test.
  testpypi-smoke-macos-arm64:
    needs: [build-macos-arm64, testpypi-macos-arm64]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.testpypi-macos-arm64.outputs.state != 'differs'
    runs-on: macos-15
    timeout-minutes: 30
    # one job per supported Python; each runs to the end whatever the others do
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-macos-arm64.outputs.matrix) }}
    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-${{ needs.build-macos-arm64.outputs.version }}-macos-arm64-dist
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-${{ needs.build-macos-arm64.outputs.version }}-macos-arm64-smoke
          path: ${{ runner.temp }}/pypi-macos-arm64/smoke
      - name: the driver is executable
        run: chmod +x "$RUNNER_TEMP/pypi-macos-arm64/smoke/pypi_smoke_macos_arm64"
      - name: TestPyPI serves the macOS wheel as built
        run: '"$RUNNER_TEMP/pypi-macos-arm64/smoke/pypi_smoke_macos_arm64" verify --index testpypi --dist dist --attempts 5 --delay 30'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: ${{ matrix.python }}
      - name: pip installs komira from TestPyPI on macOS and the quickstart prints what it should
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: '"$RUNNER_TEMP/pypi-macos-arm64/smoke/pypi_smoke_macos_arm64" install --index testpypi --dist dist --python "$PYTHON" --example "$RUNNER_TEMP/pypi-macos-arm64/smoke/quickstart.py" --expect "$RUNNER_TEMP/pypi-macos-arm64/smoke/quickstart.expected" --data "$RUNNER_TEMP/pypi-macos-arm64/smoke/readings.parquet" --abi-table "$RUNNER_TEMP/pypi-macos-arm64/smoke/komira.tsv" --work "$RUNNER_TEMP/pypi-macos-arm64/install" --attempts 5 --delay 30'

  # The record that this version's macOS wheel passed, as `testpypi-passed` is the Linux one's.
  testpypi-passed-macos-arm64:
    needs: [build-macos-arm64, testpypi-smoke-macos-arm64]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-${{ needs.build-macos-arm64.outputs.version }}-macos-arm64-smoke
          path: ${{ runner.temp }}/pypi-macos-arm64/passed
      - name: the record of the version that passed
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pypi-macos-arm64/passed
          key: pypi-passed-macos-arm64-${{ needs.build-macos-arm64.outputs.version }}

  # The verdict of the macOS push chain, as `result-testpypi` is the Linux one's: it
  # needs no Linux job and no Linux job reads it. It fails the run when the build did not
  # succeed, or when it built a wheel and the upload, a smoke or the record did not succeed. A build that
  # found the file on TestPyPI built nothing and is a notice. The job results reach the steps through
  # `env:`, never inside a `run:`.
  result-testpypi-macos-arm64:
    needs: [build-macos-arm64, testpypi-macos-arm64, testpypi-smoke-macos-arm64, testpypi-passed-macos-arm64]
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: the macOS build succeeded
        if: needs.build-macos-arm64.result != 'success'
        env:
          BUILD: ${{ needs.build-macos-arm64.result }}
        run: 'echo "::error title=pypi-macos-arm64::the macOS build job did not succeed (build-macos-arm64 $BUILD)" && exit 1'
      - name: the macOS wheel is on TestPyPI already
        if: needs.build-macos-arm64.outputs.version == ''
        run: 'echo "::notice title=pypi-macos-arm64::the macOS wheel of this version is on TestPyPI already: nothing was built on the Macs"'
      - name: the TestPyPI upload of the macOS wheel succeeded
        if: needs.build-macos-arm64.outputs.version != '' && needs.testpypi-macos-arm64.result != 'success'
        env:
          TESTPYPI: ${{ needs.testpypi-macos-arm64.result }}
        run: 'echo "::error title=pypi-macos-arm64::the macOS TestPyPI upload job did not succeed (testpypi-macos-arm64 $TESTPYPI)" && exit 1'
      - name: the bytes differ at the same version
        if: needs.testpypi-macos-arm64.outputs.state == 'differs'
        run: 'echo "::notice title=pypi-macos-arm64::bytes differ at the same version: a commit that changed only what the stamp ignores changed the wheel; a code commit raises the version"'
      - name: the macOS TestPyPI smoke and the record succeeded
        if: needs.build-macos-arm64.outputs.version != '' && needs.testpypi-macos-arm64.outputs.state != 'differs' && (needs.testpypi-smoke-macos-arm64.result != 'success' || needs.testpypi-passed-macos-arm64.result != 'success')
        env:
          TESTPYPI_SMOKE: ${{ needs.testpypi-smoke-macos-arm64.result }}
          PASSED: ${{ needs.testpypi-passed-macos-arm64.result }}
        run: 'echo "::error title=pypi-macos-arm64::the macOS TestPyPI smoke or the record job did not succeed (testpypi-smoke-macos-arm64 $TESTPYPI_SMOKE, testpypi-passed-macos-arm64 $PASSED): this macOS wheel is never promoted to PyPI" && exit 1'

  # ---- the Linux wheel, schedule and manual run: the promotion to PyPI ----

  # Finds what to promote and fetches it, with no farm, no build and no identity: restores the newest
  # record of a version that passed (the cache entries main's push runs saved), prints the size of the
  # project on both indexes, and `pypi_smoke promote` downloads the recorded file from TestPyPI into the
  # dist directory, refusing it unless its sha256 and size are the record's. A cache that holds no
  # record fails the job (`fail-on-cache-miss`), so nothing is published and the run is red.
  promote:
    if: github.ref == 'refs/heads/main' && github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: {}
    outputs:
      version: ${{ steps.promote.outputs.version }}
      skipped: ${{ steps.promote.outputs.skipped }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      testpypi_storage: ${{ steps.testpypi_storage.outputs.over }}
      pypi_storage: ${{ steps.pypi_storage.outputs.over }}
    steps:
      - name: the newest record of a version whose TestPyPI smoke passed
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pypi/passed
          key: pypi-passed-linux-x86_64-
          restore-keys: pypi-passed-linux-x86_64-
          fail-on-cache-miss: true
      - name: the driver is executable
        run: chmod +x "$RUNNER_TEMP/pypi/passed/pypi_smoke"
      - name: the size of the project on TestPyPI
        id: testpypi_storage
        run: '"$RUNNER_TEMP/pypi/passed/pypi_smoke" storage --index testpypi --project komira --limit-gib 10 --over-percent 80 --summary "$GITHUB_STEP_SUMMARY" --github-output "$GITHUB_OUTPUT"'
      - name: the size of the project on PyPI
        id: pypi_storage
        run: '"$RUNNER_TEMP/pypi/passed/pypi_smoke" storage --index pypi --project komira --limit-gib 10 --over-percent 80 --summary "$GITHUB_STEP_SUMMARY" --github-output "$GITHUB_OUTPUT"'
      # the newest passed version, its newer versions on TestPyPI named and skipped, its file from TestPyPI
      - name: the version to promote, downloaded from TestPyPI and held to the record
        id: promote
        run: '"$RUNNER_TEMP/pypi/passed/pypi_smoke" promote --record "$RUNNER_TEMP/pypi/passed/built.txt" --out "$RUNNER_TEMP/pypi/dist" --github-output "$GITHUB_OUTPUT"'
      # the Pythons that version's push run smoked, from its record
      - name: the Pythons of the PyPI smoke
        id: matrix
        run: '"$RUNNER_TEMP/pypi/passed/pypi_smoke" matrix --pythons "$RUNNER_TEMP/pypi/passed/pythons.json" --platform linux-x86_64 --github-output "$GITHUB_OUTPUT"'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-${{ steps.promote.outputs.version }}-dist
          path: ${{ runner.temp }}/pypi/dist
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-${{ steps.promote.outputs.version }}-smoke
          path: ${{ runner.temp }}/pypi/passed
          if-no-files-found: error
          retention-days: 14

  # PyPI: the same as testpypi without the storage steps, for the real index (the environment `pypi`),
  # on the bytes `promote` downloaded from TestPyPI. The upload action's default repository is PyPI, so
  # no repository-url. A version already on PyPI (`same`) is not uploaded again.
  pypi:
    needs: promote
    if: github.ref == 'refs/heads/main' && github.event_name != 'push'
    runs-on: ubuntu-24.04
    environment: pypi
    timeout-minutes: 30
    permissions:
      # trusted publishing: the token PyPI exchanges for an upload
      id-token: write
    outputs:
      state: ${{ steps.state.outputs.state }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-${{ needs.promote.outputs.version }}-dist
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-${{ needs.promote.outputs.version }}-smoke
          path: ${{ runner.temp }}/pypi/smoke
      - name: the driver is executable
        run: chmod +x "$RUNNER_TEMP/pypi/smoke/pypi_smoke"
      # absent, same or differs: asked of the index, before any upload
      - name: the wheel on PyPI
        id: state
        run: '"$RUNNER_TEMP/pypi/smoke/pypi_smoke" state --index pypi --dist dist --github-output "$GITHUB_OUTPUT"'
      - name: upload to PyPI
        if: steps.state.outputs.state == 'absent'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist

  # The smoke on PyPI: the same as testpypi-smoke, against the real index, with the record's quickstart
  # and Pythons. It is the last proof that a user's `pip install komira` works.
  pypi-smoke:
    needs: [promote, pypi]
    if: github.ref == 'refs/heads/main' && github.event_name != 'push' && needs.pypi.outputs.state != 'differs'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # one job per supported Python; each runs to the end whatever the others do
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.promote.outputs.matrix) }}
    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-${{ needs.promote.outputs.version }}-dist
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-${{ needs.promote.outputs.version }}-smoke
          path: ${{ runner.temp }}/pypi/smoke
      - name: the driver is executable
        run: chmod +x "$RUNNER_TEMP/pypi/smoke/pypi_smoke"
      - name: PyPI serves the wheel as built
        run: '"$RUNNER_TEMP/pypi/smoke/pypi_smoke" verify --index pypi --dist dist --attempts 5 --delay 30'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: ${{ matrix.python }}
      - name: pip installs komira from PyPI and the quickstart prints what it should
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: '"$RUNNER_TEMP/pypi/smoke/pypi_smoke" install --index pypi --dist dist --python "$PYTHON" --example "$RUNNER_TEMP/pypi/smoke/quickstart.py" --expect "$RUNNER_TEMP/pypi/smoke/quickstart.expected" --data "$RUNNER_TEMP/pypi/smoke/readings.parquet" --abi-table "$RUNNER_TEMP/pypi/smoke/komira.tsv" --work "$RUNNER_TEMP/pypi/install" --attempts 5 --delay 30'

  # The verdict of the Linux promotion, as result-testpypi is the Linux push chain's. The notices come first, the
  # failures after them, and the notice `already published` last, so it prints only when nothing failed.
  result-pypi:
    needs: [promote, pypi, pypi-smoke]
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: the newer versions on TestPyPI that were not promoted
        if: needs.promote.outputs.skipped != ''
        env:
          SKIPPED: ${{ needs.promote.outputs.skipped }}
          VERSION: ${{ needs.promote.outputs.version }}
        run: 'echo "::notice title=pypi::not promoted: komira $SKIPPED on TestPyPI has no record that its TestPyPI smoke passed (the smoke failed, or its run had not ended); komira $VERSION is the newest version that passed"'
      - name: the promotion found a version that passed and fetched it from TestPyPI
        if: needs.promote.result != 'success'
        env:
          PROMOTE: ${{ needs.promote.result }}
        run: 'echo "::error title=pypi::the promote job did not succeed (promote $PROMOTE): nothing was published to PyPI; its log says why" && exit 1'
      - name: the PyPI upload succeeded
        if: needs.pypi.result != 'success'
        env:
          PYPI: ${{ needs.pypi.result }}
        run: 'echo "::error title=pypi::the PyPI upload job did not succeed (pypi $PYPI)" && exit 1'
      - name: PyPI holds the version with the bytes TestPyPI served
        if: needs.pypi.outputs.state == 'differs'
        env:
          VERSION: ${{ needs.promote.outputs.version }}
        run: 'echo "::error title=pypi::PyPI holds komira $VERSION with other bytes than TestPyPI serves: nothing was uploaded and PyPI was not smoked" && exit 1'
      - name: the PyPI smoke succeeded
        if: needs.pypi-smoke.result != 'success'
        env:
          PYPI_SMOKE: ${{ needs.pypi-smoke.result }}
        run: 'echo "::error title=pypi::the PyPI smoke job did not succeed (pypi-smoke $PYPI_SMOKE)" && exit 1'
      - name: the indexes are under 80 percent of their size limit
        if: needs.promote.outputs.testpypi_storage == 'true' || needs.promote.outputs.pypi_storage == 'true'
        run: 'echo "::error title=pypi::an index holds over 80 percent of the size limit of komira (the summary of the job promote says which): prune old versions on TestPyPI or ask for a higher limit, docs/ci.md, Storage on the indexes" && exit 1'
      # Last, so it prints only when no step above failed: a day with no new version that passed.
      - name: the version is on PyPI already
        if: needs.pypi.outputs.state == 'same'
        env:
          VERSION: ${{ needs.promote.outputs.version }}
        run: 'echo "::notice title=pypi::already published: komira $VERSION is on PyPI with the bytes TestPyPI served; nothing was uploaded, and the PyPI smoke passed"'

  # ---- the macOS arm64 wheel, schedule and manual run: the promotion to PyPI ----

  # Schedule and manual run: the promotion of the macOS wheel, as `promote` is the Linux one's,
  # from the newest macOS record, with the Linux driver of that record (this job runs on Linux). No
  # storage steps: `promote` prints the project's size.
  promote-macos-arm64:
    if: github.ref == 'refs/heads/main' && github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: {}
    outputs:
      version: ${{ steps.promote.outputs.version }}
      skipped: ${{ steps.promote.outputs.skipped }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: the newest record of a macOS wheel whose TestPyPI smoke passed
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pypi-macos-arm64/passed
          key: pypi-passed-macos-arm64-
          restore-keys: pypi-passed-macos-arm64-
          fail-on-cache-miss: true
      - name: the driver is executable
        run: chmod +x "$RUNNER_TEMP/pypi-macos-arm64/passed/pypi_smoke"
      - name: the version to promote, downloaded from TestPyPI and held to the record
        id: promote
        run: '"$RUNNER_TEMP/pypi-macos-arm64/passed/pypi_smoke" promote --record "$RUNNER_TEMP/pypi-macos-arm64/passed/built.txt" --out "$RUNNER_TEMP/pypi-macos-arm64/dist" --github-output "$GITHUB_OUTPUT"'
      - name: the Pythons of the macOS PyPI smoke
        id: matrix
        run: '"$RUNNER_TEMP/pypi-macos-arm64/passed/pypi_smoke" matrix --pythons "$RUNNER_TEMP/pypi-macos-arm64/passed/pythons.json" --platform macos-arm64 --github-output "$GITHUB_OUTPUT"'
      - name: keep the dist directory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-${{ steps.promote.outputs.version }}-macos-arm64-dist
          path: ${{ runner.temp }}/pypi-macos-arm64/dist
          if-no-files-found: error
          retention-days: 14
      - name: keep the drivers and the record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-${{ steps.promote.outputs.version }}-macos-arm64-smoke
          path: ${{ runner.temp }}/pypi-macos-arm64/passed
          if-no-files-found: error
          retention-days: 14

  # PyPI for the macOS wheel: the same as `pypi`, on the macOS file `promote-macos-arm64`
  # downloaded.
  pypi-macos-arm64:
    needs: promote-macos-arm64
    if: github.ref == 'refs/heads/main' && github.event_name != 'push'
    runs-on: ubuntu-24.04
    environment: pypi
    timeout-minutes: 30
    permissions:
      # trusted publishing: the token PyPI exchanges for an upload
      id-token: write
    outputs:
      state: ${{ steps.state.outputs.state }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-${{ needs.promote-macos-arm64.outputs.version }}-macos-arm64-dist
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-${{ needs.promote-macos-arm64.outputs.version }}-macos-arm64-smoke
          path: ${{ runner.temp }}/pypi-macos-arm64/smoke
      - name: the driver is executable
        run: chmod +x "$RUNNER_TEMP/pypi-macos-arm64/smoke/pypi_smoke"
      # absent, same or differs: asked of the index, before any upload
      - name: the macOS wheel on PyPI
        id: state
        run: '"$RUNNER_TEMP/pypi-macos-arm64/smoke/pypi_smoke" state --index pypi --dist dist --github-output "$GITHUB_OUTPUT"'
      - name: upload the macOS wheel to PyPI
        if: steps.state.outputs.state == 'absent'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist

  # The smoke on PyPI for the macOS wheel: the same as testpypi-smoke-macos-arm64, against the real
  # index. It is the last proof that a macOS user's `pip install komira` works.
  # Hosted, not on a farm Mac: a farm action has no network, and the install from PyPI is the test.
  pypi-smoke-macos-arm64:
    needs: [promote-macos-arm64, pypi-macos-arm64]
    if: github.ref == 'refs/heads/main' && github.event_name != 'push' && needs.pypi-macos-arm64.outputs.state != 'differs'
    runs-on: macos-15
    timeout-minutes: 30
    # one job per supported Python; each runs to the end whatever the others do
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.promote-macos-arm64.outputs.matrix) }}
    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-${{ needs.promote-macos-arm64.outputs.version }}-macos-arm64-dist
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-${{ needs.promote-macos-arm64.outputs.version }}-macos-arm64-smoke
          path: ${{ runner.temp }}/pypi-macos-arm64/smoke
      - name: the driver is executable
        run: chmod +x "$RUNNER_TEMP/pypi-macos-arm64/smoke/pypi_smoke_macos_arm64"
      - name: PyPI serves the macOS wheel as built
        run: '"$RUNNER_TEMP/pypi-macos-arm64/smoke/pypi_smoke_macos_arm64" verify --index pypi --dist dist --attempts 5 --delay 30'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: ${{ matrix.python }}
      - name: pip installs komira from PyPI on macOS and the quickstart prints what it should
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: '"$RUNNER_TEMP/pypi-macos-arm64/smoke/pypi_smoke_macos_arm64" install --index pypi --dist dist --python "$PYTHON" --example "$RUNNER_TEMP/pypi-macos-arm64/smoke/quickstart.py" --expect "$RUNNER_TEMP/pypi-macos-arm64/smoke/quickstart.expected" --data "$RUNNER_TEMP/pypi-macos-arm64/smoke/readings.parquet" --abi-table "$RUNNER_TEMP/pypi-macos-arm64/smoke/komira.tsv" --work "$RUNNER_TEMP/pypi-macos-arm64/install" --attempts 5 --delay 30'

  # The verdict of the macOS promotion, as `result-pypi` is the Linux one's.
  result-pypi-macos-arm64:
    needs: [promote-macos-arm64, pypi-macos-arm64, pypi-smoke-macos-arm64]
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: the newer macOS wheels on TestPyPI that were not promoted
        if: needs.promote-macos-arm64.outputs.skipped != ''
        env:
          SKIPPED: ${{ needs.promote-macos-arm64.outputs.skipped }}
          VERSION: ${{ needs.promote-macos-arm64.outputs.version }}
        run: 'echo "::notice title=pypi-macos-arm64::not promoted: the macOS wheel of komira $SKIPPED on TestPyPI has no record that its TestPyPI smoke passed (the smoke failed, or its run had not ended); komira $VERSION is the newest version whose macOS wheel passed"'
      - name: the macOS promotion found a version that passed and fetched it from TestPyPI
        if: needs.promote-macos-arm64.result != 'success'
        env:
          PROMOTE: ${{ needs.promote-macos-arm64.result }}
        run: 'echo "::error title=pypi-macos-arm64::the macOS promote job did not succeed (promote-macos-arm64 $PROMOTE): no macOS wheel was published to PyPI; its log says why" && exit 1'
      - name: the macOS PyPI upload succeeded
        if: needs.pypi-macos-arm64.result != 'success'
        env:
          PYPI: ${{ needs.pypi-macos-arm64.result }}
        run: 'echo "::error title=pypi-macos-arm64::the macOS PyPI upload job did not succeed (pypi-macos-arm64 $PYPI)" && exit 1'
      - name: PyPI holds the macOS wheel with the bytes TestPyPI served
        if: needs.pypi-macos-arm64.outputs.state == 'differs'
        env:
          VERSION: ${{ needs.promote-macos-arm64.outputs.version }}
        run: 'echo "::error title=pypi-macos-arm64::PyPI holds the macOS wheel of komira $VERSION with other bytes than TestPyPI serves: nothing was uploaded and PyPI was not smoked" && exit 1'
      - name: the macOS PyPI smoke succeeded
        if: needs.pypi-smoke-macos-arm64.result != 'success'
        env:
          PYPI_SMOKE: ${{ needs.pypi-smoke-macos-arm64.result }}
        run: 'echo "::error title=pypi-macos-arm64::the macOS PyPI smoke job did not succeed (pypi-smoke-macos-arm64 $PYPI_SMOKE)" && exit 1'
      - name: the macOS wheel is on PyPI already
        if: needs.pypi-macos-arm64.outputs.state == 'same'
        env:
          VERSION: ${{ needs.promote-macos-arm64.outputs.version }}
        run: 'echo "::notice title=pypi-macos-arm64::already published: the macOS wheel of komira $VERSION is on PyPI with the bytes TestPyPI served; nothing was uploaded, and the PyPI smoke passed"'
