# The release of komira's conda packages through kci (docs/ci.md, "kci.yml").
# One job per stage, each one kci invocation:
#
#   build  on the farm runner (the same runner as ci.yml): builds bin/kci and
#          runs `kci build` over release/artifacts.textproto at this commit.
#          The release directory and the kci binary travel to `prod` as one
#          workflow artifact, so `prod` publishes the bytes `build` verified
#          and never builds anything.
#   prod   on a GitHub-hosted runner, in the GitHub environment `prod`, with
#          `id-token: write`: runs `kci publish` to the channel declared in
#          release/channels.textproto. The channel trusts this repository,
#          this file (kci.yml) and the environment `prod` (trusted
#          publishing): no secret is stored anywhere. The job stays a
#          top-level job of this file; a reusable-workflow call would change
#          the token's workflow claim.
#
# Triggers: a push to main and a manual run. NEVER pull_request: `build` runs
# on a self-hosted runner of a public repository, and a pull request's code
# must not reach a job of a release workflow.
#
# ⛔ DRY RUN. Every run is `kci publish --dry-run` (every check, and reads of
# the channel; no write, no token exchange) unless it is a MANUAL run with
# the input dry_run set to false. A push to main is always a dry run: the
# DRY_RUN line of the prod job pins it. Making a push publish is a reviewed
# change of that one line, nothing else. A run that would publish is
# refused unless it is on main and carries the set hash the approver read
# (input expect_set_hash) and names any first-time package names
# (input claim_new_names); see the step "what this run may do".
name: kci

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "dry run: check and read the channel, publish nothing"
        type: boolean
        default: true
      expect_set_hash:
        description: "the approved set hash (64 hex), required to publish; a dry run takes the build's own when empty"
        type: string
        default: ""
      claim_new_names:
        description: "package names this run may publish for the first time, space separated"
        type: string
        default: ""

permissions: {}

concurrency:
  # A group of its own per commit, so no run is cancelled or dropped for a
  # newer one (the reason is in ci.yml). Two runs of one commit queue.
  group: kci-${{ github.sha }}
  cancel-in-progress: false

env:
  # The release declarations: what is built, how, and in which order.
  KCI_DECLARATIONS: release/artifacts.textproto
  # The channels file and the channel this workflow publishes to.
  KCI_CHANNELS: release/channels.textproto
  KCI_CHANNEL: komira

jobs:
  build:
    runs-on: [self-hosted, komira-farm]
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      # Full history: kci build and release_version.sh derive the stamp from
      # git, and both refuse a shallow clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The farm connection is the runner's machine configuration (docs/ci.md),
      # never this repository's.
      - name: the runner's buckconfig names the farm
        run: |
          for key in linux_x86_64_properties; do
            ./buck2 audit config "komira_re.$key" --style json | grep -q '": *"[^"]' ||
              { echo "the runner's buckconfig sets no [komira_re] $key: this job would build on the runner"; exit 1; }
          done
      - name: the release declarations exist
        run: |
          for f in "$KCI_DECLARATIONS" "$KCI_CHANNELS"; do
            [ -f "$f" ] || { echo "$f does not exist: there is nothing to release"; exit 1; }
          done
      # The runnable directory: the binary and the runtime libraries it loads,
      # so it starts on the hosted runner with no environment.
      - name: build kci
        run: ./buck2 build '//bin/kci:kci[runnable]' --out "$RUNNER_TEMP/kci"
      # The declarations name the program `buck2`; the repository's is the
      # ./buck2 wrapper of this checkout.
      - name: buck2 on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec "%s/buck2" "$@"\n' "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/bin/buck2"
          chmod +x "$RUNNER_TEMP/bin/buck2"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: kci build
        run: |
          "$RUNNER_TEMP/kci/kci" build --declarations "$KCI_DECLARATIONS" \
            --work-dir "$GITHUB_WORKSPACE" --out-dir "$RUNNER_TEMP/release" \
            --log-dir "$RUNNER_TEMP/kci-logs" --revision-id "$GITHUB_SHA"
      - name: the build logs
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/kci-logs/*; do
            [ -f "$f" ] && { echo "== $f"; cat "$f"; }
          done
          true
      # One tar, so the binary keeps its mode across the artifact store.
      - name: pack the release
        run: tar -C "$RUNNER_TEMP" -cf "$RUNNER_TEMP/kci-release.tar" kci release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kci-release
          path: ${{ runner.temp }}/kci-release.tar
          if-no-files-found: error
          retention-days: 14
      - name: Stop buck2
        if: always()
        run: ./buck2 kill || true

  prod:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: prod
    permissions:
      contents: read
      id-token: write
    env:
      # ⛔ A push is ALWAYS a dry run: only a manual run can turn it off.
      DRY_RUN: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run }}
      EXPECT_SET_HASH: ${{ inputs.expect_set_hash }}
      CLAIM_NEW_NAMES: ${{ inputs.claim_new_names }}
    steps:
      # The declarations, the channels file and release_version.sh, at the
      # release commit, with the full history the version needs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kci-release
          path: ${{ runner.temp }}/in
      - name: unpack the release
        run: tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/in/kci-release.tar"
      # kci publish compares this with every package before any request.
      - name: release_version.sh
        run: tools/build/package/release_version.sh "$GITHUB_SHA" | tee "$RUNNER_TEMP/release_version.txt"
      - name: what this run may do
        run: |
          built=$(sed -n 's/.*"set_hash":"\([0-9a-f]\{64\}\)".*/\1/p' "$RUNNER_TEMP/release/release.json")
          [ -n "$built" ] || { echo "release.json carries no set hash"; exit 1; }
          echo "the build's set hash: $built"
          if [ "$DRY_RUN" = true ]; then
            hash=${EXPECT_SET_HASH:-$built}
            echo "DRY RUN: kci publish --dry-run, nothing is written to the channel"
          else
            [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] ||
              { echo "refused: only a manual run publishes"; exit 1; }
            [ "$GITHUB_REF" = refs/heads/main ] ||
              { echo "refused: $GITHUB_REF is not main; only main publishes"; exit 1; }
            [ -n "$EXPECT_SET_HASH" ] ||
              { echo "refused: publishing needs the approved set hash (input expect_set_hash)"; exit 1; }
            hash=$EXPECT_SET_HASH
            echo "PUBLISH: kci publish writes to channel $KCI_CHANNEL"
          fi
          echo "KCI_SET_HASH=$hash" >> "$GITHUB_ENV"
      # The channel's credential is trusted publishing (OIDC): kci reads the
      # job's ID token itself and resolves no secret, so the store is none.
      - name: kci publish
        run: |
          set -- --declarations "$KCI_DECLARATIONS" --artifacts "$RUNNER_TEMP/release" \
            --channels "$KCI_CHANNELS" --channel "$KCI_CHANNEL" \
            --release-version "$RUNNER_TEMP/release_version.txt" \
            --expect-set-hash "$KCI_SET_HASH" --report "$RUNNER_TEMP/publish_report.json" \
            --require-environment prod
          for name in $CLAIM_NEW_NAMES; do
            set -- "$@" --claim-new-name "$name"
          done
          if [ "$DRY_RUN" = true ]; then set -- "$@" --dry-run; fi
          "$RUNNER_TEMP/kci/kci" --secret-store none publish "$@"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: kci-publish-report
          path: ${{ runner.temp }}/publish_report.json
          if-no-files-found: warn
          retention-days: 90
