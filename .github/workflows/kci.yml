# The release of komira's conda packages through kci (docs/ci.md, "kci.yml").
#
# HAND-WRITTEN. The machine file (release/machine.textproto: kci's default, so
# no `kci` line names it) owns the release machine; this file runs it, one job per
# stage. kci holds this file to the machine file twice: `kci run` itself, at
# start-up under GitHub Actions (it reads this file as committed at
# GITHUB_WORKFLOW_SHA; a mismatch is exit 3, nothing run), and the welded test
# src/kci_ci_check/tests/test_repo_kci_yml.mojo, so a drift also fails
# `./buck2 build //...` on every pull request. Edit both together. The rules:
# each stage has a job whose id is its name and whose GitHub environment is
# the stage's `environment`; its `needs` is the jobs that run the stage's
# `after`; `id-token: write` only on a job whose stage publishes by trusted
# publishing or is farm-connected; the farm-connect action exactly on the
# farm-connected stage; each job runs exactly one `kci run` with
# `--summary-file`, reading the machine file being checked; no pull_request
# trigger; a `revision` input; every action pinned. A job runs its whole
# stage (a FULL run) unless the stage is SPLIT: gamma is, into `gamma` (its
# step, `--only step:publish`) and `validate` (its validation, `--only
# validation:install`), which together run all of it exactly once; a job
# that runs only validations has no environment and no identity token and
# needs the stage's own job. [The split is PENDING A RULING on rules R1 and
# R9 of the workflow check, src/kci_ci_check.]
#
#   build  on a GitHub-hosted runner joined to the build farm's tailnet
#          (./.github/actions/farm-connect; the stage is farm_connected), in
#          the environment `build`: builds bin/kci and runs
#          `kci run --stage build` at the release revision, on the farm. The
#          release directory, the kci binary and the build's result file
#          travel to the publish jobs as one workflow artifact named for the
#          revision, so they publish the bytes `build` verified, never
#          rebuilt. This job holds a tailnet node and no publishing token.
#   gamma  on a GitHub-hosted runner, in the GitHub environment `gamma`, with
#          `id-token: write`: `kci run --stage gamma --only step:publish`
#          publishes to prefix.dev komira-ai/gamma. Its job summary also lists
#          the names new to komira-ai/prod (NEW NAMES): read it before
#          approving prod.
#   validate
#          on a plain GitHub-hosted runner (docker is installed there), in no
#          environment and with `contents: read` only: `kci run --stage gamma
#          --only validation:install` installs what gamma published from the
#          channel, anonymously, in the digest-pinned container the machine
#          file names, and runs the smoke program. It holds no identity
#          token, so it cannot publish; a failed validation is exit 7 and
#          prod does not start. Re-running it re-validates without
#          re-publishing.
#   prod   the same as gamma, after gamma AND validate, in the GitHub
#          environment `prod` (its required reviewer approves the job), to
#          prefix.dev komira-ai/prod. ⛔ It runs ONLY on a manual run that
#          sets the input publish_prod (default false) AND sets dry_run to
#          false: the machine file's `manual_gate: "publish_prod"` on the
#          stage, held here by rule R13 of the workflow check (the job's
#          `if:` must have the conjunct `inputs.publish_prod == true`). So a
#          push never reaches it, and neither does a manual run that only
#          asks for gamma, whether or not the environment has a reviewer.
#          The last step of `validate` says plainly whether prod is skipped
#          and why (`stage prod: SKIPPED (...)`), or asked for; the last step
#          of `prod` says `stage prod: RAN (<status>)`, in the job summary
#          and as the job's last stderr line.
#
# Each channel trusts this repository, this file (kci.yml) and one environment
# (trusted publishing): no secret is stored anywhere. The publish jobs stay
# top-level jobs of this file; a reusable-workflow call would change the
# workflow the token names. Deploying, when there is one, is a stage and an
# environment of its own.
#
# Triggers: a push to main and a manual run. NEVER pull_request: the build job
# joins the tailnet, and the tailnet credential must not reach a pull
# request's code.
#
# THE REVISION. Everything a run builds and publishes is the commit REVISION:
# the pushed commit, or a manual run's input `revision` (a full commit id; empty
# means the commit the run was started on). Every job checks it out, kci refuses
# a checkout whose HEAD is not it, and every artifact and result is named for
# it. A run that publishes requires REVISION to be on main's history, so a
# manual run cannot publish an unmerged commit.
#
# ⛔ DRY RUN. Every run is a dry run (`kci run --plan`: every check and the
# channel's reads; nothing written to a channel) unless it is a MANUAL run with
# the input dry_run set to false. A push to main is always a dry run: the
# DRY_RUN line of each publish job pins it, and making a push publish is a
# reviewed change of those lines. Under CI a dry run also asks GitHub for the
# job's ID token and exchanges it at prefix.dev, then discards the minted token
# unused: that proves a trusted publisher accepts this job, not that it may
# write (docs/ci.md). The first real upload to komira-ai/prod happens with the
# release approver present. A manual run with dry_run false publishes to gamma
# only, unless it also sets publish_prod (the prod job, above).
name: kci

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      revision:
        description: "the commit to release (a full 40-hex commit id); empty for the commit this run starts on"
        type: string
        default: ""
      dry_run:
        description: "dry run: check and read the channels, publish nothing"
        type: boolean
        default: true
      # The manual gate of the stage prod (release/machine.textproto,
      # `manual_gate`; rule R13): prod runs only when this is true and dry_run
      # is false. It is false by default, so no run reaches prod unless its
      # operator asks for prod by name.
      publish_prod:
        description: "publish to komira-ai/prod as well (needs dry_run false); default: gamma only"
        type: boolean
        default: false

permissions: {}

concurrency:
  # A group of its own per revision, so no run is cancelled or dropped for a
  # newer one (the reason is in ci.yml). Two runs of one revision queue.
  group: kci-${{ inputs.revision || github.sha }}
  cancel-in-progress: false

env:
  # The release machine: its stages, and through them the artifacts, the
  # channels file and the channels. kci reads it by convention (kci_api's
  # DEFAULT_MACHINE_FILE), so no `kci` line passes --machine; this name is used
  # only by the step that skips a revision without one. The welded test
  # test_repo_kci_yml holds it equal to kci's default.
  KCI_MACHINE: release/machine.textproto
  # The commit this run releases (THE REVISION, above).
  REVISION: ${{ inputs.revision || github.sha }}

jobs:
  build:
    runs-on: ubuntu-24.04
    environment: build
    timeout-minutes: 120
    permissions:
      contents: read
      # for farm-connect only: the token Tailscale trusts (the stage is
      # farm-connected; it publishes nothing)
      id-token: write
    outputs:
      # "true" when this revision has a release machine; the publish jobs run
      # only then.
      release: ${{ steps.machine.outputs.release }}
    steps:
      # Full history: kci and release_version.sh derive the stamp from git, and
      # both refuse a shallow clone; kci also reads this workflow at its commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REVISION }}
          fetch-depth: 0
          persist-credentials: false
      # The farm connection: tailnet join, refusal unless the farm answers, and
      # the machine buckconfig, from repository variables (docs/ci.md).
      - uses: ./.github/actions/farm-connect
        with:
          ts-client-id: ${{ vars.TS_CLIENT_ID }}
          ts-audience: ${{ vars.TS_AUDIENCE }}
          farm-address: ${{ vars.FARM_ADDRESS }}
          farm-instance: ${{ vars.FARM_INSTANCE }}
          farm-properties: ${{ vars.FARM_LINUX_X86_64_PROPERTIES }}
      # The same guard as ci.yml, over the file farm-connect wrote: without the
      # linux property set the build would run on this runner.
      - name: the buckconfig names the farm
        run: |
          for key in linux_x86_64_properties; do
            ./buck2 audit config "komira_re.$key" --style json | grep -q '": *"[^"]' ||
              { echo "the machine buckconfig sets no [komira_re] $key: this job would build on the runner"; exit 1; }
          done
      # A revision without a release machine is not a failure of a push to
      # main: the job says so (a warning and a summary line) and every later
      # step, and the publish jobs, are skipped. A MANUAL run asked for a
      # release, so there a missing machine file is a refusal.
      - name: the release machine exists
        id: machine
        run: |
          if [ -f "$KCI_MACHINE" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          msg="nothing to release: $REVISION has no $KCI_MACHINE"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "refused: $msg"
            exit 1
          fi
          echo "::warning title=kci skipped::$msg"
          echo "kci SKIPPED: $msg (build and the publish jobs did nothing)" >> "$GITHUB_STEP_SUMMARY"
          echo "release=false" >> "$GITHUB_OUTPUT"
      # The runnable directory: the binary and the runtime libraries it loads,
      # so it starts on the publish jobs' runners with no environment.
      - name: build kci
        if: steps.machine.outputs.release == 'true'
        run: ./buck2 build '//bin/kci:kci[runnable]' --out "$RUNNER_TEMP/kci"
      # The artifacts name the program `buck2`; the repository's is the
      # ./buck2 wrapper of this checkout.
      - name: buck2 on PATH
        if: steps.machine.outputs.release == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec "%s/buck2" "$@"\n' "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/bin/buck2"
          chmod +x "$RUNNER_TEMP/bin/buck2"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # kci first holds this workflow (as committed) to the machine file: a
      # drift stops the run here, before anything is built.
      - name: kci run --stage build
        if: steps.machine.outputs.release == 'true'
        run: |
          "$RUNNER_TEMP/kci/kci" run --stage build \
            --revision-id "$REVISION" --run-id "gh-$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --context driver=github-actions --context event="$GITHUB_EVENT_NAME" \
            --context ref="$GITHUB_REF" --context actor_id="$GITHUB_ACTOR_ID" \
            --context run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --work-dir "$GITHUB_WORKSPACE" --release-dir "$RUNNER_TEMP/release" \
            --log-dir "$RUNNER_TEMP/kci-logs" --result-file "$RUNNER_TEMP/kci-result-build.json" \
            --summary-file "$GITHUB_STEP_SUMMARY"
      - name: the build logs
        if: failure() && steps.machine.outputs.release == 'true'
        run: |
          for f in "$RUNNER_TEMP"/kci-logs/*; do
            [ -f "$f" ] && { echo "== $f"; cat "$f"; }
          done
          true
      # The result file of this job, whatever the outcome: the driver's record
      # of what kci did (kci_api's kci.result).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.machine.outputs.release == 'true'
        with:
          name: kci-result-build-${{ env.REVISION }}
          path: ${{ runner.temp }}/kci-result-build.json
          if-no-files-found: warn
          retention-days: 90
      # One tar, so the binary keeps its mode across the artifact store. The
      # build's result file travels with it.
      - name: pack the release
        if: steps.machine.outputs.release == 'true'
        run: tar -C "$RUNNER_TEMP" -cf "$RUNNER_TEMP/kci-release.tar" kci release kci-result-build.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.machine.outputs.release == 'true'
        with:
          name: kci-release-${{ env.REVISION }}
          path: ${{ runner.temp }}/kci-release.tar
          if-no-files-found: error
          retention-days: 14
      - name: Stop buck2
        if: always()
        run: ./buck2 kill || true

  gamma:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: gamma
    permissions:
      contents: read
      id-token: write
    env:
      # ⛔ A push is ALWAYS a dry run: only a manual run can turn it off.
      DRY_RUN: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run }}
    steps:
      # The machine file, the artifacts, the channels file and
      # release_version.sh at the release revision, with the full history the
      # version (and the "on main" check, and kci's read of this workflow at
      # its commit) needs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REVISION }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kci-release-${{ env.REVISION }}
          path: ${{ runner.temp }}/in
      - name: unpack the release
        run: tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/in/kci-release.tar"
      # kci compares this with every package before any request.
      - name: release_version.sh
        run: tools/build/package/release_version.sh "$REVISION" | tee "$RUNNER_TEMP/release_version.txt"
      - name: what this run may do
        run: |
          if [ "$DRY_RUN" = true ]; then
            echo "DRY RUN: nothing is written to komira-ai/gamma"
          else
            [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] ||
              { echo "refused: only a manual run publishes"; exit 1; }
            [ "$GITHUB_REF" = refs/heads/main ] ||
              { echo "refused: $GITHUB_REF is not main; only main publishes"; exit 1; }
            git merge-base --is-ancestor "$REVISION" origin/main ||
              { echo "refused: $REVISION is not on main's history; only a merged commit is published"; exit 1; }
            echo "PUBLISH: the release is written to komira-ai/gamma"
          fi
      # The channel's credential is trusted publishing (OIDC): kci reads the
      # job's ID token itself and resolves no secret, so the store is none. kci
      # refuses the token unless its environment is this stage's, gamma. The
      # stage's validation runs in the `validate` job, not here.
      - name: kci run --stage gamma --only step:publish
        run: |
          set --
          if [ "$DRY_RUN" = true ]; then set -- --plan; fi
          "$RUNNER_TEMP/kci/kci" run --stage gamma --only step:publish \
            --revision-id "$REVISION" --run-id "gh-$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --context driver=github-actions --context event="$GITHUB_EVENT_NAME" \
            --context ref="$GITHUB_REF" --context actor_id="$GITHUB_ACTOR_ID" \
            --context run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --release-dir "$RUNNER_TEMP/release" --release-version "$RUNNER_TEMP/release_version.txt" \
            --secret-store none --result-file "$RUNNER_TEMP/kci-result-gamma.json" \
            --summary-file "$GITHUB_STEP_SUMMARY" "$@"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: kci-result-gamma-${{ env.REVISION }}
          path: ${{ runner.temp }}/kci-result-gamma.json
          if-no-files-found: warn
          retention-days: 90

  validate:
    needs: [build, gamma]
    if: needs.build.outputs.release == 'true'
    # docker is on the hosted image; no farm, no tailnet
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # No environment: no approval, and no environment secret to leak.
    permissions:
      # no id-token: this job cannot mint a publishing token
      contents: read
    env:
      # ⛔ A push is ALWAYS a dry run: the validation then runs nothing
      # (WOULD_VALIDATE), as gamma published nothing.
      DRY_RUN: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run }}
    steps:
      # The machine file and the smoke program at the release revision; the
      # full history kci's read of this workflow at its commit needs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REVISION }}
          fetch-depth: 0
          persist-credentials: false
      # The SAME artifact gamma published: the pins are its release.json's.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kci-release-${{ env.REVISION }}
          path: ${{ runner.temp }}/in
      - name: unpack the release
        run: tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/in/kci-release.tar"
      # kci pulls the image itself (the digest is the machine file's), reads
      # the channel anonymously and starts the container with nothing of this
      # job's environment.
      - name: kci run --stage gamma --only validation:install
        run: |
          set --
          if [ "$DRY_RUN" = true ]; then set -- --plan; fi
          "$RUNNER_TEMP/kci/kci" run --stage gamma --only validation:install \
            --revision-id "$REVISION" --run-id "gh-$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --context driver=github-actions --context event="$GITHUB_EVENT_NAME" \
            --context ref="$GITHUB_REF" --context actor_id="$GITHUB_ACTOR_ID" \
            --context run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --release-dir "$RUNNER_TEMP/release" --scratch-dir "$RUNNER_TEMP/validate" \
            --result-file "$RUNNER_TEMP/kci-result-validate.json" \
            --summary-file "$GITHUB_STEP_SUMMARY" "$@"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: kci-result-validate-${{ env.REVISION }}
          path: ${{ runner.temp }}/kci-result-validate.json
          if-no-files-found: warn
          retention-days: 90
      # The run's plain word on prod, whatever happened above: skipped and
      # why, or asked for (the prod job then says RAN). Last, so it is this
      # job's last stderr line.
      - name: stage prod
        if: always()
        env:
          PUBLISH_PROD: ${{ inputs.publish_prod }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          VALIDATE_STATUS: ${{ job.status }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            line="stage prod: SKIPPED (a push never reaches prod)"
          elif [ "$PUBLISH_PROD" != true ]; then
            line="stage prod: SKIPPED (publish_prod not set)"
          elif [ "$DRY_RUN_INPUT" != false ]; then
            line="stage prod: SKIPPED (dry run)"
          elif [ "$VALIDATE_STATUS" != success ]; then
            line="stage prod: SKIPPED (validate $VALIDATE_STATUS)"
          else
            line="stage prod: REQUESTED (publish_prod set): the prod job runs next and says RAN"
          fi
          echo "### $line" >> "$GITHUB_STEP_SUMMARY"
          echo "$line" >&2

  prod:
    # after the stage gamma: its publish AND its validation
    needs: [gamma, validate]
    # ⛔ A manual run that asks for prod by name, and is not a dry run: the
    # stage's manual gate (rule R13 holds the conjunct
    # `inputs.publish_prod == true`). A push never reaches it, and neither does
    # a manual run that leaves publish_prod false. (Skipped with gamma when the
    # revision has no release machine.)
    if: github.event_name == 'workflow_dispatch' && inputs.publish_prod == true && inputs.dry_run == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: prod
    permissions:
      contents: read
      id-token: write
    env:
      # ⛔ A push is ALWAYS a dry run: only a manual run can turn it off. (The
      # job's `if:` already requires dry_run false; this line stays as the
      # second lock.)
      DRY_RUN: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REVISION }}
          fetch-depth: 0
          persist-credentials: false
      # The SAME artifact gamma published: the bytes are never rebuilt.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kci-release-${{ env.REVISION }}
          path: ${{ runner.temp }}/in
      - name: unpack the release
        run: tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/in/kci-release.tar"
      - name: release_version.sh
        run: tools/build/package/release_version.sh "$REVISION" | tee "$RUNNER_TEMP/release_version.txt"
      - name: what this run may do
        run: |
          if [ "$DRY_RUN" = true ]; then
            echo "DRY RUN: nothing is written to komira-ai/prod"
          else
            [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] ||
              { echo "refused: only a manual run publishes"; exit 1; }
            [ "$GITHUB_REF" = refs/heads/main ] ||
              { echo "refused: $GITHUB_REF is not main; only main publishes"; exit 1; }
            git merge-base --is-ancestor "$REVISION" origin/main ||
              { echo "refused: $REVISION is not on main's history; only a merged commit is published"; exit 1; }
            echo "PUBLISH: the release is written to komira-ai/prod"
          fi
      # kci refuses the token unless its environment is this stage's, prod.
      - name: kci run --stage prod
        run: |
          set --
          if [ "$DRY_RUN" = true ]; then set -- --plan; fi
          "$RUNNER_TEMP/kci/kci" run --stage prod \
            --revision-id "$REVISION" --run-id "gh-$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --context driver=github-actions --context event="$GITHUB_EVENT_NAME" \
            --context ref="$GITHUB_REF" --context actor_id="$GITHUB_ACTOR_ID" \
            --context run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --release-dir "$RUNNER_TEMP/release" --release-version "$RUNNER_TEMP/release_version.txt" \
            --secret-store none --result-file "$RUNNER_TEMP/kci-result-prod.json" \
            --summary-file "$GITHUB_STEP_SUMMARY" "$@"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: kci-result-prod-${{ env.REVISION }}
          path: ${{ runner.temp }}/kci-result-prod.json
          if-no-files-found: warn
          retention-days: 90
      # The run's plain word on prod: it ran, and how it ended. Last, so it is
      # this job's last stderr line.
      - name: stage prod
        if: always()
        env:
          PROD_STATUS: ${{ job.status }}
        run: |
          line="stage prod: RAN ($PROD_STATUS)"
          echo "### $line" >> "$GITHUB_STEP_SUMMARY"
          echo "$line" >&2
