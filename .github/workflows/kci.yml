# The release of komira's conda packages through kci (docs/ci.md, "kci.yml").
#
# HAND-WRITTEN. The machine file (release/machine.textproto: kci's default, so
# no `kci` line names it) owns the release machine; this file runs it, one job per
# stage, and `kci ci check`
# holds it to the machine file: a step of the build job, and the welded test
# src/kci_ci_check/tests/test_repo_kci_yml.mojo, so a drift fails
# `./buck2 build //...` on every pull request. Edit both together. The rules:
# each job's id and GitHub environment are its stage's name; its `needs` is the
# stage's `after`; `id-token: write` only on the job whose stage publishes by
# trusted publishing; each job runs exactly one `kci run --stage <its id>`,
# never with `--only` (a release job runs its whole stage: a FULL run), and
# reading the machine file being checked; no pull_request trigger; a
# `revision` input; every action pinned.
#
#   build  on the farm runner (the same runner as ci.yml), in the environment
#          `build`: builds bin/kci, checks this file against the machine file,
#          and runs `kci run --stage build` at the release revision. The
#          release directory, the kci binary and the build's result file travel
#          to `prod` as one workflow artifact named for the revision, so `prod`
#          publishes the bytes `build` verified and never builds anything.
#   prod   on a GitHub-hosted runner, in the GitHub environment `prod`, with
#          `id-token: write`: `kci run --stage prod` publishes to the channel
#          the machine file names. The channel trusts this repository, this file
#          (kci.yml) and the environment `prod` (trusted publishing): no secret
#          is stored anywhere. The job stays a top-level job of this file; a
#          reusable-workflow call would change the token's workflow claim.
#          Deploying, when there is one, is a stage and an environment of its
#          own, never this one.
#
# Triggers: a push to main and a manual run. NEVER pull_request: `build` runs on
# a self-hosted runner of a public repository, and a pull request's code must
# not reach a job of a release workflow.
#
# THE REVISION. Everything a run builds and publishes is the commit REVISION:
# the pushed commit, or a manual run's input `revision` (a full commit id; empty
# means the commit the run was started on). Both jobs check it out, kci refuses
# a checkout whose HEAD is not it, and every artifact and result is named for
# it. A run that publishes requires REVISION to be on main's history, so a
# manual run cannot publish an unmerged commit.
#
# ⛔ DRY RUN. Every run is `kci run --stage prod --plan` (every check, and reads
# of the channel; no write, no token exchange) unless it is a MANUAL run with
# the input dry_run set to false. A push to main is always a dry run: the
# DRY_RUN line of the prod job pins it. Making a push publish is a reviewed
# change of that one line, nothing else. A run that would publish is refused
# unless it is on main and carries the set hash the approver read (input
# expect_set_hash) and names any first-time package names (input
# claim_new_names); see the step "what this run may do".
name: kci

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      revision:
        description: "the commit to release (a full 40-hex commit id); empty for the commit this run starts on"
        type: string
        default: ""
      dry_run:
        description: "dry run: check and read the channel, publish nothing"
        type: boolean
        default: true
      expect_set_hash:
        description: "the approved set hash (64 hex), required to publish; a dry run takes the build's own when empty"
        type: string
        default: ""
      claim_new_names:
        description: "package names this run may publish for the first time, space separated"
        type: string
        default: ""

permissions: {}

concurrency:
  # A group of its own per revision, so no run is cancelled or dropped for a
  # newer one (the reason is in ci.yml). Two runs of one revision queue.
  group: kci-${{ inputs.revision || github.sha }}
  cancel-in-progress: false

env:
  # The release machine: its stages, and through them the declarations, the
  # channels file and the channel. kci reads it by convention (kci_api's
  # DEFAULT_MACHINE_FILE), so no `kci` line passes --machine; this name is used
  # only by the step that skips a revision without one. The welded test
  # test_repo_kci_yml holds it equal to kci's default.
  KCI_MACHINE: release/machine.textproto
  # The commit this run releases (THE REVISION, above).
  REVISION: ${{ inputs.revision || github.sha }}

jobs:
  build:
    runs-on: [self-hosted, komira-farm]
    environment: build
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      # "true" when this revision has a release machine; `prod` runs only then.
      release: ${{ steps.machine.outputs.release }}
    steps:
      # Full history: kci and release_version.sh derive the stamp from git, and
      # both refuse a shallow clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REVISION }}
          fetch-depth: 0
          persist-credentials: false
      # The farm connection is the runner's machine configuration (docs/ci.md),
      # never this repository's.
      - name: the runner's buckconfig names the farm
        run: |
          for key in linux_x86_64_properties; do
            ./buck2 audit config "komira_re.$key" --style json | grep -q '": *"[^"]' ||
              { echo "the runner's buckconfig sets no [komira_re] $key: this job would build on the runner"; exit 1; }
          done
      # A revision without a release machine is not a failure of a push to
      # main: the job says so (a warning and a summary line) and every later
      # step, and the prod job, is skipped. A MANUAL run asked for a release, so
      # there a missing machine file is a refusal.
      - name: the release machine exists
        id: machine
        run: |
          if [ -f "$KCI_MACHINE" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          msg="nothing to release: $REVISION has no $KCI_MACHINE"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "refused: $msg"
            exit 1
          fi
          echo "::warning title=kci skipped::$msg"
          echo "kci SKIPPED: $msg (build and prod did nothing)" >> "$GITHUB_STEP_SUMMARY"
          echo "release=false" >> "$GITHUB_OUTPUT"
      # The runnable directory: the binary and the runtime libraries it loads,
      # so it starts on the hosted runner with no environment.
      - name: build kci
        if: steps.machine.outputs.release == 'true'
        run: ./buck2 build '//bin/kci:kci[runnable]' --out "$RUNNER_TEMP/kci"
      # This file against the machine file: a drift stops the run here, before
      # anything is built.
      - name: kci ci check
        if: steps.machine.outputs.release == 'true'
        run: |
          "$RUNNER_TEMP/kci/kci" ci check \
            --workflow .github/workflows/kci.yml \
            --result-file "$RUNNER_TEMP/kci-result-ci-check.json"
      # The declarations name the program `buck2`; the repository's is the
      # ./buck2 wrapper of this checkout.
      - name: buck2 on PATH
        if: steps.machine.outputs.release == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec "%s/buck2" "$@"\n' "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/bin/buck2"
          chmod +x "$RUNNER_TEMP/bin/buck2"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: kci run --stage build
        if: steps.machine.outputs.release == 'true'
        run: |
          "$RUNNER_TEMP/kci/kci" run --stage build \
            --revision-id "$REVISION" --run-id "gh-$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --context driver=github-actions --context event="$GITHUB_EVENT_NAME" \
            --context ref="$GITHUB_REF" --context actor_id="$GITHUB_ACTOR_ID" \
            --context run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --work-dir "$GITHUB_WORKSPACE" --release-dir "$RUNNER_TEMP/release" \
            --log-dir "$RUNNER_TEMP/kci-logs" --result-file "$RUNNER_TEMP/kci-result-build.json"
      - name: the build logs
        if: failure() && steps.machine.outputs.release == 'true'
        run: |
          for f in "$RUNNER_TEMP"/kci-logs/*; do
            [ -f "$f" ] && { echo "== $f"; cat "$f"; }
          done
          true
      # The result files of this job, whatever the outcome: the driver's record
      # of what kci did (kci_api's kci.result).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.machine.outputs.release == 'true'
        with:
          name: kci-result-build-${{ env.REVISION }}
          path: ${{ runner.temp }}/kci-result-*.json
          if-no-files-found: warn
          retention-days: 90
      # One tar, so the binary keeps its mode across the artifact store. The
      # build's result file travels with it: prod reads the set hash from it.
      - name: pack the release
        if: steps.machine.outputs.release == 'true'
        run: tar -C "$RUNNER_TEMP" -cf "$RUNNER_TEMP/kci-release.tar" kci release kci-result-build.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.machine.outputs.release == 'true'
        with:
          name: kci-release-${{ env.REVISION }}
          path: ${{ runner.temp }}/kci-release.tar
          if-no-files-found: error
          retention-days: 14
      - name: Stop buck2
        if: always()
        run: ./buck2 kill || true

  prod:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: prod
    permissions:
      contents: read
      id-token: write
    env:
      # ⛔ A push is ALWAYS a dry run: only a manual run can turn it off.
      DRY_RUN: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run }}
      EXPECT_SET_HASH: ${{ inputs.expect_set_hash }}
      CLAIM_NEW_NAMES: ${{ inputs.claim_new_names }}
    steps:
      # The machine file, the declarations, the channels file and
      # release_version.sh at the release revision, with the full history the
      # version (and the "on main" check) needs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REVISION }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kci-release-${{ env.REVISION }}
          path: ${{ runner.temp }}/in
      - name: unpack the release
        run: tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/in/kci-release.tar"
      # kci compares this with every package before any request.
      - name: release_version.sh
        run: tools/build/package/release_version.sh "$REVISION" | tee "$RUNNER_TEMP/release_version.txt"
      - name: what this run may do
        run: |
          built=$(sed -n 's/.*"set_hash":"\([0-9a-f]\{64\}\)".*/\1/p' "$RUNNER_TEMP/kci-result-build.json")
          [ -n "$built" ] || { echo "the build's result file carries no set hash"; exit 1; }
          echo "the build's set hash: $built"
          if [ "$DRY_RUN" = true ]; then
            hash=${EXPECT_SET_HASH:-$built}
            echo "DRY RUN: kci run --stage prod --plan, nothing is written to the channel"
          else
            [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] ||
              { echo "refused: only a manual run publishes"; exit 1; }
            [ "$GITHUB_REF" = refs/heads/main ] ||
              { echo "refused: $GITHUB_REF is not main; only main publishes"; exit 1; }
            git merge-base --is-ancestor "$REVISION" origin/main ||
              { echo "refused: $REVISION is not on main's history; only a merged commit is published"; exit 1; }
            [ -n "$EXPECT_SET_HASH" ] ||
              { echo "refused: publishing needs the approved set hash (input expect_set_hash)"; exit 1; }
            hash=$EXPECT_SET_HASH
            echo "PUBLISH: kci run --stage prod writes to the channel the machine file names"
          fi
          echo "KCI_SET_HASH=$hash" >> "$GITHUB_ENV"
      # The channel's credential is trusted publishing (OIDC): kci reads the
      # job's ID token itself and resolves no secret, so the store is none. kci
      # refuses the token unless its environment is this stage, prod.
      - name: kci run --stage prod
        run: |
          set -- --expect-set-hash "$KCI_SET_HASH" --release-version "$RUNNER_TEMP/release_version.txt"
          for name in $CLAIM_NEW_NAMES; do
            set -- "$@" --claim-new-name "$name"
          done
          if [ "$DRY_RUN" = true ]; then set -- "$@" --plan; fi
          "$RUNNER_TEMP/kci/kci" run --stage prod \
            --revision-id "$REVISION" --run-id "gh-$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --context driver=github-actions --context event="$GITHUB_EVENT_NAME" \
            --context ref="$GITHUB_REF" --context actor_id="$GITHUB_ACTOR_ID" \
            --context run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --release-dir "$RUNNER_TEMP/release" --secret-store none \
            --result-file "$RUNNER_TEMP/kci-result-prod.json" "$@"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: kci-result-prod-${{ env.REVISION }}
          path: ${{ runner.temp }}/kci-result-prod.json
          if-no-files-found: warn
          retention-days: 90
