# The release build of komira's conda packages through kci (docs/ci.md, "kci.yml").
#
# komira publishes to NO channel for now: the earlier publish stages (a beta
# channel, a validation that installed from it, a prod channel) are gone, and
# publishing will move to mopm (docs/releases.md). What remains is the stage
# that builds the release set, so a push to main still proves the release
# builds.
#
# HAND-WRITTEN. The machine file (release/machine.textproto: kci's default, so
# no `kci` line names it) owns the release machine; this file runs it, one job per
# stage. kci holds this file to the machine file twice: `kci run` itself, at
# start-up under GitHub Actions (it reads this file as committed at
# GITHUB_WORKFLOW_SHA; a mismatch is exit 3, nothing run), and the welded test
# src/kci_workflow_check/tests/test_repo_kci_yml.mojo, so a drift also fails
# `./buck2 build //...` on every pull request. Edit both together. The rules:
# each stage has a job whose id is its name and whose GitHub environment is
# the stage's `environment`; its `needs` is the jobs that run the stage's
# `after`; `id-token: write` only on a job whose stage publishes by trusted
# publishing or is farm-connected; the farm-connect action exactly on the
# farm-connected stage; each job runs exactly one `kci run` with
# `--summary-file`, reading the machine file being checked; NO `pull_request`
# trigger (the pull request's check is its own workflow, pr.yml); the inputs
# `revision`, `reason` and `dry_run`; every action pinned.
#
#   build  on a GitHub-hosted runner joined to the build farm's tailnet
#          (./.github/actions/farm-connect; the stage is farm_connected), in
#          the environment `build`: builds bin/kci and runs
#          `kci run --stage build` at the release revision, on the farm. The
#          release directory, the kci binary and the build's result file are
#          kept as one workflow artifact named for the revision. Its output
#          `set_hash` is the release set's hash, read from its kci result.
#          This job holds a tailnet node and no publishing token.
#   (The pull request's check, the machine file's `pr` stage, is NOT in this
#   file: it is the one job of .github/workflows/pr.yml. This file has no
#   `pull_request` trigger.)
#
# Every release job ends with the step `the prod line` (R20), which says in
# one plain line of the job summary that nothing is published. The step never
# runs `exit`, so it reaches its end on every path.
#
# Triggers: a push to main (not one that touches only documentation:
# `paths-ignore`, R17, the same documentation release_version.sh does not
# count) and a manual run, and nothing else. A pull request never starts this
# workflow (pr.yml answers it), so no environment or release job is reached
# from a pull request's code. The welded test holds it (rule R6 of
# src/kci_workflow_check: a `pull_request` trigger here is refused; pr.yml is
# held to the pull request's check alone).
#
# ONE RELEASE AT A TIME (concurrency, R16). A PUSH to main is in the group
# `kci-release-main`: a running release is NEVER cancelled; GitHub keeps at
# most one PENDING run per group, and a newer one cancels the pending one
# and takes its place, so the newest pushed revision wins and queued pushes
# coalesce (main moves forward only, so the newer push carries the older
# one's changes). A cancelled pending run shows as cancelled with no summary:
# it never started. A manual run is never in that group: a dry run in
# `kci-plan-<run id>`, any other manual run in `kci-ref-<ref name>`.
# GitHub compares the group's `github.ref` ignoring case, so a push of a
# branch `MAIN` would join it too: the repository ruleset that refuses such
# branches (docs/ci.md) is what keeps them out.
#
# A manual run (of a branch, or of main) is break-glass: build is the machine
# file's only `break_glass` stage. The input `reason` is required and
# recorded in the job's summary (`BREAK-GLASS: <ref> <revision> by
# <actor>: <reason>`); kci refuses a break-glass run without one
# (KCI-E-BREAK-GLASS-REASON). The reason reaches kci only through a job's
# `env:`, never inside a `run:`, and no `name:` holds any expression (R18).
#
# THE REVISION. Everything a run builds is the commit REVISION: the pushed
# commit, or a manual run's input `revision` (a full commit id; empty means
# the commit the run was started on). Every job checks it out, kci refuses a
# checkout whose HEAD is not it, and every artifact and result is named for
# it. Every release job's second step (R21) refuses, before anything built
# from REVISION runs, a REVISION that is not a full commit id, or, on any
# run that is not a manual dry run, is not GITHUB_SHA, the commit the run
# started on; only a manual DRY run may name another revision, on GITHUB_SHA's
# history. kci holds the same at start-up (and REVISION on
# `refs/remotes/origin/main`'s history on a push to main).
#
# DRY RUN. DRY_RUN is set once, in this file's `env:`, from the manual run's
# input alone (R22): no release job's script names DRY_RUN outside its plan
# line and the revision check, or GITHUB_ENV at all, which would re-set it for
# later steps. kci refuses `--plan` on a push to main (KCI-E-PLAN-ON-RELEASE).
name: kci

on:
  push:
    branches: [main]
    # documentation only: no release (R17; release_version.sh does not
    # count these either, so the build number would not move)
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      revision:
        description: "the commit to release (a full 40-hex commit id); empty for the commit this run starts on"
        type: string
        default: ""
      reason:
        description: "why this manual run (recorded in the job summary); a manual run is BREAK-GLASS: it builds and publishes nothing"
        type: string
        required: true
      dry_run:
        description: "dry run: the revision may name an earlier commit on this run's history"
        type: boolean
        default: false

permissions: {}

concurrency:
  # R16, byte for byte (file header, ONE RELEASE AT A TIME).
  group: kci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'release-main' || inputs.dry_run && format('plan-{0}', github.run_id) || format('ref-{0}', github.ref_name) }}
  cancel-in-progress: false

env:
  # The release machine: its stages, and through them the artifacts. kci reads
  # it by convention (kci_api's DEFAULT_MACHINE_FILE), so no `kci` line passes
  # --machine; this name is used only by the step that skips a revision
  # without one. The welded test test_repo_kci_yml holds it equal to kci's
  # default.
  KCI_MACHINE: release/machine.textproto
  # The commit this run releases (THE REVISION, above).
  REVISION: ${{ inputs.revision || github.sha }}
  # A manual run is a dry run only when it asks (R22: set here and nowhere
  # else). The revision step (R21) and every `kci run` read it.
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  build:
    # a break_glass stage, so a manual run of a branch runs it (R15): no `if:`
    runs-on: ubuntu-24.04
    environment: build
    timeout-minutes: 120
    permissions:
      contents: read
      # for farm-connect only: the token Tailscale trusts (the stage is
      # farm-connected; it publishes nothing)
      id-token: write
    outputs:
      # "true" when this revision has a release machine
      release: ${{ steps.machine.outputs.release }}
      # the release set's hash, from kci's result (R19)
      set_hash: ${{ steps.set_hash.outputs.set_hash }}
    env:
      # a manual run's reason, recorded by kci (never inside a `run:`, R18)
      REASON: ${{ inputs.reason }}
    steps:
      # Full history: kci and release_version.sh derive the stamp from git, and
      # both refuse a shallow clone; kci also reads this workflow at its commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REVISION }}
          fetch-depth: 0
          persist-credentials: false
      # R21: the revision this run releases, checked by THIS file (on a run of
      # main, main's own) before anything built from the revision runs.
      - name: the revision this run releases
        run: |
          case "$REVISION" in
            *[!0-9a-f]*) echo "refused: REVISION '$REVISION' is not a full commit id"; exit 1 ;;
          esac
          [ "${#REVISION}" = 40 ] || { echo "refused: REVISION '$REVISION' is not a full commit id"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$DRY_RUN" = true ]; then
            git merge-base --is-ancestor "$REVISION" "$GITHUB_SHA" ||
              { echo "refused: $REVISION is not on the history of $GITHUB_SHA, the commit this run started on"; exit 1; }
          else
            [ "$REVISION" = "$GITHUB_SHA" ] ||
              { echo "refused: a run that can publish releases the commit it started on ($GITHUB_SHA), not $REVISION (a revision input is for a dry run)"; exit 1; }
          fi
      # The farm connection: tailnet join, refusal unless the farm answers, and
      # the machine buckconfig, from repository variables (docs/ci.md).
      - uses: ./.github/actions/farm-connect
        with:
          ts-client-id: ${{ vars.TS_CLIENT_ID }}
          ts-audience: ${{ vars.TS_AUDIENCE }}
          farm-address: ${{ vars.FARM_ADDRESS }}
          farm-instance: ${{ vars.FARM_INSTANCE }}
          farm-properties: ${{ vars.FARM_LINUX_X86_64_PROPERTIES }}
          tls: ${{ vars.FARM_TLS || 'false' }}
      # A guard on the file farm-connect wrote: without the
      # linux property set the build would run on this runner.
      - name: the buckconfig names the farm
        run: |
          for key in linux_x86_64_properties; do
            ./buck2 audit config "komira_re.$key" --style json | grep -q '": *"[^"]' ||
              { echo "the machine buckconfig sets no [komira_re] $key: this job would build on the runner"; exit 1; }
          done
      # A revision without a release machine is not a failure of a push to
      # main: the job says so (a warning and a summary line) and every later
      # step is skipped. A MANUAL run asked for a release, so there a missing
      # machine file is a refusal.
      - name: the release machine exists
        id: machine
        run: |
          if [ -f "$KCI_MACHINE" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          msg="nothing to release: $REVISION has no $KCI_MACHINE"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "refused: $msg"
            exit 1
          fi
          echo "::warning title=kci skipped::$msg"
          echo "kci SKIPPED: $msg (build did nothing)" >> "$GITHUB_STEP_SUMMARY"
          echo "release=false" >> "$GITHUB_OUTPUT"
      # The runnable directory: the binary and the runtime libraries it loads.
      - name: build kci
        if: steps.machine.outputs.release == 'true'
        run: ./buck2 build '//bin/kci:kci[runnable]' --out "$RUNNER_TEMP/kci"
      # The artifacts name the program `buck2`; the repository's is the
      # ./buck2 wrapper of this checkout.
      - name: buck2 on PATH
        if: steps.machine.outputs.release == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec "%s/buck2" "$@"\n' "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/bin/buck2"
          chmod +x "$RUNNER_TEMP/bin/buck2"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # kci first holds this workflow (as committed) to the machine file, then
      # checks the run's ref (a break-glass run off main needs its reason): a
      # drift or a refusal stops the run here, before anything is built.
      - name: kci run --stage build
        if: steps.machine.outputs.release == 'true'
        run: |
          set --
          if [ -n "$REASON" ]; then set -- --context reason="$REASON"; fi
          "$RUNNER_TEMP/kci/kci" run --stage build \
            --revision-id "$REVISION" --run-id "gh-$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --context driver=github-actions --context event="$GITHUB_EVENT_NAME" \
            --context ref="$GITHUB_REF" --context actor_id="$GITHUB_ACTOR_ID" \
            --context run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --work-dir "$GITHUB_WORKSPACE" --release-dir "$RUNNER_TEMP/release" \
            --log-dir "$RUNNER_TEMP/kci-logs" --result-file "$RUNNER_TEMP/kci-result-build.json" \
            --summary-file "$GITHUB_STEP_SUMMARY" "$@"
      # The set hash of the release, read from kci's own result.
      - name: the set hash
        id: set_hash
        if: steps.machine.outputs.release == 'true'
        run: |
          h=$(jq -r '.set_hash' "$RUNNER_TEMP/kci-result-build.json")
          case "$h" in
            *[!0-9a-f]*|"") echo "the build's result holds no set hash ('$h')"; exit 1 ;;
          esac
          [ "${#h}" = 64 ] || { echo "the build's set hash is not 64 hex characters ('$h')"; exit 1; }
          echo "set_hash=$h" >> "$GITHUB_OUTPUT"
      - name: the build logs
        if: failure() && steps.machine.outputs.release == 'true'
        run: |
          for f in "$RUNNER_TEMP"/kci-logs/*; do
            [ -f "$f" ] && { echo "== $f"; cat "$f"; }
          done
          true
      # The result file of this job, whatever the outcome: the driver's record
      # of what kci did (kci_api's kci.result).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.machine.outputs.release == 'true'
        with:
          name: kci-result-build-${{ env.REVISION }}
          path: ${{ runner.temp }}/kci-result-build.json
          if-no-files-found: warn
          retention-days: 90
      # One tar, so the binary keeps its mode across the artifact store. The
      # build's result file travels with it.
      - name: pack the release
        if: steps.machine.outputs.release == 'true'
        run: tar -C "$RUNNER_TEMP" -cf "$RUNNER_TEMP/kci-release.tar" kci release kci-result-build.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.machine.outputs.release == 'true'
        with:
          name: kci-release-${{ env.REVISION }}
          path: ${{ runner.temp }}/kci-release.tar
          if-no-files-found: error
          retention-days: 14
      - name: Stop buck2
        if: always()
        run: ./buck2 kill || true
      # R20: one plain line in the job summary (file header).
      - name: the prod line
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          line="nothing published: komira publishes to no channel for now (build $JOB_STATUS)"
          echo "### $line" >> "$GITHUB_STEP_SUMMARY"
          echo "$line" >&2
