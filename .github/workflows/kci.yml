# The release of komira's conda packages through kci (docs/ci.md, "kci.yml").
#
# HAND-WRITTEN. The machine file (release/machine.textproto: kci's default, so
# no `kci` line names it) owns the release machine; this file runs it, one job per
# stage. kci holds this file to the machine file twice: `kci run` itself, at
# start-up under GitHub Actions (it reads this file as committed at
# GITHUB_WORKFLOW_SHA; a mismatch is exit 3, nothing run), and the welded test
# src/kci_ci_check/tests/test_repo_kci_yml.mojo, so a drift also fails
# `./buck2 build //...` on every pull request. Edit both together. The rules:
# each stage has a job whose id is its name and whose GitHub environment is
# the stage's `environment`; its `needs` is the jobs that run the stage's
# `after`; `id-token: write` only on a job whose stage publishes by trusted
# publishing or is farm-connected; the farm-connect action exactly on the
# farm-connected stage; each job runs exactly one `kci run` with
# `--summary-file`, reading the machine file being checked; a `pull_request`
# trigger that only the pr stage's job answers (below); the inputs
# `revision`, `reason` and `dry_run`; every action pinned. A job runs its whole
# stage (a FULL run) unless the stage is SPLIT: gamma is, into `gamma` (its
# step, `--only step:publish`) and `validate` (its validation, `--only
# validation:install`), which together run all of it exactly once; a job
# that runs only validations has no environment and no identity token and
# needs the stage's own job. [The split is PENDING A RULING on rules R1 and
# R9 of the workflow check, src/kci_ci_check.]
#
# ⛔ CONTINUOUS AUTO-PROMOTION. A push to main IS the release: build -> gamma
# -> validate -> prod, the same bytes at each step, nothing else to do. Every
# job that runs after build receives the release set's hash and kci refuses a
# release directory that recomputes to another (`--release-set-hash`, R17):
# prod publishes exactly the set gamma published and validate installed.
#
#   build  on a GitHub-hosted runner joined to the build farm's tailnet
#          (./.github/actions/farm-connect; the stage is farm_connected), in
#          the environment `build`: builds bin/kci and runs
#          `kci run --stage build` at the release revision, on the farm. The
#          release directory, the kci binary and the build's result file
#          travel to the publish jobs as one workflow artifact named for the
#          revision, so they publish the bytes `build` verified, never
#          rebuilt. Its output `set_hash` is the release set's hash, read
#          from its kci result. This job holds a tailnet node and no
#          publishing token.
#   gamma  on a GitHub-hosted runner, in the GitHub environment `gamma`, with
#          `id-token: write`: `kci run --stage gamma --only step:publish`
#          publishes to prefix.dev komira-ai/gamma. Its job summary also lists
#          the names new to komira-ai/prod (NEW NAMES).
#   validate
#          on a plain GitHub-hosted runner (docker is installed there), in no
#          environment and with `contents: read` only: `kci run --stage gamma
#          --only validation:install` installs what gamma published from the
#          channel, anonymously, in the digest-pinned container the machine
#          file names, and runs the smoke program. It holds no identity
#          token, so it cannot publish; a failed validation is exit 7 and
#          prod does not start. Its output `validated_set_hash` (read from its
#          own kci result) is what prod publishes.
#   prod   the same as gamma, after gamma AND validate, in the GitHub
#          environment `prod`, to prefix.dev komira-ai/prod. It runs only on
#          `main` (`github.ref == 'refs/heads/main'`, R13) and kci refuses a
#          revision that is not on main's history (KCI-E-NOT-ON-MAIN) and a
#          build number lower than the channel already holds
#          (KCI-E-SUPERSEDED). The `prod` environment's deployment branches
#          are `main` only, so a job naming it from another ref is rejected by
#          GitHub before it starts. TO PAUSE promotion, add a required
#          reviewer to that environment (docs/ci.md, "Pausing promotion to
#          prod"); no change here.
#   pr     the check of a pull request (the check named `kci / pr`), on a
#          GitHub-hosted runner joined to the build farm's tailnet, in NO
#          environment, with `contents: read` and the `id-token: write` the
#          farm connection exchanges, nothing else: it builds bin/kci from
#          the pull request's merge commit and runs `kci run --stage pr
#          --affected-by <the pull request's base commit>`, which builds the
#          units the change reaches (the artifacts of
#          release/artifacts.textproto and the checks derived from the build
#          graph when it runs) and ships nothing. It runs only for a pull request from a branch of this
#          repository: a fork's pull request runs nothing (a fork's run gets
#          no tailnet credential; a maintainer reads the change and pushes it
#          to a branch here). A push or a manual run skips it.
#
# Every release job ends with the step `the prod line` (R18), which says in
# one plain line of the job summary what happens to prod: SKIPPED (and why),
# NEXT, PLAN ONLY, or FAILED; prod's own kci run says `promoted to prod: ...`.
#
# Each channel trusts this repository, this file (kci.yml) and one environment
# (trusted publishing): no secret is stored anywhere. The publish jobs stay
# top-level jobs of this file; a reusable-workflow call would change the
# workflow the token names. Deploying, when there is one, is a stage and an
# environment of its own.
#
# Triggers: a push to main (not one that touches only documentation:
# `paths-ignore`, R15, the same documentation release_version.sh does not
# count) and a manual run release; a pull request runs the pr job and NOTHING
# ELSE. Every release job's `if:` keeps a pull request out
# (`github.event_name != 'pull_request'`), so no environment, publishing
# token or release job is reached from a pull request's code; the pr job's
# own condition keeps a fork's out of the tailnet. The welded test holds both
# (rule R6 of src/kci_ci_check).
#
# ONE RELEASE AT A TIME (concurrency, R14). A run of main (a push, or a
# manual run of main) is in the group `kci-release-main`: a running release
# is NEVER cancelled; GitHub keeps at most one PENDING run per group, and a
# newer one cancels the pending one and takes its place, so the newest
# revision wins and queued runs coalesce (main moves forward only, so the
# newer revision carries the older one's changes). A cancelled pending run
# shows as cancelled with no summary: it never started. A pull request's runs
# are one group per pull request, a newer push cancelling the older check.
# A break-glass run is in `kci-breakglass-<branch>` and neither cancels nor
# waits for main.
#
# BREAK-GLASS. A manual run from a branch other than main publishes that
# branch's revision to GAMMA ONLY: build, gamma and validate are the
# machine file's `break_glass` stages; prod is not (its `if:`, kci's start-up
# check KCI-E-NOT-ON-MAIN, and the `prod` environment's branch policy). The
# input `reason` is required and recorded in every job's summary
# (`BREAK-GLASS: <ref> <revision> by <actor>: <reason>`); kci refuses a
# break-glass run without one (KCI-E-BREAK-GLASS-REASON). The reason reaches
# kci only through a job's `env:`, never inside a `run:` (R16).
#
# THE REVISION. Everything a run builds and publishes is the commit REVISION:
# the pushed commit, or a manual run's input `revision` (a full commit id; empty
# means the commit the run was started on). Every job checks it out, kci refuses
# a checkout whose HEAD is not it, and every artifact and result is named for
# it. kci requires REVISION to be on main's history for a stage that runs only
# on main, and on the run's own ref for a break-glass run.
#
# DRY RUN. A push is a real run. A manual run is a real run unless its input
# dry_run is true (`kci run --plan`: every check and the channel's reads;
# nothing written to a channel). Under CI a dry run also asks GitHub for the
# job's ID token and exchanges it at prefix.dev, then discards the minted token
# unused: that proves a trusted publisher accepts this job, not that it may
# write (docs/ci.md).
name: kci

on:
  push:
    branches: [main]
    # documentation only: no release (R15; release_version.sh does not
    # count these either, so the build number would not move)
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      revision:
        description: "the commit to release (a full 40-hex commit id); empty for the commit this run starts on"
        type: string
        default: ""
      reason:
        description: "why this manual run (recorded in every job summary); from a branch other than main it is a BREAK-GLASS run to gamma only"
        type: string
        required: true
      dry_run:
        description: "dry run: check and read the channels, publish nothing"
        type: boolean
        default: false

permissions: {}

concurrency:
  # R14, byte for byte (file header, ONE RELEASE AT A TIME).
  group: kci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref == 'refs/heads/main' && 'release-main' || format('breakglass-{0}', github.ref_name) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The release machine: its stages, and through them the artifacts, the
  # channels file and the channels. kci reads it by convention (kci_api's
  # DEFAULT_MACHINE_FILE), so no `kci` line passes --machine; this name is used
  # only by the step that skips a revision without one. The welded test
  # test_repo_kci_yml holds it equal to kci's default.
  KCI_MACHINE: release/machine.textproto
  # The commit this run releases (THE REVISION, above); on a pull request, the
  # merge commit the pr job checks.
  REVISION: ${{ inputs.revision || github.sha }}

jobs:
  build:
    # a release job: never on a pull request (R6); a break_glass stage, so a
    # manual run of a branch runs it (R13)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment: build
    timeout-minutes: 120
    permissions:
      contents: read
      # for farm-connect only: the token Tailscale trusts (the stage is
      # farm-connected; it publishes nothing)
      id-token: write
    outputs:
      # "true" when this revision has a release machine; the publish jobs run
      # only then.
      release: ${{ steps.machine.outputs.release }}
      # the release set's hash, from kci's result (R17)
      set_hash: ${{ steps.set_hash.outputs.set_hash }}
    env:
      # a manual run's reason, recorded by kci (never inside a `run:`, R16)
      REASON: ${{ inputs.reason }}
    steps:
      # Full history: kci and release_version.sh derive the stamp from git, and
      # both refuse a shallow clone; kci also reads this workflow at its commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REVISION }}
          fetch-depth: 0
          persist-credentials: false
      # The farm connection: tailnet join, refusal unless the farm answers, and
      # the machine buckconfig, from repository variables (docs/ci.md).
      - uses: ./.github/actions/farm-connect
        with:
          ts-client-id: ${{ vars.TS_CLIENT_ID }}
          ts-audience: ${{ vars.TS_AUDIENCE }}
          farm-address: ${{ vars.FARM_ADDRESS }}
          farm-instance: ${{ vars.FARM_INSTANCE }}
          farm-properties: ${{ vars.FARM_LINUX_X86_64_PROPERTIES }}
      # The same guard as ci.yml, over the file farm-connect wrote: without the
      # linux property set the build would run on this runner.
      - name: the buckconfig names the farm
        run: |
          for key in linux_x86_64_properties; do
            ./buck2 audit config "komira_re.$key" --style json | grep -q '": *"[^"]' ||
              { echo "the machine buckconfig sets no [komira_re] $key: this job would build on the runner"; exit 1; }
          done
      # A revision without a release machine is not a failure of a push to
      # main: the job says so (a warning and a summary line) and every later
      # step, and the publish jobs, are skipped. A MANUAL run asked for a
      # release, so there a missing machine file is a refusal.
      - name: the release machine exists
        id: machine
        run: |
          if [ -f "$KCI_MACHINE" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          msg="nothing to release: $REVISION has no $KCI_MACHINE"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "refused: $msg"
            exit 1
          fi
          echo "::warning title=kci skipped::$msg"
          echo "kci SKIPPED: $msg (build and the publish jobs did nothing)" >> "$GITHUB_STEP_SUMMARY"
          echo "release=false" >> "$GITHUB_OUTPUT"
      # The runnable directory: the binary and the runtime libraries it loads,
      # so it starts on the publish jobs' runners with no environment.
      - name: build kci
        if: steps.machine.outputs.release == 'true'
        run: ./buck2 build '//bin/kci:kci[runnable]' --out "$RUNNER_TEMP/kci"
      # The artifacts name the program `buck2`; the repository's is the
      # ./buck2 wrapper of this checkout.
      - name: buck2 on PATH
        if: steps.machine.outputs.release == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec "%s/buck2" "$@"\n' "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/bin/buck2"
          chmod +x "$RUNNER_TEMP/bin/buck2"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # kci first holds this workflow (as committed) to the machine file, then
      # checks the run's ref (a break-glass run off main needs its reason): a
      # drift or a refusal stops the run here, before anything is built.
      - name: kci run --stage build
        if: steps.machine.outputs.release == 'true'
        run: |
          set --
          if [ -n "$REASON" ]; then set -- --context reason="$REASON"; fi
          "$RUNNER_TEMP/kci/kci" run --stage build \
            --revision-id "$REVISION" --run-id "gh-$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --context driver=github-actions --context event="$GITHUB_EVENT_NAME" \
            --context ref="$GITHUB_REF" --context actor_id="$GITHUB_ACTOR_ID" \
            --context run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --work-dir "$GITHUB_WORKSPACE" --release-dir "$RUNNER_TEMP/release" \
            --log-dir "$RUNNER_TEMP/kci-logs" --result-file "$RUNNER_TEMP/kci-result-build.json" \
            --summary-file "$GITHUB_STEP_SUMMARY" "$@"
      # The set hash every later job is held to, read from kci's own result.
      - name: the set hash
        id: set_hash
        if: steps.machine.outputs.release == 'true'
        run: |
          h=$(jq -r '.set_hash' "$RUNNER_TEMP/kci-result-build.json")
          case "$h" in
            *[!0-9a-f]*|"") echo "the build's result holds no set hash ('$h')"; exit 1 ;;
          esac
          [ "${#h}" = 64 ] || { echo "the build's set hash is not 64 hex characters ('$h')"; exit 1; }
          echo "set_hash=$h" >> "$GITHUB_OUTPUT"
      - name: the build logs
        if: failure() && steps.machine.outputs.release == 'true'
        run: |
          for f in "$RUNNER_TEMP"/kci-logs/*; do
            [ -f "$f" ] && { echo "== $f"; cat "$f"; }
          done
          true
      # The result file of this job, whatever the outcome: the driver's record
      # of what kci did (kci_api's kci.result).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.machine.outputs.release == 'true'
        with:
          name: kci-result-build-${{ env.REVISION }}
          path: ${{ runner.temp }}/kci-result-build.json
          if-no-files-found: warn
          retention-days: 90
      # One tar, so the binary keeps its mode across the artifact store. The
      # build's result file travels with it.
      - name: pack the release
        if: steps.machine.outputs.release == 'true'
        run: tar -C "$RUNNER_TEMP" -cf "$RUNNER_TEMP/kci-release.tar" kci release kci-result-build.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.machine.outputs.release == 'true'
        with:
          name: kci-release-${{ env.REVISION }}
          path: ${{ runner.temp }}/kci-release.tar
          if-no-files-found: error
          retention-days: 14
      - name: Stop buck2
        if: always()
        run: ./buck2 kill || true
      # R18: what happens to prod, in one plain line (file header).
      - name: the prod line
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          RELEASE: ${{ steps.machine.outputs.release }}
        run: |
          line=""
          if [ "$JOB_STATUS" != success ]; then
            line="prod: SKIPPED (build $JOB_STATUS)"
          elif [ "$RELEASE" != true ]; then
            line="prod: SKIPPED (nothing to release)"
          fi
          if [ -n "$line" ]; then
            echo "### $line" >> "$GITHUB_STEP_SUMMARY"
            echo "$line" >&2
          fi

  gamma:
    needs: build
    # a break_glass stage: a manual run of a branch publishes here (R13)
    if: github.event_name != 'pull_request' && needs.build.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: gamma
    permissions:
      contents: read
      id-token: write
    env:
      # a push is a real run; a manual run is a dry run only when asked
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      # the set build made (R17): kci refuses a release that recomputes to another
      RELEASE_SET_HASH: ${{ needs.build.outputs.set_hash }}
      REASON: ${{ inputs.reason }}
    steps:
      # The machine file, the artifacts, the channels file and
      # release_version.sh at the release revision, with the full history the
      # version (and the "on main" check, and kci's read of this workflow at
      # its commit) needs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REVISION }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kci-release-${{ env.REVISION }}
          path: ${{ runner.temp }}/in
      - name: unpack the release
        run: tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/in/kci-release.tar"
      # kci compares this with every package before any request.
      - name: release_version.sh
        run: tools/build/package/release_version.sh "$REVISION" | tee "$RUNNER_TEMP/release_version.txt"
      # The channel's credential is trusted publishing (OIDC): kci reads the
      # job's ID token itself and resolves no secret, so the store is none. kci
      # refuses the token unless its environment is this stage's, gamma. The
      # stage's validation runs in the `validate` job, not here.
      - name: kci run --stage gamma --only step:publish
        run: |
          set --
          if [ "$DRY_RUN" = true ]; then set -- --plan; fi
          if [ -n "$REASON" ]; then set -- "$@" --context reason="$REASON"; fi
          "$RUNNER_TEMP/kci/kci" run --stage gamma --only step:publish \
            --revision-id "$REVISION" --run-id "gh-$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --context driver=github-actions --context event="$GITHUB_EVENT_NAME" \
            --context ref="$GITHUB_REF" --context actor_id="$GITHUB_ACTOR_ID" \
            --context run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --release-dir "$RUNNER_TEMP/release" --release-version "$RUNNER_TEMP/release_version.txt" \
            --release-set-hash "$RELEASE_SET_HASH" \
            --secret-store none --result-file "$RUNNER_TEMP/kci-result-gamma.json" \
            --summary-file "$GITHUB_STEP_SUMMARY" "$@"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: kci-result-gamma-${{ env.REVISION }}
          path: ${{ runner.temp }}/kci-result-gamma.json
          if-no-files-found: warn
          retention-days: 90
      # R18: what happens to prod, in one plain line (file header).
      - name: the prod line
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" != success ]; then
            rc=$(jq -r '.exit_code // empty' "$RUNNER_TEMP/kci-result-gamma.json" 2>/dev/null || true)
            line="prod: SKIPPED (gamma $JOB_STATUS${rc:+: exit $rc})"
            echo "### $line" >> "$GITHUB_STEP_SUMMARY"
            echo "$line" >&2
          fi

  validate:
    needs: [build, gamma]
    # a part of gamma: a break_glass stage (R13)
    if: github.event_name != 'pull_request' && needs.build.outputs.release == 'true'
    # docker is on the hosted image; no farm, no tailnet
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # No environment: no approval, and no environment secret to leak.
    permissions:
      # no id-token: this job cannot mint a publishing token
      contents: read
    outputs:
      # the set this job installed and validated, from its own kci result
      # (never the value it was given): what prod publishes (R17)
      validated_set_hash: ${{ steps.validated.outputs.set_hash }}
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      RELEASE_SET_HASH: ${{ needs.build.outputs.set_hash }}
      REASON: ${{ inputs.reason }}
    steps:
      # The machine file and the smoke program at the release revision; the
      # full history kci's read of this workflow at its commit needs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REVISION }}
          fetch-depth: 0
          persist-credentials: false
      # The SAME artifact gamma published: the pins are its release.json's.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kci-release-${{ env.REVISION }}
          path: ${{ runner.temp }}/in
      - name: unpack the release
        run: tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/in/kci-release.tar"
      # kci pulls the image itself (the digest is the machine file's), reads
      # the channel anonymously and starts the container with nothing of this
      # job's environment.
      - name: kci run --stage gamma --only validation:install
        run: |
          set --
          if [ "$DRY_RUN" = true ]; then set -- --plan; fi
          if [ -n "$REASON" ]; then set -- "$@" --context reason="$REASON"; fi
          "$RUNNER_TEMP/kci/kci" run --stage gamma --only validation:install \
            --revision-id "$REVISION" --run-id "gh-$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --context driver=github-actions --context event="$GITHUB_EVENT_NAME" \
            --context ref="$GITHUB_REF" --context actor_id="$GITHUB_ACTOR_ID" \
            --context run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --release-dir "$RUNNER_TEMP/release" --scratch-dir "$RUNNER_TEMP/validate" \
            --release-set-hash "$RELEASE_SET_HASH" \
            --result-file "$RUNNER_TEMP/kci-result-validate.json" \
            --summary-file "$GITHUB_STEP_SUMMARY" "$@"
      # The set kci recomputed and validated, from its result: prod's input.
      - name: the validated set hash
        id: validated
        run: |
          h=$(jq -r '.set_hash' "$RUNNER_TEMP/kci-result-validate.json")
          case "$h" in
            *[!0-9a-f]*|"") echo "the validation's result holds no set hash ('$h')"; exit 1 ;;
          esac
          [ "${#h}" = 64 ] || { echo "the validated set hash is not 64 hex characters ('$h')"; exit 1; }
          echo "set_hash=$h" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: kci-result-validate-${{ env.REVISION }}
          path: ${{ runner.temp }}/kci-result-validate.json
          if-no-files-found: warn
          retention-days: 90
      # R18: what happens to prod, in one plain line (file header). Whether
      # the prod environment waits for a reviewer is not read here (that
      # needs a permission no job holds): NEXT says so.
      - name: the prod line
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" != success ]; then
            rc=$(jq -r '.exit_code // empty' "$RUNNER_TEMP/kci-result-validate.json" 2>/dev/null || true)
            line="prod: SKIPPED (validate $JOB_STATUS${rc:+: exit $rc})"
          elif [ "$GITHUB_REF" != refs/heads/main ]; then
            line="prod: SKIPPED (break-glass on $GITHUB_REF_NAME: gamma only)"
          elif [ "$DRY_RUN" = true ]; then
            line="prod: PLAN ONLY (dry run)"
          else
            line="prod: NEXT (runs automatically; it waits only while the prod environment has a required reviewer)"
          fi
          echo "### $line" >> "$GITHUB_STEP_SUMMARY"
          echo "$line" >&2

  prod:
    # after the stage gamma: its publish AND its validation
    needs: [gamma, validate]
    # main only (R13; the prod environment's deployment branches say the
    # same): a break-glass run stops at gamma. A skipped gamma or validate
    # (no release machine, a failure) skips prod: no `always()` here.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: prod
    permissions:
      contents: read
      id-token: write
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      # the set validate installed (R17), never build's or gamma's
      RELEASE_SET_HASH: ${{ needs.validate.outputs.validated_set_hash }}
      REASON: ${{ inputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REVISION }}
          fetch-depth: 0
          persist-credentials: false
      # The SAME artifact gamma published: the bytes are never rebuilt.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kci-release-${{ env.REVISION }}
          path: ${{ runner.temp }}/in
      - name: unpack the release
        run: tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/in/kci-release.tar"
      - name: release_version.sh
        run: tools/build/package/release_version.sh "$REVISION" | tee "$RUNNER_TEMP/release_version.txt"
      # kci refuses the token unless its environment is this stage's, prod;
      # refuses a run off main or of a revision not on main's history; and
      # refuses a build number lower than the channel holds.
      - name: kci run --stage prod
        run: |
          set --
          if [ "$DRY_RUN" = true ]; then set -- --plan; fi
          if [ -n "$REASON" ]; then set -- "$@" --context reason="$REASON"; fi
          "$RUNNER_TEMP/kci/kci" run --stage prod \
            --revision-id "$REVISION" --run-id "gh-$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --context driver=github-actions --context event="$GITHUB_EVENT_NAME" \
            --context ref="$GITHUB_REF" --context actor_id="$GITHUB_ACTOR_ID" \
            --context run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --release-dir "$RUNNER_TEMP/release" --release-version "$RUNNER_TEMP/release_version.txt" \
            --release-set-hash "$RELEASE_SET_HASH" \
            --secret-store none --result-file "$RUNNER_TEMP/kci-result-prod.json" \
            --summary-file "$GITHUB_STEP_SUMMARY" "$@"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: kci-result-prod-${{ env.REVISION }}
          path: ${{ runner.temp }}/kci-result-prod.json
          if-no-files-found: warn
          retention-days: 90
      # R18: kci itself wrote `promoted to prod: ...` (or PLAN ONLY) on
      # success; this step says the failure.
      - name: the prod line
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" != success ]; then
            rc=$(jq -r '.exit_code // empty' "$RUNNER_TEMP/kci-result-prod.json" 2>/dev/null || true)
            line="prod: FAILED ($JOB_STATUS${rc:+: exit $rc}) $REVISION: see kci-result-prod-$REVISION"
            echo "### $line" >> "$GITHUB_STEP_SUMMARY"
            echo "$line" >&2
          fi

  pr:
    # A pull request from a branch of this repository, and nothing else: a
    # fork's pull request runs nothing, and a push or a manual run (no pull
    # request) skips this job (R6).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # No environment: no approval, and no environment secret reaches a pull
    # request's code.
    permissions:
      contents: read
      # for farm-connect only: the token Tailscale trusts (the stage is
      # farm-connected; it publishes nothing)
      id-token: write
    steps:
      # The merge commit, with the full history: kci reads the change from
      # git (`<base>...<revision>`) and refuses a shallow clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REVISION }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/farm-connect
        with:
          ts-client-id: ${{ vars.TS_CLIENT_ID }}
          ts-audience: ${{ vars.TS_AUDIENCE }}
          farm-address: ${{ vars.FARM_ADDRESS }}
          farm-instance: ${{ vars.FARM_INSTANCE }}
          farm-properties: ${{ vars.FARM_LINUX_X86_64_PROPERTIES }}
      - name: the buckconfig names the farm
        run: |
          for key in linux_x86_64_properties; do
            ./buck2 audit config "komira_re.$key" --style json | grep -q '": *"[^"]' ||
              { echo "the machine buckconfig sets no [komira_re] $key: this job would build on the runner"; exit 1; }
          done
      # kci as the build job builds it, from the pull request's code.
      - name: build kci
        run: ./buck2 build '//bin/kci:kci[runnable]' --out "$RUNNER_TEMP/kci"
      # The build systems name the program `buck2`; the repository's is the
      # ./buck2 wrapper of this checkout.
      - name: buck2 on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec "%s/buck2" "$@"\n' "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/bin/buck2"
          chmod +x "$RUNNER_TEMP/bin/buck2"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # kci first holds this workflow (as committed) to the machine file, then
      # builds the units the change reaches: the artifacts of
      # release/artifacts.textproto and the checks its buck2 build system
      # derives from the live graph (release/ci/derive_checks.py), so every
      # target of the graph is in some unit. The base is the pull request's
      # base commit, a full commit id GitHub sets.
      - name: kci run --stage pr
        run: |
          "$RUNNER_TEMP/kci/kci" run --stage pr --affected-by ${{ github.event.pull_request.base.sha }} \
            --revision-id "$REVISION" --run-id "gh-$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --context driver=github-actions --context event="$GITHUB_EVENT_NAME" \
            --context ref="$GITHUB_REF" --context actor_id="$GITHUB_ACTOR_ID" \
            --context run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --work-dir "$GITHUB_WORKSPACE" --log-dir "$RUNNER_TEMP/kci-logs" \
            --result-file "$RUNNER_TEMP/kci-result-pr.json" \
            --summary-file "$GITHUB_STEP_SUMMARY"
      - name: the build logs
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/kci-logs/*; do
            [ -f "$f" ] && { echo "== $f"; cat "$f"; }
          done
          true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: kci-result-pr-${{ env.REVISION }}
          path: ${{ runner.temp }}/kci-result-pr.json
          if-no-files-found: warn
          retention-days: 90
      - name: Stop buck2
        if: always()
        run: ./buck2 kill || true
