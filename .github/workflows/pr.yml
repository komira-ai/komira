# The pull request's check (docs/ci.md, "pr.yml"): the ONE job of this workflow,
# so the required status check is `pr / check` (workflow name `pr`, job id
# `check`) and a pull request never shows a skipped job of the release. The
# release is .github/workflows/release.yml, which has no `pull_request`
# trigger.
#
# The job runs named Buck2 targets on the farm and nothing else:
#   1. the files the change touches (`git diff` of the merge commit against its
#      first parent) and the coverage holds of both sides, into $RUNNER_TEMP;
#   2. the BXL selector (tools/build/ci/affected.bxl) turns them into the
#      targets to build: the owners of the files and everything that depends
#      on them, or the aggregate //ci:pr (the whole check set) when a file
#      cannot be mapped or touches the build system; the heavy checks
#      (rules.bzl HEAVY: the kci binary) only when the change owns paths of
#      theirs, so the aggregate is //ci:pr_default (without them) otherwise;
#   3. `build` of that list (a library's welded tests run inside its build);
#   4. the checks only a BXL script can make, over the whole graph: the
#      test_weld and graph_check lints, the completeness guard of //ci:pr, the
#      guard that it reaches no Python, and the cases of the selector and the
#      guard;
#   5. `test` of the list's standalone tests.
# Every Buck2 step is the buck2-farm action (.github/actions/buck2-farm), which
# fails the step unless buck2 succeeded and no action ran on the runner. The
# one other `./buck2 build` is that action's own tool.
#
# The change base is the first parent of the merge commit checked out: exactly
# the main the pull request is merged into, so the change is the pull request's
# alone. Never the event's base.sha: that is main when the event fired, and once
# main moves every change merged since then would count as this pull request's.
#
# Only for a pull request from a branch of this repository (a fork's run gets no
# tailnet credential; a maintainer reads the change and pushes it to a branch
# here); a GitHub-hosted runner; no environment and no secret; `contents: read`
# and the `id-token: write` the farm connection exchanges, nothing else; every
# action pinned; no publish step.
name: pr

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  # One group per pull request: a newer push to it cancels the older check.
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # The pull request's merge commit, which the job checks out.
  REVISION: ${{ github.sha }}

jobs:
  check:
    # A pull request from a branch of this repository, and nothing else: a
    # fork's pull request runs nothing.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    # No environment: no approval, and no environment secret reaches a pull
    # request's code.
    permissions:
      contents: read
      # for farm-connect only: the token Tailscale trusts
      id-token: write
    steps:
      # The merge commit, with the full history: the change is read from git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REVISION }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/farm-connect
        with:
          ts-client-id: ${{ vars.TS_CLIENT_ID }}
          ts-audience: ${{ vars.TS_AUDIENCE }}
          farm-address: ${{ vars.FARM_ADDRESS }}
          farm-instance: ${{ vars.FARM_INSTANCE }}
          farm-properties: ${{ vars.FARM_LINUX_X86_64_PROPERTIES }}
          tls: ${{ vars.FARM_TLS || 'false' }}
      - name: the buckconfig names the farm
        run: |
          for key in linux_x86_64_properties; do
            ./buck2 audit config "komira_re.$key" --style json | grep -q '": *"[^"]' ||
              { echo "the machine buckconfig sets no [komira_re] $key: this job would build on the runner"; exit 1; }
          done
      # The tool the buck2-farm action runs over each step's output; its path
      # is the step's output.
      - name: build the farm assertion
        id: assert
        run: echo "path=$(./buck2 build komira//tools/build/ci:assert_remote --show-full-simple-output)" >> "$GITHUB_OUTPUT"
      # The change: the files the pull request touches (renames as a delete and
      # an add) and the coverage holds of the base and of the head. HEAD must be
      # the merge commit.
      - name: the change
        run: |
          git rev-parse --verify --quiet HEAD^2 > /dev/null || { echo "::error::the change base is the merge commit's first parent, and HEAD is not a merge commit"; exit 1; }
          git diff --no-renames --name-only HEAD^1...HEAD > "$RUNNER_TEMP/changed.txt"
          git grep -n '' HEAD^1 HEAD -- '*coverage_held' > "$RUNNER_TEMP/held.txt"
      - name: select the affected targets
        uses: ./.github/actions/buck2-farm
        with:
          args: bxl komira//tools/build/ci/affected.bxl:affected @tools/build/ci/affected_changed.args @${{ runner.temp }}/changed.txt @tools/build/ci/affected_held.args @${{ runner.temp }}/held.txt
          assert-remote: ${{ steps.assert.outputs.path }}
      # The selector prints one label per line on stdout and its reasons on
      # stderr (each line there starts with a time stamp): the labels are the
      # lines of the action's log that start with a cell name.
      - name: the targets to build
        run: grep -E '^[a-z_]+//[^ ]+$' "$RUNNER_TEMP/buck2-farm.log" > "$RUNNER_TEMP/targets.txt"
      # Bounded well under the job's 330 minutes: the longest check of the
      # recorded runs took 91 minutes end to end, so a build that waits longer
      # is a stall (a saturated farm, a hung compile), and it ends red at 150
      # minutes instead of holding its slot to the job's limit. While it runs,
      # the buck2-farm action's console prints, every few seconds, one action
      # it waits on and how many others are left.
      - name: build
        timeout-minutes: 150
        uses: ./.github/actions/buck2-farm
        with:
          args: build --keep-going @${{ runner.temp }}/targets.txt
          assert-remote: ${{ steps.assert.outputs.path }}
      # test_weld: every test file is welded by a target (the lints of the
      # cell, and the two fixtures that hold the rule itself).
      - name: test_weld, the cell
        uses: ./.github/actions/buck2-farm
        with:
          args: bxl komira//tools/build/lint/test_weld.bxl:check -- --lint komira//:test_weld
          assert-remote: ${{ steps.assert.outputs.path }}
      - name: test_weld, the fixture over the rules
        uses: ./.github/actions/buck2-farm
        with:
          args: bxl komira//tools/build/lint/test_weld.bxl:check -- --lint tests//functional/test_weld:ok
          assert-remote: ${{ steps.assert.outputs.path }}
      - name: test_weld, the fixture over real packages
        uses: ./.github/actions/buck2-farm
        with:
          args: bxl komira//tools/build/lint/test_weld.bxl:check -- --lint tests//functional/test_weld/real:ok
          assert-remote: ${{ steps.assert.outputs.path }}
      # graph_check: queries of the whole build graph.
      - name: graph check, python_closure
        uses: ./.github/actions/buck2-farm
        with:
          args: bxl komira//tools/build/selftest/graph/checks.bxl:check -- --check komira//:python_closure
          assert-remote: ${{ steps.assert.outputs.path }}
      - name: graph check, selftest_closure
        uses: ./.github/actions/buck2-farm
        with:
          args: bxl komira//tools/build/selftest/graph/checks.bxl:check -- --check komira//tools/build/selftest/graph:selftest_closure
          assert-remote: ${{ steps.assert.outputs.path }}
      # //ci:pr holds every check target of the graph (fails, naming the
      # targets, when one exists outside it), and the selector and the guard
      # answer their cases.
      - name: the aggregate is complete
        uses: ./.github/actions/buck2-farm
        with:
          args: bxl komira//tools/build/ci/guard.bxl:check
          assert-remote: ${{ steps.assert.outputs.path }}
      - name: the aggregate reaches no Python
        uses: ./.github/actions/buck2-farm
        with:
          args: bxl komira//tools/build/ci/python_guard.bxl:check
          assert-remote: ${{ steps.assert.outputs.path }}
      # A package's buildrules.mojo.lock.bzl holds a unit graph per platform subdir; the
      # subdirs its mopm.lock records are the ones it must hold, and `:table` compares
      # only the ones the table has. This holds the two lists equal on linux.
      - name: every package holds the graphs its lock records
        uses: ./.github/actions/buck2-farm
        with:
          args: bxl komira//tools/build/ci/lock_graphs.bxl:check
          assert-remote: ${{ steps.assert.outputs.path }}
      # `//ci:pr_default`, which a change that owns none of the heavy checks builds in
      # place of `//ci:pr`, is `//ci:pr` without the roots of rules.bzl HEAVY.
      - name: the default aggregate leaves out the heavy checks and nothing else
        uses: ./.github/actions/buck2-farm
        with:
          args: bxl komira//tools/build/ci/default_guard.bxl:check
          assert-remote: ${{ steps.assert.outputs.path }}
      - name: the selector and guard cases
        uses: ./.github/actions/buck2-farm
        with:
          args: bxl komira//tools/build/ci/cases.bxl:run
          assert-remote: ${{ steps.assert.outputs.path }}
      # The README e2e's completeness guard (//:readme_e2e_complete, in the list above)
      # tells a moved package with no e2e target from one with; these are its cases.
      - name: the README e2e guard cases
        uses: ./.github/actions/buck2-farm
        with:
          args: bxl komira//tools/build/readme_e2e/cases.bxl:run
          assert-remote: ${{ steps.assert.outputs.path }}
      # The standalone tests of the list (the tests cell is built, never run,
      # as `./buck2 build tests//functional/...` builds it). The step exists
      # when the list holds a target that is not of that cell.
      - name: the standalone test targets
        id: tests
        run: grep -v '^tests//' "$RUNNER_TEMP/targets.txt" > "$RUNNER_TEMP/test_targets.txt" && echo "any=true" >> "$GITHUB_OUTPUT" || true
      - name: test
        if: steps.tests.outputs.any == 'true'
        # The list's tests were welded into its build, so this runs what the
        # build already ran: it is bounded by the same reasoning, at 90.
        timeout-minutes: 90
        uses: ./.github/actions/buck2-farm
        with:
          args: test @${{ runner.temp }}/test_targets.txt
          assert-remote: ${{ steps.assert.outputs.path }}
      - name: Stop buck2
        if: always()
        run: ./buck2 kill || true
