# The pull request's check (docs/ci.md, "pr.yml"): the ONE job of this workflow,
# so the required status check is `pr / check` (workflow name `pr`, job id
# `check`) and a pull request never shows a skipped job of the release. The
# release is .github/workflows/release.yml, which has no `pull_request`
# trigger.
#
# The same job is the check of a merge group (docs/ci.md, "The merge queue"):
# main takes pull requests only through GitHub's merge queue, which builds each
# queued pull request on top of the ones ahead of it on a branch of its own and
# merges it when this job is green there. The job reports under the same name
# for both events; a required check that never reported on a merge group would
# hold the queue until its timeout (//:pr_workflow_cases holds the trigger, the
# job's condition, the concurrency group and the step that writes the change;
# //tools/build/ci:change chooses the change base of each event).
#
# The job runs named Buck2 targets on the farm and nothing else:
#   1. the files the change touches (`git diff` of the commit checked out against
#      the change base) and the coverage holds of both sides, into $RUNNER_TEMP;
#   2. the BXL selector (tools/build/ci/affected.bxl) turns them into the
#      targets to build: the owners of the files and everything that depends
#      on them, or the aggregate //ci:pr (the whole check set) when a file
#      cannot be mapped or touches the build system; the heavy checks
#      (rules.bzl HEAVY, none today) only when the change owns paths of
#      theirs, so the aggregate is //ci:pr_default (without them) otherwise;
#   3. `build` of that list (a library's welded tests run inside its build);
#   4. the checks only a BXL script can make, over the whole graph: the
#      test_weld and graph_check lints, the completeness guard of //ci:pr, the
#      guard that it reaches no Python, and the cases of the selector and the
#      guard;
#   5. `test` of the list's standalone tests;
#   5b. the selection once more with Mojo 1.2.0, the next compiler
#      (tools/build/toolchains/mojo_versions.bzl), by naming the platform
#      linux-x86_64-mojo-1.2.0: tools/build/ci/mojo_next.bxl selects the list minus the
#      coverage roots and the Python surface (both built with the default compiler only), `build` and
#      `test` of that selection run, so a change that only 1.2.0 refuses fails its own
#      pull request while 1.1.0, the default, stays what ships;
#   6. the macOS part (docs/ci.md, "The macOS part of the check"): the libraries
#      of the macOS set the list reaches (tools/build/ci/darwin.bxl, its labels
#      read by tools/build/ci/darwin_targets), or the
#      whole set when the list is the aggregate, built for darwin-arm64 on the
#      farm's macOS workers, their welded tests included, bounded at 60 minutes;
#      only this step names the file of the macOS keys, so no other step
#      configures a macOS platform; the macOS libraries are built with Mojo 1.2.0 by
#      the release before it stages (release.yml, `build the packages for Mojo 1.2.0`);
#   7. the configuration and analysis of the release's whole macOS set and its
#      macOS Python harness tests, for their platform, with every Zig tool their
#      actions run held to the platform it runs on: no action runs
#      (release/darwin_analysis.bxl).
# Every Buck2 step is the buck2-farm action (.github/actions/buck2-farm), which
# fails the step unless buck2 succeeded and no action ran on the runner. The
# two other `./buck2 build`s are that action's own tool and the tool that
# writes the change.
#
# The change base of a pull request is the first parent of the merge commit
# checked out: exactly the main the pull request is merged into, so the change
# is the pull request's alone. Never the event's base.sha: that is main when the
# event fired, and once main moves every change merged since then would count as
# this pull request's. The change base of a merge group is its `base_sha`, the
# commit the group's head was built on, which does not move: the group's head
# is the pull request's squash commit on top of it, not a merge commit.
#
# Only for a pull request from a branch of this repository (a fork's run gets no
# tailnet credential; a maintainer reads the change and pushes it to a branch
# here), and for a merge group, which GitHub makes from a pull request a
# maintainer queued; a GitHub-hosted runner; no environment and no secret; `contents: read`
# and the `id-token: write` the farm connection exchanges, nothing else; every
# action pinned; no publish step.
name: pr

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
    branches: [main]

permissions: {}

concurrency:
  # One group per pull request: a newer push to it cancels the older check. A
  # merge group has no pull request number; its ref
  # (refs/heads/gh-readonly-queue/main/pr-<n>-<base>) is its own, so merge
  # groups never cancel each other or a pull request's check.
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The pull request's merge commit, or the merge group's head commit, which the
  # job checks out.
  REVISION: ${{ github.sha }}

jobs:
  check:
    # A merge group, or a pull request from a branch of this repository, and
    # nothing else: a fork's pull request runs nothing. A merge group has no
    # `pull_request` in its event, so without its own term here the job would
    # be skipped, and a skipped job counts as passed: the queue would merge
    # what nothing built.
    if: github.event_name == 'merge_group' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    # No environment: no approval, and no environment secret reaches a pull
    # request's code.
    permissions:
      contents: read
      # for farm-connect only: the token Tailscale trusts
      id-token: write
    steps:
      # The merge commit (a merge group: its head), with the full history: the
      # change is read from git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REVISION }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/farm-connect
        with:
          ts-client-id: ${{ vars.TS_CLIENT_ID }}
          ts-audience: ${{ vars.TS_AUDIENCE }}
          farm-address: ${{ vars.FARM_ADDRESS }}
          farm-instance: ${{ vars.FARM_INSTANCE }}
          farm-properties: ${{ vars.FARM_LINUX_X86_64_PROPERTIES }}
          # The farm's macOS workers, for the step `build for macOS` only: their keys go into
          # a file of their own, which that step names with --config-file, so every other
          # step configures no macOS platform (the configuration of the linux part is the
          # one it had before the macOS part existed).
          darwin-properties: ${{ vars.FARM_DARWIN_ARM64_PROPERTIES }}
          darwin-macos-hosts: ${{ vars.FARM_DARWIN_MACOS_HOSTS }}
          macos-library-dirs: ${{ vars.FARM_MACOS_LIBRARY_DIRS }}
          darwin-config-file: ${{ runner.temp }}/darwin.buckconfig
          tls: ${{ vars.FARM_TLS || 'false' }}
      - name: the buckconfig names the farm
        run: |
          for key in linux_x86_64_properties; do
            ./buck2 audit config "komira_re.$key" --style json | grep -q '": *"[^"]' ||
              { echo "the machine buckconfig sets no [komira_re] $key: this job would build on the runner"; exit 1; }
          done
      # The tool the buck2-farm action runs over each step's output; its path
      # is the step's output.
      - name: build the farm assertion
        id: assert
        run: echo "path=$(./buck2 build komira//tools/build/ci:assert_remote --show-full-simple-output)" >> "$GITHUB_OUTPUT"
      # The tool that writes the change (tools/build/ci/change), built on the
      # farm like the assertion; its path is the step's output.
      - name: build the change tool
        id: change
        run: echo "path=$(./buck2 build komira//tools/build/ci:change --show-full-simple-output)" >> "$GITHUB_OUTPUT"
      # The tool that reads the macOS part's selection (tools/build/ci/darwin_targets),
      # built on the farm like the change tool; its path is the step's output.
      - name: build the macOS targets tool
        id: darwin_tool
        run: echo "path=$(./buck2 build komira//tools/build/ci:darwin_targets --show-full-simple-output)" >> "$GITHUB_OUTPUT"
      # The change: the files the pull request (or the merge group) touches
      # (renames as a delete and an add) and the coverage holds of the base and
      # of the head, into changed.txt and held.txt. The base: a pull request's
      # is HEAD^1, and HEAD must be the merge commit; a merge group's is its
      # base_sha, which must be an ancestor of HEAD. Any other event stops here
      # (change.zig).
      - name: the change
        env:
          CHANGE: ${{ steps.change.outputs.path }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: '"$CHANGE" --event "$GITHUB_EVENT_NAME" --group-base "$GROUP_BASE" --out "$RUNNER_TEMP"'
      - name: select the affected targets
        uses: ./.github/actions/buck2-farm
        with:
          args: bxl komira//tools/build/ci/affected.bxl:affected @tools/build/ci/affected_changed.args @${{ runner.temp }}/changed.txt @tools/build/ci/affected_held.args @${{ runner.temp }}/held.txt
          assert-remote: ${{ steps.assert.outputs.path }}
      # The selector prints one label per line on stdout and its reasons on
      # stderr (each line there starts with a time stamp): the labels are the
      # lines of the action's log that start with a cell name.
      - name: the targets to build
        run: grep -E '^[a-z_]+//[^ ]+$' "$RUNNER_TEMP/buck2-farm.log" > "$RUNNER_TEMP/targets.txt"
      # Bounded well under the job's 330 minutes: the longest check of the
      # recorded runs took 91 minutes end to end, so a build that waits longer
      # is a stall (a saturated farm, a hung compile), and it ends red at 150
      # minutes instead of holding its slot to the job's limit. While it runs,
      # the buck2-farm action's console prints, every few seconds, one action
      # it waits on and how many others are left.
      - name: build
        timeout-minutes: 150
        uses: ./.github/actions/buck2-farm
        with:
          args: build --keep-going @${{ runner.temp }}/targets.txt
          assert-remote: ${{ steps.assert.outputs.path }}
      # test_weld: every test file is welded by a target (the lints of the
      # cell, and the two fixtures that hold the rule itself).
      - name: test_weld, the cell
        uses: ./.github/actions/buck2-farm
        with:
          args: bxl komira//tools/build/lint/test_weld.bxl:check -- --lint komira//:test_weld
          assert-remote: ${{ steps.assert.outputs.path }}
      - name: test_weld, the fixture over the rules
        uses: ./.github/actions/buck2-farm
        with:
          args: bxl komira//tools/build/lint/test_weld.bxl:check -- --lint tests//functional/test_weld:ok
          assert-remote: ${{ steps.assert.outputs.path }}
      - name: test_weld, the fixture over real packages
        uses: ./.github/actions/buck2-farm
        with:
          args: bxl komira//tools/build/lint/test_weld.bxl:check -- --lint tests//functional/test_weld/real:ok
          assert-remote: ${{ steps.assert.outputs.path }}
      # graph_check: queries of the whole build graph.
      - name: graph check, python_closure
        uses: ./.github/actions/buck2-farm
        with:
          args: bxl komira//tools/build/selftest/graph/checks.bxl:check -- --check komira//:python_closure
          assert-remote: ${{ steps.assert.outputs.path }}
      - name: graph check, selftest_closure
        uses: ./.github/actions/buck2-farm
        with:
          args: bxl komira//tools/build/selftest/graph/checks.bxl:check -- --check komira//tools/build/selftest/graph:selftest_closure
          assert-remote: ${{ steps.assert.outputs.path }}
      # //ci:pr holds every check target of the graph (fails, naming the
      # targets, when one exists outside it), and the selector and the guard
      # answer their cases.
      - name: the aggregate is complete
        uses: ./.github/actions/buck2-farm
        with:
          args: bxl komira//tools/build/ci/guard.bxl:check
          assert-remote: ${{ steps.assert.outputs.path }}
      - name: the aggregate reaches no Python
        uses: ./.github/actions/buck2-farm
        with:
          args: bxl komira//tools/build/ci/python_guard.bxl:check
          assert-remote: ${{ steps.assert.outputs.path }}
      # A package's buildrules.mojo.lock.bzl holds a unit graph per platform subdir; the
      # subdirs its mopm.lock records are the ones it must hold, and `:table` compares
      # only the ones the table has. This holds the two lists equal on linux.
      - name: every package holds the graphs its lock records
        uses: ./.github/actions/buck2-farm
        with:
          args: bxl komira//tools/build/ci/lock_graphs.bxl:check
          assert-remote: ${{ steps.assert.outputs.path }}
      # `//ci:pr_default`, which a change that owns none of the heavy checks builds in
      # place of `//ci:pr`, is `//ci:pr` without the roots of rules.bzl HEAVY.
      - name: the default aggregate leaves out the heavy checks and nothing else
        uses: ./.github/actions/buck2-farm
        with:
          args: bxl komira//tools/build/ci/default_guard.bxl:check
          assert-remote: ${{ steps.assert.outputs.path }}
      - name: the selector and guard cases
        uses: ./.github/actions/buck2-farm
        with:
          args: bxl komira//tools/build/ci/cases.bxl:run
          assert-remote: ${{ steps.assert.outputs.path }}
      # The README e2e's completeness guard (//:readme_e2e_complete, in the list above)
      # tells a moved package with no e2e target from one with; these are its cases.
      - name: the README e2e guard cases
        uses: ./.github/actions/buck2-farm
        with:
          args: bxl komira//tools/build/readme_e2e/cases.bxl:run
          assert-remote: ${{ steps.assert.outputs.path }}
      # The standalone tests of the list (the tests cell is built, never run,
      # as `./buck2 build tests//functional/...` builds it). The step exists
      # when the list holds a target that is not of that cell.
      - name: the standalone test targets
        id: tests
        run: grep -v '^tests//' "$RUNNER_TEMP/targets.txt" > "$RUNNER_TEMP/test_targets.txt" && echo "any=true" >> "$GITHUB_OUTPUT" || true
      - name: test
        if: steps.tests.outputs.any == 'true'
        # The list's tests were welded into its build, so this runs what the
        # build already ran: it is bounded by the same reasoning, at 90.
        timeout-minutes: 90
        uses: ./.github/actions/buck2-farm
        with:
          args: test @${{ runner.temp }}/test_targets.txt
          assert-remote: ${{ steps.assert.outputs.path }}
      # The same change with Mojo 1.2.0, the next compiler: the platform
      # linux-x86_64-mojo-1.2.0 is the linux platform plus the buildrules constraint
      # mojo_1_2_0, which komira's toolchain and every Mojo package select on, so no
      # target changes. The selector (tools/build/ci/mojo_next.bxl) prints the targets
      # above minus the coverage roots and the Python surface, or their twin aggregate:
      # coverage is measured with the default compiler only, so one compiler's figures
      # are the floors, and the wheel bundles the default compiler's runtime
      # (tools/build/ci/mojo_next.bzl). Every target of the selection is configured
      # anew under that platform, so its actions, the non-Mojo ones (Zig, Rust,
      # protobuf) included, are new to the farm's cache the first time. Bounded at
      # 120: the longest check of the recorded runs took 91 minutes end to end with
      # both steps above, so a second pass that waits longer is a stall. After the
      # 1.1.0 test, so a red 1.1.0 build spends no 1.2.0 time.
      - name: select the Mojo 1.2.0 targets
        uses: ./.github/actions/buck2-farm
        with:
          args: bxl komira//tools/build/ci/mojo_next.bxl:select @tools/build/ci/mojo_next_affected.args @${{ runner.temp }}/targets.txt
          assert-remote: ${{ steps.assert.outputs.path }}
      # The labels of the selection's log into next_targets.txt, and `any` set when there is
      # one (nothing is printed when the change reaches only targets left to the default compiler).
      - name: the Mojo 1.2.0 targets to build
        id: next
        run: grep -E '^[a-z_]+//[^ ]+$' "$RUNNER_TEMP/buck2-farm.log" > "$RUNNER_TEMP/next_targets.txt" && echo "any=true" >> "$GITHUB_OUTPUT" || true
      - name: build with Mojo 1.2.0
        if: steps.next.outputs.any == 'true'
        timeout-minutes: 120
        uses: ./.github/actions/buck2-farm
        with:
          args: build --keep-going --target-platforms komira//tools/build/platforms:linux-x86_64-mojo-1.2.0 @${{ runner.temp }}/next_targets.txt
          assert-remote: ${{ steps.assert.outputs.path }}
      # The standalone tests of the selection (the tests cell is built, never run).
      - name: the Mojo 1.2.0 standalone test targets
        id: next_tests
        if: steps.next.outputs.any == 'true'
        run: grep -v '^tests//' "$RUNNER_TEMP/next_targets.txt" > "$RUNNER_TEMP/next_test_targets.txt" && echo "any=true" >> "$GITHUB_OUTPUT" || true
      # Bounded at 60 (the 1.1.0 test is at 90): its tests were welded into the
      # build above, so this runs what that build already ran.
      - name: test with Mojo 1.2.0
        if: steps.next_tests.outputs.any == 'true'
        timeout-minutes: 60
        uses: ./.github/actions/buck2-farm
        with:
          args: test --target-platforms komira//tools/build/platforms:linux-x86_64-mojo-1.2.0 @${{ runner.temp }}/next_test_targets.txt
          assert-remote: ${{ steps.assert.outputs.path }}
      # The macOS part (docs/ci.md, "The macOS part of the check"): of the targets above,
      # the libraries of the macOS set (//release:mopm_darwin_libs) the change reaches, or
      # the whole set when the change is built as the aggregate, built for darwin-arm64 on
      # the farm's macOS workers. Building a library runs its welded tests there. After the
      # linux part, so no step of it waits on a Mac; skipped when the linux part failed, so
      # a red check spends no Mac time.
      - name: select the macOS targets
        uses: ./.github/actions/buck2-farm
        with:
          args: bxl komira//tools/build/ci/darwin.bxl:select @tools/build/ci/darwin_affected.args @${{ runner.temp }}/targets.txt
          assert-remote: ${{ steps.assert.outputs.path }}
      # The labels of the selection's log into darwin_targets.txt, and `any` set when
      # there is one (tools/build/ci/darwin_targets says what it refuses).
      - name: the macOS targets to build
        id: darwin
        env:
          DARWIN_TARGETS: ${{ steps.darwin_tool.outputs.path }}
        run: '"$DARWIN_TARGETS" --log "$RUNNER_TEMP/buck2-farm.log" --out "$RUNNER_TEMP/darwin_targets.txt" --github-output "$GITHUB_OUTPUT"'
      # While every Mac is busy the farm queues the actions and this step waits: the check
      # stays pending. 60 minutes bound the wait (the whole set with 1021 new actions took
      # 14, docs/ci.md): past
      # it the step fails, so the check is red and never holds the merge queue to its own
      # limit.
      - name: build for macOS
        if: steps.darwin.outputs.any == 'true'
        timeout-minutes: 60
        uses: ./.github/actions/buck2-farm
        with:
          args: build --config-file ${{ runner.temp }}/darwin.buckconfig --target-platforms komira//tools/build/platforms:darwin-arm64 --keep-going @${{ runner.temp }}/darwin_targets.txt
          assert-remote: ${{ steps.assert.outputs.path }}
      # The release's macOS set (//release:mopm_darwin_libs) and its macOS Python
      # harness tests (DARWIN_PYTHON_HARNESS of release/darwin_libs.bzl), built whole by
      # release-macos.yml on the farm's macOS workers, configured for darwin-arm64
      # and analysed, with their whole closure, and every Zig tool their actions run
      # held to the platform it runs on: a change that makes them fail before
      # anything is built fails here, in its own pull request. Configuring and
      # analysing run no action, so nothing is built for macOS; the config file
      # registers the macOS execution platform with a property set that names no
      # worker (release/darwin_analysis.buckconfig). Last, because the config file
      # changes the daemon's configuration; it runs whenever the farm assertion
      # was built, so a red build above does not hide its answer.
      - name: the Mac release set configures and analyses
        if: ${{ !cancelled() && steps.assert.outcome == 'success' }}
        uses: ./.github/actions/buck2-farm
        with:
          args: bxl --config-file release/darwin_analysis.buckconfig komira//release/darwin_analysis.bxl:check
          assert-remote: ${{ steps.assert.outputs.path }}
      - name: Stop buck2
        if: always()
        run: ./buck2 kill || true
