# The gates of the komira_core split (tools/core_split/README.md). They are
# deleted with komira_core, together with tools/core_split. A separate file so
# that nothing here can conflict with ci.yml.
#
# Some steps need what a Buck test cannot have, a git history or a buck2
# client: core_frozen_vs_F, copy_exact, the closure check and the two importer
# checks. The rest of the gates are Buck test targets (`./buck2 test
# //tools/core_split/...`), which ci.yml's `./buck2 test //...` runs too; they run
# here again so that this workflow is one verdict for the split.
#
# Runs on a GitHub-hosted runner and reaches the farm as ci.yml does
# (.github/actions/farm-connect). A pull request from a fork gets no farm
# access, so it runs none of this; ci.yml's `fork-advisory` says so.
name: core_split

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

env:
  # The checks are python; keep their bytecode out of the checkout.
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  # One run per pull request, cancelling a superseded one; every other run has
  # a group of its own commit (the reason is in ci.yml).
  group: core_split-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    # Fork pull requests get neither the OIDC token nor the repository
    # variables, so the farm job is for this repository's own runs; a fork's
    # pull request gets no job here (ci.yml's `fork-advisory` is the only one).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/farm-connect
        with:
          ts-client-id: ${{ vars.TS_CLIENT_ID }}
          ts-audience: ${{ vars.TS_AUDIENCE }}
          farm-address: ${{ vars.FARM_ADDRESS }}
          farm-instance: ${{ vars.FARM_INSTANCE }}
          farm-properties: ${{ vars.FARM_LINUX_X86_64_PROPERTIES }}

      # F is the commit that recorded the digests. The two packages must be
      # what they were then, so editing a file and its digest together fails.
      - name: core_frozen_vs_F
        run: |
          F=$(git log --diff-filter=A --format=%H -n 1 -- tools/core_split/core.sha256)
          test -n "$F" || { echo "core_frozen_vs_F: no commit adds tools/core_split/core.sha256"; exit 1; }
          if git diff --quiet "$F" HEAD -- src/komira_core src/komira_core_ffi; then
            echo "core_frozen_vs_F GREEN: src/komira_core and src/komira_core_ffi equal their state at $F"
          else
            echo "core_frozen_vs_F RED: these changed since $F:"
            git diff --stat "$F" HEAD -- src/komira_core src/komira_core_ffi
            exit 1
          fi

      - name: core_frozen, map_total
        run: ./buck2 test //tools/core_split/...

      # A commit whose message has a `Core-Split-Copy: <package>` trailer is a
      # package's first commit; what it holds must be what split.py generates
      # from the src/komira_core of that same commit. Later commits may differ.
      # On a pull request the range is BASE..HEAD; on any other event it is the
      # whole history, so a push cannot skip it. A range with no trailered
      # commit is reported as NOT CHECKED (a warning), never as GREEN.
      - name: copy_exact
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 tools/core_split/check.py copy_range --repo . --base "$BASE" --head "${HEAD:-HEAD}" \
            --map tools/core_split/split_map.tsv --ffi-map tools/core_split/libc_rename_map.tsv | tee "$RUNNER_TEMP/copy_exact.log"
          if grep -q 'NOT CHECKED' "$RUNNER_TEMP/copy_exact.log"; then echo "::warning::copy_exact compared nothing"; fi

      # What a package's BUCK says it depends on must be what its files import
      # (and the C symbols they call): the deps are derived, never translated.
      - name: deps_derived
        run: python3 tools/core_split/check.py deps --tree . --map tools/core_split/split_map.tsv --core src

      - name: no_mixed_closure
        run: |
          tools/core_split/no_mixed_closure.sh --selftest
          tools/core_split/no_mixed_closure.sh

      # One marker per word, because the two words are repointed at different
      # times. The commit that repoints the one importer of komira_core_ffi
      # (S3.0) adds tools/core_split/libc_importers_enforced; the commit that
      # repoints the last mention of komira_core, in two design documents (S4,
      # with the deletion of src/komira_core), adds
      # tools/core_split/core_importers_enforced. A word whose marker is absent
      # is reported as NOT ENFORCED, never as GREEN.
      - name: no_core_importers, no_core_ffi_importers
        run: |
          status=0
          for pair in komira_core_ffi:libc komira_core:core; do
            word=${pair%%:*}; marker=tools/core_split/${pair##*:}_importers_enforced
            if [ ! -e "$marker" ]; then
              echo "importers $word: NOT ENFORCED yet (no $marker)"
              echo "::warning::importer check for $word is not enforced"
              continue
            fi
            python3 tools/core_split/check.py importers --root . --word "$word" \
              --exclude .git/ --exclude buck-out/ --exclude src/komira_core/ --exclude src/komira_core_ffi/ \
              --exclude tools/core_split/ --exclude .github/workflows/core_split.yml || status=1
          done
          exit "$status"

      # The two rewriters seed each statement they must handle (and, for repoint.py,
      # that a second run changes nothing and that an unresolved import is red).
      - name: split_selftest, repoint_selftest
        run: |
          python3 tools/core_split/split_selftest.py
          python3 tools/core_split/repoint_selftest.py

      - name: Stop buck2
        if: always()
        run: ./buck2 kill || true
