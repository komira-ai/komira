# Throwaway probe: can a GitHub-hosted job join the tailnet as tag:ci and reach the farm frontend?
# Manual only. Reads three repository variables (TS_CLIENT_ID, TS_AUDIENCE, FARM_ADDRESS); no secret, no endpoint in this file.
# It prints the OIDC `sub` claim (not the token) so the Tailscale credential subject can be checked, then measures the path.
name: tailnet-probe

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: tailnet-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - name: show the OIDC subject claim (never the token)
        run: |
          set -eu
          tok="$(curl -sS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=probe" | sed -n 's/.*"value":"\([^"]*\)".*/\1/p')"
          echo "::add-mask::${tok}"
          payload="$(printf '%s' "${tok}" | cut -d. -f2 | tr '_-' '/+')"
          pad=$(( (4 - ${#payload} % 4) % 4 )); payload="${payload}$(printf '=%.0s' $(seq 1 ${pad}) 2>/dev/null || true)"
          printf '%s' "${payload}" | base64 -d 2>/dev/null | grep -o '"\(sub\|ref\|event_name\)":"[^"]*"' | sed 's/":"/ = /; s/"//g'; echo
      - uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci
          log-mode: quiet
      - name: path and reachability (no addresses, names or accounts are printed: this log is public)
        env:
          FARM_ADDRESS: ${{ vars.FARM_ADDRESS }}
        run: |
          set -u
          hp="${FARM_ADDRESS#*//}"; host="${hp%:*}"; port="${hp##*:}"
          if tailscale ping -c 5 "${host}" 2>&1 | grep -q ' via DERP'; then relay=relayed; else relay=direct; fi
          ms="$(tailscale ping -c 5 "${host}" 2>&1 | sed -n 's/.* in \([0-9]*\)ms.*/\1/p' | tail -1)"
          echo "path to the farm: last ping ${ms:-unknown} ms; first-hop kind seen: ${relay}"
          if timeout 10 bash -c "</dev/tcp/${host}/${port}"; then echo "reachable ${port}"; else echo "NOT reachable ${port}"; exit 1; fi
          for p in 30983 22 6443; do
            if timeout 5 bash -c "</dev/tcp/${host}/${p}" 2>/dev/null; then echo "UNEXPECTEDLY reachable ${p}"; exit 1; else echo "blocked ${p} (expected)"; fi
          done
