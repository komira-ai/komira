# merge-from-live: a weekly pull request bumping the pins (buck2, the
# toolchain downloads, third_party archives) to their live releases, merged
# only if its ci run is green. See docs/ci.md.
#
# NOT IMPLEMENTED YET. The job runs .github/ci/merge_from_live.sh, which
# describes the design and exits 1. The weekly schedule is off until that
# script opens pull requests; add it back then:
#
#   schedule:
#     - cron: "17 6 * * 1"
name: merge-from-live

on:
  workflow_dispatch:

permissions: {}

jobs:
  bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: .github/ci/merge_from_live.sh
        run: .github/ci/merge_from_live.sh
