# mopm versions this repository pins beyond the one buildrules pins itself (rules/mopm/pins.bzl).
# `buildrules mojo sync` copies this file into tools/build/cells/toolchains/mopm_pins.bzl.
#
# No package names a mopm other than the one buildrules pins, so no table is needed for the packages.
# A package that must stay on an older mopm adds `[mopm."<version>"]` here (url, sha256, size) and names
# `toolchains//:mopm_<version with underscores>` in its `mojo_conda`.
#
# mopm 0.0.53 is the mopm of the README e2e (release/readme_e2e/packages.bzl): it has
# `mopm add --overlay`, which the e2e installs with, request time limits and retries, and upload URLs
# refreshed during a long `publish --staged`. No package builds with it.
[mopm."0.0.53"]
url = "https://github.com/komira-ai/mopm/releases/download/v0.0.53/mopm-0.0.53-linux-x86_64.tar.gz"
sha256 = "bfbf2dd82ccdf405577178ba08ce37e3048096bb6cee8800305ac3b2a11d5629"
size = 1206279
