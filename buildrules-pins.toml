# mopm versions this repository pins beyond the ones buildrules pins itself (rules/mopm/pins.bzl,
# with the linux-aarch64 and macos-arm64 tarballs of rules/mopm/hosts.bzl).
# `buildrules mojo sync` copies this file into tools/build/cells/toolchains/mopm_pins.bzl.
#
# buildrules pins mopm 0.0.48, 0.0.73, 0.0.81, 0.0.83, 0.0.85 and 0.0.86 itself, for every host a table needs, and a row
# for a version it pins is refused. Every mopm this repository uses is one of them: the packages, the
# release's stage and publish steps and the README e2e use 0.0.86. A version buildrules does not pin is
# added as `[mopm."<version>"]` (url, sha256, size; linux x86_64 only, buildrules has no way to pin another
# host's tarball for it) and named in `mopm-toolchain.toml` of the package that needs it and by
# `toolchains//:mopm_<version with underscores>` in its `mojo_conda`. There is none now.
