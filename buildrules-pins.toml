# mopm versions this repository pins beyond the one buildrules pins itself (rules/mopm/pins.bzl).
# `buildrules mojo sync` copies this file into tools/build/cells/toolchains/mopm_pins.bzl.
#
# No package names a mopm other than the one buildrules pins, so no table is needed. A package
# that must stay on an older mopm adds `[mopm."<version>"]` here (url, sha256, size) and names
# `toolchains//:mopm_<version with underscores>` in its `mojo_conda`.
