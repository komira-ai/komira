# mopm versions this repository pins beyond the ones buildrules pins itself (rules/mopm/pins.bzl,
# with the linux-aarch64 and macos-arm64 tarballs of rules/mopm/hosts.bzl).
# `buildrules mojo sync` copies this file into tools/build/cells/toolchains/mopm_pins.bzl.
#
# No row today: buildrules pins mopm 0.0.48 and 0.0.73 itself, for every host a table needs, and a
# row for a version it pins is refused. A version buildrules does not pin is added as
# `[mopm."<version>"]` (url, sha256, size) and named in `mopm-toolchain.toml` of the package that
# needs it and by `toolchains//:mopm_<version with underscores>` in its `mojo_conda`.
#
# mopm 0.0.73 is the mopm of the README e2e (release/readme_e2e/packages.bzl) and of the release's
# stage and publish steps (.github/workflows/release.yml).
