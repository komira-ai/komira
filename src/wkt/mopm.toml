[package]
name = "komira-ai/wkt"
version = "0.1.0"
description = "The protobuf well-known types (Timestamp, Duration, Empty, the scalar wrappers, FieldMask, Struct, Value, ListValue and an opaque Any) as Mojo structs, each with its proto3 canonical JSON form."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.1.0", "1.2.0"]

[dependencies]
"komira-ai/datetime" = { path = "../datetime", version = "0.1" }
"komira-ai/encoding" = { path = "../encoding", version = "0.1" }
"komira-ai/json" = { path = "../json", version = "0.1" }
"komira-ai/proto_codec" = { path = "../proto_codec", version = "0.1" }

[targets]
lib = { path = "src/wkt" }
tests = ["tests"]
