[package]
name = "kci_release_machine"
version = "0.1.0"
description = "The kci machine file: a release machine's stages and steps in order, parsed and checked from a textproto."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.0.0"]

[dependencies]
kci_api = { path = "../kci_api", version = "0.1" }
komira_textproto = { path = "../komira_textproto", version = "0.1" }

[targets]
lib = { path = "src/kci_release_machine" }
tests = ["tests"]
