[package]
name = "komira_fork_join"
version = "0.1.0"
description = "Run one body on n real POSIX threads and return only after every thread has exited."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.0.0"]

[dependencies]
komira_atomic_alias = { path = "../komira_atomic_alias", version = "0.1" }

[targets]
lib = { path = "src/komira_fork_join" }
tests = ["tests"]
