[package]
name = "komira_json"
version = "0.1.0"
description = "A small dependency-free JSON library (RFC 8259): a tagged JsonValue, a strict depth-limited parser, a duplicate-member check and direct-byte writers."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.0.0"]

[targets]
lib = { path = "src/komira_json" }
tests = ["tests"]
