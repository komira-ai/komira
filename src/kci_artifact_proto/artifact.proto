// The artifacts: the one reviewed list of what kci builds and
// publishes, and the build system that builds each.
//
// kci models a build system generically and knows no build tool by name:
// the build system builds, kci only ships. A build system is a program and
// the flags it is always run with; whatever it needs is installed in the
// container kci runs in. There is no list of supported build tools, no
// kind of artifact and no enum anywhere in this file.
//
// THE BUILD RULES. For each artifact, one at a time and in the order of this
// file, kci creates an EMPTY output directory under the release directory
// and runs
//
//   <executable> <build_system.args...> <artifact.args...>
//
// with every placeholder in any argument replaced by its value, in one pass:
//
//   {out_dir}        this artifact's output directory, {release_dir}/<name>
//   {release_dir}    this platform's release directory,
//                    <--release-dir>/<platform>: the output directory of
//                    every artifact declared ABOVE, each built and verified
//   {platform}       the platform the release is built for (`linux-x86_64`)
//   {revision_id}    the release commit (`kci run --revision-id`, the full
//                    40-hex id of the commit checked out)
//   {source_commit}  the newest first-parent commit at or below it that
//                    touches anything but documentation
//   {build_number}   the first-parent commit count of {source_commit}
//   {timestamp_ms}   {source_commit}'s commit time, in milliseconds
//
// The last four are the release stamp, derived by kci from git (never typed,
// never read from the environment). Any other `{<identifier>}` is refused (a
// brace not around an identifier is passed through as written). A
// metapackage is an ordinary artifact placed LAST, reading its members'
// manifests under {release_dir}. One metapackage per subdir whose members
// are every library of the file is the rule the PUBLISH step enforces (a
// recommendation; the CEO has not answered it).
//
// ONE ARTIFACT PER ENTRY. The build must leave, at the top of that
// directory, EXACTLY ONE kci artifact manifest (the format of
// //src/kci_artifact_manifest), named `manifest.json`, plus the files it
// names (for a CONDA artifact: the `.conda` and `metadata.json`, both next
// to it). kci refuses a build that leaves no `manifest.json` there, a
// listing that names it more than once, and a manifest whose `name` is not
// the artifact's `name`, compared exactly (byte for byte: no case
// folding, no trimming, no `-`/`_` equivalence). kci ships exactly what
// that manifest describes: the artifact type, version, platform, file,
// sha256 and metadata all come from it, never from this file. A build that
// exits non-zero is refused.
//
// Buck2 needs no special code: a build system `buck2` with args
// `["build", "-c", "komira.package_stamp={build_number}", ...]` (the
// `[komira]` stamp keys are read at analysis, so `-c` reaches them) and
// artifact args
// `["//src/komira_encoding:komira_encoding_conda[release]", "--out",
// "{out_dir}"]`. The subcommand belongs in the build system's args because
// those come first. The farm is machine configuration, not an entry of this file:
// a buckconfig buck2 reads when its daemon starts (`/etc/buckconfig.d/` or
// `~/.buckconfig.d/`). `--config-file` and `-c` in args cannot name it:
// the daemon reads `[buck2_re_client]` from config files only, at startup,
// so a build given them fails with "No engine address". What
// `buck2 build --out <existing dir>` copies is the ONE
// default output of the ONE target named: a single file lands in the
// directory under its own name, the CONTENTS of a directory output land
// directly in it (files already there are kept, which is why kci starts
// from an empty one), and two or more default outputs, or two targets, are
// refused ("choice of output is ambiguous"). A `conda_package`'s
// `[release]` is such a directory: `<name>-<version>-0.conda`,
// `manifest.json` and `metadata.json` (tools/build/package/conda.bzl).
//
// Set-level rules (every declared artifact built, versions in lockstep, the
// one metapackage published after its members, each package's requirements
// closed over the set) need the built manifests, so they are checked over
// those manifests, not here: kci build refuses a library requirement whose
// name is not the conda name of another library of the set (the platform
// guard and the compiler pin aside), and kci publish checks every rule.
//
// Deliberately absent: a version, a sha256, a file name, a platform and an
// artifact type (the built manifest carries them), and where an artifact is
// published to (the PUBLISH step's).
//
// THE PER-CHANGE CHECK (`kci run --stage <S> --affected-by <base commit>`).
// A UNIT is an artifact or a check (`checks`: built, never shipped, no
// manifest); both share one name space. Each unit names the build targets
// it stands for (`targets`). A build system that owns a unit and is to take
// part declares two commands:
//
//   affected       which units a change reaches. kci runs, in the work dir,
//                  <executable> <args...> with {changed_files}, {units_file},
//                  {base_commit} and {revision_id} substituted (the first two
//                  are required). {changed_files} is a file holding the
//                  paths `git diff -z --name-only --no-renames
//                  <base>...<revision>` printed (NUL-terminated, as git
//                  prints them); {units_file} a file of `<unit>\t<target>\n`
//                  lines, every target of every unit THIS build system owns.
//                  It prints, on stdout, one `UNIT <name>` line per affected
//                  unit and exactly one verdict line: `AFFECTED <n>` (n is
//                  the number of UNIT lines; 0 is allowed) or `WIDENED
//                  <reason>` with no UNIT line (the change reaches every
//                  declared unit: a file it cannot map, a change to the build
//                  system itself), or `BROKEN <reason>` with no UNIT line
//                  (the tool's query of its build graph failed, such as on a
//                  target it cannot configure; kci FAILS the check). Which files widen is the tool's to say:
//                  kci names no build tool and no path.
//   build_targets  how a unit is built for the check: <executable> <args...>
//                  <the unit's targets...>, no placeholder, no output
//                  directory and no manifest (nothing ships). Units whose
//                  build_targets commands are identical (the executable and
//                  every arg) are built in ONE run over the union of their
//                  targets (exact repeats dropped), so the command must be
//                  correct on the union of several units' targets.
//
// A build system may also declare a third, which makes the checks it owns
// DERIVED from its build graph when the check runs, rather than listed here:
//
//   derive_checks  run first, in the work dir, with the affected command's
//                  placeholders ({units_file} required): {units_file} is a
//                  file of `<unit>\t<target>\n` lines for every target of
//                  every DECLARED unit, of every build system. It prints,
//                  on stdout, `CHECK <name> <target>` per target of each
//                  derived check, `UNMATCHED <unit> <target>` per declared
//                  target that matches nothing in the graph, and exactly one
//                  verdict line, LAST: `DERIVED <n>` (n the number of
//                  derived checks; 0 is allowed); or, as its only line,
//                  `BROKEN <reason>` when it could not query the graph (its
//                  query failed): kci FAILS the check (KCI-E-BUILD-FAILED),
//                  never a widening. The derived checks are
//                  added after the declared ones, owned by that build
//                  system, under the file's rules (a name a declared unit
//                  has is refused). An UNMATCHED artifact target is refused
//                  (KCI-E-ARTIFACT); an UNMATCHED check target is a notice
//                  (the package it named is gone). A tool that fails or
//                  prints anything else is "cannot tell" (KCI-E-AFFECTED).
//                  Which targets a derived check names, and how they are
//                  grouped, is the tool's to say; a tool that names every
//                  target no declared unit names keeps every target of the
//                  graph in some unit with no edit to this file.
//
// kci builds exactly the affected units (every declared unit when any
// build system's answer is WIDENED), artifacts then checks in file order:
// one run per group of units sharing a build_targets command (a group of
// one runs that unit's targets alone). A batch that fails is retried unit by
// unit, in order, to name the failing units, until 3 have failed; a batch
// that times out is not retried and attributes no unit, and a batch killed
// by a signal is treated as a timed-out one; a batch that fails while each
// of its units builds alone is "cannot tell", never a pass. A
// unit counts as built only when a run that covered it succeeded. A
// non-empty change reaching no unit is refused, and so is an
// empty change; a tool that fails or prints anything else is "cannot tell",
// never a widening. A run that names a unit without `targets`, or a build
// system owning a unit without both commands, is refused before anything
// runs. A BUILD step without `--affected-by` builds the artifacts only and
// ignores `checks`, `targets` and both commands.
//
// Other `.proto` files import it as `kci/release/v1/artifact.proto`.
syntax = "proto3";

package kci.release.v1;

// An artifacts file: the build systems, then every artifact kci may build
// or publish, each once.
message Artifacts {
  repeated BuildSystem build_systems = 1;
  repeated Artifact artifacts = 2;

  // The file's format major (kci_api's format table,
  // `kci.artifacts`). Required: a file without it is refused
  // naming the field to add, and a major this kci does not read is refused
  // before any other field is read ("needs a newer kci"). Inside a major,
  // fields are only ever added.
  int32 schema_version = 3;

  // Units built by the per-change check only (file header): a lint, a doc
  // tree, a tool, a test suite. Never built by a BUILD step without
  // `--affected-by`, never published.
  repeated Check checks = 4;
}

// A program and its args, for one of a build system's per-change commands.
message Command {
  // Required. A program name, resolved on PATH, or an absolute path (the
  // rules of BuildSystem.executable).
  string executable = 1;

  // Args, in order; no entry may be empty. Which placeholders an arg may
  // hold is the command's (file header).
  repeated string args = 2;
}

// A program kci runs to build an artifact, and the flags it always gets.
message BuildSystem {
  // The name artifacts refer to it by; `[a-z][a-z0-9_]*`, unique among the
  // build systems.
  string name = 1;

  // Required. A program name, resolved on PATH, or an absolute path. No
  // whitespace, and no relative path (`./buck2` would resolve against a
  // working directory the file does not state).
  string executable = 2;

  // Args passed on every invocation, before the artifact's own, e.g.
  // `["build"]`. May be empty; no entry may be. Placeholders are substituted
  // here too.
  repeated string args = 3;

  // Which of this build system's units a change reaches (file header).
  // Optional; required by `--affected-by` when the build system owns a
  // unit.
  Command affected = 4;

  // How the per-change check builds one of this build system's units: its
  // targets are appended (file header). Optional, except that a check
  // needs its build system to declare it.
  Command build_targets = 5;

  // Derives this build system's checks from its build graph when the
  // per-change check runs (file header). Optional; a build system that
  // declares it declares `affected` and `build_targets` too.
  Command derive_checks = 6;
}

message Artifact {
  // The artifact's name; `[a-z][a-z0-9_]*`, unique among the artifacts.
  // The built `manifest.json`'s `name` must equal it exactly, so this is the
  // published name too (a conda package's name has the same syntax).
  string name = 1;

  reserved 2;
  reserved "allowed_channels";

  // The name of a declared BuildSystem.
  string build_system = 3;

  // Appended after the build system's args. Non-empty, no empty entry, and
  // `{out_dir}` must appear in the combined args (build system's and these):
  // otherwise kci cannot know where the outputs are.
  repeated string args = 4;

  // The build targets this artifact stands for in the per-change check
  // (file header). No entry empty, holding whitespace or a placeholder, or
  // given twice. Optional; required by `--affected-by`.
  repeated string targets = 5;
}

// A unit the per-change check builds and nothing ships (file header).
message Check {
  // `[a-z][a-z0-9_]*`, unique among the artifacts and the checks.
  string name = 1;

  // The name of a declared BuildSystem that declares `build_targets`.
  string build_system = 2;

  // Required: at least one; each entry as Artifact.targets.
  repeated string targets = 3;
}
