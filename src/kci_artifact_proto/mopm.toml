[package]
name = "kci_artifact_proto"
version = "0.1.0"
description = "The kci artifacts schema (kci.release.v1) as Mojo structs generated from its .proto file: the build systems and the artifacts they build."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.0.0"]

[dependencies]
komira_proto_codec = { path = "../komira_proto_codec", version = "0.1" }

[targets]
lib = { path = "generated/kci_artifact_proto_generated" }
tests = ["tests"]
