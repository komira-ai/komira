[package]
name = "komira_proto_codec"
version = "0.1.0"
description = "The codec runtime of generated protobuf messages: a message's fields written once encode as protobuf binary or proto3 canonical JSON, the format chosen at compile time."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.0.0"]

[dependencies]
komira_encoding = { path = "../komira_encoding", version = "0.1" }
komira_json = { path = "../komira_json", version = "0.1" }
komira_protobuf = { path = "../komira_protobuf", version = "0.1" }

[targets]
lib = { path = "src/komira_proto_codec" }
tests = ["tests"]
