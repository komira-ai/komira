[package]
name = "kci_release_channel"
version = "0.1.0"
description = "Release channels for kci: a publish destination as a name, a visibility and a credential, parsed from a textproto file."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.0.0"]

[dependencies]
kci_api = { path = "../kci_api", version = "0.1" }
komira_textproto = { path = "../komira_textproto", version = "0.1" }

[targets]
lib = { path = "src/kci_release_channel" }
tests = ["tests"]
