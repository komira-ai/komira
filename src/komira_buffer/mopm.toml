[package]
name = "komira_buffer"
version = "0.1.0"
description = "Aligned, shared and memory-mapped byte buffers and the region trait that columns sit on."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.0.0"]

[dependencies]
komira_host = { path = "../komira_host", version = "0.1" }
komira_libc = { path = "../komira_libc", version = "0.1" }
komira_simd = { path = "../komira_simd", version = "0.1" }

[targets]
lib = { path = "src/komira_buffer" }
tests = ["tests"]
