[package]
name = "komira_supervisor_proto"
version = "0.1.0"
description = "The wire contract between a job supervisor and the coordinator it reports to (komira.supervisor.v1) as Mojo structs generated from its .proto file."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.0.0"]

[dependencies]
komira_broker_proto = { path = "../komira_broker_proto", version = "0.1" }
komira_proto_codec = { path = "../komira_proto_codec", version = "0.1" }

[targets]
lib = { path = "generated/komira_supervisor_proto_generated" }
tests = ["tests"]
