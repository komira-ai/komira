[package]
name = "komira_sync"
version = "0.1.0"
description = "SpinMutex, a mutual-exclusion lock for plain (non-async) code, over one atomic word."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.0.0"]

[dependencies]
komira_atomic_alias = { path = "../komira_atomic_alias", version = "0.1" }

[dev-dependencies]
komira_fork_join = { path = "../komira_fork_join", version = "0.1" }

[targets]
lib = { path = "src/komira_sync" }
tests = ["tests"]
