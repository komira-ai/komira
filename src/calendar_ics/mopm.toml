[package]
name = "komira-ai/calendar_ics"
version = "0.1.0"
description = "Reads iCalendar (RFC 5545) into the calendar model with a report of what was dropped or refused, and writes the model back as iCalendar."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.1.0", "1.2.0"]

[dependencies]
"komira-ai/calendar" = { path = "../calendar", version = "0.1" }
"komira-ai/calendar_proto" = { path = "../calendar_proto", version = "0.1" }
"komira-ai/content_line" = { path = "../content_line", version = "0.1" }
"komira-ai/datetime" = { path = "../datetime", version = "0.1" }

[dev-dependencies]
"komira-ai/proto_codec" = { path = "../proto_codec", version = "0.1" }

[targets]
lib = { path = "src/calendar_ics" }
tests = ["tests"]
