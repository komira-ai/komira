[package]
name = "komira_bench_report"
version = "0.1.0"
description = "The result model and report of a benchmark run: the statistics, the verdicts, the result.json writer and strict reader, the summary per suite and the human table."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.0.0"]

[dependencies]
komira_json = { path = "../komira_json", version = "0.1" }

[targets]
lib = { path = "src/komira_bench_report" }
tests = ["tests"]
