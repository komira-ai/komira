[package]
name = "komira-ai/resources"
version = "0.1.0"
description = "The files a program reads at run time, found under its own share directory: a resource is named by its path, and an undeclared one is refused."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.1.0", "1.2.0"]

[dependencies]
"komira-ai/runtime_paths" = { path = "../runtime_paths", version = "0.1" }

[targets]
lib = { path = "src/resources" }
tests = ["tests"]
