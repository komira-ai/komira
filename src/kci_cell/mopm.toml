[package]
name = "kci_cell"
version = "0.1.0"
description = "Cells for kci: the closed worlds a deploy step deploys into, each declared once and owned by one machine."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.0.0"]

[dependencies]
kci_api = { path = "../kci_api", version = "0.1" }
komira_textproto = { path = "../komira_textproto", version = "0.1" }

[targets]
lib = { path = "src/kci_cell" }
tests = ["tests"]
