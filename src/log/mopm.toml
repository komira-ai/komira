[package]
name = "komira-ai/log"
version = "0.1.0"
description = "Structured logging: the five-level facade, typed arguments, the per-module level filter, the synchronous stderr path, and the engine behind the same call sites (per-core binary record rings, decode-at-flush drain, file, stderr and metric sinks, spans)."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.1.0", "1.2.0"]

[dependencies]
"komira-ai/atomic_alias" = { path = "../atomic_alias", version = "0.1" }
"komira-ai/clock" = { path = "../clock", version = "0.1" }
"komira-ai/containers" = { path = "../containers", version = "0.1" }
"komira-ai/hashing" = { path = "../hashing", version = "0.1" }
"komira-ai/libc" = { path = "../libc", version = "0.1" }
"komira-ai/metrics" = { path = "../metrics", version = "0.1" }
"komira-ai/spsc_ring" = { path = "../spsc_ring", version = "0.1" }
"komira-ai/trace" = { path = "../trace", version = "0.1" }

[dev-dependencies]
"komira-ai/runtime_paths" = { path = "../runtime_paths", version = "0.1" }

[native.komira_log_holder]
kind = "static"
srcs = ["native/komira_log_holder.c"]

[targets]
lib = { path = "src/log" }
tests = ["tests"]
