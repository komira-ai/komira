[package]
name = "komira_uuid"
version = "0.1.0"
description = "UUIDv7 (RFC 9562): the Uuid value type, a stateless generator and a monotonic one, with its CSPRNG declaration over aws-lc's RAND_bytes."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.0.0"]

[dependencies]
komira_atomic_alias = { path = "../komira_atomic_alias", version = "0.1" }
komira_awslc = { path = "../komira_awslc", version = "0.1" }
komira_clock = { path = "../komira_clock", version = "0.1" }

[targets]
lib = { path = "src/komira_uuid" }
tests = ["tests"]
