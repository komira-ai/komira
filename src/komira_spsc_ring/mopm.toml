[package]
name = "komira_spsc_ring"
version = "0.1.0"
description = "One bounded single-producer / single-consumer ring, SpscRing[T], with a blocking or a dropping overflow policy."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.0.0"]

[dependencies]
komira_atomic_alias = { path = "../komira_atomic_alias", version = "0.1" }
komira_collections = { path = "../komira_collections", version = "0.1" }

[targets]
lib = { path = "src/komira_spsc_ring" }
tests = ["tests"]
