[package]
name = "kci_artifact_manifest"
version = "0.1.0"
description = "Reads and writes the JSON manifest that says what an artifact file is (type, name, version, platform) and its sha256."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.0.0"]

[dependencies]
kci_api = { path = "../kci_api", version = "0.1" }
kci_release_channel = { path = "../kci_release_channel", version = "0.1" }
komira_json = { path = "../komira_json", version = "0.1" }

[targets]
lib = { path = "src/kci_artifact_manifest" }
tests = ["tests"]
