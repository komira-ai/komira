syntax = "proto3";
package komira.broker.v1;

// The multi-node routing types of a broker cluster: the cluster-wide routing
// map (every live broker's reachable endpoint plus the per-partition leader),
// a node's soft-advisory load signal, and the cluster shape. They are carried
// on the supervisor heartbeat and its response (`komira.supervisor.v1`, which
// imports this file); this file imports nothing. Generated into the Mojo
// package `komira_broker_proto` as
// `komira_broker_proto.broker`.

// ─── Broker peer routing shared types (additive, wire-safe proto3) ───────────

// The cluster-wide routing map: every live broker's reachable endpoint plus the
// current per-partition leader. The coordinator assembles this from its
// (already stale-pruned) table of live nodes + the live PartitionMap
// assignment, and ships it on each HeartbeatResponse so any broker can
// answer a complete Kafka Metadata.
message BrokerClusterMap {
  repeated NodeEndpoint nodes = 1;     // every LIVE broker's reachable endpoint
  repeated PartitionLeader leaders = 2; // per-partition leader (or NO_LEADER)
}

// One live broker's reachable Kafka endpoint (the broker id + the host/port a
// client dials to reach it).
message NodeEndpoint {
  int32  node_id = 1; // the broker's stable node id (the Kafka broker.id)
  string host    = 2; // the broker's reachable host (advertised_host)
  uint32 port    = 3; // the broker's reachable Kafka port (advertised_port)
}

// One partition's current leader: the owning node id, or -1 (NO_LEADER) when no
// live node owns the partition (a client reads -1 as no-leader and refreshes).
message PartitionLeader {
  uint32 partition_id    = 1; // the partition id
  int32  leader_node_id  = 2; // the owning broker's node id, or -1 (NO_LEADER)
}

// ─── Multi-node shared types ──────────────────────────────────────────────

// A node's soft-advisory load signal. Carried on the heartbeat and recorded
// for observability and accounting (the record count is a free,
// manifest-derived signal); the coordinator's assignment pass does not
// currently use it (it could later bias the tie-break toward less-loaded
// nodes). "Soft-advisory": the coordinator never grants a lease off these
// numbers; ownership is the assignment table CAS, not a load-based lock.
message NodeLoad {
  uint64 records_served = 1; // cumulative records this node has served
  uint32 partition_count = 2; // partitions this node currently owns

  // ── Native multi-node scaling (additive, wire-safe proto3) ──
  // The live topic partition count this node observes in the topic's
  // partition map in object storage. Distinct from partition_count above
  // (the count this node currently owns): this is the total live partition
  // count of the topic, and it grows when a hot-shard split writes a grown
  // map. The coordinator folds these reports into its table of live nodes
  // and assigns partitions over max(configured count, max reported), so a
  // split-driven partition-count change reaches the coordinator (which never
  // re-reads the map itself; it learns the grown count only from this
  // heartbeat field). Absent (0 / unset) on a plain job supervisor and on a
  // broker that did not read the map.
  optional uint32 reported_partition_total = 3;
}

// The cluster shape the coordinator publishes so a node can size its routing view.
message ClusterConfig {
  uint32 total_partitions = 1; // partition count of the (single) topic
  uint32 node_count = 2;       // live node count the assignment spread across
}
