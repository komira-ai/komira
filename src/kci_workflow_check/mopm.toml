[package]
name = "kci_workflow_check"
version = "0.1.0"
description = "Holds a hand-written CI workflow to the release machine file: one job per stage, matching environments, permissions and pinned actions."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.0.0"]

[dependencies]
kci_api = { path = "../kci_api", version = "0.1" }
kci_release_channel = { path = "../kci_release_channel", version = "0.1" }
kci_release_machine = { path = "../kci_release_machine", version = "0.1" }

[targets]
lib = { path = "src/kci_workflow_check" }
tests = ["tests"]
