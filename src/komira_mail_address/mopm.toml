[package]
name = "komira_mail_address"
version = "0.1.0"
description = "Email addresses in Mojo, with no dependencies: one grammar for RFC 5322 header fields (addr-spec, name-addr, groups, comments) and RFC 5321 SMTP paths, with validating constructors and minimum-quoting formatting."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.0.0"]

[targets]
lib = { path = "src/komira_mail_address" }
tests = ["tests"]
