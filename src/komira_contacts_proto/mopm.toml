[package]
name = "komira_contacts_proto"
version = "0.1.0"
description = "The resources of a contacts service's JSON API (komira.contacts.v1) as Mojo structs generated from its .proto file, with their proto3 JSON form."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.0.0"]

[dependencies]
komira_proto_codec = { path = "../komira_proto_codec", version = "0.1" }

[targets]
lib = { path = "generated/komira_contacts_proto_generated" }
tests = ["tests"]
