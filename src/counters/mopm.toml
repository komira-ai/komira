[package]
name = "komira-ai/counters"
version = "0.1.0"
description = "Process-global census and falsifier counters (named 64-bit cells, relaxed atomic adds) plus the build-gated runtime introspection probe."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.1.0", "1.2.0"]

[dependencies]
"komira-ai/atomic_alias" = { path = "../atomic_alias", version = "0.1" }

[dev-dependencies]
"komira-ai/runtime_paths" = { path = "../runtime_paths", version = "0.1" }

[targets]
lib = { path = "src/counters" }
tests = ["tests"]
