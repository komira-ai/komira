[package]
name = "komira-ai/bump_arena"
version = "0.1.0"
description = "An O(1)-reset bump allocator over a fixed-capacity byte region."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.1.0", "1.2.0"]

[dependencies]
"komira-ai/byte_buffer" = { path = "../byte_buffer", version = "0.1" }

[targets]
lib = { path = "src/bump_arena" }
tests = ["tests"]
