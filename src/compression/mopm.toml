[package]
name = "komira-ai/compression"
version = "0.1.0"
description = "Byte-stream codec trait and the codecs behind it: snappy linked statically, zstd, bzip2 and xz opened at run time, gzip and lz4 through zlib and lz4."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.1.0", "1.2.0"]

[dependencies]
"komira-ai/lz4" = { path = "../lz4", version = "0.1" }
"komira-ai/zlib" = { path = "../zlib", version = "0.1" }

[native-dependencies]
bz2 = { version = ">=1.0.8,<2", kind = "shared", mode = "load" }
lzma = { version = ">=5.2.5,<6", kind = "shared", mode = "load" }
zstd = { version = ">=1.5.2,<2", kind = "shared", mode = "load" }

# libsnappy.a is built by the `native_library` target //third_party/snappy:snappy_native, which BUCK's
# `natives = {...}` names: an archive of the build, not compiled from sources by mopm. snappy is C++, so every
# program that links it ends its link with `-lc++`.
[native.snappy]
kind = "static"
provided = true
link = ["c++"]

[targets]
lib = { path = "src/compression" }
tests = ["tests"]
