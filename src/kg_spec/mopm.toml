[package]
name = "komira-ai/kg_spec"
version = "0.1.0"
description = "The build configuration of one knowledge graph (sources, extract config, synthesis binding, trigger), its scope reference, its validation and the fail-safe resolution of its extract mode."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.1.0", "1.2.0"]

[dependencies]
"komira-ai/kg_mode" = { path = "../kg_mode", version = "0.1" }

[targets]
lib = { path = "src/kg_spec" }
tests = ["tests"]
