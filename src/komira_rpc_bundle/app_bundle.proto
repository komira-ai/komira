// app_bundle.proto: the AUTHORED INTENT SURFACE of the deploy standard.
//
// WHAT THIS IS. The intent bundle is the small textproto a customer (or their
// LLM) authors as `komira.deploy.textproto`: ~20 lines for the common case,
// stating WHAT they want (a `kind`, a `name`, named `build{}` targets, intent
// `spec{}`, per-environment `waves{}`) and NEVER naming a cloud primitive. It
// is tier 1 of a two-tier model: built-in compositions synthesize the
// FullManifest (`full_manifest.proto`) from it, with no customer code and no
// compiler. This schema is the single source of truth: the server emits the
// shape so an LLM authors a first draft without hallucinating fields.
//
// TYPED SYMBOLIC REFERENCES, NO TEMPLATING. "Defined once, plumbed through" is
// ENFORCEABLE here because there is no `${}` grammar: a build output is
// referenced by a `from_build` oneof arm (names a `BuildTarget.name`); a wave
// output is referenced by a typed `ValueFrom` enum (`DEPLOY_URL`). Neither is a
// string the author can mistype into drift.
//
// REUSE BY IMPORT, NOT DUPLICATION. `AppSpec` reuses the intent
// enums/messages from `deploy_model.proto` by IMPORT: `ComputeIntent`,
// `DatastoreNeed`, `SecretBinding` are the ONE definition, referenced here,
// not re-declared. The bundle's env-var message is named `BundleEnvVar`, not
// `EnvVar`, so it never collides with `deploy_model.EnvVar`; the shapes
// genuinely differ anyway: the bundle's carries a `value | value_from` oneof,
// `deploy_model.EnvVar` is a plain name/value pair.
//
// NAMING. The kind and spec messages are `AppKind` and `AppSpec`, not bare
// `Kind`/`Spec`. Enum values are FULLY PREFIXED (`APP_KIND_API`,
// `GATE_ON_EXIT_CODE`, `VALUE_FROM_DEPLOY_URL`) as in `deploy_model.proto`:
// proto enum values live in the enclosing scope, so a prefix is collision
// insurance; the authored textproto uses the full value names.
//
// PLAIN proto3 (no `(komira.db.*)` options): the struct emitter
// (`mojo_proto_library`) generates proto3-JSON + binary serde. Authoring is
// textproto; this schema is the wire/authoring contract, never storage.

syntax = "proto3";

package komira.bundle.v1;

// The reused intent enums/messages: ComputeIntent, DatastoreNeed,
// SecretBinding. ⚠ THE IMPORT PATH DOES NOT MIRROR THE PACKAGE: this file
// declares `komira.bundle.v1` and its import path is
// `komira/deploy/v1/app_bundle.proto`, the import directory of the
// deploy-model protos. The wire depends on the package and field numbers,
// never on the path.
import "komira/deploy/v1/deploy_model.proto";

// ─── The customer-facing app kind ────────────────────────────────────────────
//
// The user-facing kinds that REPLACE cloud primitives. The first four are
// DEPLOYABLE-SERVICE kinds: the composition maps each to a node topology and
// the customer never sees a node. Values 5–7 are TYPED BUILD+TEST ARTIFACTS:
// they carry a device/capability matrix that the pipeline fans over to
// build+test the artifact across a support envelope. They are NOT
// deployable-service topologies (no composition maps them to a served-node
// graph yet; `compose()` fails closed on them). Grows ADDITIVELY (existing
// ordinals are frozen; new kinds append at the tail).
enum AppKind {
  // Proto3 zero default. UNSPECIFIED is an authoring error: a bundle MUST
  // declare its kind (fail-fast).
  APP_KIND_UNSPECIFIED = 0;
  // A served HTTP API (composes to {IamRole -> Secret -> Config ->
  // ServerlessCompute}).
  APP_KIND_API = 1;
  // A static frontend.
  APP_KIND_STATIC_FRONTEND = 2;
  // A data pipeline.
  APP_KIND_DATA_PIPELINE = 3;
  // A search cluster (composes to a ~5-node graph: index queue + object store +
  // compute + load balancer + DNS).
  APP_KIND_SEARCH_CLUSTER = 4;
  // ── Typed BUILD+TEST artifacts. NOT deployable-service topologies: each
  //    carries a device/capability matrix; the typed kind CONSTRAINS the valid
  //    native-cell OS dims (fail-closed at synthesis). ──
  // A desktop application: Electron/native (dmg/zip/msi/nsis/AppImage). Its
  // NATIVE matrix cells target os ∈ {macos, windows, linux} (ubuntu accepted as
  // the linux token, the device registry's `AppTarget.os` vocabulary).
  APP_KIND_DESKTOP_APPLICATION = 5;
  // A mobile application: iOS/Android (ipa/apk). Its NATIVE matrix cells target
  // os ∈ {ios, android}.
  APP_KIND_MOBILE_APPLICATION = 6;
  // A per-platform native library (package/binary). Its NATIVE matrix cells may
  // target any os (no per-kind OS constraint).
  APP_KIND_LIBRARY = 7;
  // ── ★ SHARED INFRASTRUCTURE: a release machine that OWNS resources and
  //    SERVES NOTHING. ─────────────────────────────────────────────────────────
  //
  // WHY THIS IS A KIND AND NOT AN API BUNDLE WITH NO ROUTES. When several
  // bundles each declare `datastore: DATASTORE_NEED_SERVERLESS` against the
  // SAME database, each one creates-or-adopts it and the FIRST deployer wins.
  // Nobody owns it, so nobody can pick its name. Ownership needs a bundle whose
  // ONLY job is to own, and such a bundle has no image, no port and no
  // ServerlessCompute node. `APP_KIND_API` would force a decorative container
  // that nothing calls, that costs money, and that can fail a deploy while
  // being unable to fail a test.
  //
  // WHAT IT COMPOSES TO: Config -> Datastore. No Secret, no IamRole, no
  // service. The same shape a bootstrap manifest uses for a datastore without
  // serverless compute, as an AUTHORED kind.
  //
  // ⛔ SHARED INFRASTRUCTURE IS OPERATOR-ONLY, AND THAT IS STRUCTURAL. A managed
  // app deployed into a CUSTOMER account has no shared infrastructure to share:
  // there is exactly one tenant. So a managed app never references; it declares
  // its OWN `datastore_database`. See `AppSpec.datastore_database_ref`.
  APP_KIND_SHARED_INFRASTRUCTURE = 8;
}

// ─── ★ TENANCY: WHOSE CLOUD ACCOUNT THE WORKLOAD RUNS IN ─────────────────────
//
// The product deploys into the customer's account, so that the operator sees
// nothing of what runs there.
//
// ⚠ WHY THIS IS A SECOND AXIS AND NOT MORE `AppKind` VALUES. `kind` is the
// TOPOLOGY: the composer dispatches the node graph on it and validation keys
// image-required on it. A managed app is topologically an API and must keep
// composing to the API topology, so an `APP_KIND_MANAGED_APP` would force
// either a duplicate API arm or a fail-close that breaks every managed-app
// deploy. WHOSE ACCOUNT it runs in and WHAT GRAPH it composes to are
// independent questions.
//
// Collapsing them has a concrete cost: if a managed app and a hosted service
// are the same type, nothing in the schema, the parser, the composer or the
// applier can tell "a service we host" from "an app we deploy into a
// customer's account", and a managed-app wave naming the operator's own
// production environment would deploy customer workloads into the operator's
// production project.
//
// THE SAME ENUM IS AUTHORED ON BOTH SIDES OF A PLACEMENT: on the bundle (whose
// account this workload runs in) and on the environment (whose account this
// env binds to, `environment.proto`), so the rule is a TYPE MATCH:
//
//   ⛔ A `TENANCY_CUSTOMER` bundle may not name a `TENANCY_CONTROL_PLANE` env.
//
// DELIBERATELY ASYMMETRIC: a control-plane bundle MAY name a customer env,
// which is what an end-to-end harness does. Only the direction that puts
// customer workloads in the operator's account is refused.
//
// ─── ★★ WHAT `TENANCY_CUSTOMER` MEANS FOR A WAVE ────────────────────────────
//
// A managed app never deploys a service from its own release machine. The
// release machine uploads the image to the appropriate repository; a
// validation step then deploys the managed app in a customer cloud, tests its
// functionality, and deletes it.
//
// So tenancy is not only WHOSE ACCOUNT. For a `TENANCY_CUSTOMER` bundle it
// also fixes what a `Wave` IS:
//
//   deploy   = PUBLISH the image to the repo the wave's env names. THAT IS ALL.
//              No `Service` node, in any project, in any environment. The repo
//              is the one the env's `release_channel` (`environment.proto`)
//              maps to.
//   validate = an EPHEMERAL lifecycle in a CUSTOMER account: deploy the app
//              there, exercise it, DELETE it. Nothing survives it. Authored as
//              a `ValidationSet` on a control-plane harness bundle and run
//              against a customer environment, NOT as `waves[].validate` on
//              the app.
//
// ⛔ SO A MANAGED APP'S PRODUCTION WAVE IS CORRECT AND MUST NOT BE DELETED. It
// is how the image reaches the public repo. What changes is what the wave DOES.
//
// AND IT IS DECIDABLE FROM THE AUTHORED BUNDLE, which is what makes it a rule
// rather than an intention: an image in a registry cannot answer an HTTP
// request and has no URL to inject, so a `TENANCY_CUSTOMER` wave that authors
// an `HttpCheck` or any `ValueFrom` has PROVED it stood a service up. A check
// of that rule should DERIVE its oracle from `enum ValueFrom` + `message
// HttpCheck` below rather than restate it, so that a third way to name a
// deployed service is seen the day it lands.
//
// THE MODEL IS TRUE OF THE DEPLOY PATH, not only of what a bundle may author:
// the deploy driver returns an empty resource graph for a publish-only bundle
// (`deploy_publishes_only(bundle)`) immediately after the image pin and before
// the manifest mapper.
//
// ORDERING: stripping a wave's gates BEFORE that cut would only delete the
// assertion about a service that is still stood up. Publish first, then
// convert.
//
// BOTH SIDES ARE STORED FIELDS, so the placement rule is REPRESENTABLE at
// deploy time:
//
//   `AppBundle.tenancy = 15`   (below)
//   `Environment.tenancy = 13` (environment.proto)
//
// ⚠ THE ENVIRONMENT SIDE IS AN `int32`, NOT THIS ENUM, and that is deliberate:
// environment.proto is a standalone import root that imports no other proto,
// so it REUSES this enum's ORDINAL CONTRACT the way `deploy_provider` reuses
// `DeployProvider`'s, mirrored in the environment registry and drift-guarded.
// ⛔ Do not "fix" it into an import, and do not declare a second `Tenancy`
// there: the whole value of the field is that it is THE SAME ENUM as this one,
// and a type match across two independently-editable enums is a coincidence.
enum Tenancy {
  // Proto3 zero default. UNSPECIFIED is an authoring error: a bundle and an
  // account-binding environment MUST each declare their tenancy (fail-fast).
  // There is no default, deliberately: defaulting a new project to "not control
  // plane" is how a managed app reaches the operator's account, and defaulting
  // it the other way breaks every correctly-placed app.
  TENANCY_UNSPECIFIED = 0;
  // THE OPERATOR'S OWN account. We operate what runs here: the operator's
  // environment projects and its build project.
  TENANCY_CONTROL_PLANE = 1;
  // A CUSTOMER's account. We must not see what runs here. Every managed app is
  // this: each customer account an environment is bound to, whatever runs in
  // it.
  TENANCY_CUSTOMER = 2;
}

// ─── The typed wave-output reference (no string templating) ──────────────────
//
// A typed symbolic reference to a value produced by a PRIOR wave. The ONLY
// wave-output reference form (there is no `${}` grammar), so it cannot be
// mistyped into drift. Used by a `BundleEnvVar.value_from`.
enum ValueFrom {
  VALUE_FROM_UNSPECIFIED = 0;
  // The deployed service URL of THIS bundle's service in the current wave's
  // environment: injected as e.g. `TARGET_URL` into an integration container.
  VALUE_FROM_DEPLOY_URL = 1;
  // The published API-EDGE URL of THIS bundle's service in the current wave's
  // environment (the API-edge node's output-contract URL, discovered post-apply
  // and read off the edge outcome accumulator): injected as e.g. `TARGET_URL`
  // into an edge end-to-end validate container. A standalone validate run (no
  // apply, no accumulator) resolves it from the `--edge-url` flag instead.
  VALUE_FROM_EDGE_URL = 2;
  // ── THE ENV-DERIVED ARMS ──────────────────────────────────────────────────
  //
  // The RESOLVED `EnvBinding`'s own `account_ref`: the GCP project id of the
  // environment the run was pointed at by `--env`. NOT a wave output: it is
  // known BEFORE anything is applied, which is exactly why it can source a step
  // that runs before any deploy (for example a bootstrap step that CREATES the
  // environment in that project; there is no deploy_url to hang it off).
  //
  // ⛔ IT EXISTS BECAUSE THE LITERAL FORM IS A SILENT LIE. A step that authors
  // the project as a literal env value keeps that literal when the run is
  // re-pointed with `--env` at a DIFFERENT environment, runs the same steps,
  // and reports green about a project the operator never named. The flag
  // reaches the binding and the binding reaches nothing.
  VALUE_FROM_ENV_PROJECT = 3;
  // The RESOLVED `EnvBinding`'s own `region`. The same argument one axis over:
  // a per-set literal region would keep the previous env's region when the set
  // is re-pointed with `--env`.
  VALUE_FROM_ENV_REGION = 4;

  // ── ★ THE INTERNAL ORIGIN ────────────────────────────────────────────────
  //
  // The DIRECT Cloud Run service URL of THIS bundle's service: the `.run.app`
  // ORIGIN the API Gateway forwards to, dialled WITHOUT the edge hop.
  //
  // ⛔ WHY IT EXISTS. When a serverless application's OUTPUT is the gateway
  // endpoint, `VALUE_FROM_DEPLOY_URL` means the gateway. A service that runs a
  // DIRECT end-to-end check and a GATEWAY end-to-end check as a PAIR (so that a
  // direct-path failure surfaces as the DIRECT row, never masked behind the
  // edge hop) then has NO name left for the origin: both rows dial the same
  // host, and the pair silently collapses into one test run twice. A gate that
  // reports two verdicts about one path is worse than one gate.
  //
  // ⛔ DIAGNOSTIC-ONLY, AND THE SCHEMA, NOT A CONVENTION, ENFORCES IT.
  // Legal on `RunContainer.env` and `RunContainer.args` (a validate step) and
  // NOWHERE ELSE. `validate_bundle` REFUSES it on `AppSpec.env`,
  // `AppSpec.parameters`, `JobSpec.env`, `Wave.env_override` and
  // `Wave.parameter_override`: the five places a resolved value reaches a
  // workload that serves or does real work.
  //
  // The refusal is the whole point of the arm having a separate name at all.
  // The gateway is where auth, quota, the ApiConfig's declared surface and the
  // scoped invoker grant live; an origin URL handed to a SERVICE is a documented
  // way to route production traffic around all four, and it would be invisible:
  // the request succeeds. So the marker cannot be spelled anywhere a service
  // reads it, and the bundle that tries is rejected offline, by name, before any
  // cloud call.
  //
  // ⚠ RESOLVES FROM ITS OWN INPUT, NEVER DERIVED FROM `deploy_url`. The driver
  // takes the origin as a SEPARATE argument (`origin_url`); an EMPTY one drops
  // the env entry and REFUSES an origin-targeted step rather than falling back
  // to whatever `deploy_url` currently means. Deriving one from the other is
  // exactly the coupling that would let a re-pointing of `deploy_url` drag the
  // origin along with it and re-collapse the pair without a single edit going
  // red.
  VALUE_FROM_INTERNAL_ORIGIN_URL = 5;

  // ── ★★ THE VALIDATION-RUN OWNERSHIP ID ───────────────────────────────────
  //
  // The id of THE RUN THAT IS EXECUTING THIS STEP: the release CLI's own
  // `--validation-run-id`, the same value the run's terminal cloud-leak check
  // is given. It resolves to a per-RUN string; it is not a property of the
  // bundle, the environment, or any wave output.
  //
  // ⛔ IT EXISTS BECAUSE A PER-RUN VALUE CANNOT BE AN AUTHORED LITERAL, AND THE
  // IN-CLOUD ARM HAS NO OTHER CHANNEL. An in-env `run_container` step's argv is
  // rendered by the validate driver out of this bundle's authored `args {}`,
  // whose sources are `value_from` / `value` / `default`, all three decided at
  // AUTHOR time. A local fork-exec step can receive the id through its process
  // environment; a Cloud Run Job or an ECS task placed for a validate step
  // cannot, and without this marker every billable resource that step creates
  // is UNATTRIBUTED.
  //
  // ⛔ AND UNATTRIBUTED IS NOT "SLIGHTLY WORSE": IT IS THE LEAK. A leak check
  // may only delete a billing resource it can PROVE this run created; without a
  // `komira-ci-run-id` stamp it REPORTS the resource, HOLDS the delete, and
  // exits non-zero. When that resource is a GCE or EC2 instance (GCE does not
  // self-terminate on guest shutdown), the difference between this marker
  // resolving and not is an UNBOUNDED HOURLY BILL versus a reclaimed instance.
  //
  // ⛔ ARGV-ONLY, AND THE SCHEMA, NOT A CONVENTION, ENFORCES IT.
  // Legal on `RunContainer.args` and NOWHERE else: `validate_bundle` REFUSES it
  // on `RunContainer.env` (and therefore on `AppSpec.env`, `JobSpec.env` and
  // `Wave.env_override`, which are refused one rung higher as well) and on
  // `AppSpec.parameters` / `Wave.parameter_override`.
  //   * NOT ON `env`, because a binary's configuration is a command-line FLAG,
  //     not an environment variable. Making the same value authorable on both
  //     channels would create two paths to one value, with different resolution
  //     semantics and no diagnostic when an author picks the weaker one.
  //   * NOT ON A SERVED SPEC, because a run id is a property of a VALIDATION
  //     RUN. A service configured with one would carry the id of whichever
  //     deploy last rolled it, forever, and a leak sweep that trusted that
  //     stamp would delete a production service believing it owned it. That is
  //     strictly worse than the leak this marker exists to close.
  //
  // ⛔ AND A STEP THAT DECLARES IT WITH NO ID REFUSES; `required:` DOES NOT
  // SOFTEN IT. The validate driver raises, by name, before the first
  // placement, exactly as `VALUE_FROM_INTERNAL_ORIGIN_URL` refuses an
  // origin-targeted step with no threaded origin. Falling through to `default`
  // or omitting the flag would run the step ANYWAY and create the billable
  // resource unattributed, i.e. it would produce the exact outcome the author
  // wrote this line to prevent, and produce it silently.
  VALUE_FROM_VALIDATION_RUN_ID = 6;

  // ── ★★ THE LIFECYCLE COMPUTE-ENVIRONMENT NAME ────────────────────────────
  //
  // The name of the compute environment a managed-app release machine's
  // lifecycle wave PRODUCES (its bootstrap step) and CONSUMES (its end-to-end
  // step). It is DERIVED by the composer from the resolved env binding and the
  // RELEASE MACHINE NAME (`bundle.name`), in ONE place in the validate driver.
  //
  // ⛔ WHY IT EXISTS. If the name is authored twice per bundle, once for the
  // producer step and once for the consumer step, the two copies can diverge
  // (the bootstrap creates one environment and the end-to-end step asks for
  // another), and the validate run fails only in cloud. `required: true` is
  // fully satisfied by a bound-but-WRONG string, so nothing offline catches it.
  // ⛔ THE FIX IS NOT A CHECK ASSERTING THE TWO LITERALS MATCH: a check makes
  // the divergence DETECTABLE; resolving one value for both steps makes it
  // UNREPRESENTABLE. There is no second literal left to disagree with.
  //
  // ⛔ ARGV-ONLY, ON THE SAME TWO RULES AS `VALUE_FROM_VALIDATION_RUN_ID` AND
  // FOR THE SAME REASONS: `validate_bundle` refuses it on every `env` channel
  // and on every served spec. A bootstrap step under this marker takes a
  // FLAG; authoring the marker on `env` is refused BY NAME, with the argv form
  // in the message.
  //
  // ⛔ AND A STEP THAT DECLARES IT WITH NO RESOLVED NAME REFUSES; `required:`
  // does not soften it, exactly as for the run id. Falling through to `default`
  // or omitting the flag would start a lifecycle validator pointed at whatever
  // its own default names, which is the unbound-consumer failure above with the
  // diagnostic removed.
  VALUE_FROM_LIFECYCLE_ENV_NAME = 7;

  // ── ⭐ THE FIVE COMPUTE-ENVIRONMENT EXPECTATIONS ───────────────────────────
  //
  // A gate on a job VM needs expectations that are INDEPENDENT OF THE PARTY IT
  // GRADES: where the VM must land, as whom, on which subnet, and who must have
  // deleted it. Each of these renders the `COMPUTE_ENVIRONMENT` arg's
  // environment row through the compute-environment library's OWN naming
  // functions (the same functions the customer bootstrap creates the resources
  // with), and NEVER from a record or view the job manager itself writes.
  //   VALUE_FROM_COMPUTE_ENV_SERVICE_ACCOUNT  the job-VM service account email
  //   VALUE_FROM_COMPUTE_ENV_SUBNETWORK       `projects/<p>/regions/<r>/subnetworks/<derived>`
  //   VALUE_FROM_COMPUTE_ENV_ZONE             the env row's declared zone
  //   VALUE_FROM_COMPUTE_ENV_PROJECT          the customer env's project
  //   VALUE_FROM_COMPUTE_ENV_PLACER           the job manager's service account,
  //                                           which must have done the delete
  //
  // ⛔ THEY ARE DECLARED AND `validate_bundle` REFUSES EACH BY NAME, on every
  // channel, until their resolution exists (the step's `COMPUTE_ENVIRONMENT`
  // resolved through the environment registry to an admitted
  // `TENANCY_CUSTOMER` env). The validate driver's argv and env ladders refuse
  // them by name too, so a bundle that bypassed `validate_bundle` still cannot
  // resolve one to EMPTY and have the flag silently omitted, which for an
  // EXPECT_* arg is a gate comparing against the validator's own default, i.e.
  // a hollow green.
  VALUE_FROM_COMPUTE_ENV_SERVICE_ACCOUNT = 8;
  VALUE_FROM_COMPUTE_ENV_SUBNETWORK = 9;
  VALUE_FROM_COMPUTE_ENV_ZONE = 10;
  VALUE_FROM_COMPUTE_ENV_PROJECT = 11;
  VALUE_FROM_COMPUTE_ENV_PLACER = 12;

  // ── ⚠ `VALUE_FROM_EDGE_URL` IS A DUPLICATE-IN-WAITING ─────────────────────
  //
  // EDGE_URL is to be retired as a duplicate name, and the retirement lands
  // WITH the re-pointing of DEPLOY_URL to the gateway, not before it.
  //
  // WHY RETIRE: once DEPLOY_URL denotes the gateway, DEPLOY_URL and EDGE_URL
  // denote the SAME endpoint. Two markers for one endpoint is not redundancy,
  // it is a fork: `step_targets_edge()` is TRUE for one spelling and FALSE for
  // the other, so the same URL is reached down two code paths with DIFFERENT
  // refusal semantics (an undiscovered edge REFUSES under one name and resolves
  // silently under the other). An author picking the "wrong" synonym gets a
  // weaker gate and no diagnostic. The endpoint axis becomes exactly two names:
  // DEPLOY_URL (the front door, and the DEFAULT) and INTERNAL_ORIGIN_URL (the
  // origin, diagnostic-only), and the default being the front door is the
  // posture we want, since going direct then requires stating it.
  //
  // ⛔ WHY NOT YET: while DEPLOY_URL still means the `.run.app` origin,
  // deleting EDGE_URL would silently re-point an edge check at the origin: a
  // PASSING row named for the edge that never left the direct path, which is
  // what `step_targets_edge` exists to prevent. The ordering is forced:
  //   1. this arm + its refusal
  //   2. the direct check authors INTERNAL_ORIGIN_URL; driver fed a real origin
  //   3. DEPLOY_URL re-pointed to the gateway
  //   4. the EDGE_URL sites -> DEPLOY_URL; ordinal 2 -> `reserved`
  // Doing 4 before 3 breaks the edge gate; doing 3 before 2 breaks the direct
  // gate. Neither breakage is visible in a green run, which is why the order is
  // written down here.
}

// ─── The validate-step gate condition (`gate_on`) ────────────────────────────
//
// What a `run_container` validate step gates promotion on.
enum GateOn {
  GATE_ON_UNSPECIFIED = 0;
  // Gate on the container's process EXIT CODE (0 = pass): the "your command
  // exits 0" contract of a bring-your-own container.
  GATE_ON_EXIT_CODE = 1;
}

// ─── The SHAPE of the artifact a Dockerfile recipe produces ──────────────────
//
// The build "type" is NOT the build TOOL; it is the OUTPUT SHAPE the Dockerfile
// produces. The recipe is uniformly a Dockerfile; `output_format` selects
// (extraction step, digest scheme, destination store), NOT a build script.
// Grows ADDITIVELY (as `AppKind` does).
enum OutputFormat {
  // The Dockerfile's final stage IS the OCI image (docker-image). Nothing is
  // extracted: the image is the output. Digest = OCI `sha256:` manifest
  // digest, pushed to an image registry. The DEFAULT.
  OUTPUT_FORMAT_IMAGE = 0;
  // Extract the file(s) at `output` from a build stage (a library package or
  // binary, via BuildKit `--output` / a multi-stage extract). Digest = the
  // artifact's content digest.
  OUTPUT_FORMAT_LIBRARY_ARTIFACT = 1;
  // Extract the dir at `output`, package it as ONE `.tar.gz` (static files,
  // e.g. a UI `dist/`). Digest = a `content-sha256:` over the tarball, landed
  // in the content store.
  OUTPUT_FORMAT_STATIC_TARGZ = 2;
  // ── THE GENERIC FILE SHAPE ────────────────────────────────────────────────
  //
  // Extract the SINGLE file at `output` and land its bytes, VERBATIM AND
  // UNINTERPRETED, in the content store. Digest = a `content-sha256:` over the
  // file bytes. Nothing here knows or cares what the file MEANS.
  //
  // ⛔ WHY THIS IS `FILE` AND NOT `TEMPLATE`. One file that needs it is a
  // deploy template published beside a managed app's image, and naming the
  // ENUM ARM for that one consumer would put template semantics in the
  // OUTPUT-SHAPE vocabulary, which is the one thing this enum is not ("the
  // build 'type' is NOT the build TOOL; it is the OUTPUT SHAPE"). An arm named
  // TEMPLATE would then have to be joined by POLICY, SBOM, LICENSE,
  // OPENAPI_SPEC: five arms whose (extraction, marker, scheme) triples are
  // byte-identical and whose only difference is what reads them. WHAT the file
  // is belongs to the artifact's ROLE (`RevisionArtifact.role`, and
  // `BuildTarget.file_role` below), which is where every other consumer
  // distinction in this pipeline lives.
  //
  // ⚠ NOT `LIBRARY_ARTIFACT`, though both extract a file. LIBRARY_ARTIFACT
  // rides the OCI marker/scheme and lands in an artifact registry
  // (`routes_to_oci` = true); FILE rides `content-sha256:` and lands in the
  // content store. Same extraction, different DESTINATION STORE, and the
  // destination is half of what this enum selects.
  //
  // ⚠ `content-sha256:` ADDRESSES TWO SHAPES (this and STATIC_TARGZ), so the
  // scheme prefix alone does not identify an output_format.
  OUTPUT_FORMAT_FILE = 3;
}

// ─── ⭐ WHAT A `FILE` BUILD TARGET'S BYTES ARE FOR ────────────────────────────
//
// `OUTPUT_FORMAT_FILE` says only the output SHAPE; its own comment puts WHAT
// the file MEANS on the artifact's ROLE. This is that role, declared on the
// build target so the stage step knows which record to write and which
// invariants to hold (for example, the boot-bundle bucket carries nothing but
// the boot bundle, because customer VM service accounts read it).
//
// ⛔ DECLARED AHEAD OF ITS BUILD AND STAGE LEGS: `validate_bundle` REFUSES any
// non-zero value BY NAME until they exist. A declared role nothing honours
// would build a FILE and stage it nowhere.
enum FileRole {
  // Not a role-bearing file: every build target that does not set the field.
  FILE_ROLE_UNSPECIFIED = 0;
  // The VM supervisor's boot bundle, staged content-addressed under
  // `pod-loader/sha256/<d>/` and handed to the job manager as its
  // `--vm-pod-loader-url` through `from_build`.
  FILE_ROLE_POD_LOADER_BUNDLE = 1;
}

// ─── ⭐ WHICH REGISTRY AN IMAGE BUILD TARGET IS STAGED INTO ───────────────────
//
// The job VM runs as the CUSTOMER'S role in the CUSTOMER'S account and must
// never read the operator's registry, so an image a job VM pulls is staged
// into the customer's own job-image repository through a SECOND build target
// over the same Dockerfile.
//
// ⛔ DECLARED AHEAD OF ITS STAGING LEG: `validate_bundle` REFUSES a non-zero
// value BY NAME until the staging leg and its repo-scoped writer grant exist.
enum RepositoryRole {
  // The stage's OWN image registry, where every image build target is staged
  // by default.
  REPOSITORY_ROLE_STAGE_IMAGES = 0;
  // The customer compute environment's job-image repository, written by the
  // stage's deploy identity through a repo-scoped, test-only grant that exists
  // only where the environment row states `admit_cp_validation: true`.
  REPOSITORY_ROLE_JOB_IMAGES = 1;
}

// ─── One named build target ──────────────────────────────────────────────────
//
// A named artifact this bundle builds: a Dockerfile RECIPE + a typed OUTPUT
// SHAPE. Multi-artifact: e.g. a "service" target and a separate "integ_tests"
// target. The recipe is ALWAYS a Dockerfile; what varies is `output_format`
// (the output shape), not the tool.
message BuildTarget {
  // The build target's symbol, referenced by `ImageRef.from_build` (e.g.
  // "service", "integ_tests").
  string name = 1;
  // THE RECIPE: the path to the target's Dockerfile in the repo (e.g.
  // "Dockerfile", "Dockerfile.integ"). `output_format` states what it
  // produces.
  string dockerfile = 2;

  // The Docker build context dir (default "." when empty).
  string context = 3;
  // The OUTPUT SHAPE the Dockerfile produces; default OUTPUT_FORMAT_IMAGE = 0
  // (a {name, dockerfile} block is exactly an IMAGE artifact with a default
  // context).
  OutputFormat output_format = 4;
  // The path-in-build to extract for the non-image shapes
  // (LIBRARY_ARTIFACT / STATIC_TARGZ / FILE). Empty for IMAGE (the image IS
  // the output).
  string output = 5;
  // ⭐ WHAT A `FILE` TARGET'S BYTES ARE FOR. UNSPECIFIED by default. Refused by
  // `validate_bundle` when non-zero, until its build and stage legs exist.
  FileRole file_role = 6;
  // ⭐ WHICH REGISTRY AN IMAGE TARGET IS STAGED INTO. STAGE_IMAGES (0) by
  // default. Refused by `validate_bundle` when non-zero, until its staging
  // leg exists.
  RepositoryRole repository_role = 7;
}

// ─── A typed image reference (no string templating) ──────────────────────────
//
// The ONE place a compiled artifact is named, as a TYPED oneof: either a
// pinned digest OR a symbolic `from_build` reference to a `BuildTarget.name`.
message ImageRef {
  // Exactly one arm. A `from_build` names a build target in THIS bundle whose
  // BUILD wave produces the digest; a `digest` pins an already-published image.
  oneof source {
    // A pinned sha256 digest (a customer container or an already-published
    // image): the direct, no-build form.
    string digest = 1;
    // Names a `BuildTarget.name` in this bundle: the BUILD wave produces this
    // image's digest, resolved at synthesis. The typed alternative to a
    // mistypeable string.
    string from_build = 2;
  }
}

// ─── A typed cross-service reference (no string templating) ──────────────────
//
// A typed symbolic reference to ANOTHER service in the same manifest/app: the
// `service` field is a LOGICAL service name (a sibling `AppBundle.name`), whose
// deployed endpoint this env var should resolve to. This GENERALIZES the
// SELF-only `ValueFrom` (`VALUE_FROM_DEPLOY_URL` = THIS bundle's own URL) to
// point at a sibling: the drift-proof alternative to a `${}` template.
// Vendor-neutral: a logical name ONLY, NO vendor URL, NO cloud-specific token.
// The resolution (logical name -> concrete endpoint) is a composition-tier
// concern, NOT stated here.
message ServiceRef {
  // The LOGICAL name of another service in this manifest/app (a sibling
  // `AppBundle.name`) whose endpoint this env var resolves to.
  string service = 1;
}

// ─── One container env var, with a typed wave-output arm ─────────────────────
//
// Not named `EnvVar`: this file imports `deploy_model.proto`, which defines
// `komira.deploy.v1.EnvVar`, and the bundle's shape is different.
// `BundleEnvVar` carries a `value | value_from | service_ref` oneof (a plain
// literal OR a typed self wave-output reference OR a typed cross-service
// reference), which `deploy_model.EnvVar` (name/value only) does not.
message BundleEnvVar {
  // The env var name (e.g. "LOG_LEVEL", "TARGET_URL").
  string name = 1;
  // Exactly one arm: a literal `value`, a typed `value_from` SELF wave-output
  // reference (e.g. `TARGET_URL` <- `VALUE_FROM_DEPLOY_URL`), OR a typed
  // `service_ref` CROSS-SERVICE reference (the endpoint of a SIBLING service).
  oneof val {
    // A literal string value.
    string value = 2;
    // A typed SELF wave-output reference (the drift-proof alternative to a `${}`
    // template): resolves to THIS bundle's own deployed URL.
    ValueFrom value_from = 3;
    // A typed CROSS-SERVICE reference: this env var resolves to the deployed
    // endpoint of ANOTHER service (named by logical `ServiceRef.service`) in the
    // same manifest/app. GENERALIZES the SELF-only `value_from` to point at a
    // sibling. APPENDED LAST (arm 3, field 4) so it neither displaces nor bleeds
    // into the existing arms. Vendor-neutral: a LOGICAL service name only.
    ServiceRef service_ref = 4;
  }

  // ─── ★ THE SERVICE AXIS: MEANINGFUL ONLY ON `Wave.env_override` ────────────
  //
  // WHICH service in this bundle the override applies to (a logical
  // `ServiceSpec.name`). OUTSIDE a wave override this field is REFUSED BY THE
  // PARSER, because there the question is already answered by the block the var
  // is written in: an `AppSpec.env` / `ServiceSpec.spec.env` / `RunContainer.env`
  // entry belongs to the spec that contains it. Accepting it in those three
  // places and ignoring it is how one field comes to mean two things.
  //
  // ⚠ WHY IT EXISTS. A `Wave` is BUNDLE-scoped and has no service axis, so
  // without this field the composer would fold EVERY override key onto EVERY
  // service's Config node. That is harmless while a bundle is one service and
  // is a CONFIG LEAK once one bundle holds several: one service's mail and DNS
  // settings would reach every other service in the bundle.
  //
  // EMPTY (the proto3 default) ⇒ the override applies to the ONE service that
  // would receive it. If MORE THAN ONE would, compose REFUSES, naming the
  // variable and the candidates: the decided default is a loud refusal, not a
  // silent fan-out and not "the first service". A bundle with one receiving
  // service is unambiguous, which is what keeps every single-service bundle
  // byte-identical and this field optional.
  //
  // A name that matches no declared service REFUSES, and so does one naming a
  // service that composes no Config node (a SHARED_INFRASTRUCTURE service's
  // artifact is a database: it has no container and therefore no env, so an
  // override addressed to it could never land).
  string service = 5;
}

// ═══════════════════════════════════════════════════════════════════════════
//  MANAGED-APP PARAMETERS: the typed input contract
// ═══════════════════════════════════════════════════════════════════════════
//
// Managed apps take parameters. The control plane understands only a generic
// concept of parameters; the parameters are passed into the app's deploy
// template, and the template plumbs them in as command-line arguments.
//
// ⚠ WHY THIS IS NOT COSMETIC: THE TWO INDEPENDENT FIXES.
//
//   (i)  `required` REFUSES AT DEPLOY, NAMING THE PARAMETER. An unconfigured
//        required input stops the deploy at compose/plan time with a name,
//        instead of reaching a running container as an empty string.
//
//   (ii) ARGV CAN EXPRESS *ABSENT*; ENV CANNOT. `getenv("X")` returns "" for
//        NEVER CONFIGURED and for CONFIGURED EMPTY: the same bytes. In argv
//        they are different states: the FLAG IS OMITTED vs `--x=`. A program
//        that reads a list of local domains from env cannot tell "no local
//        domains" from "never configured", and may deny every request as a
//        result, with nothing pointing at the cause.
//
// THE PARAMETER NAME IS NOT AN ENV KEY. It is an identifier; the transport is
// `--<flag>=<value>` on the container's argv. That is the whole point.

// The v1 parameter TYPE set. Every serving value is a string on the wire
// (argv is `repeated string`), and typing exists to VALIDATE AT DEPLOY, not to
// change the transport. The values bundles carry are domains, buckets, service
// account emails, project ids, `on|off`-style enums, ints (`5000000`, `8080`,
// `3600`), `1` bools and `secret://` refs.
//
// ⛔ NO FLOAT/NUMBER ARM, DELIBERATELY. No parameter needs one; a float arm
// would only add a parse divergence between the deploy-time validator and the
// in-process reader. Grows ADDITIVELY.
enum ParamType {
  // Proto3 zero default. An authored parameter MUST state its type; UNSPECIFIED
  // is an authoring error (fail-fast in `validate`).
  PARAM_TYPE_UNSPECIFIED = 0;
  // An opaque string. `regex` is the only applicable constraint.
  PARAM_TYPE_STRING = 1;
  // A base-10 signed integer. `min`/`max` are the applicable constraints.
  PARAM_TYPE_INT = 2;
  // A boolean, spelled `true`/`false`/`1`/`0` (case-insensitive) in a value.
  PARAM_TYPE_BOOL = 3;
  // A closed set of string values: `allowed_values` is REQUIRED and is the
  // constraint.
  PARAM_TYPE_ENUM = 4;
  // A SECRET. Its `source` MUST be the `secret_ref` arm, and its argv token
  // carries a REFERENCE, never plaintext (see `AppParameter.flag`). A literal
  // `value` on a SECRET parameter is refused by `validate`.
  PARAM_TYPE_SECRET = 5;
}

// The REGISTERED deploy-time value PRODUCERS: an ENUM, not a `${…}` string.
//
// ⚠ THIS ENUM MAKES "MAY BE EMPTY" A TYPE-LEVEL FACT. The older marker grammar
// is a set of `${…}` tokens the manifest mapper substitutes, and its registry
// rules make an unresolved marker RAISE, for every marker EXCEPT
// `${org_mail_domain}`, whose resolver renders EMPTY rather than raise. In that
// grammar the carve-out is PROSE: a comment saying "this one may be empty",
// with nothing in the type system holding it. Under this schema it is DATA:
// `required: false`, no `default` ⇒ THE FLAG IS OMITTED, and the binary's own
// default applies with the operator able to see it was never set.
//
// Ordinals are FROZEN; new producers append at the tail. Every entry here must
// have a resolver threaded at every mapper call site.
enum ParamMarker {
  // Proto3 zero default. A `marker` source arm MUST name a real producer;
  // UNSPECIFIED is an authoring error (fail-fast in `validate`).
  PARAM_MARKER_UNSPECIFIED = 0;
  // The deploy target's cloud project id (the `${project}` producer).
  PARAM_MARKER_PROJECT = 1;
  // The deploy target's region (the `${region}` producer).
  PARAM_MARKER_REGION = 2;
  // The resolved datastore database id (the `${datastore_database}` producer).
  PARAM_MARKER_DATASTORE_DATABASE = 3;
  // The app-deployment record id: the offline-verify token `aud` (the
  // `${app_deployment_id}` producer).
  PARAM_MARKER_APP_DEPLOYMENT_ID = 4;
  // The rendered PUBLIC JWK Set for the target environment (the
  // `${app_signing_jwks}` producer). Public key material only, never a seed.
  PARAM_MARKER_APP_SIGNING_JWKS = 5;
  // The org's onboarded + VERIFIED mail domain (the `${org_mail_domain}`
  // producer). ⚠ THE ONE PRODUCER THAT MAY LEGITIMATELY RESOLVE TO NOTHING:
  // an org with no VERIFIED mail domain. Author it `required: false` with NO
  // default so an unresolved marker OMITS THE FLAG; a `required: true` marker
  // parameter that resolves empty REFUSES the deploy.
  PARAM_MARKER_ORG_MAIL_DOMAIN = 6;
  // ★ THE ORG THIS DEPLOY IS RUNNING UNDER: the hyphenated uuid the operator
  // passed as `--org-id` (the `${org_id}` producer).
  //
  // ⛔ IT IS THE ONE MARKER WHOSE VALUE A BUNDLE SHOULD NOT SPELL OUT. The
  // operator's reserved org id has exactly ONE declaration and every other site
  // must DERIVE it; a bundle that wrote it literally would be a second copy.
  // Substituting some OTHER plausible uuid would pass every offline check and
  // deploy a service asserting its identity under the wrong tenancy. This
  // marker lets a bundle name the org without typing it.
  //
  // ⚠ IT NEVER RESOLVES TO NOTHING. Unlike `${org_mail_domain}`, an empty org
  // is not a smaller correct deploy: it is a service that cannot derive the
  // handle of its own per-org identity secret. An authored `${org_id}` with no
  // `--org-id` REFUSES the deploy, naming the flag, on BOTH cloud arms.
  PARAM_MARKER_ORG_ID = 7;
}

// ─── ONE typed managed-app parameter ─────────────────────────────────────────
//
// The CloudFormation-`Parameters` analog, in this file's house style: typed,
// constrained, defaulted, and referenced by a TYPED source arm rather than a
// `${}` template.
//
// ⚠ `name` IS NOT AN ENV KEY, AND THAT IS THE ENTIRE POINT. The value reaches
// the container as `--<flag>=<value>` on argv. `flag` defaults to the derived
// `name.lower().replace('_','-')`, so an author states the name once.
message AppParameter {
  // The parameter id: UPPER_SNAKE, `^[A-Z][A-Z0-9_]{0,63}$`. This is the name
  // the CONTROL PLANE carries opaquely and the operator types on
  // `--param NAME=VALUE`. It is NOT an env key.
  string name = 1;
  // The parameter's TYPE. UNSPECIFIED is an authoring error.
  ParamType type = 2;
  // REQUIRED ⇒ an unresolved value REFUSES THE DEPLOY, naming this parameter
  // (rc=9, at compose/plan time, before any cloud call): fail at deploy with
  // a name, not at runtime as an auth error.
  bool required = 3;
  // The fallback value applied when nothing else resolves. MEANINGFUL ONLY when
  // `required` is false (a `required` parameter with a default can never
  // refuse, which makes `required` a lie: `validate` rejects that pair). An
  // EMPTY default on an optional parameter means THE FLAG IS OMITTED, which is
  // how "never configured" stays distinguishable from "configured empty".
  string default = 4;
  // The human purpose. ⚠ LOAD-BEARING, NOT DECORATION: the deploy-time refusal
  // message quotes it VERBATIM, so this text is what an operator reads at 3am
  // when a deploy stops. Write it as the answer to "what breaks without this?".
  string description = 5;
  // The argv LONG FLAG, without the leading `--`. EMPTY ⇒ DERIVED as
  // `name.lower().replace('_','-')` (so `LOCAL_DOMAINS` ⇒ `--local-domains`).
  // State it explicitly only when the binary's existing flag disagrees with the
  // derivation.
  string flag = 6;

  // ─── CONSTRAINTS (all optional; empty/zero = unconstrained) ───────────────
  // The closed value set. REQUIRED for `PARAM_TYPE_ENUM`; refused on any other
  // type (a constraint that cannot apply is an authoring error, not a no-op).
  repeated string allowed_values = 7;
  // A pattern the value must match. `PARAM_TYPE_STRING` only.
  string regex = 8;
  // The inclusive lower bound. `PARAM_TYPE_INT` only. Applied iff
  // `has_min`: a bare 0 is a legitimate bound, so presence is explicit.
  int64 min = 9;
  // The inclusive upper bound. `PARAM_TYPE_INT` only. Applied iff `has_max`.
  int64 max = 10;
  // Presence flags for `min`/`max`. proto3 scalars have no presence, and 0 is a
  // legitimate bound: without these a `min: 0` would be indistinguishable from
  // "no lower bound", which is the same absent-vs-empty confusion this whole
  // schema exists to kill.
  bool has_min = 16;
  bool has_max = 17;

  // ─── WHERE THE VALUE COMES FROM ───────────────────────────────────────────
  // EXACTLY ONE arm, or NONE. No arm ⇒ the value is SUPPLIED at deploy (by the
  // control plane's opaque parameter map, or by `--param NAME=VALUE` on an
  // operator deploy), falling back to `Wave.parameter_override`, then
  // `default`, then REFUSING if `required`.
  oneof source {
    // A bundle LITERAL. Refused for `PARAM_TYPE_SECRET`: a secret literal in a
    // checked-in bundle is the thing this model exists to prevent.
    string value = 11;
    // A `secret://<name>[:<version>]` handle. `PARAM_TYPE_SECRET` ONLY. The
    // HANDLE rides the bundle; the VALUE reaches the container through the
    // applier's secret-store mount and is resolved in-process. Never plaintext.
    string secret_ref = 12;
    // A REGISTERED deploy-time producer (the typed replacement for `${…}`).
    ParamMarker marker = 13;
    // A typed SELF wave-output reference: the same `ValueFrom` the env arm uses
    // (`DEPLOY_URL` / `EDGE_URL`).
    ValueFrom value_from = 14;
    // A typed CROSS-SERVICE reference: a sibling service's deployed endpoint.
    ServiceRef service_ref = 15;
    // ⭐ A BUILD OUTPUT OF THIS BUNDLE, by build-target NAME (field 18 because
    // 16/17 are `has_min`/`has_max`). Resolves to what that target's
    // build+stage legs produced: the staged boot bundle's URL for a
    // `FILE_ROLE_POD_LOADER_BUNDLE` target (through a pairwise check against
    // the staged service image), or the probe image's digest for a
    // validate-step arg. A wave `parameter_override` may carry EXACTLY this
    // dynamic arm, and only when the spec-level parameter has no source.
    //
    // ⛔ DECLARED AHEAD OF ITS RESOLUTION: `validate_bundle` REFUSES it BY NAME
    // on every parameter and arg, and compose refuses it too, until the
    // resolution exists. Unrefused, an optional `from_build` parameter would
    // resolve to NOTHING and its flag would be silently omitted.
    string from_build = 18;
  }
}

// ─── The scaling intent ──────────────────────────────────────────────────────
message Scaling {
  // The minimum replica count. Default 0 = scale-to-zero (frugal architecture).
  int32 min = 1;
  // The maximum replica count (autoscale ceiling).
  int32 max = 2;
}

// ─── One AUTHORED object-store bucket the app self-provisions ────────────────
//
// The INTENT-tier bucket declaration a control-plane bundle authors so the
// DEPLOY graph PROVISIONS the bucket (a `RESOURCE_KIND_BUCKET` node) instead of
// assuming it as a bootstrap prerequisite. The composer emits ONE bucket node
// per entry, ordered BEFORE the service's ServerlessCompute node (as a
// datastore is), plus ONE `CAPABILITY_WRITE_OBJECT_STORE` grant so the
// service's runtime service account holds objectAdmin on it. The bucket node
// is realized by the low-level bucket conformer.
//
// TWO-TIER NAMING (matching how bundles spell bucket names in env values).
// `name` carries the LITERAL bucket name, and MAY embed the `${project}` token
// (e.g. `${project}-assets`), the SAME convention the bundle's
// Config-node env values use. The composer (env-agnostic, no project binding)
// emits the name VERBATIM as the bucket node's logical_id + grant target; the
// manifest mapper substitutes `${project}` from its `--env` binding for the
// RESOURCE name (the graph logical_id stays un-substituted so depends_on edges
// still match).
//
// AUDITED CONFIG. `location` = the deploy region (e.g. "europe-west1");
// `storage_class` = the GCS storage class ("" -> the STANDARD default);
// `uniform_bucket_level_access` + `public_access_prevention` express an audited
// bucket policy. Empty/false defaults keep a bucket-free bundle BYTE-IDENTICAL
// (additive-safe).
//
// ─── ITS RESOLVED COUNTERPART IS `komira.manifest.v1.ResolvedBucketSpec` ─────
// The two tiers live in different packages (`komira.bundle.v1` /
// `komira.manifest.v1`), but a Mojo consumer imports both tiers into one flat
// namespace, so the pair is disambiguated: the RESOLVED side takes the
// prefix, the convention in this file pair, where `GitPush` / `Schedule` /
// `PackagePublished` sit opposite `ResolvedGitPush` / `ResolvedSchedule` /
// `ResolvedPackagePublished`. THIS message keeps the bare name: it is the
// resolved one PLUS `name` at field 1, which is why every other field here is
// one number higher.
message BucketSpec {
  // The LITERAL bucket name (globally unique). MAY embed the `${project}` token
  // (e.g. "${project}-assets") which the mapper resolves from the `--env`
  // binding, matching how the bundle's env values spell these names.
  string name = 1;
  // The bucket location / region (e.g. "europe-west1").
  string location = 2;
  // The GCS storage class ("STANDARD" / "NEARLINE" / …). EMPTY -> the conformer's
  // STANDARD default (the cloud provider's hot-data choice).
  string storage_class = 3;
  // Whether Uniform Bucket-Level Access is enforced. Default false =
  // additive-safe.
  bool uniform_bucket_level_access = 4;
  // The public-access-prevention policy ("enforced" / "inherited"). EMPTY -> the
  // GCS default (no explicit policy stamped), additive-safe.
  string public_access_prevention = 5;

  // ★ HOW LONG AN OBJECT MAY LIVE HERE, IN DAYS (GCS Object Lifecycle
  // Management: one rule, `action{type:"Delete"}` + `condition{age_days:N}`).
  //
  // WHY THIS FIELD EXISTS: a service that only transits customer data, and
  // does not store it persistently, needs its buckets to say so. Without a
  // lifecycle concept at any tier (intent, resolved manifest, or conformer),
  // no bucket this deploy engine creates could carry an expiry, and objects
  // would stay resident indefinitely. A policy nobody can author is a policy
  // nobody can audit.
  //
  // ZERO IS "NOT AUTHORED", NOT "ZERO DAYS". GCS reads `age: 0` as "every
  // object matches immediately", so the proto3 zero cannot double as the
  // absent value without every existing bucket silently acquiring a
  // delete-everything rule. So:
  //   * 0   -> this bundle makes NO claim about object lifetime. The create
  //            body carries no `lifecycle` block and the conformer neither
  //            reads nor converges the live one. BYTE-IDENTICAL to a bundle
  //            that does not set the field (additive-safe).
  //   * N>0 -> AUTHORED. The conformer stamps the rule on create AND converges
  //            it on adopt (a live bucket whose rule disagrees reads DRIFTED
  //            and is patched).
  //   * N<0 -> REFUSED by the conformer, naming the field.
  //
  // ⚠ THE ASYMMETRY IS DELIBERATE AND IS A KNOWN GAP. Because 0 means
  // "unclaimed", DELETING this field from a bundle does NOT remove a live
  // rule: it stops asserting one. That is the safe direction (a deploy never
  // silently lengthens a retention it was once asked to shorten), but it means
  // "this bucket must have NO expiry" is not expressible here. Say so in a
  // follow-up field rather than reading a sentinel into 0.
  int32 object_expiry_days = 6;
}

// ─── The intent spec (`AppSpec`) ─────────────────────────────────────────────
//
// The intent fields for the service. Reuses `ComputeIntent` / `DatastoreNeed` /
// `SecretBinding` from `deploy_model.proto` BY IMPORT (defined once), NOT
// re-declared here.
// ─── HOW A SERVICE'S NAME RELATES TO ITS BUNDLE'S NAME ──────────────────────
//
// The bundle's `name:` is either the service name itself (the default shape)
// or a BASE name that the deploy target qualifies. See `AppSpec.name_scope`.
enum NameScope {
  // The authored `name` IS the service name. A zero enum value writes nothing
  // on the wire.
  NAME_SCOPE_UNSPECIFIED = 0;

  // The authored `name` is a BASE name; the service name is
  // `regional_service_name(base, target.cloud, target.region)`, i.e.
  // `<base>-<cloud>-<region>`, the ONE convention `regional_service_name_region`
  // decodes back. A target with no resolved region is a REFUSAL, never a
  // fallback to the bare base (see `AppSpec.name_scope` for the service that
  // fallback would collide with).
  NAME_SCOPE_REGIONAL = 1;
}

message AppSpec {
  // The ONE place the deployed artifact is named (a digest or a `from_build`
  // reference).
  ImageRef image = 1;
  // The served container port.
  int32 port = 2;
  // The environment variables (literals and/or typed wave-output references).
  repeated BundleEnvVar env = 3;
  // The scaling intent (min/max; default min=0 scale-to-zero).
  Scaling scaling = 4;
  // The compute intent (serverless | serverful), REUSED from
  // `deploy_model.proto` by import.
  .komira.deploy.v1.ComputeIntent compute = 5;
  // The datastore INTENT (none | serverless | dedicated), REUSED from
  // `deploy_model.proto` by import. The IMPL is resolved per target by the
  // composition/mapper, not stated here.
  .komira.deploy.v1.DatastoreNeed datastore = 6;
  // The secrets this app resolves at runtime: the REUSED `SecretBinding` from
  // `deploy_model.proto` (a name + capability node, never a value).
  repeated .komira.deploy.v1.SecretBinding secret_bindings = 7;
  // The AUTHORED runtime service account the compute RUNS AS (the identity the
  // ServerlessCompute node carries as `runtime_identity`). EMPTY = derive
  // `<service>-role` (a plain app leaves this unset). NON-EMPTY = the
  // control-plane SELF-PROVISION signal: the composer additionally emits a
  // `RESOURCE_KIND_SERVICE_ACCOUNT` node that CREATES this service account +
  // its 6 base capability grants (READ_SECRET on the bootstrap signing seed,
  // READ_OBJECT_STORE on the bootstrap bucket, READ_ARTIFACTS on the bootstrap
  // artifact registry, and project-scoped READ_WRITE_DATASTORE / LOG_WRITE /
  // SERVICE_USAGE), so the DEPLOY graph (not bootstrap) stands up the runtime
  // identity. The authoring counterpart of `DeploymentSpec.runtime_identity`
  // (deploy_model.proto).
  string runtime_identity = 8;

  // ─── OPTIONAL supervisor HINTS ────────────────────────────────────────────
  // The ONLY supervisor knobs a customer may touch. The composer MERGES these
  // into the platform-injected `SupervisorSpec` (full_manifest.proto); every
  // PLATFORM field (supervisor_image_digest / mode / lease+heartbeat timing /
  // report_target) stays platform-owned. All empty/0 = platform defaults
  // (byte-identical to a bundle that omits them, additive-safe). SupervisorSpec
  // itself is NOT on the AppBundle: a customer authors ONLY these four hints.
  // The HTTP liveness path the supervisor probes on the child ("" = process-
  // liveness only) -> SupervisorSpec.child_health_path.
  string supervisor_child_health_path = 9;
  // The child health port (0 = the node's served port) ->
  // SupervisorSpec.child_health_port.
  int32 supervisor_child_health_port = 10;
  // Supervisor container cpu (SIDECAR only) -> SupervisorSpec.cpu.
  string supervisor_cpu = 11;
  // Supervisor container memory (SIDECAR only) -> SupervisorSpec.memory.
  string supervisor_memory = 12;

  // ─── STATIC_FRONTEND authoring ────────────────────────────────────────────
  // The AUTHORED front-door intent an APP_KIND_STATIC_FRONTEND bundle carries.
  // The static-frontend composer threads these onto the ONE
  // `RESOURCE_KIND_WEB_FRONTEND` node; every other kind ignores them (empty =
  // byte-identical compose, additive-safe). The vendor L7 primitive names are
  // self-derived from the slug INSIDE the conformer (the adopt discipline): no
  // vendor name is authored here.
  //
  // The stable name prefix every L7 primitive self-derives from, DECOUPLED
  // from the domain (the cutover-safety lever: a new slug stands up a PARALLEL
  // front door while the live one keeps serving). EMPTY = derive `bundle.name`.
  string web_slug = 13;
  // The primary managed-cert/serving domain (e.g. "example.com"). DNS stays
  // MANUAL (no DNS_RECORD node is composed from this).
  string web_domain = 14;
  // Additional cert/serving domains (e.g. "www.example.com").
  repeated string web_additional_domains = 15;
  // The url-map path PREFIXES routed to the api backend instead of the SPA
  // bucket (e.g. "/api", "/v1"). The conformer expands each prefix `p` to the
  // `p` + `p/*` path-rule pair.
  repeated string web_api_path_prefixes = 16;
  // The logical id of the api ServerlessCompute node the LB's serverless NEG
  // targets (e.g. "example-api-svc"; the mapper strips the `-svc` suffix to
  // recover the served service name). EMPTY = a pure static frontend (no api
  // backend path rules).
  string web_api_service_logical_id = 17;

  // ─── API-EDGE authoring ───────────────────────────────────────────────────
  //
  // The app's inbound-delivery INTENT, REUSED from `deploy_model.proto` by
  // import (as ComputeIntent/DatastoreNeed are). UNSPECIFIED (the default) =
  // no inbound: every bundle that omits it composes byte-identically.
  // CLIENT ⇒ the composer emits ONE `RESOURCE_KIND_API_EDGE`
  // {CATCH_ALL, CLIENT_PASSTHROUGH} node per service, gated per wave by
  // `Wave.api_edge_enabled` (the staging toggle). WEBHOOK ⇒ the SINGLE_PATH
  // edge emission.
  .komira.deploy.v1.InboundNeed inbound = 18;
  // The SINGLE_PATH inbound route (e.g. "/mail/inbound"): REQUIRED iff
  // `inbound: WEBHOOK` (authored by the app bundle; NO baked default in the
  // conformer). MUST be empty for CLIENT/POLL/NONE (validated fail-fast).
  string inbound_route_path = 19;

  // ─── OBJECT-STORE BUCKETS the app SELF-PROVISIONS ─────────────────────────
  // The authored object-store buckets the DEPLOY graph provisions for this
  // service. The composer emits ONE `RESOURCE_KIND_BUCKET` node per entry,
  // ordered BEFORE the ServerlessCompute node (datastore-before-service), plus
  // ONE `CAPABILITY_WRITE_OBJECT_STORE` grant per bucket (the runtime service
  // account holds objectAdmin). EMPTY (the default) => NO bucket node composed:
  // a bundle without buckets composes BYTE-IDENTICALLY (additive-safe). Like
  // every field from 20 on, appended at the highest number so it neither
  // displaces nor bleeds into the existing fields; a code site that constructs
  // `AppSpec` positionally must be updated with it.
  repeated BucketSpec buckets = 20;

  // ─── EXTRA runtime capability grants beyond the 6 self-provision base grants ──
  // The ADDITIONAL project-scoped capability GRANTS the DEPLOY graph binds to
  // this service's runtime service account, on top of the SIX base grants the
  // self-provision path emits (READ_SECRET on the signing seed /
  // READ_OBJECT_STORE on the bootstrap bucket / READ_ARTIFACTS on the artifact
  // registry / project-scoped READ_WRITE_DATASTORE / LOG_WRITE /
  // SERVICE_USAGE). Each entry is a GENERIC `Capability` ORDINAL (a raw int:
  // the resolved-tier `Capability` enum lives in `full_manifest.proto`, which
  // this intent-tier proto may NOT import under the two-proto layering rule,
  // so the ordinal is carried on the wire exactly as the conformer consumes
  // it). The composer emits ONE project-scoped `RESOURCE_KIND_GRANT` node per
  // entry (target=="" -> `projects/<P>`), each `depends_on` the runtime service
  // account node. ONLY meaningful when `runtime_identity` is authored
  // (self-provision); ignored otherwise (a managed app gets no extra grants).
  // This folds out-of-band per-service grants into IaC, for example:
  //   * a job manager -> ADMIN_SERVERLESS_COMPUTE (12): stand up Cloud Run JOBS.
  //   * a push service -> PUSH_MESSAGING (13): send FCM.
  // EMPTY (the default) => NO extra grant composed (additive-safe). ONLY the
  // project-scoped capabilities (READ_WRITE_DATASTORE / LOG_WRITE /
  // SERVICE_USAGE / ADMIN_SERVERLESS_COMPUTE / PUSH_MESSAGING) are legal here
  // (a target=="" grant); compose FAILS FAST on an UNSPECIFIED / out-of-range /
  // non-project-scoped ordinal.
  repeated int32 runtime_extra_capabilities = 21;

  // ─── FULL url-map ROUTE TABLE (verbatim) ──────────────────────────────────
  // The COMPLETE load-balancer routing table, authored VERBATIM so a converge
  // reproduces the live url-map byte-for-byte (no `p`+`p/*` expansion,
  // multiple backend roles, per-rule 404 policies). When NON-EMPTY this is the
  // AUTHORITATIVE routing table and SUPERSEDES `web_api_path_prefixes` (the
  // uniform-expansion path). EMPTY (the default) => the conformer falls back to
  // the `web_api_path_prefixes` expansion (additive-safe). Each rule's `paths`
  // are matched longest-prefix by the LB; `backend_role` selects the
  // self-derived backend; an optional per-rule 404 policy scopes a
  // custom-error response (an honest 404 for a path family the app does not
  // serve).
  repeated WebRouteRule web_route_rules = 22;

  // ─── PER-BUNDLE DEPLOY-REGION OVERRIDE (multi-region control plane) ───────
  // The Cloud Run DEPLOY region this bundle deploys to, OVERRIDING the `--env`
  // binding's default region FOR THIS BUNDLE ONLY. The deploy path otherwise
  // derives the region EXCLUSIVELY from the env binding's `Environment.region`
  // (one value per env symbol) and threads it into ALL FOUR apply sites: the
  // ServerlessCompute compose/apply region, the served-URL registry poll
  // region, the IAM binder region, and the index-ensure region. So without
  // this field a bundle that must run in a different region than its env's
  // default would mis-deploy to the env's region.
  //
  // WHEN SET (non-empty, e.g. "us-central1") the effective region for THIS
  // bundle becomes this value at all four sites, while the env binding's
  // region stays the DEFAULT for every OTHER bundle in that env. WHEN EMPTY
  // (the default) the effective region IS the env binding's region. The env
  // binding remains the DEFAULT; this is an OVERRIDE, never a replacement, and
  // it is DATA (a bundle field), not an env var or a CLI flag (config as data,
  // as `buckets.location` is).
  string region = 23;

  // ─── PUBLIC (allUsers) INVOKER: for a service that is EXTERNALLY DIALED ───
  // When TRUE, the composer emits ONE `RESOURCE_KIND_GRANT` node binding the
  // literal IAM member `allUsers` -> `roles/run.invoker` on this service's OWN
  // `<name>-svc` served node, i.e. the served Cloud Run service is PUBLICLY
  // invocable (unauthenticated at the IAM layer). EMPTY/false (the default)
  // => NO allUsers node composed: the service stays PRIVATE (OIDC-gated
  // run.invoker only). A bundle must OPT IN explicitly to become public.
  //
  // WHEN THIS IS SAFE: only for a service whose callers cannot present an
  // OIDC identity, so that Cloud Run IAM cannot be its auth boundary, and
  // whose security therefore lives ENTIRELY in the app layer. The worked
  // example is a content-blind WebSocket session relay: BOTH peers (a user's
  // runner and a browser/device) dial OUT to it over wss://, a BROWSER peer
  // CANNOT present a service OIDC token, and security is a per-session share
  // token + a Noise_XX handshake that keys an END-TO-END channel between the
  // two peers. The relay forwards opaque ciphertext frames by session_id and
  // holds no key, no datastore, no secret, so `allUsers` authorizes only
  // "reach the pipe"; the real gate is unaffected.
  //
  // ⚠️ DO NOT set this on a service that is invoked WITH OIDC and is never
  // externally dialed: such a service MUST stay PRIVATE (scoped run.invoker
  // only). Conversely, do not "fix" a service like the relay back to private:
  // its publicness is load-bearing. NOTE: a public Cloud Run service also
  // requires the org policy `iam.allowedPolicyMemberDomains` to PERMIT
  // `allUsers` (the constraint the webhook-ingress conformer routes AROUND via
  // an API-Gateway-fronted scoped invoker).
  bool public_invoker = 24;

  // ─── RETENTION: keep the newest N Cloud Run revisions (lazy prune-at-deploy)
  // How many of the app's most-recent Cloud Run REVISIONS survive a forward
  // deploy. On each successful create/update the deploy lazily PRUNES older
  // revisions beyond the newest `keep_last_n` (never the serving revision).
  // This is a DIFFERENT axis from RETAIN_*/`retention` (which is
  // may-delete-on-teardown): keep_last_n bounds how many VERSIONS survive a
  // forward deploy. proto3-optional so UNSET is representable: the deploy
  // tool's mapper applies the default (5) when absent (a deploy is
  // reproducible from the bundle; the default is a constant of the tool, NOT
  // an env var). Threaded through the composer onto
  // `ServerlessComputeSpec.keep_last_n`, then onto the
  // `DeploymentSpec.keep_last_n` the Cloud Run conformer prunes against.
  optional int32 keep_last_n = 25;

  // ─── ADDITIONAL inbound routes on the SAME edge, each EDGE-SECURED ────────
  // Routes this app serves that the EDGE authenticates, alongside the single
  // `inbound_route_path` above (which the edge passes THROUGH). Only meaningful
  // with `inbound: WEBHOOK`: validate REFUSES them otherwise, because the edge
  // they hang on is the SINGLE_PATH one and under CLIENT/POLL/NONE there is
  // nothing to attach them to.
  //
  // ★ WHY A SECOND ROUTE RATHER THAN WIDENING `inbound_route_path`. An app can
  // have TWO inbound callers with genuinely different credentials: a vendor
  // webhook sender that can present NO cloud identity at all and is authorized
  // by a shared webhook secret at the BACKEND, and an internal router that
  // presents a self-signed service-account JWT the EDGE validates. An
  // edge-WIDE policy can express neither pair: it either weakens the internal
  // route to a secret that cannot name a principal, or strengthens the vendor
  // route to a JWT the vendor cannot mint, and the symptom of the second is
  // "deliveries stopped arriving", behind a gateway that looks MORE secure. So
  // the policy travels with the ROUTE.
  //
  // EMPTY (the default) => NO secured route is composed and the API_EDGE node
  // is byte-identical to one composed without this field (additive-safe).
  repeated SecuredInboundRoute secured_inbound_routes = 26;

  // ─── THE DATASTORE'S DATABASE NAME: A CONFIG CHOICE, NOT A CONSTANT ───────
  //
  // People pick their database's name in the config; the deploy tool does not
  // name every database for them.
  //
  // The id of the database this service's documents live in. REQUIRED whenever
  // `datastore` is SERVERLESS/DEDICATED (unless `datastore_database_ref` is
  // set instead); REFUSED when `datastore` is NONE (a database name on a
  // service that has no datastore names nothing, and the next reader believes
  // it).
  //
  // ★ THERE IS DELIBERATELY NO DEFAULT, AND THAT IS THE WHOLE POINT. The two
  // candidate defaults are both wrong in a way that ships silently:
  //   * a fixed constant would create a database with that one name in every
  //     account a deploy targets, customer accounts included.
  //   * a name DERIVED from the app would SILENTLY REPOINT an existing deploy
  //     at a fresh, EMPTY database the day the derivation changed: document-DB
  //     create-if-absent succeeds, the indexes get ensured, the deploy goes
  //     green, and every document written before that day is invisible. There
  //     is no error anywhere in that sequence.
  // So the bundle STATES it. An unstated database is a build-time refusal,
  // offline, before any cloud call, which is the only place this class of
  // mistake is cheap.
  //
  // ★ IT IS THREADED TO BOTH SIDES, AND THAT IS WHY IT IS ONE FIELD.
  // The id has two consumers: the INDEX-ENSURE step (which creates the database
  // and its composite indexes) and the ENV STAMP the deployed app reads. A
  // database that is stamped but never ensured exists with ZERO composite
  // indexes: the first list query then returns a 400 FAILED_PRECONDITION and
  // nothing in the deploy says so. Both come from this one string: the deploy
  // tool bakes it into the `EnsureIndexes` step, and the mapper substitutes it
  // for the `${datastore_database}` marker in any env value.
  //
  // ★ AUTHOR THE ADDRESS AS THE MARKER, NEVER AS A LITERAL. An env whose name
  // ends in `_FIRESTORE_DATABASE` must carry `${datastore_database}`; a literal
  // there is REFUSED at compose. A literal is how the stamp and the ensure
  // diverge, and the divergence is invisible until a live query fails.
  //
  // SHAPE: a valid Firestore database id: `(default)`, or 4-63 chars of
  // [a-z0-9-] starting with a letter and ending alphanumeric.
  string datastore_database = 27;

  // ─── ★ THE DATABASE THIS SERVICE OPENS BUT DOES NOT OWN: the REFERENCE arm
  //
  // A resource the deploy tool does not own but only references.
  //
  // ⛔ THIS FIELD AND `datastore_database` ARE MUTUALLY EXCLUSIVE, AND EXACTLY
  // ONE IS REQUIRED WHEN `datastore` IS SERVERLESS/DEDICATED. Both set, or
  // neither, is REFUSED offline by `resolve_datastore_identity`, the single
  // function every reader goes through. Never read these two strings directly;
  // a reader that picks one of them has just re-created the ambiguity this pair
  // exists to remove.
  //
  // ★ WHAT THE SPLIT IS FOR. When several bundles each declare
  // `datastore: DATASTORE_NEED_SERVERLESS` and name the SAME database, every
  // one runs create-or-adopt, so the FIRST deploy creates it and the others
  // silently adopt whatever they find. The database then has many claimants
  // and no owner: its name has to be a constant (no single bundle can choose
  // one); a fresh environment's first deploy can fail on first contact (no one
  // owns creating it, so everyone opportunistically ensures it); and a service
  // can end up STAMPING one database while its deploy ENSURES another. Those
  // are three symptoms of one missing distinction.
  //
  // ★ WHAT A REFERENCE MEANS, PRECISELY. "This database is a resource ANOTHER
  // release machine declares. Do not create it, do not update it, do not delete
  // it, and REFUSE THIS DEPLOY if it is not already there." The refusal is the
  // whole mechanism. A reference that fell back to create-or-adopt would be
  // byte-identical to the behaviour above, and a green deploy would prove
  // nothing, which is why a test of it must assert the NEGATIVE case and not
  // the happy path.
  //
  // ★ IT IS CHECKED IN TWO PLACES BECAUSE THERE ARE TWO DIFFERENT QUESTIONS,
  // AND NEITHER SOURCE CAN ANSWER THE OTHER'S:
  //   * OFFLINE, from the bundle text: "who owns this, and what did they call
  //     it?" `resolve_datastore_identity` answers it with no credentials, which
  //     is what keeps validation offline.
  //   * LIVE, from the cloud, AT PLAN and before any mutation: "does it exist,
  //     ensured, right now?" A read-only probe (`databases.get` plus a non-empty
  //     composite-index list) answers it. Present -> the node plans NOOP.
  //     Absent -> it RAISES, naming the bundle that owns the database and the
  //     command that deploys it. There is deliberately NO registry lookup in
  //     between: a published record would be a THIRD source of truth that can
  //     disagree with the cloud.
  //
  // ⛔ AND THERE IS NO CROSS-PROJECT ARM. The probe runs in the project THIS
  // deploy targets (`account_ref`, the same project the `${project}` marker
  // resolves to). A managed app deployed into a customer account therefore
  // CANNOT resolve the operator's database: there is no shared infrastructure
  // in that account, the probe finds nothing, and the deploy is refused with
  // "declare your own `datastore_database`". That refusal is the customer case
  // working, not a limitation of it.
  //
  // SHAPE: a valid Firestore database id (identical to `datastore_database`).
  string datastore_database_ref = 28;

  // ─── ★ THE INDEX SHAPES THIS APP'S OWN DATABASE NEEDS: declared BY THE APP,
  //     never by the control plane ────────────────────────────────────────────
  //
  // ⛔ WHY. If the only way an index shape reaches a database is a literal
  // compiled into a control-plane binary, a customer whose app has a `widget`
  // table has exactly two options: send a patch to the operator's control
  // plane, or ship an app whose first list query returns a 400
  // FAILED_PRECONDITION. Both are the same bug: the control plane authoring an
  // app's schema.
  //
  // ★ IT IS DECLARED WHERE THE DATABASE IS DECLARED. `index_tables` is legal
  // ONLY on a bundle that OWNS its database (`datastore_database`, field 27). A
  // bundle that merely REFERENCES one (`datastore_database_ref`, field 28) is
  // REFUSED at validate if it authors index shapes: the owner's deploy is the
  // only thing that ensures indexes, so a consumer's declaration would be a set
  // nothing provisions, and the reference probe would then demand indexes no
  // deploy of any bundle would ever create, refusing every consumer deploy
  // forever.
  //
  // ★ SHAPE = THE BACKEND-NEUTRAL datastore index manifest, spelled as nested
  // messages rather than as an embedded textproto STRING. A string would have
  // been one field and no parser work; it would also have been a second grammar
  // inside the bundle grammar: unvalidatable by bundle validation, invisible to
  // the emitter's round-trip, and unauthorable by an LLM reading the emitted
  // schema.
  //
  // EMPTY (the default) ⇒ NO bundle-declared shape: the ensure step uses
  // whatever its other source still declares for the database, so every bundle
  // that authors none composes and deploys BYTE-IDENTICALLY. The two sources
  // are UNIONED, never one-or-the-other, so shapes can be moved into bundles
  // one block at a time with the tree deployable at every step.
  repeated .komira.deploy.v1.BundleIndexTable index_tables = 29;

  // ─── ★ THE INGRESS REALIZATION INPUTS: the declarable front door ─────────
  //
  // `inbound` (18) + `inbound_route_path` (19) + `secured_inbound_routes` (26)
  // + `Wave.api_edge_enabled` compose a `RESOURCE_KIND_API_EDGE` node: they
  // state the ROUTE and the AUTH. This block states the four REALIZATION
  // inputs the edge conformer takes, which would otherwise be hard-coded in
  // the composer or carried by a hand-written provisioning script. It holds
  // those fields and nothing else: the ROUTE and the AUTH stay where they are.
  //
  // UNSET (the default) ⇒ every field keeps the default behaviour: the
  // project-global gateway service account, the conformer's own gateway-region
  // placement policy, no source allow-list, and the ingress APIs treated as a
  // bootstrap prerequisite. So a bundle without the block composes and
  // re-emits BYTE-IDENTICALLY (additive-safe).
  //
  // ⚠ IT IS ONLY MEANINGFUL WITH AN `inbound` NEED. `validate` REFUSES an
  // `ingress {}` block on a service whose `inbound` is NONE/POLL: there is no
  // edge for it to configure, and a block that configures nothing is worse
  // than an absent one because it reads as though the front door were set up.
  IngressSpec ingress = 30;

  // ─── ★ THE MANAGED-APP PARAMETERS: the typed input contract ──────────────
  //
  // The app's declared parameters. The composer resolves each one and emits
  // ZERO OR ONE argv token, `--<flag>=<value>`, in BUNDLE DECLARATION ORDER
  // (a revision's argv must be byte-stable or every deploy churns a revision
  // for nothing), onto the served container. A `required` parameter that
  // resolves to nothing REFUSES the deploy (rc=9) naming the parameter.
  //
  // ⚠ THIS IS THE ONLY SCHEMA HOME. The app's deploy template is the plumbing
  // point, and the template IS the `.deploy.textproto`; a second home (for
  // example on a managed-app catalog record) would be a second truth.
  //
  // EMPTY (the default) ⇒ NO argv token, NO refusal, BYTE-IDENTICAL compose,
  // so bundles can adopt parameters ONE AT A TIME.
  repeated AppParameter parameters = 31;

  // ─── ★ THE NETWORK REACH OF THE SERVED SERVICE: the half of "private" that
  //     IAM cannot express ───────────────────────────────────────────────────
  //
  // ⛔ WHY. A design can depend on a service being "NETWORK-private (`ingress:
  // internal-and-cloud-load-balancing`)", and without a field to set and a
  // stamp to emit there is no way for that claim to become true: the service
  // reads back `ingress: all`. This field is the channel; `NetworkIngress`
  // (deploy_model.proto) is the vocabulary.
  //
  // ⚠ THIS IS NOT `public_invoker`, AND CONFUSING THE TWO IS THE FAILURE MODE.
  // `public_invoker` (field 24) governs IAM: WHO may invoke once a connection
  // is open. This governs the NETWORK: who may open one at all. They are
  // independent: a service can be IAM-private and still publicly dialable, and
  // the reachability half is the one an org-policy change cannot restore. Both
  // are needed to say "private" and mean it.
  //
  // UNSPECIFIED (the default) ⇒ NOTHING IS STAMPED: no ingress value on the
  // create/update body, no ingress path in the update mask, so a bundle that
  // omits it composes and re-emits BYTE-IDENTICALLY (additive-safe).
  //
  // ⚠ AND UNSPECIFIED IS NOT SAFE-BY-DEFAULT: unstamped means PUBLIC on Cloud
  // Run. A bundle that omits this field is choosing the platform's default; a
  // repository check should REPORT every such bundle by name rather than let
  // the omission look like a decision.
  .komira.deploy.v1.NetworkIngress network_ingress = 32;

  // ─── ★ THE SERVED SERVICE'S OUTBOUND PATH (the `network_ingress` sibling) ──
  //
  // WHICH NETWORK THIS SERVICE'S OWN TRAFFIC LEAVES THROUGH. Renders onto Cloud
  // Run's `RevisionTemplate.vpc_access` (run/v2 field 6) as a SINGLE
  // `network_interfaces` entry: Direct VPC egress, the connector-less form.
  //
  // ★ IT IS THE EXACT INVERSE OF FIELD 32, AND THE PAIR IS THE POINT.
  // `network_ingress` says who may open a connection TO this service;
  // `network_egress` says how this service opens one to someone else. They are
  // independent, and a private-ingress topology needs BOTH halves authored: the
  // callee sets `network_ingress: NETWORK_INGRESS_INTERNAL_AND_LOAD_BALANCER`,
  // and every caller sets this. Otherwise the caller egresses over the PUBLIC
  // INTERNET, the callee refuses it AT THE EDGE (before the container, with the
  // platform's own HTML 404), and the refusal is indistinguishable from an
  // application 404. Authoring only the ingress half is how a control plane
  // takes its own front door down.
  //
  // ⚠ THE MESSAGE IS SHARED BY BOTH SCOPES. `ValidateVpcEgress` was first
  // needed for `RunContainer.vpc_egress` (field 7), one validate step's job,
  // and its `Validate*` prefix records only that. Its shape (network /
  // subnetwork / network_tags / private_ranges_only) is the general
  // Direct-VPC-egress payload with nothing job-specific in it, so it is REUSED
  // here rather than cloned: a parallel message would mean two spellings, two
  // parsers, two validators and two renders for one Cloud Run concept, and a
  // fix to one of them would silently not apply to the other.
  //
  //     WHICH SCOPE AM I READING?  `RunContainer.vpc_egress` -> ONE VALIDATE
  //     STEP'S one-shot JOB (`TaskTemplate.vpc_access`). THIS FIELD -> the
  //     bundle's SERVED SERVICE (`RevisionTemplate.vpc_access`).
  //
  // ★★ `private_ranges_only` FALSE, THE proto3 DEFAULT, MEANS `ALL_TRAFFIC`,
  // AND ALL_TRAFFIC IS THE ONLY ARM THAT REACHES A PRIVATE-INGRESS `*.run.app`
  // PEER. A run.app hostname resolves to a PUBLIC address, so under
  // PRIVATE_RANGES_ONLY the request never enters the VPC and the
  // private-ingress callee refuses it exactly as it would with no attachment
  // at all. The default is therefore the arm that does the thing this field
  // exists for, and the narrower-sounding value is the one that silently does
  // nothing. Do not read `private_ranges_only: false` as "unconfigured"; read
  // it as "all traffic". (This INVERTS the vendor default: Cloud Run's own
  // `VpcAccess.egress` documents "if not provided, it defaults to
  // PRIVATE_RANGES_ONLY", which is why the render always writes the arm
  // EXPLICITLY and never omits it.)
  //
  // ⚠ AUTHORING IT SELECTS, IT DOES NOT CREATE, same as the job scope. No
  // compose, map or apply path provisions a network, a subnetwork, a connector,
  // a Cloud Router or a NAT from it; a name that does not resolve fails CLOSED
  // at the CreateService/UpdateService RPC. Under ALL_TRAFFIC the subnetwork
  // additionally needs `privateIpGoogleAccess` for Google-owned destinations (a
  // `*.run.app` URL, `*.googleapis.com`), and a Cloud NAT only for NON-Google
  // ones.
  //
  // ⚠ REGION-COUPLED: the subnetwork must be in the SERVICE'S OWN region
  // (`AppSpec.region`). Direct VPC egress attaches to a subnetwork in the
  // region the revision runs in, so a bundle that moves region must move this
  // with it.
  //
  // ABSENT (the default) ⇒ NOTHING IS RENDERED: no `vpc_access` on the
  // create/update body, so a bundle that omits it composes and re-emits
  // BYTE-IDENTICALLY (additive-safe). Absent is NOT neutral, in the same way an
  // absent `network_ingress` is not: it means the service egresses over the
  // public internet.
  //
  // ⛔ AND UNLIKE `network_ingress`, ABSENT HERE *REAPS*. `vpc_access` lives
  // under `template`, which the Cloud Run update carries as a BARE mask path,
  // so an in-place update REPLACES THE WHOLE TEMPLATE SUBTREE: a hand-set
  // `vpc_access` on a service whose bundle authors none is DELETED by the next
  // deploy of that bundle. That is the same declarative contract every other
  // template field has (env, args, scaling) and it is intended (the bundle is
  // the sole source of truth for the template), but it is the reason this must
  // be authored in the bundle rather than set by hand.
  ValidateVpcEgress network_egress = 33;

  // ─── MAIL TRANSPORT authoring ─────────────────────────────────────────────
  // The mail-transport spine this app owns: the domain it may send as and
  // receive for, the queue accepted inbound mail lands in, and the DNS records
  // that PROVE the domain to the mail provider.
  //
  // ⛔ WHY THIS FIELD EXISTS AT ALL. `RESOURCE_KIND_QUEUE` (5),
  // `RESOURCE_KIND_MAIL_DOMAIN_IDENTITY` (22) and `RESOURCE_KIND_DNS_RECORD`
  // (7) each have conformers and live adapters; without an authoring surface
  // no composer would emit them. A `Resource` no composer can reach is not a
  // half-built feature, it is a file. This field is the caller.
  //
  // ABSENT (the default) ⇒ NO mail-transport node is composed and the manifest
  // is BYTE-IDENTICAL (additive-safe).
  MailTransportSpec mail_transport = 34;

  // ─── ★ THE COLLECTION SHAPES THIS APP'S DATASTORE HOLDS (field 35) ────────
  //
  // ⛔ WHY THIS FIELD EXISTS AT ALL. The resolved tier carries
  // `DatastoreSpec.collections` (full_manifest.proto, with
  // `DatastoreCollectionSpec` + `DatastoreAccessPath`), the AWS arm reads it,
  // and the AWS table-spec builder REFUSES a node authoring
  // `len(collections) != 1` BY NAME. Without an authoring field nothing could
  // fill it: every datastore node would MAP successfully and materialize
  // nothing, and the arm's refusal would read as a bundle's mistake rather
  // than as an absent surface. That looks finished and is not. This field is
  // the AUTHORING surface.
  //
  // ── ⚠ WHY THIS IS NEUTRAL AND NOT A DYNAMODB BLOCK ────────────────────────
  // The concept authored here is an ACCESS PATH, "queries on this collection
  // are answered by (a partition field, an optional ordered field)", and the
  // two clouds MATERIALIZE it differently rather than one of them ignoring it
  // (`DatastoreCollectionSpec` in full_manifest.proto states the mapping on
  // both sides). A `hash_key`/`range_key` pair would have been one vendor's
  // field set with the other arm obliged to ignore it: a vendor leak in the
  // neutral IR. No vendor name appears in this block or in the two messages
  // below.
  //
  // ── ⛔ AUTHORING IS THE ONLY WAY A KEY SCHEMA MAY BE STATED ────────────────
  // A DynamoDB key schema is IMMUTABLE: there is no `UpdateTable` form that
  // changes a partition key, a sort key or an attribute type, and the only path
  // between two designs is DeleteTable + CreateTable, which DESTROYS EVERY
  // ITEM. So a DEFAULT anywhere below the authoring tier is a permanent,
  // silent, uncorrectable wrong answer. This field is what makes "authored or
  // refused" an achievable rule instead of a refusal with no alternative.
  //
  // ⚠ AND AUTHORING ONE IS A SEPARATE DECISION FROM HAVING THE CHANNEL. An
  // invented key schema is permanent, so a block here should land only with
  // the decision that chose its partition/sort keys.
  //
  // ⚠ ONE COLLECTION IS NOT ONE DATABASE, which is why this is `repeated`. A
  // Firestore database holds N collection groups; DynamoDB has no database
  // object at all, so the same node's AWS materialization is N TABLES and the
  // AWS arm refuses N != 1 by count. The composer carries every N it is given:
  // it must, or that stated refusal silently becomes a SINGLE-TABLE DESIGN,
  // i.e. an invented key schema. Closing N > 1 is a composer change (one
  // datastore node per collection).
  //
  // EMPTY (the default) ⇒ the composed `DatastoreSpec.collections` is empty, and
  // a `repeated` field writes NOTHING when empty, so a bundle that omits it
  // re-emits identically and its composed manifest's content address is
  // unmoved.
  repeated DatastoreCollection datastore_collections = 35;

  // ─── ★★ THE PER-CLOUD SPEC VARIANTS ───────────────────────────────────────
  //
  // One app may need to run in every AWS, GCP and Azure region and on several
  // on-prem sites; the variants are keyed by cloud type (AWS vs GCP vs Azure
  // vs on-prem).
  //
  // The per-CLOUD half of one spec. A handful of an app's declarations are a
  // function of WHICH CLOUD it lands on and of nothing else: the container
  // image (a Lambda image and a Cloud Run image are different artifacts built
  // from different rules), the edge realization inputs, and the collection
  // shapes a datastore holds. Everything else about the app is cloud-neutral
  // and stays exactly where it is.
  //
  // ⛔ THE KEY IS THE CLOUD ENUM, NOT THE ENV NAME, AND THAT IS THE WHOLE
  // POINT. An env-keyed override already exists twice over
  // (`Wave.env_override`, `Wave.parameter_override`) and it is the WRONG axis
  // for this: a personal AWS env, a production AWS env and a customer's own
  // AWS account are three env symbols and ONE answer to "which image". Keying
  // by env would make the author restate the same fact once per environment,
  // and the first environment somebody forgot would silently take the GCP
  // image on AWS: a deploy that converges and then fails at the first invoke.
  //
  // ⛔ AND IT IS NOT A NEW SELECTOR. `Cloud` (environment.proto) is the axis
  // the deploy tool already selects on: per-cloud behaviour is derived off
  // `binding.cloud`, and the composer already TAKES `cloud: Int` and gates
  // grant nodes on it. This field puts the SAME key in the authoring tier. Do
  // not propose a second axis (`deploy_provider` is not one).
  //
  // ⚠ `cloud` IS AN `int32` MIRRORING `komira.deploy.v1.Cloud`'s ORDINAL
  // CONTRACT (1=GCP, 2=AWS, 3=AZURE, 4=KUBERNETES, 5=LOCAL), the identical
  // treatment `Environment.deploy_provider` and `Environment.tenancy` take, and
  // for the identical reason stated in environment.proto's header: the two
  // protos are separate import roots and naming the enum would force a package
  // change that ripples every importer. The composer already mirrors
  // CLOUD_GCP/CLOUD_AWS as constants and is drift-guarded; this reuses that
  // mirror rather than adding a third.
  //
  // ⛔ 0 (CLOUD_UNSPECIFIED) IS A REFUSAL, NEVER A WILDCARD AND NEVER A DEFAULT
  // ARM. A variant that names no cloud can be selected by no deploy, so it
  // would be authored and ignored. It is refused AT COMPOSE, by name. So is a
  // second variant naming a cloud some earlier variant already named: two
  // answers to one question is not a tie-break, and taking the first would
  // make the authored order load-bearing for something the author never said
  // was ordered.
  //
  // ★ THE SAFETY PROPERTY, WHICH IS WHAT MAKES THIS SAFE ON A LIVE FLEET.
  // EMPTY (the default) ⇒ NO variant is selected ⇒ the spec-level declaration
  // stands ⇒ the composed manifest is BYTE-IDENTICAL, including its content
  // address. This is the same discipline `Wave.env_override` and
  // `Wave.parameter_override` state. A selected variant likewise overlays ONLY
  // the sub-fields it AUTHORS: an absent `image` inside a matched variant
  // leaves `spec.image` alone.
  //
  // ⛔ WHAT THIS FIELD DELIBERATELY DOES **NOT** CARRY: `region`. Read this
  // before adding it. Region is the PLACEMENT axis, not the cloud axis: there
  // are many regions per cloud, so `region` inside a per-cloud variant could
  // express only ONE region per cloud, while an app must be able to author
  // every region it deploys to. Placement is already carried by the env
  // binding and by `AppSpec.region` (whose override also moves the
  // artifact-registry grant region, a coupling a second placement home would
  // duplicate rather than fix). On-prem has no region at all and uses the
  // CUSTOMER-SUPPLIED NAME in the same field; that is one mechanism with two
  // authors, not two mechanisms.
  repeated CloudVariant cloud_variants = 36;
  // ─── ★ THE SERVICE NAME IS A FUNCTION OF THE DEPLOY TARGET, NOT A FIELD OF
  //     THE BUNDLE ────────────────────────────────────────────────────────────
  //
  // A bundle should be as cloud-agnostic as possible: a service is named
  // `worker`, not `worker-aws`.
  //
  // ⛔ THE PROBLEM. `AppBundle.name` is ONE authored string used VERBATIM as
  // five things: the Cloud Run service name, the service-registry key (the key
  // IS the name), the `service_ref` peer token, the compose graph's node ids
  // (`<name>-svc`), and the string `regional_service_name_region` decodes a
  // REGION out of at dispatch and at `roles/run.invoker` grant time. Because it
  // is authored ONCE per bundle, a bundle can carry exactly ONE
  // region-qualified name, so a second (cloud, region) would have to be a
  // SECOND BUNDLE, a fork of one service's declaration.
  //
  // ⚠ AND THE OBVIOUS FIX IS THE WRONG ONE. STRIPPING the region out of the
  // name is not a simplification: `regional_service_name_region` would then
  // return "" for every fleet member, the dispatcher's routing axis loses its
  // home region, and the invoker grant loses the region it binds in. Cloud Run
  // IAM is per-service PER REGION, so that is a 403 on every cross-region
  // dispatch behind a GREEN deploy. The name must still CARRY the target; it
  // must stop being AUTHORED with it.
  //
  // ★ WHAT THIS FIELD DOES. `NAME_SCOPE_REGIONAL` says: the authored `name` is
  // a BASE name, and this service's real name is
  // `regional_service_name(base, target.cloud, target.region)`, composed at
  // COMPOSE time from the target the deploy resolved, never typed by an author.
  // One bundle named `worker`, two waves, two derived names
  // (`worker-gcp-europe-west1`, `worker-aws-eu-west-1`), no second
  // bundle, no second key format, and NO change to any decoder.
  //
  // ⚠ IT REFUSES RATHER THAN DEGRADES, AND THAT IS THE WHOLE SAFETY ARGUMENT.
  // A REGIONAL scope composed with an EMPTY region RAISES. It may NOT fall back
  // to the bare base name: a bare `worker` can be a name that is already
  // live in the project (for example a service from an earlier naming scheme).
  // A silent fallback would compose that exact string, collide with its
  // registry row (which is keyed on PROJECT ALONE, so region does not
  // disambiguate it), and repoint a live service with no signal anywhere.
  //
  // UNSPECIFIED (the default) ⇒ the authored `name` IS the service name,
  // byte-identically. An enum's zero value writes NOTHING on the wire, so a
  // bundle that omits it re-emits identically and its composed manifest's
  // content address is unmoved.
  //
  // Field numbers in this message are allocated in order and never reused: two
  // fields with one number is the one proto defect that is silent on the wire
  // in exactly the direction that hurts (a `NameScope` ordinal read back as a
  // `CloudVariant`).
  NameScope name_scope = 37;

  // ─── ★ THE APP'S OWN COMPUTE ALLOCATION ───────────────────────────────────
  //
  // ⛔ WITHOUT THESE A SERVED APP CANNOT BE BILLED AT ALL. Billable CPU is a
  // usage INTERVAL multiplied by an ALLOCATION, and the only other cpu/memory
  // on this message are `supervisor_cpu` (11) / `supervisor_memory` (12),
  // which are the SIDECAR's, while `compute` (5) is a `ComputeIntent` ENUM (a
  // shape selector, serverless|serverful, not a quantity). So the app DECLARES
  // its allocation here; it does not inherit one from the compute shape, and
  // nothing downstream invents one.
  //
  // ⛔ THE SAME `string` VOCABULARY AS `Job.cpu` / `Job.memory` AND
  // `ContainerSpec.cpu` / `.memory`: KUBERNETES QUANTITIES ("1000m", "0.5",
  // "2" / "512Mi", "1Gi"). Deliberately NOT a millicore int: the value hands
  // straight through to the billing resource record with no conversion, so
  // there is no second unit system and no second parser to disagree with the
  // one Kubernetes-quantity reader.
  //
  // ⛔ proto3-`optional`, AND THAT IS THE WHOLE ABSENT-vs-EMPTY SEAM, NOT A
  // STYLE CHOICE. The billing record's cpu is NULLABLE precisely because "" is
  // a value a bill will happily carry and NULL is not. A plain `string` here
  // would spell "the bundle said nothing" and "the bundle authored an empty
  // quantity" with the SAME BYTES, and compose could then not refuse the
  // second one. With presence: an OMITTED field composes an UNSET node field
  // (carried absent, never defaulted; the read refuses it loudly at billing
  // time), and an authored `cpu: ""` is REFUSED BY NAME at compose, where the
  // fault is still attributable to the bundle that caused it.
  //
  // ⛔ AND NEVER DEFAULTED, ANYWHERE. A fabricated "0m"/"" is an un-billed
  // customer and is byte-identical to an idle one.
  optional string cpu = 38;
  optional string memory = 39;

  // ─── ★★ THE APP'S HEALTHCHECK ENDPOINT ────────────────────────────────────
  //
  // An app defines a healthcheck endpoint; the job manager polls it until the
  // app is up and only then marks the resource ACTIVE.
  //
  // ⛔ WITHOUT THIS, `ACTIVE` MEANS "THE CLOUD ACCEPTED OUR CREATE". A Cloud Run
  // service HAS a URL, and enumerates, the instant the service resource
  // exists: before the revision is READY and before the container has opened a
  // socket. A registry that moves a row PROVISIONING -> ACTIVE on that evidence
  // tells every reader of the status column "the app is serving" about a
  // service that might be answering 503. This field is the app STATING what
  // the job manager should ask it, so ACTIVE can mean what everyone believes
  // it does.
  //
  // ⛔ IT IS **NOT** `supervisor_child_health_path` (9), AND THE DISTINCTION IS
  // NOT PEDANTRY. That field is SUPERVISOR -> CHILD, *inside* the container,
  // over loopback, by a sidecar that is already running; it answers "is the
  // process I launched still alive". This one is JOB MANAGER -> APP, from
  // OUTSIDE, across the ingress, before anything has been confirmed running;
  // it answers "can the world reach this app and does it say it is ready".
  // They differ in DIRECTION, in ALTITUDE, in what a failure means and in who
  // acts on it. Overloading one spelling onto both altitudes would make the
  // identical spelling a coincidence of English rather than a shared
  // vocabulary. An app may legitimately state both, the same string or two
  // different ones, and neither implies the other.
  //
  // ⚠ NOR IS IT `DEPLOY_STARTUP_PROBE_PATH`, the env var a bundle may author in
  // `spec.env`. That string is an instruction to the APPLIER: it renders GCP's
  // own startup probe, which Cloud Run evaluates INSIDE the revision to decide
  // whether to send it traffic. It is consumed and stripped at apply time and
  // NOTHING in the job manager can read it. Same conceptual quantity,
  // different consumer, different substrate, and only one of the two is a
  // first-class declaration the control plane can act on.
  //
  // ⛔ proto3-`optional`, WHICH IS THE WHOLE NO-HEALTHCHECK POLICY. Three states
  // stay distinct end to end: OMITTED -> the app declares no healthcheck and
  // its resource is `NOT_GATED` (adopted on cloud existence, byte-identically
  // to a deploy without this field; a gate that reds every existing app is an
  // outage, not a gate); an authored `""` -> REFUSED BY NAME at compose,
  // because "the bundle said nothing" and "the bundle asked us to probe the
  // empty path" are different statements and a plain `string` would spell them
  // with the SAME BYTES; a value -> carried verbatim and probed.
  // ⛔ AND NEVER DEFAULTED TO `/healthz`. A fabricated path produces exactly
  // one of the two give-up verdicts, `GAVE_UP_NEVER_ANSWERED` ("we got no
  // answer"), for an app that never asked to be probed there; a hardcoded
  // `/healthz` fails closed for every app that serves its health elsewhere.
  //
  // The value is a PATH, absolute, e.g. `/healthz`. The job manager joins it to
  // the resource's own served endpoint; the app never states a host, because
  // the host is the deployment's, not the bundle's.
  optional string health_check_path = 40;
}

// ─── ONE PER-CLOUD VARIANT OF A SERVICE'S SPEC ──────────────────────────────
//
// The sub-spec selected when `AppSpec.cloud_variants` holds an entry whose
// `cloud` equals the deploy target's cloud posture. Each member is OPTIONAL
// inside the variant: an absent member leaves the spec-level value in place,
// so a variant that names only an image changes only the image.
//
// ⚠ THE MEMBER SET IS DELIBERATELY SMALL, AND ADDING TO IT IS A DESIGN
// DECISION, NOT A CONVENIENCE. Every member here is a field whose CORRECT
// VALUE IS A FUNCTION OF THE CLOUD AND OF NOTHING ELSE. A field whose value
// varies by ENVIRONMENT belongs in `Wave.env_override` /
// `Wave.parameter_override`; a field whose value varies by PLACEMENT belongs
// on the placement axis. A member that is a function of both is a sign the
// field itself is wrongly shaped.
message CloudVariant {
  // WHICH cloud posture this variant answers for. Mirrors the
  // `komira.deploy.v1.Cloud` ORDINAL CONTRACT: 1=GCP, 2=AWS, 3=AZURE,
  // 4=KUBERNETES (on-prem), 5=LOCAL. 0 (UNSPECIFIED) is REFUSED at compose:
  // never a wildcard, never a default arm.
  int32 cloud = 1;
  // THE CONTAINER IMAGE for this cloud. The motivating member: a Lambda image
  // and a Cloud Run image are different artifacts from different build rules,
  // and no amount of per-env config makes one into the other. A `from_build`
  // ref names a `build {}` target of the SAME bundle, so both images are
  // declared in one file and neither is invisible to the other.
  // ABSENT ⇒ the spec-level `image` stands.
  ImageRef image = 2;
  // THE EDGE REALIZATION INPUTS for this cloud. `IngressSpec` carries a
  // `gateway_service_account` and a `gateway_region`, whose correct values are
  // cloud-shaped. ABSENT ⇒ the spec-level `ingress` stands (which, for a
  // bundle that authors none, is itself absent).
  IngressSpec ingress = 3;
  // THE COLLECTION SHAPES this app's datastore holds on this cloud. Present
  // because a Firestore collection and a DynamoDB table are not the same shape
  // and `RESOURCE_KIND_DATASTORE`'s AWS arm reads these to decide a table.
  // EMPTY ⇒ the spec-level `datastore_collections` stands. ⚠ It REPLACES
  // rather than appends: a merge would make the spec-level list mean something
  // different depending on which cloud read it, and there is no correct order
  // for a merged list.
  repeated DatastoreCollection datastore_collections = 4;
}

// ─── THE MAIL-TRANSPORT AUTHORING TIER ──────────────────────────────────────
//
// ⛔ NEUTRAL BY CONSTRUCTION: NO VENDOR NAME APPEARS HERE. "SES", "SQS" and
// "Route53" are the AWS arm's RENDERING of these three sentences, stated in
// the AWS manifest mapper and nowhere else.

// WHO OWNS a mail domain identity: the ONE axis where the schema may not pick
// a default, because both answers are destructive in opposite directions.
//
// ⛔ THE HAZARD. When customers share one mail relay, a domain identity is
// either one WE minted or one somebody else verified out of band. Deleting an
// identity a third party verified stops THEIR mail, and against AWS that
// delete call simply SUCCEEDS. Refusing to send from a domain we do own stops
// OURS. There is no safe value to guess, so UNSPECIFIED is REFUSED at compose
// rather than defaulted (`full_manifest.proto`'s mail-domain-identity node
// states the same rule for the node's `Retention`, which this enum is the
// authoring tier's statement of).
enum MailIdentityOwnership {
  // Unstated. REFUSED at compose time, by name. Never silently coerced.
  MAIL_IDENTITY_OWNERSHIP_UNSPECIFIED = 0;
  // OURS end to end: create, converge, delete. -> RETENTION_DELETE.
  MAIL_IDENTITY_OWNERSHIP_OURS = 1;
  // Somebody ELSE verified it. Adopt and observe; create/update/delete all
  // REFUSE. -> RETENTION_RETAIN_KEEP.
  MAIL_IDENTITY_OWNERSHIP_EXTERNAL = 2;
}

// ONE DNS record that proves, routes or scopes a mail domain.
//
// ⚠ EVERY VALUE IS LITERAL. The AWS arm REFUSES a `${project}` or `${region}`
// token in any name it renders, so a record authored with one is a refusal and
// not an interpolation. That is the point: a DNS record whose name was
// half-substituted publishes cleanly and resolves to nothing.
//
// ⚠ NO TTL FIELD AND NO ZONE FIELD. `full_manifest.proto`'s `DnsRecordSpec`, the
// resolved tier this composes into, carries neither, and inventing them here
// would put a value in the manifest the resolved tier has nowhere to hold. The
// zone is RESOLVED from the record name against the account by the conformer;
// the TTL is the conformer's stated default.
message MailTransportDnsRecord {
  // The fully-qualified record name (e.g. "example.com",
  // "mail._domainkey.example.com").
  string record_name = 1;
  // The record type. The AWS conformer supports a stated set and REFUSES
  // anything else BY NAME: an unrecognised type would be value-compared by a
  // rule nobody chose for it, which is how a record reports converged holding
  // the wrong value.
  string record_type = 2;
  // The record target / value.
  string target = 3;
}

// The mail-transport spine of ONE app: a domain identity, an inbound queue, and
// the DNS records that prove the domain.
message MailTransportSpec {
  // The mail domain (e.g. "example.com"). It IS the MAIL_DOMAIN_IDENTITY
  // node's `logical_id`: that kind carries its entire identity in the name and
  // adds no oneof arm (the `RESOURCE_KIND_PROJECT_SERVICE` shape).
  //
  // ⛔ A MAILBOX IS NOT A DOMAIN. `postmaster@example.com` verifies as an EMAIL
  // identity, not a domain identity: a different resource, different
  // verification, different blast radius. The composer REFUSES an `@` rather
  // than stripping it.
  string domain = 1;
  // WHO OWNS the identity. REQUIRED: see `MailIdentityOwnership`.
  MailIdentityOwnership identity_ownership = 2;
  // The queue accepted inbound mail lands in. EMPTY ⇒ no QUEUE node is composed
  // (a send-only domain is a legitimate authoring; it just receives nothing).
  //
  // ⚠ THE NAME IS LOAD-BEARING AND IT ADOPTS. The AWS arm derives the
  // dead-letter companion as `<name>-dlq` and refuses a name that already ends
  // in `-dlq` (that would be a queue with a queue). A one-token divergence from
  // the live queue's name produces a clean plan, a clean apply, and a SECOND
  // queue nothing consumes.
  string inbound_queue = 3;
  // The logical id of the QUEUE node, so a manifest-driven apply lands on the
  // SAME node key a hand-composed spine uses and ADOPTS the live queue instead
  // of standing a second one beside it. EMPTY ⇒ derive `<inbound_queue>-queue`.
  string inbound_queue_logical_id = 4;
  // The DNS records that prove / route this domain. EMPTY ⇒ none composed.
  repeated MailTransportDnsRecord dns_records = 5;
}

// ─── THE DATASTORE-COLLECTION AUTHORING TIER ────────────────────────────────
//
// ⛔ NEUTRAL BY CONSTRUCTION: NO VENDOR NAME APPEARS HERE, AND NO VENDOR
// ALPHABET EITHER. "DynamoDB", "Firestore", "table", "GSI" and the `S`/`N`/`B`
// attribute letters are each arm's RENDERING of these two messages, stated in
// the AWS manifest mapper / the GCP bridge and nowhere else.
//
// ⚠ THESE ARE THE AUTHORING TWINS OF `full_manifest.proto`'s
// `DatastoreCollectionSpec` / `DatastoreAccessPath`, and they are SEPARATE
// MESSAGES for the reason every other tier-1/tier-2 pair is (`BucketSpec` /
// `ResolvedBucketSpec`, `JobSpec` / `RunToCompletionJobSpec`): the authored
// intent tier may not import the resolved manifest tier, or the two-tier model
// has one tier. The composer has ONE translation between them, and it is a
// total field-for-field copy, so a field added to one and not the other is a
// compile error at that function rather than a silent drop.

// ONE ACCESS PATH OVER A COLLECTION, AS AUTHORED.
//
// The PRIMARY one is how a row is IDENTIFIED; a SECONDARY one is an additional
// query shape the collection must answer. Both are the same message because on
// both clouds they are the same concept materialized twice (a table key and a
// secondary index; a document path and a composite index).
//
// ⛔ NOTHING HERE IS DEFAULTED AND EVERY HALF-AUTHORED PAIR IS REFUSED. On the
// arm where these values become an IMMUTABLE key schema, a dropped or invented
// half produces a DIFFERENT and PERMANENT collection, so that arm's
// access-path check refuses a missing partition field, a missing partition
// type, an ordered TYPE with no NAME and an ordered NAME with no TYPE, each by
// name.
message DatastoreAccessPath {
  // The path's name. EMPTY for the primary path (it has no name of its own on
  // either cloud); REQUIRED for a secondary one, where it is the index name.
  string name = 1;

  // The field this collection is PARTITIONED by: the equality half of the
  // query. REQUIRED.
  string partition_field = 2;

  // Its type, as a NEUTRAL token: `string` / `number` / `bytes`.
  //
  // ⛔ DO NOT AUTHOR `S` / `N` / `B`. Those are one vendor's own attribute
  // letters; this value is read by every arm, and each arm maps the neutral
  // token into its own vocabulary and RAISES on anything else rather than
  // defaulting to a string key. REQUIRED: a collection keyed `seq(string)` and
  // one keyed `seq(number)` accept different items, reject each other's, and
  // neither can become the other.
  string partition_field_type = 3;

  // The field rows are ORDERED by within a partition: the range half. EMPTY
  // when this path has none (one row per partition value).
  string ordered_field = 4;

  // Its type, same vocabulary. Must be EMPTY when `ordered_field` is empty and
  // NON-EMPTY when it is not: a half-authored pair is refused rather than
  // resolved by dropping the half that was written, because either half
  // dropped produces a different and permanent collection.
  string ordered_field_type = 5;
}

// ONE KEYED COLLECTION INSIDE THIS APP'S DATASTORE, AS AUTHORED.
message DatastoreCollection {
  // The collection's name. It is carried VERBATIM and never derived: on one
  // cloud it is the collection-group id, on another it is the TABLE NAME, and a
  // table name is unique per account+region, so a derived one silently ADOPTS
  // or COLLIDES with whatever already holds it. REQUIRED.
  string name = 1;

  // How this collection is ADDRESSED. REQUIRED for a materialization: a
  // collection with no primary access path is a table with no key, which is not
  // a thing that can exist.
  DatastoreAccessPath primary_access_path = 2;

  // Additional query shapes this collection must answer. EMPTY is the ordinary
  // case and creates nothing.
  //
  // ⚠ THE AWS ARM REFUSES A NON-EMPTY LIST, BY NAME, AND THAT REFUSAL IS THE
  // HONEST STATE: its resolved table spec carries no index list, so a spec
  // derived while ignoring these would create a table that applies green,
  // reports converged forever, and answers the app's index query with a
  // ValidationException at its FIRST request. Authoring one here is therefore
  // legal and refuses at map time until the wiring exists, which is the point
  // of a stated refusal over a silent drop.
  repeated DatastoreAccessPath secondary_access_paths = 3;

  // The field whose value is the row's expiry instant, or EMPTY for "this
  // collection makes NO expiry claim". ⚠ EMPTY IS NOT "no expiry": it is "not
  // stated", so an arm stamps nothing rather than turning expiry OFF on a live
  // collection that has it.
  string expiry_field = 4;

  // true: this collection is owned OUTSIDE this graph: ADOPT it, never create
  // it. The materializing node becomes a probe: it agrees with the live shape
  // or REFUSES, and its create/update/delete all raise.
  //
  // ⛔ THIS IS THE ONLY SAFE WAY TO AUTHOR A COLLECTION THAT ALREADY EXISTS. An
  // adopt path that silently RECREATES is the same data-loss defect as a key
  // change wearing a different hat: the name is taken over, the items are gone,
  // and every reader gets an empty registry that answers successfully.
  bool referenced = 5;
}

// ─── THE INGRESS REALIZATION INPUTS ─────────────────────────────────────────
//
// The values the ingress conformer takes that the rest of the intent tier does
// not state. The conformer (in `komira_gcp_bridge`) is constructed with
// `(backend_project, backend_region, backend_name, edge_auth, allowed_sources,
// gateway_sa, route_path, gateway_region, secured_routes)`: the first three
// are DERIVED from the service, `edge_auth`/`route_path`/`secured_routes` are
// authored on `AppSpec`, and the remaining three (`gateway_sa`,
// `gateway_region`, `allowed_sources`) are authored here. The fourth field
// here (`enable_required_services`) is the API-enablement leg an ingress needs.
//
// Vendor-neutral: not one vendor product name appears here. "Gateway" is the
// neutral role the edge realization plays; which product implements it is the
// conformer's business, and on a direct/on-prem target there is no gateway at
// all and every field below is inert.

// ─── ★★ WHO IS ALLOWED THROUGH THIS APP'S FRONT DOOR ────────────────────────
//
// Internal services must be callable only by each other.
//
// THE ONE FIELD THAT SEPARATES A CUSTOMER-FACING APP FROM A CONTROL-PLANE PEER.
// Without it, every composed client edge is `CLIENT_PASSTHROUGH`, a pure
// public->private bridge, so a public API (which WANTS the internet) and an
// internal pipeline service (which must never see it) would compose
// BYTE-IDENTICAL edges. The only thing keeping the second private would be
// that no edge was composed for it at all, i.e. an absence. Once every
// serverless application gets a gateway endpoint as an OUTPUT, that absence is
// gone, so the question "may the internet call this?" has to be ANSWERED
// rather than left unasked.
//
// ⛔ GETTING THIS WRONG PUTS THE CONTROL PLANE ON THE INTERNET. A peer service
// marked PUBLIC is an unauthenticated `/**` catch-all in front of the process
// that deploys customer applications. That is why the value is stated per app
// rather than derived from a name, a directory or a tenancy: a derivation is a
// guess about intent, and this one has no safe default to guess.
//
// ⚠ AND UNSPECIFIED IS NOT "INTERNAL". Proto3 cannot distinguish unset from
// zero, so 0 means "this bundle has not answered", and the composer's reading
// of it is the PRE-EXISTING BEHAVIOUR (a pass-through edge), because changing
// what every existing bundle composes on a field they do not set is how a
// silent cutover happens.
//
// ⛔ SO THE UNANSWERED SET IS A REAL RESIDUAL. A bundle that answers nothing
// composes a PUBLIC pass-through: correct for a customer-facing app and
// unexamined for anything else. A census of unanswered bundles is the way to
// close it.
enum EdgeCallerClass {
  // Proto3 zero default: the bundle has NOT answered. Composes exactly what it
  // would without this field (a `CLIENT_PASSTHROUGH` client edge).
  EDGE_CALLER_CLASS_UNSPECIFIED = 0;
  // ★ CUSTOMER-FACING. Anyone on the internet may reach this edge; the APP is
  // the sole authorizer (its own request middleware verifying the forwarded
  // Authorization). A DELIBERATE public surface: authoring it explicitly is
  // what makes the peer services' silence visible.
  EDGE_CALLER_CLASS_PUBLIC = 1;
  // ★ PEER-ONLY. The edge REFUSES a request that does not carry a valid control
  // plane identity token: it renders `EDGE_AUTH_MODE_IDENTITY_JWT`, whose
  // `x-google-issuer` is the control plane and whose `x-google-audiences` is
  // this app's own audience. An unauthenticated request is rejected AT THE EDGE
  // and never reaches the container.
  //
  // ⚠ THIS IS AUTHENTICATION, NOT REACHABILITY. `allowed_sources` narrows WHO
  // CAN CONNECT and decides nothing about who is authorized; this decides
  // whether the caller proved who they are. The two are stated separately
  // because a route with a source list and no policy is an UNAUTHENTICATED route
  // with a filter in front of it.
  //
  // ⛔⛔ "REJECTED AT THE EDGE" IS TRUE ONLY OF REQUESTS THAT GO THROUGH THE
  // EDGE. The composed gateway publishes the backend's OWN Cloud Run URL as its
  // `x-google-backend: address`; if that service also authors
  // `public_invoker: true`, the address the edge names is bound to the IAM
  // member `allUsers` and answers anyone directly. The two fields compose to a
  // contradiction, so the composer REFUSES the combination outright rather
  // than leaving it to a reader to notice.
  EDGE_CALLER_CLASS_PEER_INTERNAL = 2;
}

message IngressSpec {
  // ★ THE GATEWAY'S BACKEND-AUTH SERVICE ACCOUNT, AND THE SCOPED INVOKER
  // MEMBER. ONE FIELD, BOTH HALVES, FOR THE SAME REASON `SecuredInboundRoute.
  // sa_email` IS ONE FIELD.
  //
  // This is BOTH the identity the edge impersonates to mint the backend-hop
  // OIDC token (the ApiConfig's backend-auth service account) AND the member
  // that receives the SCOPED `run.invoker` binding on the backend's OWN service
  // resource. Two fields could name two different accounts, producing an edge
  // that mints as A while B is authorized: a 403 at the backend that reads
  // exactly like a missing IAM binding, and which no offline check can catch
  // because both strings are individually well-formed.
  //
  // ⛔ NEVER `allUsers`. The org policy `iam.allowedPolicyMemberDomains` rejects
  // it, and admitting it would make the backend itself public, the precise
  // condition this whole ingress shape exists to route around. `validate`
  // refuses the literal.
  //
  // EMPTY (the default) ⇒ the project-global gateway service account the
  // composer self-provisions. NON-EMPTY ⇒ this service account is used
  // instead (for example the customer project's own deploy service account,
  // which removes the need for a cross-project `iam.serviceAccountUser` actAs
  // on a shared account). A NAME (a service account email), never a
  // credential.
  string gateway_service_account = 1;
  // ★ THE REGION THE EDGE OBJECT IS PLACED IN, DECOUPLED FROM THE BACKEND'S,
  // AND THAT DECOUPLING IS LOAD-BEARING, NOT A PREFERENCE. The managed-gateway
  // product is not offered in every serverless-compute region, so placing the
  // edge in the backend's region can be a deploy that fails at edge-create and
  // can NEVER succeed there. The edge routes CROSS-REGION to the backend by its
  // full HTTPS url (an edge in one region can front a backend in another).
  //
  // EMPTY (the default) ⇒ the conformer's OWN placement policy
  // (`resolve_api_gateway_region(backend_region)`): the backend's region when
  // the edge product serves it, a supported region otherwise. That policy stays
  // the default precisely because it is a POLICY: a bundle should not have to
  // know the product's region list to get a working front door. This field is
  // the OVERRIDE for the case where an operator must pin the placement.
  string gateway_region = 2;
  // The inbound SOURCE ALLOW-LIST: CIDRs and/or sender ids the edge admits.
  // Stamped by the conformer as a marker on the served document. EMPTY (the
  // default) ⇒ no allow-list.
  //
  // ⚠ THIS IS NOT AUTHENTICATION AND MUST NOT BE READ AS ANY. A source list is
  // a reachability narrowing; the thing that decides whether a caller is
  // authorized is `inbound` / `secured_inbound_routes`. A route with an
  // allow-list and no policy is an UNAUTHENTICATED route with a firewall in
  // front of it, and the failure mode of confusing the two is a route that
  // reads as secured because it has a list on it.
  repeated string allowed_sources = 3;
  // Whether the DEPLOY GRAPH turns on the platform services its own ingress
  // realization requires (one `RESOURCE_KIND_PROJECT_SERVICE` node per required
  // service, ordered BEFORE the edge node), instead of assuming them as a
  // bootstrap prerequisite.
  //
  // FALSE (the default) ⇒ no enable node is composed: the services are a
  // bootstrap prerequisite, and a deploy into a project that lacks them fails
  // at edge-create with a 403 that names an API. TRUE ⇒ the graph enables them,
  // which is what makes a deploy work in a fresh customer project.
  //
  // ⚠ WHICH services are required is the CONFORMER's knowledge, never authored
  // here: there is deliberately no `repeated string services` field, because a
  // hand-listed set drifts from what the impl actually calls and the symptom of
  // the drift is a 403 on the one API somebody forgot. The bool asks the
  // question; the conformer answers it.
  bool enable_required_services = 4;

  // ★ WHO MAY CALL THIS APP'S EDGE (see `EdgeCallerClass` above). UNSPECIFIED
  // (the default) ⇒ byte-identical composition to a bundle without this field.
  //
  // ⛔ LEGAL ONLY ON `inbound: INBOUND_NEED_CLIENT`. The webhook arm of the
  // API-edge composer composes `EDGE_AUTH_MODE_WEBHOOK_SECRET` unconditionally
  // and reads neither this field nor `peer_identity_audience`, so authoring
  // PEER_INTERNAL on a WEBHOOK service would silently compose an
  // unauthenticated pass-through edge, on exactly the kind of app the internet
  // POSTs to. It is a REFUSAL rather than a discard.
  EdgeCallerClass caller_class = 5;

  // ★ THE `aud` A PEER'S IDENTITY TOKEN MUST CARRY: this app's own containment
  // fence, and REQUIRED under `EDGE_CALLER_CLASS_PEER_INTERNAL` (the composer
  // refuses an empty one rather than render an empty `x-google-audiences`,
  // which does not mean "the default audience": it means the edge stops
  // checking `aud`, and that fails OPEN).
  //
  // ⚠ SINGULAR, deliberately, and for the reason `ApiEdgeSpec.identity_audience`
  // gives at the resolved tier: one edge fronts one app, and a second accepted
  // audience is a second app's tokens being admitted here. A widening authored
  // "for compatibility" is exactly how a containment fence stops containing.
  //
  // ⚠ REFUSED under any other `caller_class`: a bundle carrying an audience no
  // mode reads is a bundle whose author believed the edge was checking
  // something. The composer errors rather than ignoring it.
  string peer_identity_audience = 6;
}

// ─── BundleIndexField / BundleIndex / BundleIndexTable LIVE IN
//     deploy_model.proto ──────────────────────────────────────────────────────
//
// This file `import`s deploy_model.proto, so every `AppSpec.index_tables`
// reference above resolves to them.
//
// WHY THERE: `DeploymentSpec` (deploy_model.proto) must carry the same shapes,
// because a pipeline deploy engine that deploys a managed app into a CUSTOMER
// project reads a `DeploymentSpec` and never sees an `AppBundle`. Import
// direction settles which file: app_bundle.proto imports deploy_model.proto
// (never the reverse: that is a cycle), so the shapes live in the imported
// file rather than being duplicated up into this one.
//
// ⛔ NOT COPIED. Two proto messages of the same shape are two schemas, and a
// boundary with two spellings is a defect.

// ─── The EDGE-AUTH POLICY guarding ONE SecuredInboundRoute ───────────────────
//
// AGNOSTIC: it names WHAT the edge enforces, never how a cloud realizes it.
// The GCP conformer's OpenAPI render translates it into an API-Gateway
// `securityDefinitions` block; AWS API Gateway / Azure APIM would translate the
// same value into their own idiom.
//
// ⛔ THERE IS DELIBERATELY NO "NONE" VALUE. A secured route whose policy is
// UNSPECIFIED is REFUSED at validate, never defaulted to something permissive:
// the zero value of the field that decides whether a route is authenticated
// must be a REFUSAL, because the failure mode of the other choice is a public
// route that reads as configured.
enum EdgeAuthPolicyKind {
  // Proto3 zero default. Fail-fast invalid: see above.
  EDGE_AUTH_POLICY_KIND_UNSPECIFIED = 0;
  // The FEDERATED-CALLER policy. The caller presents a SELF-SIGNED
  // service-account JWT (IAM Credentials `signJwt`) and the edge validates it
  // against THAT SERVICE ACCOUNT'S OWN published key set. That pins WHICH
  // PRINCIPAL called, which an audience alone cannot do: for a Google-ISSUED
  // id-token every Google identity shares the issuer and the key set, so the
  // audience is the only discriminator left and it names the CALLEE.
  EDGE_AUTH_POLICY_KIND_FEDERATED_SA_JWT = 1;
}

// ─── ONE additional, EDGE-SECURED inbound route ──────────────────────────────
//
// A path plus the policy that guards it. The AUTHORING counterpart of the
// code-level `komira_gcp_bridge.SecuredRoute` + `EdgeAuthPolicy` pair; the
// resolved-tier mirror is `SecuredEdgeRoute` in full_manifest.proto.
message SecuredInboundRoute {
  // The route path the edge serves and secures (e.g. "/inbound").
  // REQUIRED, must start with "/", and must NOT equal `inbound_route_path`:
  // two `paths:` keys with one value means the LAST one wins silently in the
  // rendered OpenAPI document, so one of the two policies would vanish from the
  // served config with nothing to observe it.
  string route_path = 1;
  // The policy the EDGE enforces on this route. REQUIRED; UNSPECIFIED is
  // refused (see `EdgeAuthPolicyKind`).
  EdgeAuthPolicyKind policy = 2;
  // ★ THE CALLER'S SERVICE-ACCOUNT EMAIL: ONE FIELD, BOTH HALVES OF THE PIN.
  //
  // Under FEDERATED_SA_JWT this is BOTH the issuer the edge matches (`iss`) AND
  // the account whose published key set the edge fetches to check the
  // signature. It is ONE field precisely because two fields can name two
  // different accounts, and the resulting edge verifies signatures against
  // account A while its issuer claims to pin account B, which validates nothing
  // and reads as a correctly configured pin. The JWKS URL is DERIVED, never
  // authored; there is deliberately no field here to author it with.
  //
  // REQUIRED when `policy` is FEDERATED_SA_JWT; an empty one renders a security
  // definition no token can satisfy (every request 401s, which reads as a
  // broken deploy rather than as this).
  string sa_email = 3;

  // ★★ FIELD 4 WAS `repeated string audience`, AND IT IS GONE ON PURPOSE.
  // THERE IS NO WAY TO AUTHOR AN EDGE AUDIENCE.
  //
  // The value it had to hold is the ORIGIN of the address the caller POSTs to
  // (the caller takes scheme+authority of its ingest URL as `aud`), which is
  // this edge's OWN origin, and a gateway hostname is generated by the cloud at
  // Gateway CREATE, strictly AFTER the ApiConfig whose document carries the
  // value. So every authored audience was a GUESS at a string the cloud had not
  // chosen yet, and the guess could not be checked by anything offline: no
  // front door answers on it until the deploy that needs it has already run.
  //
  // AND THE GUESS FAILS CLOSED AND SILENT, which is the worst pair. The edge
  // answers 401 with an EMPTY BODY, the caller records a status code,
  // deliveries stop arriving, and nothing anywhere names the audience.
  //
  // THE REPLACEMENT IS NOT A DIFFERENT FIELD. The GCP conformer reads the LIVE
  // `Gateway.default_hostname` after create and binds the audience from it
  // (`EdgeAuthPolicy.bind_to_origin`), through the SAME `edge_origin_from_host`
  // that forms the published edge URL the registry hands the caller. One
  // observed hostname, one formatter, both consumers. Until that host is known
  // the secured route is NOT SERVED AT ALL (an undeclared path 404s): closed,
  // and closed for a reason the served document states in
  // `x-komira-secured-routes-pending`.
  //
  // A bundle that still spells `audience:` is REFUSED by the parser with that
  // explanation rather than ignored: an ignored field is how a value that means
  // nothing keeps looking like the thing in control.
  reserved 4;
  reserved "audience";
}

// ─── ONE verbatim url-map path rule (the full-route-table model) ─────────────
//
// A single LB path rule: a verbatim path list -> a self-derived backend (by
// role), plus an OPTIONAL per-rule custom-error 404 policy. Authored on both
// AppSpec (this proto) and WebFrontendSpec (full_manifest.proto): the two
// carry the SAME shape so the static-frontend composer projects one to the
// other. Vendor-neutral: only the ROLE token rides here, never a vendor
// backend name; the conformer self-derives the concrete backend from the slug.
message WebRouteRule {
  // The verbatim path list this rule matches (e.g. ["/app", "/app/*"] or the
  // exact ["/callback"]). NO uniform expansion:
  // authored exactly as the live url-map carries them (bare, wildcard, or
  // exact).
  repeated string paths = 1;
  // The backend ROLE the matched paths route to: one of the self-derived roles
  // the conformer resolves off `web_slug`, for example:
  //   "spa"  -> the SPA backend-BUCKET   (`<slug>-web-static-backend`)
  //   "api"  -> the api backend-SERVICE  (`<slug>-api-backend`)
  // FAIL-FAST on an unknown role (the conformer raises). Empty defaults to "api".
  string backend_role = 2;
  // OPTIONAL per-rule custom-error 404 policy path (e.g. "/docs/api/index.html").
  // When set, a 404 from the origin under these paths serves this object at the
  // `error_404_code` status (an honest 404: serve a docs index at a real 404,
  // never a home bounce). Empty = no per-rule policy.
  string error_404_path = 3;
  // The response code the per-rule 404 policy overrides to (e.g. 404 for an
  // honest 404). Only meaningful when `error_404_path` is set. 0 = no override.
  int32 error_404_code = 4;
  // ── The rule's ROUTING DISPOSITION (config-as-data, field 5) ───────────────
  // What the rule ASSERTS about `paths`. The zero value is ROUTE, so a rule
  // that omits it composes BYTE-IDENTICALLY (additive-safe).
  WebRouteDisposition disposition = 5;
  // WHY a DENY exists: the audit trail that travels WITH the containment.
  // REQUIRED (non-empty) when `disposition` is DENY; compose fails fast on an
  // unexplained deny, because a containment nobody can justify is a containment
  // the next engineer deletes. Ignored for other dispositions.
  string deny_reason = 6;
}

// ─── The ROUTING DISPOSITION of one WebRouteRule ─────────────────────────────
//
// The url-map route table is not just a list of positive routes: a front
// door's posture is (a) what IS routed, (b) what MUST NOT be routed, and (c)
// what the pathMatcher DEFAULT does with an unmatched request. All three are
// one authored table, so none of them needs an out-of-band reconcile script.
enum WebRouteDisposition {
  // ROUTE `paths` -> `backend_role`. The zero value: an un-annotated rule keeps
  // its plain meaning, so no existing bundle changes shape. (Elsewhere the
  // convention is UNSPECIFIED=0-is-invalid; here the zero value MUST be the
  // additive-safe identity or every existing rule would fail fast.)
  WEB_ROUTE_DISPOSITION_ROUTE = 0;

  // ⚠️ A ROUTE rule NEVER inherits the SPA deep-link error policy. The
  // 404->shell rewrite authored by the DEFAULT rule below is rendered SCOPED,
  // as the per-rule `customErrorResponsePolicy` of a `/*` SPA catch-all
  // pathRule, and NOT as `pathMatcher.defaultCustomErrorResponsePolicy`, which
  // every pathRule that states no policy of its own inherits. Without that
  // scoping an API ROUTE rule's honest 404 would come back to the client as
  // `200` + an HTML page. A ROUTE rule therefore carries a 404 policy only
  // when it AUTHORS one in `error_404_path`.
  //
  // NEGATIVE ROUTE: `paths` MUST NOT be routed to ANY backend. No pathRule is
  // emitted, so the paths fall through to the pathMatcher default (the SPA
  // bucket). `backend_role` is IGNORED (a deny names no backend).
  //
  // WHY THIS IS NOT THE SAME AS OMITTING THE RULE. Omission is the ABSENCE of
  // an instruction: it is indistinguishable from "nobody got round to adding
  // it", it enforces nothing, and it silently loses the reason. A DENY is a
  // POSITIVE instruction with three teeth:
  //   1. compose-time: authoring the same path in a ROUTE rule is a HARD ERROR
  //      naming `deny_reason`, so a re-open cannot pass review by accident;
  //   2. converge-time: the rendered url-map provably carries no pathRule for it;
  //   3. drift-time: a LIVE url-map that routes a denied path reads as DRIFTED,
  //      so the next apply REMOVES the route instead of leaving it standing.
  // The case it exists for: a backend whose auth is not fit for the public
  // domain (for example one that would answer a bogus bearer with real
  // records) must be provably unreachable through the front door.
  WEB_ROUTE_DISPOSITION_DENY = 1;

  // The pathMatcher DEFAULT: this rule configures the default arm, NOT a
  // pathRule. `paths` MUST be empty (fail-fast otherwise) and at most ONE rule
  // in a table may carry it. `backend_role` names the default service AND the
  // custom-error `errorService`; `error_404_path` + `error_404_code` author the
  // SPA deep-link fallback (`/index.html` @ 200) that a client-side-routed SPA
  // needs so a deep link is not served as a hard 404. Omitting the DEFAULT rule
  // (or its error_404_path) means NO fallback at all (which also avoids a CDN
  // caching a 200 shell for a path that does not exist).
  //
  // WHERE IT IS RENDERED (load-bearing): NOT into
  // `pathMatcher.defaultCustomErrorResponsePolicy`, which is inherited by every
  // pathRule and would rewrite API 404s into `200` + HTML. It is rendered as
  // the per-rule policy of a `/*` SPA catch-all pathRule pointed at
  // `backend_role`'s backend: scoped to the SPA, invisible to every api rule,
  // and still first in GCP's precedence for the paths it does match (URL path
  // > URL domain > LB). url-map matching is longest-prefix, so `/*` can never
  // shadow an authored rule.
  WEB_ROUTE_DISPOSITION_DEFAULT = 2;
}

// ─── A cheap HTTP health check ───────────────────────────────────────────────
message HttpCheck {
  // The GET path to probe (e.g. "/healthz").
  string path = 1;
  // The HTTP status that counts as healthy (e.g. 200).
  int32 expect_status = 2;
  // ─── ★ THE LATENCY ASSERTION ──────────────────────────────────────────────
  //
  // The wall-clock budget, in MILLISECONDS, for the probe's whole request:
  // dial through last byte of the response head. A response that arrives with
  // the expected status but LATER than this is a FAIL, and the failure text
  // carries BOTH numbers (measured and budget).
  //
  // ⛔ WHY IT EXISTS. A status-only check passes a service whose control route
  // (a path the deployment cannot serve, so its latency is pure request-path
  // cost with zero work in it) normally answers in milliseconds and has
  // started answering in twenty seconds, for example because a single-threaded
  // reactor is blocked and draining its backlog. Every status-only liveness
  // oracle reports such a service as healthy, including the deploy gate that
  // observed the slow response.
  //
  // ⇒ A STATUS-ONLY `http_check` IS A LIVENESS ORACLE, NEVER A PERFORMANCE
  // ONE. This field is the smallest thing that makes it able to be both.
  //
  // ── ZERO (the proto3 default) MEANS **NOT CHECKED**, AND THAT IS THE WHOLE
  //    BACKWARD-COMPATIBILITY CONTRACT ────────────────────────────────────────
  // An unauthored budget leaves the step status-only, no clock consulted for
  // the verdict. So a bundle that omits it is unaffected, and the emitter
  // re-emits it BYTE-IDENTICALLY (it writes this line only when the value is
  // non-zero).
  // ⛔ Do NOT give it a non-zero read-site default and do NOT make it
  // required: retrofitting a budget onto every authored `http_check` at once
  // means guessing a number per route with no measurement behind it, and a
  // guessed threshold that reds a healthy deploy is how a latency gate gets
  // deleted three days later.
  //
  // ── AUTHORING GUIDANCE (what a good number looks like) ────────────────────
  // Budget the ROUTE, not the service. The number must sit far above normal
  // variance and far below a stall: for the cheap liveness paths this field is
  // for (`/livez`, `/readyz`, `/healthz`, a control 404), normal latency is in
  // single-digit milliseconds, so a budget in the low SECONDS catches a genuine
  // multi-second stall while surviving a cold start, a TLS handshake and a
  // noisy operator link. A step whose route does real work wants its own,
  // larger, number, or none.
  //
  // ⚠ IT IS PER-ATTEMPT, AND THE GATE STILL RETRIES. A retrying gate re-arms
  // unconditionally, so one slow attempt inside it is not a red deploy; a
  // budget miss that PERSISTS across the gate's attempts is, which is exactly
  // the shape of a stalled service.
  //
  // ⚠ NEGATIVE IS REFUSED by `validate_bundle`, not silently floored to zero:
  // "not checked" already has a spelling (omit the field), so a negative value
  // is an authoring mistake and must be named as one.
  int32 max_latency_ms = 3;
}

// ─── Run an arbitrary container as a validate step ───────────────────────────
//
// The generic "third-party validation" form: run a named container against the
// deployed URL and gate on its exit code, with no new deploy-tool code (an
// external-container provider).
message RunContainer {
  // The image to run (a digest or a `from_build` reference to a test build
  // target).
  ImageRef image = 1;
  // What to gate promotion on (EXIT_CODE: the container's process exit code).
  GateOn gate_on = 2;
  // The env injected into the container, INCLUDING typed wave-output refs (e.g.
  // `TARGET_URL` <- `VALUE_FROM_DEPLOY_URL`).
  repeated BundleEnvVar env = 3;

  // ─── THE SECRETS THIS CONTAINER READS FOR ITSELF ──────────────────────────
  //
  // Secret Manager secret NAMES, in the CONTROL-PLANE project, that this step's
  // container fetches AT RUNTIME over its own `:access` call. Each one composes
  // ONE resource-scoped `roles/secretmanager.secretAccessor` grant for the
  // deploy identity an in-cloud validate JOB runs as.
  //
  // ⚠ THIS IS NOT A MOUNT, AND THE DISTINCTION IS THE WHOLE POINT. A `secret://`
  // env is resolved BY CLOUD RUN at placement and lands in the Job spec as a
  // `secretKeyRef`; that path does not exist for a validate step (the validate
  // driver passes a literal env value through VERBATIM, so `secret://…` would
  // reach the container as those exact bytes). A step whose validator
  // SELF-FETCHES has no such wire (the value never enters the Job spec at
  // all), so without this field there is NO way to say "this container needs
  // to read X", and therefore no way to compose the grant that lets it.
  //
  // ── WHAT IT CLOSES ───────────────────────────────────────────────────────
  // Without it, a validate step whose container reads its own secrets fails
  // with HTTP 403 on each read even though the secrets exist with an enabled
  // version: nothing granted the validate job's identity access. A prerequisite
  // stated only as prose in a bundle comment cannot converge; this field gives
  // it a wire, so the deploy makes the grant instead of documenting it.
  //
  // ── IT IS AN EXPLICIT DECLARATION WHERE A PROXY WAS USED ──────────────────
  // The composer separately grants the deploy identity the managed-app signing
  // seed off TWO PROXIES ("this env's wave has a runnable run_container step"
  // AND "some service self-provisions"). This field is the authored
  // declaration that a step needs a secret. The seed grant is deliberately
  // LEFT ALONE: re-deriving it from this field would silently drop the grant
  // from every bundle that has not yet been re-authored, a live 403 traded for
  // a tidier graph.
  //
  // EMPTY (the default) ⇒ NO grant node composed, byte-identical compose for a
  // bundle that omits it. A name is a bare secret id (e.g.
  // `example-oauth-client-secret`), never a `projects/…` path and never a
  // `secret://` URL: `validate_bundle` refuses both, because a grant target
  // that is not the secret's own name is a SetIamPolicy against a resource that
  // does not exist, which succeeds at compose and 404s at apply.
  repeated string reads_secret = 4;

  // ─── ★ THE ARGV THIS VALIDATOR'S ENTRYPOINT RECEIVES ──────────────────────
  //
  // A validate container takes the endpoint it is testing as a parameter,
  // ideally a command-line argument to its entrypoint, so it can test any
  // endpoint (which also lets the same test act as a canary).
  //
  // Rendered, IN AUTHORED ORDER, onto Cloud Run `Container.args` (the in-cloud
  // JOB) and onto the fork-exec child argv (the LOCAL subprocess arm) as
  // `--<flag>=<value>`. EMPTY ⇒ no `args` on the wire, so a bundle that omits
  // it re-emits and re-composes byte-identically.
  //
  // ⚠ IT IS `AppParameter`, THE SAME MESSAGE `AppSpec.parameters` USES, AND
  // THAT REUSE IS THE POINT. The managed-app parameters already have this
  // exact shape one layer up: typed declaration, generic carriage,
  // `--flag=value` render through ONE flag derivation, deploy-time refusal on
  // a missing required value. A second, differently-spelled argv convention
  // for validators would be the worst available outcome: two flag derivations
  // to keep equal, two refusal texts, two places for `required` to mean
  // something slightly different. So a validator arg IS a parameter, and
  // everything written about `AppParameter` applies verbatim, including `flag`
  // (empty ⇒ derived `name.lower()` with `_`->`-`), `description` (quoted
  // VERBATIM in the refusal an operator reads at 3am) and the `source` oneof.
  //
  // ── WHY `required` IS THE WHOLE FEATURE ────────────────────────────────────
  // `required: true` + nothing resolves ⇒ THE DEPLOY REFUSES, NAMING THE ARG,
  // before any cloud call. Otherwise an unset value renders as an EMPTY
  // STRING, the container starts, and the defect surfaces much later as an
  // error nobody can attribute (an empty allow-list that denies everything,
  // for example). An absent argv flag and an empty one are DIFFERENT STATES,
  // which is precisely what `getenv` cannot express and argv can.
  //
  // ── WHICH `source` ARMS MEAN SOMETHING ON A VALIDATE STEP ──────────────────
  //   `value`       a bundle literal (a path, a fixture id, a peer URL).
  //   `value_from`  VALUE_FROM_DEPLOY_URL / VALUE_FROM_EDGE_URL: the SELF wave
  //                 outputs. THIS is how a validator is handed "the endpoint it
  //                 is testing" without anyone hand-typing a hostname.
  //   `service_ref` a SIBLING service's endpoint. REFUSED, deliberately:
  //                 `ValueFrom` is SELF-scoped, so a `service_ref` resolves to
  //                 NOTHING at a validate step, and rendering it as an empty
  //                 flag is the exact silent-empty shape this field exists to
  //                 end. It is the named home for sibling-endpoint resolution
  //                 at a validate step once that exists.
  //   `secret_ref`  REFUSED: argv is world-readable (`/proc/self/cmdline`, mode
  //                 0444; every job describe; every deploy audit log). A
  //                 validator needing a secret declares it in `reads_secret`
  //                 and fetches it from the secret store.
  //   `marker`      REFUSED: the deploy-time producers are managed-app scoped.
  //
  // A validator needing SEVERAL endpoints declares SEVERAL entries: one per
  // flag, distinct names, distinct flags (the duplicate-flag rule is enforced:
  // two args rendering `--x=` twice mean the container silently takes one).
  repeated AppParameter args = 5;

  // ─── ★ THE IDENTITY THIS STEP RUNS AS ─────────────────────────────────────
  //
  // The service-account email the in-cloud validate JOB is attached to. EMPTY ⇒
  // the deploy identity (the default validate-job service account).
  //
  // ⛔ WHY IT EXISTS: A GATE THAT RUNS AS THE WRONG PRINCIPAL TESTS NOTHING. A
  // step that asserts "the job manager can read and write its staging bucket"
  // must run as the job manager's identity. Run under the ambient deploy
  // identity, it tests the deploy identity's permissions instead, and fails
  // with PERMISSION_DENIED on a bucket the job manager can in fact write.
  //
  // ⚠ THE TEMPTING FIX IS THE WRONG ONE, AND IT IS WORSE THAN THE BUG. Granting
  // the deploy identity object-write would turn the step GREEN while still
  // never touching the job manager's identity: a gate that passes for a reason
  // unrelated to its claim, which is a vacuous pass with extra IAM surface
  // attached. The subject of the assertion has to change, not the permissions
  // of the wrong subject. So the step names the identity UNDER TEST and runs as
  // it.
  //
  // ⚠ THIS CANNOT ESCALATE, AND THE REASON IS STRUCTURAL, NOT A CONVENTION.
  // Cloud Run `CreateJob` REJECTS a `service_account` the CALLER lacks
  // `iam.serviceAccounts.actAs` on. So this field can only ever select an
  // identity the deploy identity was ALREADY permitted to act as: it cannot
  // widen anything, and an un-actAs-able value fails closed at the CreateJob
  // RPC rather than silently running as something else. It is also a
  // NARROWING in practice: a validator moves off the broad deploy identity
  // onto the single role whose behaviour it is asserting.
  //
  // ⚠ NO `${project}` SUBSTITUTION: a validate step resolves a literal and a
  // `value_from` and NOTHING ELSE, so a marker would reach Cloud Run verbatim
  // as a service account email that does not exist. Write the literal.
  //
  // MIRRORS `JobSpec.runtime_identity` (field 5) in both name and semantics:
  // one concept, one spelling, so "the identity a declared workload runs as"
  // does not acquire a second vocabulary.
  string runtime_identity = 6;

  // ─── ★ THE NETWORK THIS STEP'S JOB SENDS ITS TRAFFIC THROUGH ──────────────
  //
  // ABSENT (the default) ⇒ the Job carries NO network configuration, and a
  // Cloud Run Job with no network configuration egresses over the PUBLIC
  // INTERNET. It can therefore reach a service whose ingress admits public
  // callers, and CANNOT reach one whose ingress is
  // `internal-and-cloud-load-balancing`: the private service refuses it AT THE
  // EDGE, before the container, so the probe sees the platform's HTML 404
  // rather than anything the app said.
  //
  // ⛔ DO NOT ASSUME A VALIDATE JOB IS "INSIDE THE VPC". Without this field
  // there is no syntax, no placement field and no render onto
  // `TaskTemplate.vpc_access` that would put it there, and a health gate that
  // fails with a 404 from a private service would be misread as an app defect.
  //
  // PRESENT ⇒ the Job is rendered with Direct VPC egress: `vpcAccess.
  // networkInterfaces[0] = {network, subnetwork, tags}` plus an `egress` mode.
  // Google's stated requirement for one Cloud Run resource to reach an
  // internal-ingress Cloud Run service is exactly this: "configure the source
  // resource to use either Direct VPC egress or a connector"
  // (cloud.google.com/run/docs/securing/private-networking).
  //
  // ⚠ AUTHORING IT DOES NOT CREATE ANYTHING, AND THAT IS DELIBERATE. It
  // SELECTS an existing network + subnetwork by name; the deploy tool composes
  // no VPC, no subnet, no connector, no Cloud Router and no NAT from it. A
  // value naming a subnetwork that does not exist fails CLOSED at the
  // CreateJob RPC. The network infrastructure must exist first.
  //
  // ⚠ IT IS SCOPED TO THIS ONE STEP'S JOB. It says nothing about the SERVICE
  // being deployed, and nothing about service-to-service calls between
  // control-plane services, which face the identical refusal without egress of
  // their own (see `AppSpec.network_egress`). A green gate here would not mean
  // that path works.
  ValidateVpcEgress vpc_egress = 7;

  // ─── ★ THE PROJECT TELEMETRY THIS CONTAINER READS FOR ITSELF ──────────────
  //
  // The read-only observability planes this step's container queries AT
  // RUNTIME over its own API calls. Each entry composes ONE project-scoped READ
  // grant for the identity the job runs as: `runtime_identity` when authored,
  // else the deploy identity.
  //
  // EMPTY (the default) ⇒ NO grant node, byte-identical compose for a bundle
  // that omits it.
  //
  // ── WHAT IT CLOSES ───────────────────────────────────────────────────────
  // An observability validator that reads logs and metrics fails its
  // preconditions with HTTP 403 when its identity holds no Logging or
  // Monitoring role. A prerequisite stated only as prose in a bundle comment
  // cannot converge; this field gives it a wire, so the deploy MAKES the grant
  // instead of describing it.
  //
  // ── IT IS THE `reads_secret` SHAPE, FOR THE `reads_secret` REASON ───────────
  // A validator that SELF-FETCHES has no wire that could carry the authority:
  // no `secret://` mount, no env, nothing that reaches the Job spec. Without
  // `reads_secret` there would be no way to say "this container reads X" and
  // therefore no way to compose the grant; the same is true of telemetry
  // without this field. The bundle that needs the grant is the artifact that
  // asks for it.
  //
  // ── WHY A CLOSED ENUM AND NOT A GENERIC `Capability` ───────────────────────
  // A generic capability list here would let any bundle author grant the
  // DEPLOY identity any capability in the vocabulary, `ADMIN_SET_IAM`
  // included, from a validate step. This enum can express only READ scopes
  // and nothing else, so the widest thing a bundle can ask for is "read this
  // project's logs and metrics". The concrete roles still terminate in the
  // grant conformer: `TELEMETRY_READ_LOGS` -> `CAPABILITY_READ_LOGS` ->
  // `roles/logging.viewer`; `TELEMETRY_READ_METRICS` ->
  // `CAPABILITY_READ_MONITORING` -> `roles/monitoring.viewer`. No `roles/…`
  // string appears above that tier.
  //
  // ── WHY SEPARATE ENTRIES AND NOT ONE "observability" FLAG ──────────────────
  // Because the refusals are independent and a validator reports them
  // independently, as two rows each naming its own role. A fused flag could
  // not express "logs readable, metrics not", which is exactly the state a
  // partially-applied grant produces, and exactly the state a reader needs to
  // be able to name.
  //
  // `TELEMETRY_READ_UNSPECIFIED` is REFUSED by `validate_bundle`: an unset
  // element would compose a grant for no capability, which fails at the
  // conformer an hour later instead of at the bundle line that wrote it.
  // Duplicates are refused for the same reason two nodes on one target would
  // race under read-modify-write SetIamPolicy.
  repeated TelemetryRead reads_telemetry = 8;

  // ─── ★ THE EPHEMERAL CONTROL-PLANE IDENTITIES THIS STEP PRESENTS ──────────
  //
  // Each entry declares ONE caller identity that EXISTS ONLY FOR THIS VALIDATE
  // RUN: created before the step DAG starts, revoked on BOTH of its exit arms.
  // The validator is handed four HANDLES on argv (the deployment id it mints
  // as, the secret handle its private key lives at, the org it acts in, and the
  // control-plane issuer) and fetches + self-mints; NO credential material ever
  // rides argv or env.
  //
  // EMPTY (the default) ⇒ NOTHING is provisioned, NOTHING is revoked, and NO
  // flag is rendered: byte-identical parse, emit, compose and argv for a bundle
  // that omits it.
  //
  // ⛔ WHY IT IS A CONTROL-PLANE IDENTITY AND NOT A CLOUD IAM ROLE. The
  // decisive fact is at the door, not in the provisioning: an app that
  // verifies callers against the control plane's JWKS reads a control-plane JWT
  // and nothing else, so an AWS/GCP role is not a credential it can read at
  // all. The alternative, a cloud-native role plus a federation bridge
  // cloud-role → control-plane token, would be a NEW trust path into the mint,
  // on top of a grant that cannot even converge on AWS (a grant's carrier there
  // is an inline policy on the deploy principal's role, which the AWS grant
  // conformer refuses).
  //
  // ★ AND THIS IS NOT `runtime_identity` (field 6). That is the CLOUD identity
  // the validate JOB *runs as*: SELECTED, never created. This is the
  // control-plane identity the validator *presents to the app under test*. Two
  // axes; a step may author both and they mean different things.
  //
  // ── WHAT THE DEPLOY DOES WITH ONE ─────────────────────────────────────────
  // CREATE (idempotent): the control plane writes the app-deployment row and a
  // P-256 key, puts the private scalar at a per-(app, org) handle through the
  // SAME cloud-dispatched writer a deploy uses, then records a grant of
  // `level` on the deployment the named service resolves to. DESTROY: the
  // teardown revokes the grant and the credential keys.
  //
  // ⛔⛔ THE TEARDOWN IS A **REVOKE**, NEVER A DELETE, AND THE SECRET IS NEVER
  // DELETED AT ALL. AWS `DeleteSecret` is a SOFT delete with a 7-30 day
  // recovery window during which THE NAME STAYS TAKEN, and the handle is
  // derived from `(app, org)`, so deleting it BRICKS every subsequent run of
  // the same test role for up to a month. A revoked row is inert (the control
  // plane holds no candidate key, so every authorization check naming it is
  // refused as unauthenticated from the next request) and is idempotently
  // re-keyed by the next run.
  //
  // ── ⛔ TENANCY IS A SCHEMA PROPERTY OF THIS FIELD, NOT A CONVENTION ────────
  // Provisioning one WRITES ROWS INTO THE OPERATOR'S OWN CONTROL PLANE, so
  // `validate_bundle` REFUSES a `test_role` on any bundle that is not
  // `tenancy: TENANCY_CONTROL_PLANE`: the POSITIVE test, because `Tenancy` has
  // THREE members and the negation of "is CUSTOMER" includes UNSPECIFIED, the
  // value a bundle that declared nothing carries. A customer bundle's deploy
  // creates NOTHING, so a test role on one would mint a live control-plane
  // identity for a machine that stands nothing up.
  repeated TestRole test_role = 9;

  // ─── ⭐ AN IDENTITY THIS STEP OWNS: declared by the bundle, CREATED by the
  //     deploy graph ──────────────────────────────────────────────────────────
  //
  // The service-account ACCOUNT ID (e.g. `vm-validator`, never an email) this
  // step's in-cloud job runs as, where the service account is the STEP'S OWN:
  // compose derives, in the control-plane graph, the service account itself,
  // the deploy identity's actAs on it, and a scoped `run.invoker` on the
  // step's service. The validation still creates nothing: the BUNDLE declares
  // it and the DEPLOY creates it.
  //
  // ⛔ EXCLUSIVE WITH `runtime_identity` (6), which SELECTS an identity that
  // already exists. One step, one principal; a step naming both would have to
  // pick one silently.
  //
  // ⛔ WHY NOT THE DEPLOY IDENTITY (the default): it holds `projectIamAdmin`,
  // so a gate running as it can read anything whether or not the grant under
  // test exists: a green that proves nothing about the grant.
  //
  // ⛔ DECLARED AHEAD OF ITS COMPOSITION: `validate_bundle` REFUSES it BY NAME
  // until the service account / actAs / invoker composition exists. Unrefused,
  // a step would run as a service account nothing created and fail at
  // CreateJob: loud, but late.
  string own_identity = 10;
}

// ─── ★ ONE EPHEMERAL CONTROL-PLANE CALLER IDENTITY FOR ONE VALIDATE STEP ────
//
// The `RunContainer.test_role` payload. It answers the question: *"what does
// this service do when a correctly-scoped CUSTOMER caller (not the operator,
// not the deploy principal) presents a token?"* The alternative way to have
// such a caller is to leave a PERSISTENT fake service deployed in a test org,
// which is a standing credential nobody rotates and a staleness liability the
// moment the real shape changes.
//
// EVERY field is proto3-default-skipped on emit, so a bundle that does not
// author the block re-emits BYTE-IDENTICALLY.
message TestRole {
  // The role's symbol, unique within the STEP. It names the role in every
  // refusal and in the provisioning report, and it is half of the app name the
  // `app_deployment` row is keyed on. REQUIRED.
  string name = 1;
  // The org this caller ACTS IN: a hyphenated UUID naming an EXISTING
  // organization row. REQUIRED.
  //
  // ⛔ IT MAY NOT BE THE OPERATOR'S RESERVED ORG. That org is the operator's
  // own tenancy; a "customer caller" minted into it collapses the very tenancy
  // axis a cross-tenant assertion is about, so every such gate would pass for
  // a reason unrelated to its claim. `validate_bundle` refuses it by value.
  //
  // ⚠ AND IT MUST ALREADY EXIST. Provisioning REFUSES an unknown org rather
  // than creating one: an app-deployment row anchored to an org that does not
  // exist is a PERMANENTLY UN-MINTABLE identity, indistinguishable from a
  // healthy row until somebody tries to mint.
  string org_id = 2;
  // The `ServiceSpec.name`, IN THIS BUNDLE, whose deployment this role is
  // granted on. REQUIRED, and refused when it names no service the bundle
  // declares: a grant on a resource that does not exist is a row nothing reads,
  // and the step would then assert an entitlement it never held.
  //
  // ★ THE AUDIENCE IS DERIVED FROM IT, NOT AUTHORED. The target is the bundle's
  // own `${app_deployment_id}` for that service, the same value the deploy
  // already resolves, so nobody hand-types an audience read off a live
  // deployment.
  string grants_on_service = 3;
  // The access level the grant records. REQUIRED: `TEST_ROLE_LEVEL_UNSPECIFIED`
  // is refused, because a grant for no level is a row the authorizer cannot
  // interpret and it would fail at read time rather than at the line that
  // wrote it.
  TestRoleLevel level = 4;
  // ── THE FOUR FLAGS. DECLARED, NEVER DERIVED ───────────────────────────────
  //
  // The consumer has its own argv vocabulary (`--caller-deployment-a`,
  // `--relay-audience`, …) and the deploy tool deliberately refuses to grow a
  // SECOND flag derivation beside the parameter one. So the bundle states the
  // flag it wants each resolved value rendered onto, and a role that omits a
  // flag simply does not render that value.
  //
  // ⚠ EVERY ONE OF THESE CARRIES A HANDLE, NEVER A CREDENTIAL, including
  // `identity_secret_flag`, which renders the secret's NAME. Argv is
  // WORLD-READABLE (`/proc/self/cmdline` is mode 0444; the same string lands in
  // `ps`, in every job describe, and in every deploy audit log), which is
  // exactly why `AppParameter.secret_ref` is refused on a validate-step arg.
  // The validator FETCHES the scalar under its own identity and self-mints.

  // The flag the minted caller's `app_deployment_id` (its token `sub`/`aud`)
  // renders onto.
  string deployment_id_flag = 5;
  // The flag the SECRET HANDLE (the address the private signing scalar lives
  // at, never the scalar) renders onto.
  string identity_secret_flag = 6;
  // The flag `org_id` renders onto.
  string org_id_flag = 7;
  // The flag the control-plane ISSUER renders onto.
  string issuer_flag = 8;
  // ★★ THE FLAG THE **TARGET** DEPLOYMENT (the one `grants_on_service` names,
  // i.e. this bundle's own `${app_deployment_id}`) RENDERS ONTO.
  //
  // ⛔ IT IS A DIFFERENT VALUE FROM `deployment_id_flag`, AND THAT CONFUSION IS
  // THE WHOLE REASON IT IS NAMED SEPARATELY. `deployment_id_flag` carries the
  // CALLER's minted id (its token's `sub`); this one carries the deployment the
  // caller was GRANTED ON (its token's `aud`). A consumer handed only the first
  // holds the principal and not the resource: exactly half of an entitlement,
  // and the half that cannot be detected from the flag it did receive.
  //
  // ★ WHY IT HAD TO BE A FIELD. Every other route to a validate step's argv is
  // CLOSED for this value: `marker` is refused on a validate-step arg (the
  // `ParamMarker` producers resolve against a MANAGED-APP deployment and a
  // validate step has no such subject), `service_ref` is refused (`ValueFrom`
  // is SELF-scoped), and a literal `value:` would be a server-assigned id
  // hand-typed off a live deployment, which goes stale. So without this flag a
  // step that DECLARES a test role can be handed the caller and never the
  // resource, and the assertion the role exists to enable is unexpressible.
  //
  // ⚠ ONE ROLE MAY CLAIM IT, because no flag may be claimed twice across a
  // step's roles. Roles sharing a target therefore author it ONCE (the shape
  // `issuer_flag` has, for the same reason): the value is identical for all of
  // them, and two roles rendering it would mean the container silently takes
  // one.
  string granted_on_flag = 9;
}

// ─── THE ACCESS LEVEL A `TestRole` GRANT RECORDS ─────────────────────────────
//
// ⚠ THIS IS A SEPARATE VOCABULARY FROM the authorization layer's access-level
// lattice, AND THE DIVERGENCE IS FORCED, NOT PREFERENCE. That lattice numbers READ as **0**, and
// 0 is the proto3 default, so a mirror-ordinal enum would make "the author
// declared nothing" and "the author asked for READ" THE SAME BYTES, the
// absent-vs-empty confusion that would make the `level`-is-required refusal
// unimplementable. So UNSPECIFIED takes 0 here and the mapping to the authz
// ordinals is ONE function, pinned by a test against the lattice's own
// constants so the two cannot drift.
//
// ⛔ ADMIN AND CREATE ARE DELIBERATELY ABSENT. ADMIN is a CLAIM-ONLY level the
// mint stamps for an org admin and is NEVER a stored grant level;
// CREATE is scope-level and never stored either. This enum is the ceiling on
// what a bundle author can make a deploy grant to a test caller, so a value
// added here widens that ceiling for every bundle.
enum TestRoleLevel {
  TEST_ROLE_LEVEL_UNSPECIFIED = 0;
  // -> the lattice's READ level
  TEST_ROLE_LEVEL_READ = 1;
  // -> the lattice's WRITE level
  TEST_ROLE_LEVEL_WRITE = 2;
  // -> the lattice's DELETE level
  TEST_ROLE_LEVEL_DELETE = 3;
}

// ─── THE READ-ONLY TELEMETRY PLANES A VALIDATE STEP MAY QUERY ────────────────
//
// The `RunContainer.reads_telemetry` vocabulary. DELIBERATELY READ-ONLY: this
// enum is the ceiling on what a bundle author can ask the deploy to grant a
// validate job, so every value added here widens that ceiling for EVERY
// bundle. Adding a write scope to this enum is not an additive change.
enum TelemetryRead {
  TELEMETRY_READ_UNSPECIFIED = 0;
  // Cloud Logging `entries:list`: "did this request produce a log entry, and
  // does the entry's recorded status match the status measured on the wire".
  // -> CAPABILITY_READ_LOGS -> roles/logging.viewer, project-scoped.
  TELEMETRY_READ_LOGS = 1;
  // Cloud Monitoring `timeSeries.list`: "do this service's built-in metric
  // series exist". -> CAPABILITY_READ_MONITORING -> roles/monitoring.viewer,
  // project-scoped.
  TELEMETRY_READ_METRICS = 2;
  // ⭐ THE JOB-VM OBSERVE READ. What a VM gate reads about the instance a job
  // placed: the instance, its disk, its SERIAL CONSOLE and the zone operation
  // that deleted it. -> CAPABILITY_OBSERVE_JOB_VM (34) -> a custom role
  // holding {compute.instances.get, compute.disks.get,
  // compute.instances.getSerialPortOutput, compute.zoneOperations.get}.
  //
  // ⚠ IT WIDENS THE CEILING THIS ENUM'S HEADER WARNS ABOUT, AND IN ONE PLACE
  // ONLY: the grant is composed by the CUSTOMER'S bootstrap, in the CUSTOMER'S
  // project, and only where the environment row states
  // `admit_cp_validation: true`; serial output is customer data, which is why
  // a real customer never grants it. The control-plane graph composes NO grant
  // for it.
  //
  // ⛔ DECLARED AHEAD OF ITS COMPOSITION: `validate_bundle` REFUSES a step
  // reading it BY NAME until the customer-side composition exists.
  TELEMETRY_READ_JOB_VM_STATE = 3;
}

// ─── DIRECT VPC EGRESS FOR ONE VALIDATE STEP'S JOB ───────────────────────────
//
// The `RunContainer.vpc_egress` payload (also `AppSpec.network_egress`).
// Renders onto Cloud Run's `TaskTemplate.vpc_access` (run/v2 field 8) as a
// SINGLE `network_interfaces` entry: Direct VPC egress, the connector-less
// form. `VpcAccess.connector` is deliberately NOT exposed: a connector is a
// provisioned, billed, regional resource, and offering both spellings would
// make "which one is this bundle using" a question every reader has to answer
// out of two fields.
//
// EVERY field is proto3-default-skipped on emit, so a bundle that does not
// author the block re-emits byte-identically.
message ValidateVpcEgress {
  // The VPC network the job's interface attaches to: the bare name
  // (`default`) or a full resource URI. REQUIRED when the block is present:
  // `validate_bundle` refuses an empty one, because Cloud Run rejects a
  // `network_interfaces` entry with no network and the refusal should name the
  // bundle line rather than arrive as a CreateJob error an hour later.
  string network = 1;
  // The subnetwork, in the JOB'S OWN REGION. REQUIRED when the block is
  // present, for the same reason.
  //
  // ⚠ REGION-COUPLED. Direct VPC egress attaches to a subnetwork in the region
  // the Job runs in, so a bundle whose validate job moves region must move this
  // with it.
  string subnetwork = 2;
  // Network tags applied to the job's interface: what selector firewall rules
  // match on. EMPTY (the default) ⇒ no tags, so only rules that match the
  // network broadly apply.
  repeated string network_tags = 3;
  // Which traffic takes the VPC path.
  //
  // FALSE (the default) ⇒ `ALL_TRAFFIC`: every request the container makes,
  // including one to a `*.run.app` hostname, leaves through the VPC. THIS IS
  // THE ARM THAT REACHES A PRIVATE-INGRESS SERVICE: a run.app address is a
  // public one, so under `PRIVATE_RANGES_ONLY` it does NOT take the VPC path
  // and the refusal is unchanged. The default is the arm that does the thing
  // this field exists for.
  //
  // TRUE ⇒ `PRIVATE_RANGES_ONLY`: only RFC-1918 destinations take the VPC
  // path. Correct for a validator that talks to an internal IP (a database, an
  // internal load balancer) and should keep its public egress direct, and it is
  // the arm that needs NO Cloud NAT, because public traffic never enters the
  // VPC.
  //
  // ⚠ UNDER `ALL_TRAFFIC`, WHAT THE VPC MUST CARRY IS THE JOB'S OWN DESTINATION
  // SET, not "the internet" as such. A GOOGLE-owned destination (a `*.run.app`
  // URL, `*.googleapis.com`) is carried by PRIVATE GOOGLE ACCESS on the
  // subnetwork, with no Router and no NAT; the metadata server
  // (169.254.169.254) is link-local and never enters the VPC path at all. NAT
  // is required only for a NON-Google destination. So a probe that dials one
  // run.app URL needs ONE boolean on an existing subnet
  // (`privateIpGoogleAccess`), and a validator that dials a third-party host
  // needs the NAT as well. Google states the run.app case as both halves
  // together: "Configure the source resource to route all traffic through the
  // VPC network and enable Private Google Access on the subnet"
  // (cloud.google.com/run/docs/securing/private-networking).
  bool private_ranges_only = 4;
}

// ─── ONE RUN-TO-COMPLETION JOB THE BUNDLE DECLARES ──────────────────────────
//
// The intent-tier declaration of a `RESOURCE_KIND_RUN_TO_COMPLETION_JOB` node:
// a container the deploy SHIPS into the target project to be run once and
// exit, as opposed to a `SERVERLESS_COMPUTE` node that is shipped to serve. The
// resolved-tier kind (2) and its `RunToCompletionJobSpec` carry it; this is how
// an author asks for one, instead of a hand-written script that deploys and
// executes a job out of band.
//
// ★ A ONE-SHOT JOB IS A DEPLOY. It ships a container image into a customer
// project under an identity with secrets bound to it. That it exits afterwards
// changes the LIFETIME of the workload, not the nature of the act, which is
// why this is a declared resource with a retention policy and not a CLI flag.
//
// ⛔ AND DECLARING IT DOES NOT RUN IT. See `ExecuteJob`.
message JobSpec {
  // The job's symbol, unique within the bundle. It is what an `ExecuteJob.job`
  // names, and what the composed node's logical id derives from. REQUIRED.
  string name = 1;
  // The image to run: a pinned digest OR a `from_build` reference. REUSES
  // `ImageRef`, the ONE place a compiled artifact is named, so a job's image
  // is as drift-proof as a service's. REQUIRED.
  ImageRef image = 2;
  // The env injected into the job's container, INCLUDING the typed wave-output
  // refs. REUSES `BundleEnvVar`, which removes the most fragile way to feed a
  // job: reading values out of the LIVE service's env block, where a rename of
  // any of them silently produces an empty string and a job that runs against
  // nothing. `value_from: VALUE_FROM_DEPLOY_URL` and `service_ref` are the
  // typed forms of the same intent, resolved by the same seam every other
  // consumer uses.
  repeated BundleEnvVar env = 3;
  // The secrets the job resolves at runtime: the REUSED `SecretBinding` from
  // `deploy_model.proto` (a name + capability, never a value), the same shape
  // `AppSpec.secret_bindings` carries.
  repeated .komira.deploy.v1.SecretBinding secret_bindings = 4;
  // The identity the job RUNS AS. EMPTY ⇒ the same runtime identity the
  // bundle's service resolves to (`AppSpec.runtime_identity`, or its derived
  // default), never a broader one. A job that needs its own identity states
  // it.
  string runtime_identity = 5;
  // How many times a FAILED task is retried before the execution is failed.
  //
  // ★ proto3-OPTIONAL ON PURPOSE, AND THIS IS THE ONE FIELD WHERE IT MATTERS
  // MOST IN THIS MESSAGE. `max_retries: 0` is a MEANINGFUL value ("a failure
  // is a verdict, do not retry") that is also the proto3 zero. Without
  // `optional` there is no way to tell "the author demanded no retries" from
  // "the author said nothing", so a gate whose whole contract is
  // `exit code == verdict` could silently acquire retries and start passing on
  // the second attempt. UNSET ⇒ the platform default.
  optional int32 max_retries = 6;
  // The per-task wall budget in SECONDS (e.g. 600 for ten minutes). 0 ⇒ the
  // platform default. Seconds, not a duration string: a duration grammar
  // inside the bundle grammar is a second parser nothing validates.
  int32 task_timeout_seconds = 7;
  // The region the job is placed in. EMPTY ⇒ the bundle's effective deploy
  // region (the `--env` binding, or `AppSpec.region` when it overrides).
  string region = 8;
  // The job's ARGV: the arguments passed to the image's baked ENTRYPOINT.
  //
  // ★ A BINARY'S CONFIGURATION IS COMMAND-LINE FLAGS, NOT ENV. The resolved
  // tier has `RunToCompletionJobSpec.args`; without this field the intent tier
  // could configure a job ONLY through `env`, and none of the legitimate env
  // channels (platform-set mode discriminators, secret material, a platform's
  // own deploy-time config) covers a job's own arguments.
  //
  // ⚠ ARGUMENTS, NOT AN ENTRYPOINT OVERRIDE, and the two clouds agree on that
  // by construction: this list becomes Cloud Run's `args` (the CMD override,
  // entrypoint untouched) and ECS's `command` (the Docker CMD). Neither mapper
  // writes an entrypoint override, so a job runs the program its image was
  // built to run, with the arguments the bundle authored.
  //
  // ⛔ SECRETS DO NOT GO HERE. Argv is world-readable: a container's arguments
  // appear in the Job/task definition that `run.jobs.get` and
  // `ecs:DescribeTaskDefinition` expose, and in every deploy audit log and plan
  // diff. Use `secret_bindings`.
  repeated string args = 9;
}

// ─── EXECUTING a declared job, AS A GATE ────────────────────────────────────
//
// ★ WHY EXECUTION IS A `ValidateStep` ARM AND NOT A PROPERTY OF `JobSpec`, AND
// NOT A `Wave` FIELD:
//
//   * NOT ON THE RESOURCE. A resource's verbs are read/plan/create/update/
//     delete and every one of them is idempotent by contract: that is what
//     lets a re-apply of an unchanged graph be a NOOP. "Execute" is none of
//     those: it is a side effect with no converged state to compare against.
//     Hanging it on the resource means every apply runs it, so a re-deploy that
//     changes nothing re-sends the mail, re-charges the card, re-runs the
//     migration. The resource's job is to EXIST; running it is a different act
//     with a different lifecycle, and merging them is how an idempotent applier
//     stops being one.
//
//   * NOT A WAVE FIELD. A wave is an env plus the gates that must pass before
//     promotion past it. An execution whose exit code IS the verdict is, by
//     that definition, a gate, so putting it beside the gates rather than among
//     them buys nothing and loses everything a step already has.
//
//   * A STEP, BECAUSE THE SHAPE ALREADY FITS EXACTLY. `GateOn.GATE_ON_EXIT_CODE`
//     is already "your command exits 0". Being a step also inherits, for free
//     and without a second implementation: `depends_on` (the step DAG the
//     parallel scheduler orders by), `excluded_because` (the exclusion marker
//     whose value is its own justification), and membership in a named
//     `ValidationSet` so the set can be run against any env. A wave-level or
//     resource-level execution would have to re-grow all three.
//
// ⚠ THE DIFFERENCE FROM `run_container`, WHICH IS WHY THIS ARM IS NOT
// REDUNDANT. A `run_container` step runs an ANONYMOUS container as the deploy
// caller with no declared identity, no secret bindings, no retry policy and no
// timeout. A gate that needs its own run identity, a bound secret, retries
// pinned to 0 and a fixed time budget cannot be a `run_container` step. This
// arm executes a job the bundle DECLARED, so the container's identity and
// grants are graph state that a plan can show and a delete can reap, rather
// than argv.
message ExecuteJob {
  // The `JobSpec.name` to execute. Validated fail-closed against the bundle's
  // declared jobs: a step naming a job that does not exist is refused offline,
  // never at the cloud.
  string job = 1;
  // What to gate promotion on. EXIT_CODE: the execution's exit code, which is
  // the verdict (`GateOn`).
  GateOn gate_on = 2;
}

// ─── A SCHEDULED CALL INTO A SERVICE THIS BUNDLE DECLARES ───────────────────
//
// A wall-clock cron, declared with the service it calls. A scale-to-zero
// service that owes the world a periodic reconcile has NO way to tick itself;
// the cron IS the liveness of that backstop, and a cron created out of band by
// a script is a backstop nothing gates.
//
// ⛔ WHY THIS DOES NOT REUSE `Schedule` (the trigger arm), WHICH HAS THE SAME
// TWO FIELDS. `Schedule`'s contract is a CADENCE: the control plane derives an
// INTERVAL from it and advances the per-deployment clock by that interval; it
// does not fire at the named instant, and there is deliberately no
// per-customer cloud timer. A `CronSpec` is the opposite on both counts: a
// real scheduler object that fires AT the named instant. Sharing the message
// would import a semantics comment that is FALSE here, and the field that would
// then be wrong is the one every reader trusts. Two fields duplicated is
// cheaper than one contract silently inverted.
//
// ⛔ AND THERE IS DELIBERATELY NO `uri` AND NO `audience` FIELD, for the reason
// `SecuredInboundRoute` field 4 (`audience`) is reserved. Both values are the
// target service's serving URL, which the cloud assigns at service-create with
// a server-generated hash. Any authored form is a GUESS at a string that does
// not exist yet, it cannot be checked offline, and when it is wrong the
// scheduler gets a 403 with an empty body while the deploy reports green: a
// backstop that has silently stopped ticking. The target is named as a TYPED
// SIBLING REFERENCE and the url + the OIDC audience are both DERIVED from the
// one observed address, by the one formatter, at apply time.
message CronSpec {
  // The cron's symbol, unique within the bundle; the composed node's logical
  // id and the scheduler object's name derive from it. REQUIRED.
  string name = 1;
  // A 5-field cron expression (`m h dom mon dow`), fired AT the named instant.
  // REQUIRED.
  string cron = 2;
  // The IANA timezone the expression is interpreted in (e.g. "UTC"). EMPTY ⇒
  // UTC. A cron with no stated zone is a cron that moves twice a year.
  string timezone = 3;
  // The SIBLING service this cron calls: a LOGICAL name (`ServiceRef`), the
  // same typed cross-service reference a `BundleEnvVar` uses. Validated
  // fail-closed against the services this bundle declares. REQUIRED: a cron
  // whose target is not in this bundle is a cron whose invoker binding this
  // deploy cannot make, and a cron that cannot invoke is a no-op with a green
  // deploy behind it.
  ServiceRef target = 4;
  // The path appended to the target's DISCOVERED serving url (e.g.
  // "/reconcile"). MUST start with "/". EMPTY ⇒ the service root.
  string path = 5;
  // The HTTP method. EMPTY ⇒ POST: a scheduled tick that mutates is the norm,
  // and a GET default would make the safe-looking spelling the wrong one.
  string http_method = 6;
  // The identity the scheduler authenticates AS when it calls the target (the
  // OIDC token's subject; it also receives the scoped invoker binding on the
  // target, the `IngressSpec.gateway_service_account` shape and for the same
  // one-field reason). EMPTY ⇒ the target service's own runtime identity.
  string invoker_identity = 7;
  // How long one attempt may run before the scheduler gives up, in SECONDS
  // (e.g. 300). 0 ⇒ the platform default.
  int32 attempt_deadline_seconds = 8;
}

// ─── RUN-SCOPED LIFECYCLE: a deploy a TEST may create and destroy ────────────
//
// For a test that creates real resources in a mimic-customer project and then
// deletes exactly what it created, and afterwards asserts that ZERO run-scoped
// resources survived, because the failure it guards is a COST leak nobody
// would otherwise see.
//
// ★ WHAT THIS IS AND IS NOT. It is NOT a new verb: the deploy tool's delete
// already walks the graph in reverse honouring per-node `Retention`. It is NOT
// a per-node property: `Retention` IS that property and it is the right one.
// It is the ONE thing neither of those can express: that THIS WHOLE GRAPH
// belongs to a single throwaway run, and therefore that the data-protecting
// retention which is correct for a standing deployment is exactly wrong here.
//
// ★ PRESENCE IS A PERMISSION, AND THAT IS DELIBERATE. A deploy or delete with
// `--run-id <id>` is REFUSED for a bundle that declares no `ephemeral {}`
// block. The id itself is never authored (it is per-RUN and a bundle is
// per-DEPLOY), but the bundle must OPT IN to being deployable under a suffixed
// name, because a production bundle silently accepting `--run-id` would stand
// up a parallel copy of a live service under a name that its registry, its
// DNS, and its callers know nothing about.
//
// ★★ THE CIRCULARITY QUESTION, ANSWERED RATHER THAN AVOIDED. A conformance
// test that used the tool under test to SET UP the test would be circular for
// the assert-app-running leg. The split this schema takes is: THE DEPLOY HALF
// MAY BE CIRCULAR, THE ASSERTION HALF MAY NOT.
//   * SETUP and TEARDOWN may route through the deploy tool. A setup that fails
//     is a FAILED TEST, not a false pass, so a broken tool cannot manufacture a
//     green result through this leg: it can only manufacture a red one, which
//     is the safe direction and is the whole reason the asymmetry holds.
//   * THE TWO LEGS THAT MUST NOT are (a) assert-app-running, which must dial
//     the app's published URL with an INDEPENDENT client and must never ask the
//     deploy tool whether the deploy worked, and (b) THE LEAK DETECT, which
//     must ENUMERATE surviving resources from the cloud's own list API by
//     run-id prefix, never from the deploy tool's ledger. A teardown that asks
//     its own bookkeeping whether it deleted everything cannot detect the leak
//     it caused; it will report clean precisely when it is wrong.
//   * THAT IS WHY THERE IS NO `verify_teardown` FIELD HERE AND NO
//     verify-teardown VERB, AND WHY THERE MUST NOT BE. The assertion's
//     independence from the tool is the property being tested. A field here
//     that turned it on would move the assertion inside the thing it is
//     checking.
message EphemeralScope {
  // ⚠⚠ THE FIELD THAT MAKES A DATA-PROTECTING RETENTION NOT APPLY, AND IT
  // CANNOT BE SET WITHOUT WRITING DOWN WHY.
  //
  // Under a run-scoped teardown EVERY node this bundle composes is deleted,
  // INCLUDING the ones whose per-node `Retention` is RETAIN_KEEP. RETAIN_KEEP
  // exists to stop a stray destroy from nuking a bucket that holds data, a
  // domain, a certificate. For a run-scoped conformance graph there is no such
  // data (the bucket IS the run), and leaving it standing is the COST leak the
  // run-scoped teardown exists to prevent.
  //
  // REQUIRED to be non-empty when this block is present, and the value IS the
  // justification, in the text a reviewer reads. The same shape as
  // `ValidateStep.excluded_because` and `WebRouteRule.deny_reason`, chosen for
  // the same reason: a bool can be flipped in a diff with no explanation, and
  // "ignore the retention policy" is the single most dangerous instruction it
  // is possible to put in this file.
  string keep_overridden_because = 1;
  // The ORPHAN BUDGET: the wall, in seconds, after which a run of this bundle
  // is presumed abandoned and may be reaped by a sweeper that did not create
  // it. 0 ⇒ no budget declared, and teardown is then the caller's obligation
  // ALONE.
  //
  // ⚠ 0 IS NOT SAFE, IT IS JUST QUIET. A teardown run from a shell `trap` does
  // not fire when the machine dies, the token expires, or CI cancels the job,
  // and the resources outlive the run with nothing that will ever come back
  // for them. Stating a budget is what makes an abandoned run FINDABLE;
  // leaving it 0 is a decision to rely on the trap.
  int32 max_lifetime_seconds = 2;
}

// ─── One validate step (the gate-as-VALIDATE mechanism) ──────────────────────
//
// A typed validation/test step. Any number of these gate promotion between
// environments (unlimited validation steps). The reconciler will not advance
// the wave until this step passes.
message ValidateStep {
  // The step's symbol (e.g. "up", "integ").
  string name = 1;
  // Exactly one check form: a cheap HTTP probe, an arbitrary gated container,
  // OR the execution of a run-to-completion JOB this bundle declares.
  oneof check {
    // A GET-path/expect-status HTTP health probe.
    HttpCheck http_check = 2;
    // An arbitrary container gated on its exit code.
    RunContainer run_container = 3;
    // ★ EXECUTE a `AppBundle.jobs[]` job and gate on its exit code. APPENDED
    // LAST (field 6) so it neither displaces nor bleeds into the existing arms.
    // See `ExecuteJob` for why the execution is a STEP and not a property of
    // the job resource.
    ExecuteJob execute_job = 6;
  }
  // The names of the validate steps (within the SAME wave) this step depends
  // on: the step-DAG edges the parallel validation scheduler orders by (a
  // topological sort). EMPTY (the default) ⇒ the step is INDEPENDENT and
  // eligible to run CONCURRENTLY with every other independent step. A
  // non-empty entry naming a step that FAILS ⇒ this step is SKIPPED (never
  // run). Round-trip-stable: the parser authors it; the emitter re-emits it
  // only when non-empty.
  repeated string depends_on = 4;
  // ── THE EXCLUSION MARKER, WITH ITS REASON WELDED ON ────────────────────────
  // A NON-EMPTY value EXCLUDES this step from a resolved run of the set, and
  // the value IS the written justification. EMPTY (the proto3 default) ⇒ the
  // step runs, so no bundle that does not author this field changes behavior,
  // and the emitter re-emits it byte-identically.
  //
  // WHY A STRING AND NOT A `bool disabled`. A bool can be flipped in a diff
  // with no explanation; this field cannot be set at all without writing down
  // WHY, in the text a reviewer reads. An exemption that costs nothing to grant
  // is an exemption nobody audits.
  //
  // WHAT EXCLUSION MEANS FOR THE DAG (the topology contract, the whole point).
  // The step is NOT deleted from the graph, it is CONTRACTED out of it: every
  // step that `depends_on` an excluded step inherits that step's OWN deps in
  // its place. So excluding a fan-out app step leaves the downstream fan-in
  // join still transitively ordered after everything the excluded step waited
  // for: an excluded step can never REORDER the DAG, only remove a node from
  // it. The step also stays AUTHORED in the bundle: it keeps its image, its
  // env wiring, and its place in the one journey, so a topology check still
  // sees it and re-including it is deleting one line, not re-deriving a
  // fan-out step.
  //
  // A step that names ITSELF excluded is still a real step for every non-run
  // purpose (schema validation, topology checks, the emitter). Exclusion is a
  // property of a RUN's resolution, not of the authored graph.
  string excluded_because = 5;
  // ─── ★ THE SERVICE AXIS: WHICH SERVICE THIS STEP'S `SELF` MEANS ───────────
  //
  // WHICH service in this bundle this step is ABOUT (a logical
  // `ServiceSpec.name`). It is the subject of every SELF-scoped resolution the
  // step performs: the `http_check` host, and the `VALUE_FROM_DEPLOY_URL` that
  // an `env` / `args` entry of its `run_container` resolves.
  //
  // ⚠ WHY IT EXISTS: THE SAME HOLE `BundleEnvVar.service` CLOSES, ONE LEVEL UP.
  // A `Wave` is BUNDLE-scoped and has no service axis, so without this field a
  // wave's validate steps have no way to say which service they probe.
  // `VALUE_FROM_DEPLOY_URL` means "THIS service's own converged URL"; in a
  // bundle with one service that is well-defined, in a bundle with several it
  // is not, and resolving it to "the first observed URL" would point EVERY
  // step in the DAG at the first service. Both wrong answers then read as a
  // verdict about the service the step is named for:
  //   * a 401 from the first service's CONTAINER (it does not serve the probed
  //     path unauthenticated); because a container answered, a "service
  //     reachable" row passes, so the gate reports "up and unhealthy" about a
  //     service it never spoke to.
  //   * a 403 from the Cloud Run EDGE for a step whose `runtime_identity`
  //     holds `run.invoker` on the service it MEANT and not on the first one.
  //
  // EMPTY (the proto3 default) ⇒ the step is about the ONE service whose URL
  // this deploy observed. If MORE THAN ONE was observed the resolution
  // REFUSES, naming the step and the candidates: the decided default is a loud
  // refusal, not "the first service". A single-service bundle is unambiguous,
  // which is what keeps every single-service bundle byte-identical and this
  // field optional.
  //
  // A name that matches no declared service REFUSES, and so does one naming a
  // service that composes no served node (a SHARED_INFRASTRUCTURE service's
  // artifact is a database: it has no URL, so a step addressed to it could
  // never dial anything).
  string service = 7;
}

// ─── One deployment wave (an ordered environment + gates) ────────────────────
//
// One environment in the ordered promotion sequence, plus its validation
// gates. A deploy IS a pipeline wave. `env` is a LOGICAL SYMBOL ONLY: it names
// no cloud specifics; the Environment registry (`environment.proto`) binds the
// symbol to a concrete environment per installation.
message Wave {
  // The logical environment symbol (e.g. "dev" / "staging" / "prod"), bound
  // to a concrete environment by the registry (`environment.proto`), NOT a
  // cloud primitive. An empty-`validate` wave (e.g. `prod`) is a promotion
  // gated by the PREDECESSOR wave passing.
  string env = 1;
  // The validation/test steps that gate promotion past this wave (any number).
  repeated ValidateStep validate = 2;
  // The PER-WAVE API-EDGE staging toggle (a bool on Wave, the
  // wave-as-promotion-unit shape): the `AppSpec.inbound: CLIENT` edge node is
  // composed for THIS wave's env iff this is true. Default FALSE: an
  // unconditional bundle-global flip would stand up the production edge, and
  // could implicitly cut clients over, on the first unrelated promotion. Turn
  // it on for a pre-production wave first, production last.
  bool api_edge_enabled = 3;
  // The PER-WAVE ENV-VAR OVERRIDES: the per-ENV deploy config that is NOT
  // `${project}`-derivable (an OAuth client id is a registered per-env value; a
  // vanity callback host is the env's web domain, not the GCP project id). When
  // the composer composes the wave whose `env` matches, each entry here
  // OVERRIDES the spec-level `env {}` value of the SAME `name` on the Config
  // node (literal-`value` arm only: a `value_from` / `service_ref` override is
  // ignored). The spec-level `env {}` holds the env-NEUTRAL default; this
  // supplies the env-correct value. EMPTY (the default) ⇒ the spec-level value
  // stands ⇒ byte-identical compose for every bundle that authors no override.
  // This lives on Wave (next to `api_edge_enabled`) because it is per-ENV
  // deploy config, exactly like the edge toggle, with no cross-tier
  // environment-registry plumbing.
  repeated BundleEnvVar env_override = 4;

  // ─── ★ THE PER-WAVE PARAMETER OVERRIDES ───────────────────────────────────
  // The per-ENV parameter binding, mirroring `env_override` above exactly. When
  // the composer composes the wave whose `env` matches, an entry here
  // OVERRIDES the spec-level `parameters` entry of the SAME `name`: the spec
  // level holds the env-NEUTRAL declaration (type, required, description,
  // constraints), this supplies the env-CORRECT value.
  //
  // ⚠ PER-ENV BINDING IS NOT OPTIONAL. Without a per-env home, a per-env value
  // such as a callback host ends up committed as a placeholder string in the
  // spec: an unconfigured required input that became a plausible string
  // instead of a refusal.
  //
  // EMPTY (the default) ⇒ the spec-level declaration stands ⇒ byte-identical
  // compose for every bundle that authors no override.
  repeated AppParameter parameter_override = 5;

  // ─── ★ THE CONTROL PLANE THIS ENV'S PEER EDGES TRUST ──────────────────────
  //
  // The `iss` an `EDGE_CALLER_CLASS_PEER_INTERNAL` edge in THIS env requires,
  // and the authority whose key set it fetches
  // (`<issuer>/.well-known/identity-jwks.json`, DERIVED by `identity_jwks_uri`,
  // never authored beside it: one field, one authority; a separate JWKS field
  // would let an edge verify signatures against control plane A while its
  // `x-google-issuer` named control plane B).
  //
  // ⚠ IT LIVES ON `Wave` BECAUSE IT IS PER-ENV, exactly like
  // `api_edge_enabled` and `env_override` beside it: each env's peers must
  // trust that env's own control plane. A bundle-global issuer would point one
  // env's edges at another env's control plane, a cross-environment trust the
  // schema should not be able to express. The composer reads the wave whose
  // `env` matches and no other, so it cannot.
  //
  // EMPTY (the default) ⇒ this env composes no peer-authenticated edge; a
  // service that authored `PEER_INTERNAL` and lands in a wave with no issuer is
  // a REFUSAL at compose, never a silently-public edge.
  string peer_identity_issuer = 6;

  // ─── ★★ THE AUTHENTICATED DEVELOPER-ACCESS PRINCIPAL: NON-PRODUCTION ONLY ──
  //
  // WHAT IT IS, said plainly: a SECOND accepted credential on a peer-only edge
  // in a non-production environment, so a named human operator can call an
  // internal service directly instead of having to stand up a peer to do it. It
  // relaxes the PEER-ONLY restriction. It does NOT relax authentication: the
  // value is a service-account email, and the edge accepts only a token
  // SELF-SIGNED by that account against that account's own published key set.
  // Minting one requires `roles/iam.serviceAccountTokenCreator` on it, which is
  // an IAM grant an operator holds and the internet does not. An
  // unauthenticated request is refused under this mode exactly as it is
  // without it.
  //
  // ⛔⛔ WHAT IT WOULD COST IF IT REACHED PRODUCTION, STATED SO NOBODY HAS TO
  // INFER IT. A production peer edge carrying this accepts every token that
  // account can sign, so the set of people who can call the production control
  // plane's internal services directly becomes the set of people holding
  // tokenCreator on one service account, forever, silently, and with no
  // per-call record that distinguishes them from a legitimate peer. It converts
  // an edge whose caller set is "the other services in this deployment" into
  // one whose caller set is "an IAM binding". THAT IS WHY IT CANNOT BE AUTHORED
  // FOR A PRODUCTION ENV AND WHY THE REFUSAL IS AN ERROR RATHER THAN A DROP:
  // silently composing it away for production would make an authored-and-
  // ignored field look like a working one, and the next reader would widen
  // the allow-list to "fix" it.
  //
  // ⛔ THE ENV GATE IS AN ALLOW-LIST AND FAILS CLOSED. The composer refuses
  // this field for ANY env not on its developer-access-eligible list, not a
  // deny-list of production names, because a deny-list admits every
  // environment nobody remembered to add to it, and the one it would admit
  // first is the next production environment. A wave IS an env, so composing
  // the production env reads the production wave and only that wave; authoring
  // this on the production wave is a compose-time ERROR, and authoring it on an
  // eligible wave composes NOTHING into the production manifest.
  //
  // EMPTY (the default) ⇒ byte-identical composition, in every env.
  string developer_access_principal = 7;

  // ─── ★★ THE PER-WAVE WEB FRONT-DOOR TOPOLOGY ──────────────────────────────
  //
  // The env-CORRECT front-door declaration for THIS wave: the field that lets
  // ONE frontend bundle carry every environment's front door, instead of one
  // bundle per environment purely because a bundle has ONE `spec`.
  //
  // ⛔⛔ IT IS **TOTAL**, NOT A MERGE, AND THAT IS THE WHOLE DESIGN.
  // When a wave authors this, that wave's ENTIRE front-door topology comes from
  // it and the bundle-level `AppSpec.web_*` topology fields MUST be empty:
  // `validate_bundle` refuses a bundle that authors both, and refuses a
  // STATIC_FRONTEND wave that authors neither once any sibling wave overrides.
  //
  // WHY NOT A FIELD-BY-FIELD MERGE ("non-empty replaces"): **a merge cannot
  // express ABSENT**, and ABSENT is the axis on which environments actually
  // differ. A pre-production front door typically routes paths a production
  // one does not (docs, liveness, webhooks, a DENY rule for a path that must
  // stay closed), so production's table is not the pre-production table with
  // blanks; it is a SHORTER TABLE. Under a merge an empty `web_route_rules` on
  // the override reads as *inherit*, so the shorter table could never be
  // authored at all. It is the same reason `Wave.env_override` is ruled out for
  // this (a `getenv`-shaped channel has no spelling for absent).
  //
  // ⚠ AND IT DELIBERATELY CARRIES **TOPOLOGY ONLY**. The per-env runtime-config
  // values of a frontend (its client SDK keys, its push key, its api origin)
  // ride `Wave.env_override` (field 4), the field that is ALREADY the
  // precedent for "the spec holds the env-neutral default, the wave supplies
  // the env-correct value". Folding them in here would create a SECOND
  // runtime-config override channel whose applicability depends on the
  // bundle's KIND. Two concepts, the two channels that already match them.
  //
  // EMPTY (the default) ⇒ the bundle-level `spec.web_*` stands ⇒ BYTE-IDENTICAL
  // compose for a bundle that omits it (additive-safe; field 8).
  WebFrontendOverride web_override = 8;

  // ─── ⭐ THE PER-SERVICE API-EDGE ALLOW-LIST ───────────────────────────────
  //
  // The services whose edge THIS wave composes, by service name. It exists
  // because `api_edge_enabled` (3) is PER-WAVE, and turning it on for one
  // service's door (for example a job manager's heartbeat door) would ALSO
  // compose every other service's client edge in the bundle, and adopt and
  // REPLACE any live gateway config those edges already have. A per-service
  // list turns on exactly the door the wave means.
  //
  // ⛔ EXCLUSIVE WITH `api_edge_enabled`: a wave stating both would have two
  // answers to "which edges does this wave compose", and the union and the
  // intersection are both plausible readings of it.
  //
  // ⛔ DECLARED AHEAD OF ITS COMPOSITION: `validate_bundle` REFUSES a non-empty
  // list BY NAME until the per-service composition exists. EMPTY (the default)
  // ⇒ byte-identical compose.
  repeated string api_edge_services = 9;
}

// ─── ★ THE PER-WAVE WEB FRONT-DOOR TOPOLOGY (`Wave.web_override`, field 8) ───
//
// A TOTAL statement of one environment's front door. Every field mirrors the
// `AppSpec` field of the same name EXACTLY (same meaning, same conformer
// treatment), because the point is that the wave supplies the env-correct
// value for a declaration whose SHAPE does not change per env, not that a wave
// gets a different vocabulary. The static-frontend composer reads the wave
// whose `env` matches and NO other, so a bundle cannot compose one env's front
// door into another env's manifest.
//
// ⛔ THERE IS DELIBERATELY NO `web_api_fqdn` FIELD HERE.
// `web_api_service_logical_id` is env-INVARIANT, and the conformer resolves it
// inside the env's own project, which is an unforgeable cross-ENVIRONMENT
// containment; an FQDN would CREATE a per-env axis that does not exist while
// deleting that containment. Authoring an FQDN is not expressible, which is the
// intended state: a field nobody may use is worse than no field.
message WebFrontendOverride {
  // The stable name prefix every L7 primitive self-derives from
  // (`AppSpec.web_slug`, field 13). REQUIRED on an override: an empty slug on
  // the spec path falls back to `bundle.name`, and under one bundle with two
  // waves that fallback would give BOTH environments the SAME slug and stand up
  // one env's primitives in the other env's project. `validate_bundle` refuses
  // an empty slug here.
  string web_slug = 1;
  // The primary managed-cert / serving domain (`AppSpec.web_domain`, field
  // 14). REQUIRED: it is also what the wave's front-door URL resolves to as the
  // probe target, and an empty one makes every authored validate step of that
  // wave probe nothing.
  string web_domain = 2;
  // Additional cert/serving domains (`AppSpec.web_additional_domains`, 15).
  repeated string web_additional_domains = 3;
  // The uniform-expansion prefix list (`AppSpec.web_api_path_prefixes`, field
  // 16). Carried for parity so an override is a TOTAL statement of the same
  // shape; IGNORED whenever `web_route_rules` is non-empty, exactly as on the
  // spec.
  repeated string web_api_path_prefixes = 4;
  // The api ServerlessCompute node the LB's serverless NEG targets
  // (`AppSpec.web_api_service_logical_id`, field 17). ⚠ ENV-INVARIANT in
  // practice: it is on the override because the override is TOTAL, not
  // because it varies. Its stability is a property worth keeping visible per
  // wave.
  string web_api_service_logical_id = 5;
  // The COMPLETE url-map routing table for THIS env, authored verbatim
  // (`AppSpec.web_route_rules`, field 22). REQUIRED non-empty on an override:
  // an empty table is what a merge semantic would have made ambiguous, and the
  // hazard to guard is the route table quietly shrinking. A wave that genuinely
  // routes nothing to an api backend authors the DEFAULT arm alone and says so.
  repeated WebRouteRule web_route_rules = 6;
}

// ─── The continuous-deployment trigger source ────────────────────────────────
//
// One bound source that fires this app's pipeline on an event. The PRESENCE of
// ≥1 `AppBundle.triggers` is the identifier of CONTINUOUS deployment (zero
// triggers ⇒ one-shot). Multi-source fan-in: N TriggerSource entries (mixed
// self-hosted / external) all drive the SAME pipeline (this bundle's): any
// source firing runs it. The composition expands each TriggerSource into ONE
// `full_manifest.proto` Trigger node (the one-intent→N-nodes shape), all
// carrying the same `pipeline_ref` (== this bundle's name).
//
// LAYERING / NAMING NOTE (why the enums are declared HERE, not imported).
// `SourceKind` + `RegistryKind` (and the arm messages `GitPush` / `Schedule` /
// `PackagePublished`) are declared in this file INDEPENDENTLY of the
// identically-shaped-and-named types in `full_manifest.proto`'s `TriggerSpec`:
// `app_bundle.proto` is the INTENT tier; `full_manifest.proto` is the
// deliberately-STANDALONE resolved tier (it imports NO intent schema). Neither
// may import the other (that would be a layering inversion: the synthesized
// output is not a dependency of the authored input). The two files declare
// different packages (`komira.bundle.v1` here, `komira.manifest.v1` there),
// so `komira.bundle.v1.SourceKind` and `komira.manifest.v1.SourceKind` are
// different symbols: the same name means a different thing in the intent and
// resolved tiers, and both files can be compiled by one protoc. The
// composition translates the intent-tier enum ordinal to the resolved-tier
// enum ordinal (identical ordinals by construction) when it emits each Trigger
// node.
enum SourceKind {
  // Proto3 zero default. UNSPECIFIED is an authoring error (fail-fast).
  SOURCE_KIND_UNSPECIFIED = 0;
  // A repository on our OWN self-hosted git service (impl named only in the
  // conformer: no vendor token here).
  SOURCE_KIND_GIT_SELFHOSTED = 1;
  // A repository on an EXTERNAL third-party git host (impl named only in the
  // conformer: no vendor token here).
  SOURCE_KIND_GIT_EXTERNAL = 2;
}

// The package-registry class a PACKAGE_PUBLISHED trigger watches (the GENERIC
// class; the concrete registry host is named only in the conformer). Grows
// ADDITIVELY.
enum RegistryKind {
  // Proto3 zero default. UNSPECIFIED is an authoring error (fail-fast).
  REGISTRY_KIND_UNSPECIFIED = 0;
  // A package published to an EXTERNAL third-party package registry.
  REGISTRY_KIND_GITHUB_PACKAGES = 1;
  // A package published to our OWN package registry.
  REGISTRY_KIND_CODEWORKS = 2;
}

// ─── The trigger ARMS: one message per kind of thing that can fire ───────────
//
// THE OPEN SET LIVES HERE, NOT IN AN ENUM. The closed thing to avoid is the
// PAYLOAD: a flat `{source_kind, repo_ref, ref, event}` message forces every
// conceivable trigger to be a `(repo, ref)` pair. A schedule has no repo and
// no ref; a published package has a package name and a version range. Adding
// `string cron` next to `repo_ref` on a flat message is exactly what makes a
// set NOT open: each new kind contributes more mutually-exclusive flat fields
// that no validator can check and no reader can interpret.
//
// So: one arm per kind, each carrying ONLY its own fields. A new trigger kind
// is a new message + a new arm, and every existing arm is untouched.

// A push (commit) to a tracked git ref fires the machine.
message GitPush {
  // The GENERIC source host class (no vendor token).
  SourceKind source_kind = 1;
  // The repository handle this source binds.
  string repo_ref = 2;
  // The git ref (branch/tag) tracked (e.g. "main"). (Mojo field name: `ref_`;
  // `ref` is a Mojo keyword the codegen escapes; wire/JSON name stays `ref`.)
  string ref = 3;
}

// A wall-clock cadence fires the machine. This is the arm a periodic
// MERGE-FROM-LIVE is authored as: it is what keeps security patches flowing to
// a deployment nobody is actively releasing to.
//
// ⚠ WHO EVALUATES THIS. The deploy CLI DECLARES a schedule; it never RUNS one:
// it is a one-shot CLI with no daemon and no timer. The control plane evaluates
// the cadence against the per-deployment clock it already keeps, driven by
// the ONE cloud tick the install already has. There is deliberately NO per-customer cloud timer: that
// would be N_orgs x M_apps scheduler jobs to provision, bill and reconcile.
message Schedule {
  // A 5-field cron expression (`m h dom mon dow`): the CADENCE, not a
  // wall-clock appointment. The control plane derives an INTERVAL from it and
  // advances the per-deployment clock by that interval; it does not fire at the
  // named instant. A `@weekly`-equivalent (`0 6 * * 1`) is the merge-from-live
  // default.
  string cron = 1;
  // The IANA timezone the cron is interpreted in (e.g. "UTC"). EMPTY ⇒ UTC.
  string timezone = 2;
}

// A package published to a watched registry fires the machine. Structurally a
// webhook, exactly like GitPush: NOT a poll.
message PackagePublished {
  // The GENERIC registry class (no vendor token).
  RegistryKind registry_kind = 1;
  // The package handle watched (e.g. "acme/widget").
  string package_ref = 2;
  // The version range that fires (e.g. "^2.0.0"). EMPTY ⇒ any published
  // version.
  string version_range = 3;
}

// ─── One authored trigger on this release machine ────────────────────────────
//
// Fields 1-4 held a flat git-shaped payload (`source_kind`, `repo_ref`, `ref`,
// `event`) and are RESERVED, never to be reused.
//
// There is no separate event enum. It would be a SECOND axis cross-producted
// against `SourceKind`, and most of the cross product is nonsense
// (`GIT_SELFHOSTED` x `SCHEDULE`?). The ARM IS THE EVENT: `git_push` fires on a
// push, `schedule` fires on a cadence. There is nothing left for it to say.
message TriggerSource {
  reserved 1, 2, 3, 4;
  reserved "source_kind", "repo_ref", "ref", "event";

  // The trigger's SYMBOL: how a human and a log line name this trigger, unique
  // within the machine. A trigger is addressable (that is what "first-class"
  // buys), not only describable by its repo handle, which a schedule does not
  // have.
  string name = 5;

  // ── THE OPEN SET ──────────────────────────────────────────────────────────
  // Exactly one arm. Arms grow ADDITIVELY; adding one touches no existing arm.
  oneof on {
    // A push to a tracked git ref.
    GitPush git_push = 6;
    // A wall-clock cadence (the merge-from-live arm).
    Schedule schedule = 7;
    // A package published to a watched registry.
    PackagePublished package_published = 8;
  }
}

// ─── One named service in a multi-service app ───────────────────────────────
//
// A single AppBundle may express N NAMED services that compose into ONE
// FullManifest. Each `ServiceSpec` is a (name, kind, spec) triple: the SAME
// three shapes the top-level singular `AppBundle.kind`/`name`/`spec` carry for
// the single-service case, REPEATED so N services coexist. A `service_ref` env
// arm (BundleEnvVar) names a SIBLING service's `ServiceSpec.name`, so
// multi-service composition is the substrate the cross-service reference
// resolves against.
//
// AUTO-LIFT (the non-breaking contract, enforced by the composition/mapper):
// if `AppBundle.services` is EMPTY, the pipeline SYNTHESIZES a one-element
// services list from the singular fields (`ServiceSpec{ name: AppBundle.name,
// kind: AppBundle.kind, spec: AppBundle.spec }`), so a single-service bundle
// composes BYTE-IDENTICALLY (same node ids/order/content-address). If
// `services` is NON-EMPTY, it is AUTHORITATIVE and the singular `name`/`spec`
// are ignored (the singular `kind` still gates the top-level composition
// dispatch).
message ServiceSpec {
  // The LOGICAL service name (a sibling `ServiceRef.service` target). Every
  // derived node id is `<name>-role`/`-secret`/`-config`/`-svc`: unique per
  // service so N services' node sets never collide.
  string name = 1;
  // The service's app kind (selects the per-service composition topology).
  AppKind kind = 2;
  // The service's intent spec (image ref, port, env, scaling, compute/datastore/
  // secret intent): the SAME `AppSpec` the singular `AppBundle.spec` carries.
  AppSpec spec = 3;
}

// ─── A NAMED validation SET ─────────────────────────────────────────────────
//
// A validation set is a NAMED list of validation steps, DEFINED ONCE and
// referenced BY NAME, NOT welded to an env (`Wave.validate` couples checks to
// a promotion wave). Decoupling the checks from the env is the whole point:
// the SAME named set runs against ANY env (a test run picks the set and the
// env independently), and a pipeline STEP references a set by name too. A set
// reuses `ValidateStep` (http_check OR run_container), so a scripted
// `run_container` integration flow (bad-cred POST→401, signup POST→201, a
// bearer-sequenced CAS round-trip: the forms `http_check`'s GET+status cannot
// express) is a first-class member.
message ValidationSet {
  // The set's symbol, referenced by `PipelineStep.validation_set_refs` and by
  // a test run naming the set. Unique within the bundle.
  string name = 1;
  // The ordered validation steps (http_check | run_container). REUSES
  // `ValidateStep`, the SAME shape `Wave.validate` carries, lifted into a
  // named, env-independent set. `depends_on` still names sibling steps WITHIN
  // the set (the step-DAG edges the parallel scheduler orders by).
  repeated ValidateStep steps = 2;
  // ⛔ THE ENV RESTRICTION. WHICH envs this set may be RUN in. The
  // discriminator is a SEPARATE field from the list on purpose; see
  // `ValidationSetEnvPolicy`.
  ValidationSetEnvPolicy env_policy = 3;
  // The CLOSED list of env symbols this set may run in: meaningful ONLY under
  // `VALIDATION_SET_ENV_POLICY_ENV_ALLOWLIST`, and REQUIRED (non-empty) there.
  // Beside `ANY_ENV` it is dead text that reads as live, and with NO policy at
  // all it is an allowlist nothing consults; `validate_bundle` refuses both.
  repeated string envs = 4;
}

// ─── The env-restriction POLICY of a `ValidationSet` ────────────────────────
//
// ⛔ REFUSE, NOT DEFAULT, and this enum exists ONLY so that "this set is safe
// anywhere" has to be SPELLED. A lone `repeated string envs` whose ABSENCE
// meant "every env" would leave a destructive set (for example one that
// self-provisions a real account on a live front door and then CASCADE-DELETES
// the org) one forgotten line away from the production tenant. Absent and
// empty are the SAME BYTES to a repeated field, so the discriminator is lifted
// OUT of the list into its own field, where the zero value is an authoring
// ERROR rather than a permission.
//
// ⚠ WHERE THE REFUSAL BITES, AND WHY IT IS STILL ADDITIVE. UNSPECIFIED is
// refused at the JOIN: the moment a `PipelineStep` that RUNS sets
// (`STEP_KIND_DEPLOY_AND_VALIDATE` / `STEP_KIND_TEST`) names the set. That is
// precisely where the absence would otherwise become a silent "any env", and
// it leaves a set no pipeline step references byte-identically legal, so this
// is a field the format GREW, not a migration every bundle must answer.
//
// ⚠ THE RESIDUAL, STATED RATHER THAN HIDDEN: an ad-hoc test run that names a
// set and an env resolves the set by name with no env in hand, and so consults
// nothing here. The AUTHORED path is closed; the ad-hoc operator path is not.
enum ValidationSetEnvPolicy {
  // Proto3 zero. NOT "any env": an authoring error at the point of reference.
  VALIDATION_SET_ENV_POLICY_UNSPECIFIED = 0;
  // The set is safe in ANY env, stated deliberately. `envs` must be EMPTY.
  VALIDATION_SET_ENV_POLICY_ANY_ENV = 1;
  // The set may run ONLY in the envs `envs` names. `envs` must be NON-EMPTY.
  VALIDATION_SET_ENV_POLICY_ENV_ALLOWLIST = 2;
}

// ─── The pipeline-STEP kind ──────────────────────────────────────────────────
//
// A pipeline step's KIND: the verb it performs. These are the VERBS
// (build/stage/deploy/deploy_and_validate/test) lifted to step kinds: a
// pipeline definition is an ordered list of steps, each `{step_kind, env(s),
// validation-set ref(s)}`. VOCABULARY: "STEP", never "stage": the
// `STEP_KIND_STAGE` value names the artifact-staging VERB (one step kind), NOT
// the pipeline unit (which is always a "step"). Grows ADDITIVELY.
enum StepKind {
  // Proto3 zero default. UNSPECIFIED is an authoring error (fail-fast).
  STEP_KIND_UNSPECIFIED = 0;
  // Build the bundle's named artifact(s) + resolve the immutable digest(s).
  STEP_KIND_BUILD = 1;
  // Stage (artifact-staging VERB): copy the built artifact BY DIGEST into the
  // target env's registry/bucket + record the staged ref. The one step kind the
  // reserved word `stage` names (NOT the pipeline unit).
  STEP_KIND_STAGE = 2;
  // Deploy (apply + converge) to the target env(s). No validation gate.
  STEP_KIND_DEPLOY = 3;
  // Deploy + run the step's validation-set(s) against the step's env as the
  // in-step promotion gate (the `validate` verb, step-bound).
  STEP_KIND_DEPLOY_AND_VALIDATE = 4;
  // Test: run the step's named validation-set(s) against the target env,
  // decoupled from a deploy (the `test` verb, as a pipeline step).
  STEP_KIND_TEST = 5;
}

// ─── One pipeline STEP ───────────────────────────────────────────────────────
//
// A step = `{step_kind, target env(s), validation-set ref(s)}`. It compiles
// down to the pipeline runtime's stage-execution rows: the authoring layer
// does NOT duplicate the runtime, it authors ON TOP of it.
// `validation_set_refs` name `ValidationSet.name`s (resolved at synthesis); a
// build/stage/deploy step references NO set (empty). The
// `deploy_and_validate` / `test` kinds reference ≥1 set: the checks that gate
// (deploy_and_validate) or that run ad-hoc (test) against the step's env(s).
message PipelineStep {
  // The step's kind (the verb it performs).
  StepKind step_kind = 1;
  // The target env symbol(s) this step acts on, bound to concrete environments
  // by the registry (`environment.proto`), NOT a cloud primitive. Typically
  // one; a fan-out (e.g. deploy to N regions) is ≥1.
  repeated string envs = 2;
  // The named validation-set(s) this step runs (each names a
  // `ValidationSet.name`). EMPTY for build/stage/deploy; ≥1 for
  // deploy_and_validate / test.
  repeated string validation_set_refs = 3;
  // The NAME of a matrix this step fans over (names an
  // `AppBundle.matrices[].name`). EMPTY ⇒ the step is NOT matrix-fanned. When
  // set, the pipeline expands the step into one job per SELECTED matrix cell
  // (build-all-then-validate-all on the LINEAR step chain, NOT authored here).
  // The schema, the parser and fail-closed synthesis-time validation (the ref
  // must name a declared Matrix) exist; the cell fan itself is a later stage.
  string matrix_ref = 4;
}

// ─── The pipeline: an ordered list of steps ──────────────────────────────────
//
// A `Pipeline` is an ORDERED list of `PipelineStep`s, e.g. `[build, stage,
// deploy_and_validate→staging, deploy_and_validate→prod]`. It aligns the
// deploy tool's authoring config with the pipeline runtime's step list. One
// pipeline per bundle (a singular `AppBundle.pipeline`); named multi-pipeline
// would be an additive future field.
message Pipeline {
  // The ordered steps.
  repeated PipelineStep steps = 1;
}

// ─── A device/capability MATRIX CELL ─────────────────────────────────────────
//
// One capability predicate: an (os, arch, os_version-range, artifact_kind)
// point plus EITHER a `from_build` (a NATIVE build→test cell) OR a `browser` (a
// WEB test cell). This is UNIVERSAL, usable by any `AppKind` (an API/docker
// artifact declares an `{oci}×{arm64,x86_64}` envelope exactly as a desktop app
// declares `{macos,windows,ubuntu}×{arm64,x86_64}`). The os/arch/artifact_kind
// fields MIRROR the device registry's `AppTarget` vocabulary the device
// coordinator fine-matches: a cell serializes verbatim into that predicate. NOTHING here fans a pipeline: this
// is schema + parse + fail-closed validation.
message MatrixCell {
  // The cell's symbol within its Matrix (unique per Matrix; a stable handle a
  // job/verdict references). e.g. "mac-arm64", "web-chromium".
  string name = 1;
  // The OS the cell targets: "macos" | "windows" | "ubuntu" | "android" |
  // "ios" | "web" (mirrors `AppTarget.os`). "" = any.
  string os = 2;
  // The CPU arch: "arm64" | "x86_64" | "universal" (mirrors `AppTarget.arch`).
  // The coordinator enforces this axis fail-closed against the device's arch.
  // "" = any.
  string arch = 3;
  // The OUTPUT SHAPE the cell produces/consumes: "dmg" | "zip" | "msi" |
  // "AppImage" | "apk" | "ipa" | "oci" | "library" | ... (mirrors
  // `AppTarget.artifact_kind`). "" = any.
  string artifact_kind = 4;
  // The INCLUSIVE OS-version FLOOR (a half-open range with os_version_max,
  // aligned with the device selection predicate). "" = no floor.
  string os_version_min = 5;
  // The INCLUSIVE OS-version CEILING. "" = an OPEN range (no ceiling).
  string os_version_max = 6;
  // The build target this NATIVE cell consumes: names a `BuildTarget.name`.
  // PRESENT ⇒ a NATIVE cell (build→test): the matrix fans the BUILD step over
  // it and threads the artifact into the VALIDATE cell. ABSENT ⇒ a WEB cell.
  string from_build = 7;
  // The browser this WEB cell drives: "chromium" | "firefox" | "webkit" |
  // "msedge" (the web-fan axis the coordinator fine-matches). SET ⇒ a WEB cell
  // (browser test against a deployed URL, no build). A cell is EITHER native
  // (`from_build` set) OR web (`browser` set), never both, never neither
  // (fail-closed at synthesis).
  string browser = 8;
}

// ─── A device/capability MATRIX ──────────────────────────────────────────────
//
// A NAMED set of capability cells, referenced by a `PipelineStep.matrix_ref`.
// A NEUTRAL proto block on the manifest (NOT inside any electron/builder
// config): the authored SUPPORT ENVELOPE from which the build+test
// cross-section is derived.
message Matrix {
  // The matrix's symbol, referenced by `PipelineStep.matrix_ref` (unique per
  // bundle). e.g. "desktop-support", "web-browsers".
  string name = 1;
  // The cells: the capability points this matrix declares (≥1 for a matrix
  // that any step references).
  repeated MatrixCell cell = 2;
}

// ─── A named DEPLOY OUTPUT ───────────────────────────────────────────────────
//
// A CloudFormation-style named OUTPUT a deploy bundle exposes so a downstream
// consumer (a provider definition's `coordinator_ref` / `registry_ref`, or
// another bundle) can REFERENCE it by name via the typed
// `${ref:<bundle>.outputs.<name>}` symbolic reference (resolved at synthesis:
// NOT a string template; the same "typed symbolic refs, no ${} templating"
// discipline the rest of this proto enforces for `from_build` / wave-output
// refs).
//
// SCOPE: the ONLY output kind is a SERVED-URL output: a name given to the
// observed Cloud Run URL of a served `<from_served>-svc` node, reusing the
// post-converge served-URL registry write (`service/<from_served>` → URL). No
// separate post-deploy capture step: `from_served` names the service the
// registry ALREADY stores, and `${ref:...}` reads it back via the SAME service
// registry read path.
//
// EXTENSION: the general OUTPUTS shape would add an `OutputSource
// {SERVED_URL | ARTIFACT_DIGEST | RESOURCE_REF | LITERAL}` discriminant + a
// `value` field (for LITERAL / stamped runtime values), so any bundle could
// expose arbitrary named outputs. Those are ADDITIVE new field numbers (≥3):
// this shape (`name`=1, `from_served`=2) is forward-compatible with that
// extension.
message DeployOutput {
  // The output's symbol: the `<name>` in `${ref:<bundle>.outputs.<name>}`.
  // Unique within the bundle (fail-closed on a duplicate). e.g. "endpoint".
  string name = 1;
  // SERVED-URL source: names the served `<from_served>-svc` node in THIS bundle
  // whose observed Cloud Run URL this output exposes. Validated fail-closed at
  // synthesis: it MUST name a real served service the bundle composes. The
  // referenced URL is resolved from the service registry
  // (`service/<from_served>` → URL), the SAME store the post-converge write
  // fills.
  string from_served = 2;
}

// ─── The intent bundle (the top-level `AppBundle`) ───────────────────────────
//
// The whole authored intent: the tier-1 surface. Stated ONCE; every downstream
// artifact (the synthesized FullManifest, each wave's steps) references these
// symbols, never restates them ("defined once, plumbed through").
message AppBundle {
  // The app kind (API | STATIC_FRONTEND | DATA_PIPELINE | SEARCH_CLUSTER | ...):
  // selects the composition topology.
  AppKind kind = 1;
  // The service name, stated ONCE; every downstream artifact references it.
  string name = 2;
  // The named build targets (multi-artifact: service, integ tests, base image).
  repeated BuildTarget build = 3;
  // The intent spec (image ref, port, env, scaling, compute/datastore/secret
  // intent).
  AppSpec spec = 4;
  // The ordered deployment waves (environments + their validation gates).
  repeated Wave waves = 5;
  // The continuous-deployment trigger sources. ZERO ⇒ one-shot (run the
  // pipeline once, no standing trigger); ≥1 ⇒ continuous (each source fans in
  // onto this bundle's pipeline; any source firing runs it).
  repeated TriggerSource triggers = 6;
  // The NAMED services this bundle composes. EMPTY ⇒ AUTO-LIFT: the pipeline
  // synthesizes a one-element list from the singular `name`/`kind`/`spec`
  // (byte-identical single-service output). NON-EMPTY ⇒ AUTHORITATIVE: N
  // services coexist in ONE FullManifest, each with its own `<name>-*` node
  // set; the singular `name`/`spec` are ignored. Like every field from 7 on,
  // appended at the highest number so it neither displaces nor bleeds into the
  // existing fields; a code site that constructs `AppBundle` positionally must
  // be updated with it.
  repeated ServiceSpec services = 7;

  // ─── env / validation-set / pipeline-step / pipeline ───────────────────────
  //
  // The NAMED validation sets: DEFINED ONCE, referenced by name (by a
  // `PipelineStep.validation_set_refs` and by a test run naming the set), NOT
  // welded to an env. EMPTY ⇒ the bundle authors no named set (the env-keyed
  // `Wave.validate` gates still work).
  repeated ValidationSet validation_sets = 8;
  // The pipeline: an ORDERED list of steps `{step_kind, env(s), set ref(s)}`.
  // The singular authoring shape (one pipeline per bundle); UNSET ⇒ no
  // authored pipeline.
  Pipeline pipeline = 9;

  // ─── The device/capability MATRICES. NAMED matrices, referenced by a
  //     `PipelineStep.matrix_ref`. A NEUTRAL block (UNIVERSAL: any AppKind may
  //     declare one). EMPTY ⇒ the bundle authors no matrix. Schema + parse +
  //     fail-closed validation; NO pipeline cell fan is emitted here. ────────
  repeated Matrix matrices = 10;

  // ─── The named DEPLOY OUTPUTS. CloudFormation-style named outputs a
  //     downstream consumer references via `${ref:<bundle>.outputs.<name>}`.
  //     EMPTY ⇒ the bundle exposes no output. Only the SERVED-URL output kind
  //     exists (it reuses the served-URL registry write); see `DeployOutput`.
  repeated DeployOutput outputs = 11;

  // ─── ★ THE RUN-TO-COMPLETION JOBS THIS BUNDLE SHIPS ───────────────────────
  // EMPTY (the default) ⇒ no job node is composed: a bundle that omits it
  // composes and re-emits BYTE-IDENTICALLY. A job is EXECUTED by a
  // `ValidateStep.execute_job` step naming it, never by being declared here:
  // see `ExecuteJob` for why those are two different acts.
  //
  // ⚠ WHY THIS IS ON `AppBundle` AND NOT ON `AppSpec`, WHERE `buckets` LIVES.
  // `AppSpec.buckets` is genuinely per-SERVICE: each bucket exists so that one
  // service's runtime identity can be granted write on it, so it belongs to the
  // service. A job is not a service's resource: an end-to-end job can run in
  // the CONTROL-PLANE project against a customer project's app, and with
  // multiple services there is no one service it would belong to. Putting it
  // here also lets `ExecuteJob.job` resolve against one flat bundle-wide
  // namespace instead of an (implicit service, name) pair.
  repeated JobSpec jobs = 12;

  // ─── ★ THE SCHEDULED CALLS INTO THIS BUNDLE'S OWN SERVICES ────────────────
  // EMPTY (the default) ⇒ no cron node is composed: byte-identical.
  //
  // On `AppBundle` for the same reason as `jobs`, plus one of its own: a
  // `CronSpec.target` names a SIBLING service by logical name, so the cron sits
  // beside the services it may reference rather than inside one of them.
  repeated CronSpec crons = 13;

  // ─── ★ RUN-SCOPED LIFECYCLE: this bundle MAY be deployed and destroyed as a
  //     throwaway run ──────────────────────────────────────────────────────────
  // UNSET (the default) ⇒ byte-identical, AND `--run-id` is REFUSED for this
  // bundle. Presence is a permission, not a preference: see `EphemeralScope`,
  // which also records the answer to the conformance-circularity question this
  // capability raises.
  EphemeralScope ephemeral = 14;

  // ─── ★ TENANCY: WHOSE CLOUD ACCOUNT THIS WORKLOAD RUNS IN ─────────────────
  //
  // The product deploys into the customer's account, so the operator sees
  // nothing of what runs there.
  //
  // ORTHOGONAL to `kind` (field 1), and the orthogonality is the point. `kind`
  // is the TOPOLOGY axis (the composer dispatches the node graph on it and
  // validation keys image-required on it), so a managed app, which is
  // topologically an API, must keep composing to the API topology. WHOSE
  // ACCOUNT it runs in is a different question, and collapsing the two into
  // one enum leaves nothing in the schema that can tell "a service we host"
  // from "an app we deploy into a customer's account".
  //
  // ⚠ IT IS A STORED FIELD, NOT ONLY A PARSE-TIME CHECK. A value the parser
  // validated and then dropped would be invisible to every consumer downstream
  // of the parse (the composer, the validator, the applier), and the deploy
  // path could not branch on it to publish instead of deploy for a managed
  // app.
  //
  // ⛔ UNSPECIFIED IS NOT A SYNONYM FOR CONTROL-PLANE. `Tenancy`'s own comment
  // says why there is no default: defaulting a new bundle to "not control
  // plane" is how a managed app reaches the operator's account, and defaulting
  // it the other way breaks every correctly-placed app. Every reader of this
  // field must branch on the CONCRETE values it cares about and leave
  // UNSPECIFIED alone, which is also what keeps a construction site that
  // passes UNSPECIFIED composing byte-identically.
  Tenancy tenancy = 15;
}
