[package]
name = "kci_reconciler"
version = "0.1.0"
description = "The provider-neutral deploy engine core of kci: reconciles a graph of desired resources against live state (plan, apply, rollback, destroy) over a write-ahead intent store, with typed outputs flowing between nodes."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.0.0"]

[dependencies]
komira_collections = { path = "../komira_collections", version = "0.1" }
komira_log = { path = "../komira_log", version = "0.1" }

[targets]
lib = { path = "src/kci_reconciler" }
tests = ["tests"]
