[package]
name = "komira-ai/metrics"
version = "0.1.0"
description = "The metrics model: per-operator metric sets, attribute-set interning, per-worker series and histogram tables with their export sweep, and the EXPLAIN ANALYZE collector and renderer."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.1.0", "1.2.0"]

[dependencies]
"komira-ai/atomic_alias" = { path = "../atomic_alias", version = "0.1" }
"komira-ai/clock" = { path = "../clock", version = "0.1" }
"komira-ai/containers" = { path = "../containers", version = "0.1" }
"komira-ai/hashing" = { path = "../hashing", version = "0.1" }
"komira-ai/name_registry" = { path = "../name_registry", version = "0.1" }

[dev-dependencies]
"komira-ai/fork_join" = { path = "../fork_join", version = "0.1" }

[native.komira_metrics_ea_flag]
kind = "static"
srcs = ["native/komira_metrics_ea_flag.c"]

[targets]
lib = { path = "src/metrics" }
tests = ["tests"]
