[package]
name = "komira-ai/test_run_id"
version = "0.1.0"
description = "A per-run id for naming the resources one test run creates, minted from the wall clock and 64 random bits, with the clock and entropy seams and their fakes."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.1.0", "1.2.0"]

[dependencies]
"komira-ai/clock" = { path = "../clock", version = "0.1" }
"komira-ai/validation_run" = { path = "../validation_run", version = "0.1" }

[targets]
lib = { path = "src/test_run_id" }
tests = ["tests"]
