[package]
name = "komira-ai/trace"
version = "0.1.0"
description = "A span tracer: per-worker span-packet rings, the Tracer, and the JSONL and in-memory span exporters."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.1.0", "1.2.0"]

[dependencies]
"komira-ai/atomic_alias" = { path = "../atomic_alias", version = "0.1" }
"komira-ai/clock" = { path = "../clock", version = "0.1" }
"komira-ai/containers" = { path = "../containers", version = "0.1" }
"komira-ai/name_registry" = { path = "../name_registry", version = "0.1" }
"komira-ai/spsc_ring" = { path = "../spsc_ring", version = "0.1" }

[dev-dependencies]
"komira-ai/fork_join" = { path = "../fork_join", version = "0.1" }
"komira-ai/runtime_paths" = { path = "../runtime_paths", version = "0.1" }

[targets]
lib = { path = "src/trace" }
tests = ["tests"]
