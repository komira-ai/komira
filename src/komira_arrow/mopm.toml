[package]
name = "komira_arrow"
version = "0.1.0"
description = "Arrow-compatible columnar types: arrays of every kind, Column, Schema, RecordBatch, Table, bitmaps, builders, typed views and selection vectors."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.0.0"]

[dependencies]
komira_atomic_alias = { path = "../komira_atomic_alias", version = "0.1" }
komira_buffer = { path = "../komira_buffer", version = "0.1" }
komira_collections = { path = "../komira_collections", version = "0.1" }
komira_compression = { path = "../komira_compression", version = "0.1" }
komira_counters = { path = "../komira_counters", version = "0.1" }
komira_simd = { path = "../komira_simd", version = "0.1" }

[targets]
lib = { path = "src/komira_arrow" }
tests = ["tests"]
