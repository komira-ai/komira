[package]
name = "komira_datetime"
version = "0.1.0"
description = "The civil calendar, timestamp text (ISO 8601, RFC 3339, HTTP-date) and IANA time zones in Mojo, with no dependencies: TZif files read into zones, UTC to local, and local to UTC with gap and fold policies the caller names."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.0.0"]

[targets]
lib = { path = "src/komira_datetime" }
tests = ["tests"]
