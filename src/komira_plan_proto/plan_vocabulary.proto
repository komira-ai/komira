  _DT_BOOL = 1;
  _DT_INT8 = 2;
  _DT_INT16 = 3;
  _DT_INT32 = 4;
  _DT_INT64 = 5;
  _DT_UINT8 = 6;
  _DT_UINT16 = 7;
  _DT_UINT32 = 8;
  _DT_UINT64 = 9;
  _DT_FLOAT16 = 10;
  _DT_FLOAT32 = 11;
  _DT_FLOAT64 = 12;
