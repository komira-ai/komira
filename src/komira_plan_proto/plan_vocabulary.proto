// ----------------------------------------------------------------------
// The closed SourceVariant union's arm tag. Most arms are carried by
// SOURCE_VARIANT_BINDING; the two concrete arms that remain are the
// EXEMPT rows below.
// Derived from: src/komira_scan_source/source_variant.mojo
// Engine prefix: SOURCE_VARIANT_
//
// EXEMPT — declared by the engine, deliberately NOT on the wire.
// The number is RESERVED so nothing can take it; the reason is
// the debt, and the row disappears when the debt is paid.
//   SOURCE_VARIANT_IN_MEMORY: InMemorySource holds `data: ArcPointer[Slab[RecordBatch]]` — LIVE
//     HEAP DATA INSIDE THE IR. A plan carrying this arm is a container
//     of the data, not a description of work, and cannot be written to
//     bytes at all. The row disappears when the arm does
//   SOURCE_VARIANT_PARQUET: ParquetSource carries `_mtime_ns`, an ENVIRONMENT-local filesystem
//     observation that differs across machines, so the arm's identity is
//     not portable as-is. SOURCE_VARIANT_BINDING is the portable
//     replacement and is already the majority arm
// ----------------------------------------------------------------------
enum SourceVariantTag {
  SOURCE_VARIANT_WIRE_UNSPECIFIED = 0;
  SOURCE_VARIANT_JSON = 3;
  SOURCE_VARIANT_CSV = 4;
  SOURCE_VARIANT_ARROW_UNCOMPRESSED = 5;
  SOURCE_VARIANT_ARROW_LZ4_FRAME = 6;
  SOURCE_VARIANT_ARROW_ZSTD = 7;
  SOURCE_VARIANT_ORC = 8;
  SOURCE_VARIANT_AVRO = 9;
  SOURCE_VARIANT_BINDING = 10;
  reserved 1;  // SOURCE_VARIANT_PARQUET
  reserved 2;  // SOURCE_VARIANT_IN_MEMORY
}

