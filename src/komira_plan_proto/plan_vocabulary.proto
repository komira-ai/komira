// The plan wire's enumerated tag vocabulary. It mirrors the engine's
// `comptime` tag declarations in the core packages (each enum below names the
// file it is derived from) and src/komira_plan_wire/plan_wire_vocabulary.mojo,
// which holds the same wire numbers. There is no generator in this
// repository: a tag added to the engine must be added here by hand, with the
// same wire number as in `plan_wire_vocabulary.mojo`.
// src/komira_plan_wire/tests/test_plan_wire_vocabulary.mojo checks that the
// Mojo vocabulary is complete against the engine's own tag counts, and
// src/komira_plan_wire/tests/test_plan_wire_vocabulary_names.mojo compares it
// to this file as protoc reads it: every name, which numbers decode, and that
// both directions refuse the numbers reserved below.

syntax = "proto3";

package komira.plan.v1;

// The plan IR's WIRE VOCABULARY: every enumerated tag space a
// LogicalPlan node or Expr node can name, as a proto3 enum.
//
// WIRE NUMBER = ENGINE VALUE + 1. Wire 0 is *_WIRE_UNSPECIFIED in
// every space, because proto3 cannot distinguish an absent enum
// field from an explicit zero — and engine tag 0 is a real tag in
// every one of these spaces (PLAN_SCAN, EXPR_COL_REF, AGG_SUM,
// JOIN_INNER, ...). Without the offset, a message with a MISSING
// tag would decode as a valid plan node.
//
// A reader MUST fail loud on wire 0 and on any value it does not
// know: a plan you cannot execute is not a plan you may
// partially execute.

// ----------------------------------------------------------------------
// LogicalPlan node kind. ONE declaration site, logical_plan.mojo (0-15).
// 16-17 were the ROW<->COLUMN converts and are DELETED; their numbers
// stay burned.
// Derived from: src/komira_plan_ir/logical_plan.mojo
// Engine prefix: PLAN_
// ----------------------------------------------------------------------
enum PlanTag {
  PLAN_WIRE_UNSPECIFIED = 0;
  PLAN_SCAN = 1;
  PLAN_FILTER = 2;
  PLAN_PROJECT = 3;
  PLAN_AGGREGATE = 4;
  PLAN_JOIN = 5;
  PLAN_SORT = 6;
  PLAN_LIMIT = 7;
  PLAN_DISTINCT = 8;
  PLAN_TOPN = 9;
  PLAN_PARTITION_BY = 10;
  PLAN_PARTITION_TOPN = 11;
  PLAN_ASOF_JOIN = 12;
  PLAN_UNION = 13;
  PLAN_VIEW_REF = 14;
  PLAN_CSE_REF = 15;
  PLAN_CAST_TO_VARCHAR = 16;
  reserved 17;  // PLAN_CONVERT_COLUMN_TO_ROW
  reserved 18;  // PLAN_CONVERT_ROW_TO_COLUMN
}

// ----------------------------------------------------------------------
// Expr node kind. EXPR_CORRELATED_SUBQUERY is the only cross-edge from
// the expression tree back into the plan tree.
// Derived from: src/komira_plan_expr/expr.mojo
// Engine prefix: EXPR_
//
// EXEMPT — declared by the engine, deliberately NOT on the wire.
// The number is RESERVED so nothing can take it; the reason is
// the debt, and the row disappears when the debt is paid.
//   EXPR_BETWEEN: declared with no payload field on Expr — the SQL frontend desugars
//     BETWEEN into two comparisons, so no Expr in the tree carries this
//     tag
//   EXPR_SORT_KEY: declared with no payload field on Expr — sort keys live on
//     SortData/TopNData, not as an Expr arm
// ----------------------------------------------------------------------
enum ExprTag {
  EXPR_WIRE_UNSPECIFIED = 0;
  EXPR_COL_REF = 1;
  EXPR_COL_IDX = 2;
  EXPR_LITERAL = 3;
  EXPR_BINARY_OP = 4;
  EXPR_UNARY_OP = 5;
  EXPR_CAST = 6;
  EXPR_ALIAS = 7;
  EXPR_STRING_OP = 8;
  EXPR_WHEN = 9;
  EXPR_IN_LIST = 10;
  EXPR_AGG_FN = 13;
  EXPR_WINDOW_FN = 14;
  EXPR_CORRELATED_SUBQUERY = 15;
  EXPR_REGEXP = 16;
  EXPR_STRUCT_FIELD = 17;
  EXPR_STRUCT_FIELD_IDX = 18;
  EXPR_MAP_GET = 19;
  EXPR_JSON_EXTRACT = 20;
  EXPR_EXTRACT = 21;
  EXPR_MATH_FN = 22;
  EXPR_MATH_FN2 = 23;
  EXPR_SUBSTRING = 24;
  EXPR_STRING_FN = 25;
  EXPR_UDF_CALL = 26;
  EXPR_STRING_FN_N = 27;
  reserved 11;  // EXPR_BETWEEN
  reserved 12;  // EXPR_SORT_KEY
}

