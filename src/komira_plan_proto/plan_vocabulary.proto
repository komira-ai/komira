// ----------------------------------------------------------------------
// `WireWriteTarget.format` — the file format a write envelope asks for.
// Three members, one per SDK file sink family (parquet / csv / jsonl;
// DuckDB spells the third `FORMAT 'json'`). ⚠ A DECODER MUST NOT STOP AT
// THIS SPACE: validity is a property of the (format, compression) PAIR,
// and `write_target_supported` in the same file is the one table that
// decides it. Snappy is parquet-only, so (WFMT_CSV, WCOMP_SNAPPY) is two
// valid members and no sink.
// Derived from: src/komira_arrow/write_target.mojo
// Engine prefix: WFMT_
// ----------------------------------------------------------------------
enum WriteFormat {
  WFMT_WIRE_UNSPECIFIED = 0;
  WFMT_PARQUET = 1;
  WFMT_CSV = 2;
  WFMT_JSONL = 3;
}

// ----------------------------------------------------------------------
// `WireWriteTarget.codec` — the compression a write envelope asks for. ⚠
// A WRONG VALUE HERE IS A WRONG FILE, NOT A DECODE FAILURE: the
// destination path is carried verbatim beside it, so a codec that
// decoded as GZIP where the producer meant ZSTD puts the other codec's
// bytes at a path named for this one — invisible to a row count and to a
// wall clock alike, which is the hazard `plan_write._sink_tag_for`'s own
// docstring names. That is why the codec crosses as a validated enum
// rather than as a bare uint32.
// Derived from: src/komira_arrow/write_target.mojo
// Engine prefix: WCOMP_
// ----------------------------------------------------------------------
enum WriteCompression {
  WCOMP_WIRE_UNSPECIFIED = 0;
  WCOMP_SNAPPY = 1;
  WCOMP_UNCOMPRESSED = 2;
  WCOMP_ZSTD = 3;
  WCOMP_GZIP = 4;
  WCOMP_LZ4 = 5;
}

// ----------------------------------------------------------------------
// ★ A DISCRIMINATOR.
// `ScalarValue._kind` selects which of the struct's payload fields is
// live, so a decoder that accepts an out-of-range kind produces a scalar
// that reads a field nothing wrote — an unvalidated tag beside flat
