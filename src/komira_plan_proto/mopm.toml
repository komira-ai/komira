[package]
name = "komira_plan_proto"
version = "0.1.0"
description = "The logical and optimized plan IR on the wire (komira.plan.v1) as Mojo structs generated from its .proto files: the plan nodes and expressions, the tag spaces and the optimized-plan header, each a codec message."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.0.0"]

[dependencies]
komira_proto_codec = { path = "../komira_proto_codec", version = "0.1" }

[targets]
lib = { path = "generated/komira_plan_proto_generated" }
tests = ["tests"]
