[package]
name = "komira_resources"
version = "0.1.0"
description = "The files a program reads at run time, found under its own share directory: a resource is named by its path, and an undeclared one is refused."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.0.0"]

[dependencies]
komira_runtime_paths = { path = "../komira_runtime_paths", version = "0.1" }

[targets]
lib = { path = "src/komira_resources" }
tests = ["tests"]
