[package]
name = "komira-ai/chat_proto"
version = "0.1.0"
description = "The chat API (komira.chat.v1) as Mojo structs generated from its .proto files, with their proto3 canonical JSON form."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.1.0", "1.2.0"]

[dependencies]
"komira-ai/proto_codec" = { path = "../proto_codec", version = "0.1" }

[targets]
lib = { path = "generated/chat_proto" }
tests = ["tests"]
