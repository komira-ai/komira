[package]
name = "kci_api"
version = "0.1.0"
description = "The kci build and release tool's one table of exit codes, outcome words, error ids, document formats, file names, release layout and platform rows."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.0.0"]

[dependencies]
komira_json = { path = "../komira_json", version = "0.1" }
komira_textproto = { path = "../komira_textproto", version = "0.1" }

[targets]
lib = { path = "src/kci_api" }
tests = ["tests"]
