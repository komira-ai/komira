[package]
name = "kci_manifest_proto"
version = "0.1.0"
description = "The kci deployment resource graph (kci.manifest.v1) as Mojo structs generated from its .proto file: FullManifest, the typed graph of resources for one environment."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.0.0"]

[dependencies]
komira_proto_codec = { path = "../komira_proto_codec", version = "0.1" }

[targets]
lib = { path = "generated/kci_manifest_proto_generated" }
tests = ["tests"]
