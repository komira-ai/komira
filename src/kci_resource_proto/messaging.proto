// The MESSAGING primitives of the kci resource catalog (`kci.resource.v1`):
// `queue`, `topic` and `subscription`.
// The field numbers are what is stored, pinned as literal wire bytes by the
// welded tests in tests/ (resource.proto says how the files are split).
// held-numbers: Queue 50-53
// held-numbers: Topic 50-53
// held-numbers: Subscription 50-53
syntax = "proto3";

package kci.resource.v1;

import "google/protobuf/duration.proto";
import "kci/resource/v1/refs.proto";

// ---- messaging: queue, topic and subscription ------------------------------------

// A queue of messages that receivers PULL: a received message is hidden from
// every other receiver until it is acknowledged or its `ack_deadline`
// passes, and then it is delivered again. A message delivered
// `max_deliveries` times without an acknowledgement moves to the
// `dead_letter` queue. Messages reach a queue by a direct SEND, or from a
// topic through a `subscription`. Its retention default is DELETE.
message Queue {
  option (portability) = PORTABLE;
  option (exposes) = NAME;
  option (exposes) = ADDRESS;

  // How long a received message stays hidden before it is delivered again,
  // in whole seconds from 10 to 300 (the range every built-in cloud honours).
  // Unset: the versioned default, 30 seconds.
  google.protobuf.Duration ack_deadline = 1;
  // The `queue` a message moves to after `max_deliveries` deliveries. Set
  // together with `max_deliveries`, or neither: with no dead-letter queue a
  // message is delivered until it is acknowledged.
  Ref dead_letter = 2;
  // From 5 to 100 (the range every built-in cloud honours). Presence: an
  // explicit 0 is told apart from "not written".
  optional uint32 max_deliveries = 3;
  // 50 to 53 are held for the per-cloud extensions (resource.proto header).
}

// A fan-out point: every message SENT to a topic is delivered to every
// queue a `subscription` connects to it. A topic holds no receivers of its
// own. Its retention default is DELETE. No field yet; 50 to 53 are held for
// the per-cloud extensions (resource.proto header).
message Topic {
  option (portability) = PORTABLE;
  option (exposes) = NAME;
  option (exposes) = ADDRESS;
}

// One edge of fan-out: every message sent to `topic` is delivered to
// `queue`. Both are required, each names a resource of its own type, and a
// (topic, queue) pair is connected once. A subscription exposes nothing and
// accepts nothing, and is deleted with its resource. 50 to 53 are held for
// the per-cloud extensions (resource.proto header).
message Subscription {
  option (portability) = PORTABLE;

  Ref topic = 1;
  Ref queue = 2;
}
