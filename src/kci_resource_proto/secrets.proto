// The SECRET primitive of the kci resource catalog (`kci.resource.v1`):
// `secret`, the container of a value kci never holds.
// The field numbers are what is stored, pinned as literal wire bytes by the
// welded tests in tests/ (resource.proto says how the files are split).
// held-numbers: Secret 50-53
syntax = "proto3";

package kci.resource.v1;

import "kci/resource/v1/refs.proto";

// ---- secrets: secret ------------------------------------------------------------

// The CONTAINER of a secret value: the provider's secret object, created with
// no value, so kci still writes none. Its value is written by an identity
// granted WRITE on it (or by a person, out of band), and read by an identity
// granted READ, which a workload names in `secret_env` through
// `SecretRef.secret`. Its NAME is the cloud's name for it. Deleting it deletes
// every version of its value, so its retention default is KEEP: removing a
// secret from the file leaves it in the cloud unless `retention: DELETE` is
// written. No field yet; 50 to 53 are held for the per-cloud extensions
// (resource.proto header).
message Secret {
  option (portability) = PORTABLE;
  option (exposes) = NAME;
}
