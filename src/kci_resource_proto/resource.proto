// The kci resource catalog (`kci.resource.v1`): what an author writes in a
// deploy action. Typed resources, each a common, cloud-agnostic shape; a
// platform adapter set linked into kci turns each one into engine nodes.
//
// V1 IS TWO TYPES: `service` and `job`. The other planned types (worker,
// table, bucket, queue, secret, site, domain, mail_relay) are not declared
// yet; their `Resource.body` numbers are held (see `Resource`), so adding one
// later is an addition, never a renumber.
//
// WHAT THIS FILE PROMISES
//   * Every field is a BEHAVIOUR (a port, a scale, a public URL, an expiry),
//     never a part of somebody's product. No vendor word appears in a
//     message, field or enum value name.
//   * The resource types are a CLOSED oneof. There is no kind string, no
//     `google.protobuf.Any` and no provider enum: which platform a graph runs
//     on is chosen by the invocation (`--platform=<id>`), never by this file.
//   * Every field that names another resource is a `Ref`. The only
//     id-bearing string is `Resource.id`. So one walk over `Ref` fields finds
//     every edge of the graph.
//
// WHAT IS NOT HERE, ON PURPOSE
//   * Identity, permissions, networks, gateways, load balancers and DNS
//     records. The platform creates them while it builds a `service` or a
//     `domain`; "this may read that" is one `Uses` line on the consumer.
//   * Stage names. A stage's list of resources lives in the release machine
//     file; no resource carries the name of a stage.
//   * The `raw` escape hatch. Field 90 of `Resource.body` is left free for
//     it; it is specified separately and not built yet.
//   * A secret RESOURCE, and secret values. A service or a job receives a
//     secret that already exists BY NAME (`SecretRef`); kci never reads,
//     writes or stores the value. No `Value` ever carries a secret: `Value`
//     field 4 stays held.
//   * Retention. It serves data-bearing types v1 does not have; `Resource`
//     field 3 is held for it.
//
// TWO MEANINGS OF "PLATFORM". `--platform=<id>` picks the deploy target (the
// adapter set kci links). `ArtifactPlatform` is an OS and a CPU: which build
// of an artifact a service or job runs. They are unrelated.
//
// Field numbers are what is stored. They are pinned as literal wire bytes by
// the welded tests in tests/; renumbering a field is protoc-legal and decodes
// stored data as the wrong field, so the tests are the guard.
syntax = "proto3";

package kci.resource.v1;

import "google/protobuf/descriptor.proto";
import "google/protobuf/duration.proto";

// ---- the catalog's one declared bit ------------------------------------------

// Whether every complete platform must host a type. PORTABLE: a complete
// platform implements it or carries a ledgered gap. PLATFORM_BOUND: partial
// coverage is legitimate, and applying it where no adapter exists is refused
// before anything is created. UNSET is never a legal marking.
enum Portability {
  PORTABILITY_UNSET = 0;
  PORTABLE = 1;
  PLATFORM_BOUND = 2;
}

extend google.protobuf.MessageOptions {
  // Marks each resource type message below (v1: `Service`, `Job`).
  Portability portability = 50001;
  // The outputs a type exposes to a `Ref`. A `Ref` asking a type for an
  // output it does not expose is refused when the graph is loaded.
  repeated Output exposes = 50002;
}

// ---- references ----------------------------------------------------------------

// What a produced value IS, never whose attribute it is. 3 and 4 are held
// for ADDRESS and NAME, which only the later data types expose.
enum Output {
  OUTPUT_UNSET = 0;
  URL = 1;
  HOST = 2;
}

// A reference to another resource of the same list. With neither arm of
// `output` set it names the resource itself (as in `Uses.target`); with
// `standard` set it names one value the resource
// produces at apply time. `named` is reserved for the escape hatch's own
// outputs and is refused for every other producer.
message Ref {
  string resource = 1;
  oneof output {
    Output standard = 2;
    string named = 3;
  }
}

// What a consumer may do to a resource. v1 has one access, CALL, which both
// v1 types accept. 2 to 6 are held for READ, WRITE, READ_WRITE, SEND and
// RECEIVE, which only the later data types accept.
enum Access {
  ACCESS_UNSET = 0;
  CALL = 1;
}

// "This resource may do `access` to `target`." The platform turns it into
// whatever its own permission system needs. `target.output` must be unset:
// access is granted to a resource, not to one of its values.
message Uses {
  Ref target = 1;
  Access access = 2;
}

// A configuration value: a literal, a release machine parameter, or a value
// another resource produces. All three are plain (not secret) values. 4 is
// held; a secret never rides a `Value` (see `SecretRef`).
message Value {
  oneof v {
    string literal = 1;
    string param = 2;
    Ref ref = 3;
  }
}

// An output of an earlier BUILD action of the release machine. A different
// namespace from `Ref`: resolved before the deploy graph exists, and never a
// graph edge.
message ActionOutput {
  string action = 1;
  string name = 2;
}

// The OS of an artifact build. v1 declares one value.
enum Os {
  OS_UNSET = 0;
  LINUX = 1;
}

// The CPU of an artifact build. v1 declares one value.
enum Cpu {
  CPU_UNSET = 0;
  X86_64 = 1;
}

// Which build of an artifact: an OS and a CPU (not a cloud; see "TWO
// MEANINGS OF PLATFORM" above). Artifacts are built per platform, so an
// `Image` states the one it needs.
//
// An unset field means its v1 default: `os` LINUX, `cpu` X86_64. That
// default is fixed; declaring more values later does not move it, because
// stored lists rely on it. In v1, linux x86_64 is the only platform a
// reader accepts: any other value (one a later schema declares, or an
// undeclared number) is refused when the graph is validated, before anything
// is created.
message ArtifactPlatform {
  Os os = 1;
  Cpu cpu = 2;
}

// What to run: a build action's output, or a literal content digest. Never a
// mutable tag. `platform` says which build: the action output of that
// platform, or, for a digest, that the digest is of that platform's single
// image (not a multi-platform index).
message Image {
  oneof source {
    ActionOutput output = 1;
    string digest = 2;
  }
  ArtifactPlatform platform = 3;
}

// A secret that already exists in the target environment's secret store,
// named, never valued. kci passes the NAME to the platform, which makes the
// secret's current value available to the container at run time; the value
// is never in this file, in kci's state or in kci's memory. Creating or
// rotating the secret is outside v1 (there is no secret resource). The map
// key of a `secret_env` field is the environment variable the container
// reads it from.
message SecretRef {
  string name = 1;
}

// ---- one entry of a deploy action's list --------------------------------------

message Resource {
  // Author-chosen and stable: the identity key for state.
  string id = 1;
  repeated Uses uses = 2;
  // 3 is held for the retention policy of data-bearing types.
  // Was a per-resource stage filter in an earlier draft. Stage differences
  // live in the release machine file.
  reserved 4;
  reserved "only_in";

  // Typed and closed. Held, not declared: 12 worker, 13 table, 14 bucket,
  // 15 queue, 16 secret, 17 site, 18 domain, 19 mail_relay; 90 the escape
  // hatch.
  oneof body {
    Service service = 10;
    Job job = 11;
  }
}

// The resources of one deploy action, in no particular order: ordering is
// derived from the `Ref`s between them.
message ResourceList {
  repeated Resource resource = 1;
}

// ---- shared shapes -------------------------------------------------------------

// Neutral sizes.
message Size {
  uint32 cpu_millis = 1;
  uint32 memory_mb = 2;
}

// Instance bounds. `min = 0` allows scaling to zero.
message Scale {
  uint32 min = 1;
  uint32 max = 2;
}

// ---- the v1 types: service and job -------------------------------------------------

// A container that answers requests, scales (to zero if allowed) and may have
// a public URL.
message Service {
  option (portability) = PORTABLE;
  option (exposes) = URL;
  option (exposes) = HOST;

  Image image = 1;
  uint32 port = 2;
  repeated string args = 3;
  map<string, Value> env = 4;
  Size size = 5;
  Scale scale = 6;
  string health_path = 7;
  // Behaviours, not products: an adapter reports a finding when the
  // platform's ceiling is lower.
  google.protobuf.Duration request_timeout = 8;
  uint32 max_concurrency = 9;

  // "A public URL" is an arm, not a gateway resource.
  oneof exposure {
    Public public = 10;
    Internal internal = 11;
  }

  // Secrets this service receives by name, keyed by environment variable.
  // A key must not also appear in `env`.
  map<string, SecretRef> secret_env = 12;

  // Reachable from outside the graph at a URL.
  message Public {}
  // No public URL; callable by other resources of this graph. Not a
  // statement about networks.
  message Internal {}
}

// A container that runs to completion, on demand or on a schedule.
message Job {
  option (portability) = PORTABLE;

  Image image = 1;
  repeated string args = 2;
  Size size = 3;
  uint32 max_retries = 4;
  google.protobuf.Duration timeout = 5;
  // Plain values only, as on `Service.env`: a literal, a parameter or
  // another resource's output. Secrets go in `secret_env`.
  map<string, Value> env = 6;
  // Secrets this job receives by name, keyed by environment variable. A key
  // must not also appear in `env`.
  map<string, SecretRef> secret_env = 7;

  oneof trigger {
    OnDemand on_demand = 10;
    Schedule schedule = 11;
  }

  message OnDemand {}
  // Part of the job, not a second resource.
  message Schedule {
    string cron = 1;
    string timezone = 2;
  }
}
