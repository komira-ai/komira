// The kci resource catalog (`kci.resource.v1`): what an author writes in a
// deploy step. The cloud adapter built into kci for the cell's cloud turns
// each resource into engine nodes.
//
// PRIMITIVES AND COMPOSITES
//   * A PRIMITIVE is one `Resource.body` arm of this file. It is 1:1 with a
//     resource kind of the major clouds, and it is the only thing a cloud
//     adapter lowers to engine nodes. Each primitive lowers to a FIXED set of
//     roles per cloud (the provider object plus at most a fixed set of
//     private helper objects that exist only for it and die with it).
//   * A COMPOSITE is DATA, not an arm of this file: a named graph of other
//     resources (primitives or other composites, to any depth) with inputs
//     and outputs. It is expanded into its primitives before lowering, so the
//     engine only ever sees primitives. Its format is composite.proto; an
//     INSTANCE of one is `Resource.body` 80, not a catalog type.
//
// THE RULE THAT DECIDES A PRIMITIVE'S SHAPE
//   * R1, a NEUTRAL primitive (PORTABLE): one type for a kind whose identity
//     (one provider object plus a fixed set of private helpers), meaning
//     (every field the author must decide means the same thing: same unit,
//     same effect, same failure) and delete (deleting it deletes the same
//     thing) match on every cloud. Differences confined to optional tuning go
//     in per-cloud extension fields; an extension may tune, never change
//     meaning.
//   * R1', a neutral primitive that is CLOUD_BOUND: R1 holds on the clouds
//     that have the kind, and the others have no equivalent at all; they
//     declare it absent by design.
//   * R2, a PROVIDER primitive (CLOUD_BOUND): one type per provider kind,
//     when R1 fails on any cloud (the objects decompose differently, the core
//     field is the provider's own language, or one provider object would be
//     shared by several owners).
//
// V1 DECLARES TWENTY PRIMITIVES: `service` 10, `container_job` 11,
// `worker` 12, `table` 13, `bucket` 14, `queue` 15, `secret` 16, `dns_zone`
// 18, `service_account` 20, `topic` 21, `schedule` 22, `network` 23,
// `registry` 24, `grant` 25, `dns_record` 26, `certificate` 27,
// `subscription` 28, `subnet` 29, `ip_address` 30 and `event_trigger` 31.
// Every other number below is HELD:
// not declared, so it decodes as an unknown field today, and declaring it
// later is an addition, never a renumber. The welded tests pin each held
// number as undeclared.
//   * `Resource.body` 17, 19 and 32 to 36: the later neutral primitives
//     (17 and 19 unused, 32 mail domain, 33 parameter, 34 encryption key,
//     35 function, 36 virtual machine).
//   * `Resource.body` 90: the `raw` escape hatch, specified separately.
//   * `Resource.body` 100-299, 300-499, 500-699 and 700-899: provider
//     primitives (R2) of four clouds, one range each.
//   * Fields 50, 51, 52 and 53 of every primitive message: its per-cloud
//     extension messages, one per cloud.
// THE HELD NUMBERS, MACHINE-READABLE. Each file of this package carries the
// `held-numbers:` lines of the messages it declares (this file's are below);
// they are what the welded test `test_held_numbers_are_unused` reads: no
// field of the named message may use a held number, and no message may reuse
// a `reserved` number. A held number leaves its line in the same change that
// declares it.
// held-numbers: Resource 5 17 19 32-36 90 100-299 300-499 500-699 700-899
// held-numbers: CompositeInstance 6
// The list of clouds is data (a cloud is a value checked against the
// built-in clouds); the four ranges and the four extension numbers are held
// for the four built-in clouds, never named by a type here.
// Provider primitives and per-cloud extensions carry provider words in their
// names. Declaring any of them changes the promise below that no vendor word
// appears in this schema, so it is a recorded decision, not an addition.
//
// THE FILES. One package, `kci.resource.v1`, in files by message family, so
// a message's wire form does not depend on which file declares it:
//   * refs.proto       the catalog's declared bit (`Portability`, the
//                      `portability` and `exposes` options) and what a
//                      resource holds of others: `Output`, `Ref`, `Access`,
//                      `CellResource`, `Retention`, `Uses`, `Value`,
//                      `StepOutput`, `Image`, `SecretRef`;
//   * compute.proto    `Size`, `Scale`, `Service`, `ContainerJob`, `Worker`;
//   * data.proto       `Table`, `FieldType`, `StorageTier`, `Bucket`;
//   * identity.proto   `ServiceAccount`, `Grant`;
//   * messaging.proto  `Queue`, `Topic`, `Subscription`;
//   * secrets.proto    `Secret`;
//   * names.proto      `DnsZone`, `RecordType`, `DnsRecord`, `Certificate`;
//   * triggers.proto   `Schedule`, `SourceEvent`, `EventTrigger`;
//   * networks.proto   `Network`, `Subnet`, `IpAddress`;
//   * artifacts.proto  `ArtifactFormat`, `Registry`;
//   * this file        `Resource`, `CompositeInstance`, `ValueMap`,
//                      `ResourceList`;
//   * composite.proto  the format of a composite definition.
//
// WHAT THESE FILES PROMISE
//   * Every field is a BEHAVIOUR (a port, a scale, a public URL, an expiry),
//     never a part of somebody's product. No vendor word appears in a
//     message, field or enum value name.
//   * The resource types are a CLOSED oneof. There is no kind string, no
//     `google.protobuf.Any` and no provider enum: which cloud a graph runs
//     on comes from the cell the stage deploys to (`--cloud=<id>`), never
//     from these files.
//   * Every field that names another resource is a `Ref`. The only
//     id-bearing string is `Resource.id`. So one walk over `Ref` fields finds
//     every edge of the graph.
//
// IDENTITY AND GRANTS
//   * A `service_account` is a workload identity. A WORKLOAD (a `service`, a
//     `container_job` or a `worker`) runs as the account its `run_as` names;
//     with no `run_as` it runs as a PRIVATE identity of its own, a helper
//     object that exists only for it and dies with it.
//   * A `grant` is one edge: `principal` may do `access` to `target` (or to
//     a resource the cell provides, `cell`). Its principal is an identity: a
//     `service_account`, or a workload with no `run_as`.
//   * `Resource.uses` is the same edge written on the grantee: on a
//     `service_account` it means "this identity may"; on a workload it
//     means "the identity I run as may". It is refused on every other
//     type. A `uses` line and a `grant` for one (principal, target)
//     pair are the same edge, so writing both is refused.
//   * Every identity a resource holds of its own also gets the edge
//     `cell LOGS WRITE` (its logs), unless the resource writes it. It is
//     lowered and printed like any other edge, never hidden.
//   * A TRIGGER (a `schedule` or an `event_trigger`) starts or calls its
//     `target` through an identity of its own: a private helper of the
//     trigger that only the cloud's scheduling or eventing service may use.
//     It gets exactly one edge, CALL on the target, lowered and printed like
//     any other edge; it is never a grant's principal, and it has no `uses`.
//
// WHAT IS NOT HERE YET, ON PURPOSE
//   * Permission sets, raw provider role bindings, federation, firewalls,
//     NAT, peering, gateways, load balancers and mail domains as resources
//     of their own.
//     Each is a later primitive at a held number above (or a provider
//     primitive).
//   * Stage names. A stage's list of resources lives in the release machine
//     file; no resource carries the name of a stage.
//   * Secret VALUES. A `secret` resource is the CONTAINER only. A workload
//     receives a secret BY REFERENCE (`SecretRef`: the name of one
//     that already exists, or a `secret` resource of the list); kci never
//     reads, writes or stores the value. No `Value` ever carries a secret:
//     `Value` field 4 stays held.
//
// RETENTION (`Resource.retention`) says whether a resource's objects are
// deleted when the resource leaves the file or the graph is destroyed. It
// is for the primitives that hold data, messages, secrets, artifacts, names
// or addresses (v1: `table`, `bucket`, `queue`, `topic`, `secret`,
// `registry`, `dns_zone`, `dns_record`, `certificate`, `network`, `subnet`
// and `ip_address`); each such type has a versioned default (KEEP for a
// table, a bucket, a secret and a registry, DELETE for the others) that
// applies while the field is unset. A workload (a
// service, a container job, a worker), a service account, a grant, a
// subscription, a schedule or an event trigger is always deleted with its
// resource, and setting retention on one is refused when the graph is
// validated. A third answer,
// "kci cannot delete this", is a capability of a cloud object, not a policy
// an author chooses, so it has no value here.
//
// METADATA (`Resource.physical_name` 6, `labels` 7, `adopt` 8) means the
// same on every type that takes it.
// `physical_name` is the cloud name of the resource's primary object; a
// `grant` (an edge: its objects are bindings) and a `dns_record` (named by
// the DNS name and type it writes) have no name of their own, so writing one
// there is refused. `adopt` (an `Adoption`) takes over the existing object of
// that name instead of refusing it as foreign, once kci has read it and
// found what the resource declares; kci never replaces an adopted object,
// never deletes one unless `adopt` is ADOPT_DELETABLE, and releases it when
// the resource leaves the list. `labels` are the author's, written beside kci's own; a key in
// kci's own label space (`kci_*`, `kci-*`) is refused. A name or a label a
// cloud refuses (a name too long or too short, a kind with no name of its
// own there, one name on two objects of one kind there, more labels than an
// object carries there) is refused as a limit of that cloud when the graph
// is validated, before anything is created.
//
// RESERVED NOW, BUILT LATER (held numbers, not declared; each is an addition
// when it lands): `Resource` 5 a typed per-cloud settings map, `Image` 4 an
// `artifact_ref { name, platform, revision }` source arm beside `output`,
// `Service` 13, `ContainerJob` 8 and `Worker` 12 a `source` that may also
// be a non-image artifact, and `Output` 5 REVISION (the cloud's own
// revision of a service, not kci's revision id). `Table` 4 an analytics replica (its meaning
// differs per cloud, so it waits for a decision). Per-cloud extensions 50 to
// 53 are held on `Service`, `ContainerJob`, `Worker`, `Table`, `Bucket`,
// `ServiceAccount`, `Grant`, `Queue`, `Topic`, `Subscription`, `Secret`,
// `DnsZone`, `DnsRecord`, `Certificate`, `Schedule`, `EventTrigger`,
// `Network`, `Subnet`, `IpAddress` and `Registry` as on every primitive.
// `SourceEvent` 3 is held for a message published to a topic. `Registry` 2
// is held for who may read a registry beyond the identities granted READ.
//
// "PLATFORM" MEANS OS + CPU AND NOTHING ELSE (`Image.platform`). The deploy
// target is the cloud, which no file here names.
//
// Field numbers are what is stored. They are pinned as literal wire bytes by
// the welded tests in tests/; renumbering a field is protoc-legal and decodes
// stored data as the wrong field, so the tests are the guard.
syntax = "proto3";

package kci.resource.v1;

import "kci/resource/v1/refs.proto";
import "kci/resource/v1/compute.proto";
import "kci/resource/v1/data.proto";
import "kci/resource/v1/identity.proto";
import "kci/resource/v1/messaging.proto";
import "kci/resource/v1/secrets.proto";
import "kci/resource/v1/names.proto";
import "kci/resource/v1/triggers.proto";
import "kci/resource/v1/networks.proto";
import "kci/resource/v1/artifacts.proto";

// ---- one entry of a deploy step's list ----------------------------------------

// `Resource.adopt`: whether kci takes over an existing object, and whether
// it may delete it. Any other value is refused when the graph is validated.
enum Adoption {
  // kci creates the object, and refuses an unstamped one of its name.
  ADOPTION_UNSET = 0;
  // Take over the object; never delete it (a destroy, or the resource no
  // longer lowering it while it stays in the list, is refused before any
  // change).
  ADOPT = 1;
  // Take over the object, and let kci delete it as it deletes its own
  // (never replace it: a replace of an adopted object is refused at plan
  // time at either value).
  ADOPT_DELETABLE = 2;
}

message Resource {
  // Author-chosen and stable: the identity key for state.
  string id = 1;
  repeated Uses uses = 2;
  // Data primitives only (see the file header); unset: the type's default.
  Retention retention = 3;
  // Was a per-resource stage filter in an earlier draft. Stage differences
  // live in the release machine file.
  reserved 4;
  reserved "only_in";
  // 5 is held for a typed per-cloud settings map.

  // THE METADATA (see the file header): the cloud name of the resource's
  // primary object, the author's labels on its objects, and whether kci
  // takes over an existing object of that name. Each applies to every type
  // the catalog allows it on, and each is checked when the graph is
  // validated, before anything is created.
  //
  // The cloud name of the resource's PRIMARY object (the one a reference
  // to the resource lands on). Unset: the cloud adapter names it. It has
  // presence, so a written empty name is told apart from an unwritten one
  // (and refused). The other objects of the resource keep the names the
  // adapter gives them. A changed name on an object kci holds is refused
  // before any change: a new name is a new object. Ownership is read from
  // the stamp, never parsed from a name.
  optional string physical_name = 6;
  // The author's labels, written on every object the resource lowers to
  // that carries labels on its cloud (an object that carries none, such as
  // a policy binding, carries none of them), beside kci's own. A key that
  // starts with `kci_` or `kci-` (kci's identity labels and marks) is
  // refused.
  map<string, string> labels = 7;
  // Whether kci takes over the existing object named `physical_name`
  // (which must be written), and what it may do to it (`Adoption`). Before
  // anything is planned, the object must exist and be what the resource
  // declares (its kind, its name and every field of its shape the cloud can
  // read); a missing or different object refuses the plan. The object is
  // then stamped and recorded instead of being refused as foreign, and kci
  // keeps it in step with the file like any of its own, by updates in place
  // only: a plan that would replace it is refused before any change, at
  // either value. kci did not create it, so when the resource leaves the
  // list, kci RELEASES the object (drops its stamp and its record) and
  // leaves it standing. Unset: an unstamped object of that name refuses the
  // apply. Like every plain field it is written at its default (`40 00`);
  // ADOPT is `40 01` and ADOPT_DELETABLE `40 02`.
  Adoption adopt = 8;
  // An earlier draft's deletable flag, which ADOPT_DELETABLE replaces.
  reserved 9;
  reserved "adopt_deletable";

  // Typed and closed. Held, not declared (see the file header): 17, 19
  // and 32 to 36 the later neutral primitives, 90 the escape hatch,
  // 100-299 / 300-499 / 500-699 / 700-899 the provider primitives of four
  // clouds. 80 is not a primitive: an instance of a composite.
  oneof body {
    Service service = 10;
    ContainerJob container_job = 11;
    Worker worker = 12;
    Table table = 13;
    Bucket bucket = 14;
    Queue queue = 15;
    Secret secret = 16;
    DnsZone dns_zone = 18;
    ServiceAccount service_account = 20;
    Topic topic = 21;
    Schedule schedule = 22;
    Network network = 23;
    Registry registry = 24;
    Grant grant = 25;
    DnsRecord dns_record = 26;
    Certificate certificate = 27;
    Subscription subscription = 28;
    Subnet subnet = 29;
    IpAddress ip_address = 30;
    EventTrigger event_trigger = 31;
    CompositeInstance composite = 80;
  }
}

// `Resource.body` 80: one use of a composite definition (composite.proto),
// in a list or as a component of another definition. kci EXPANDS it into
// its primitives (ids `<top>/<component>/...`, all OWNED by the top-level
// resource) before validating; the engine never sees one. It has no object,
// so `uses`, `retention`, `physical_name`, `labels` and `adopt` (the
// `Adoption`) are refused on it. `definition` and `version` name a given definition; `digest`, when
// written, must be `sha256:<hex>` of its bytes as this kci encodes them.
// Each input is bound by name, in the map of its type: `input` a STRING,
// INT or BOOL input (a `Value`: a literal of the type, or inside a definition
// an input of the same type) and a REF input (a `Ref` naming a resource),
// `image_input` an IMAGE input, `map_input` a VALUE_MAP input. 6 is held
// (secret inputs).
message CompositeInstance {
  string definition = 1;
  string version = 2;
  optional string digest = 3;
  map<string, Value> input = 4;
  map<string, Image> image_input = 5;
  map<string, ValueMap> map_input = 7;
}

// The value of a VALUE_MAP input: plain values by key (an environment, say),
// each a literal, a parameter or another resource's output, as in `env`.
message ValueMap {
  map<string, Value> value = 1;
}

// The resources of one deploy step, in no particular order: ordering is
// derived from the `Ref`s between them.
message ResourceList {
  repeated Resource resource = 1;
}
