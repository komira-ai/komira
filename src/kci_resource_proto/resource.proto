// The kci resource catalog (`kci.resource.v1`): what an author writes in a
// deploy step. The cloud adapter built into kci for the cell's cloud turns
// each resource into engine nodes.
//
// PRIMITIVES AND COMPOSITES
//   * A PRIMITIVE is one `Resource.body` arm of this file. It is 1:1 with a
//     resource kind of the major clouds, and it is the only thing a cloud
//     adapter lowers to engine nodes. Each primitive lowers to a FIXED set of
//     roles per cloud (the provider object plus at most a fixed set of
//     private helper objects that exist only for it and die with it).
//   * A COMPOSITE is DATA, not an arm of this file: a named graph of other
//     resources (primitives or other composites, to any depth) with inputs
//     and outputs. It is expanded into its primitives before lowering, so the
//     engine only ever sees primitives. Its format and its instance arm are
//     not declared yet (body arm 80 is held for the instance).
//
// THE RULE THAT DECIDES A PRIMITIVE'S SHAPE
//   * R1, a NEUTRAL primitive (PORTABLE): one type for a kind whose identity
//     (one provider object plus a fixed set of private helpers), meaning
//     (every field the author must decide means the same thing: same unit,
//     same effect, same failure) and delete (deleting it deletes the same
//     thing) match on every cloud. Differences confined to optional tuning go
//     in per-cloud extension fields; an extension may tune, never change
//     meaning.
//   * R1', a neutral primitive that is CLOUD_BOUND: R1 holds on the clouds
//     that have the kind, and the others have no equivalent at all; they
//     declare it absent by design.
//   * R2, a PROVIDER primitive (CLOUD_BOUND): one type per provider kind,
//     when R1 fails on any cloud (the objects decompose differently, the core
//     field is the provider's own language, or one provider object would be
//     shared by several owners).
//
// V1 DECLARES THREE PRIMITIVES: `service` 10, `job` 11 and `bucket` 14.
// Every other number below is HELD: not declared, so it decodes as an
// unknown field today, and declaring it later is an addition, never a
// renumber. The welded tests pin each held number as undeclared.
//   * `Resource.body` 12, 13 and 15 to 36: the later neutral primitives
//     (12 worker, 13 table, 15 queue, 16 secret, 17 and 19 unused, 18 DNS zone,
//     20 service account, 21 topic, 22 schedule, 23 network, 24 registry,
//     25 grant, 26 DNS record, 27 certificate, 28 subscription, 29 subnet,
//     30 IP address, 31 event trigger, 32 mail domain, 33 parameter,
//     34 encryption key, 35 function, 36 virtual machine).
//   * `Resource.body` 80: a composite instance.
//   * `Resource.body` 90: the `raw` escape hatch, specified separately.
//   * `Resource.body` 100-299, 300-499 and 500-699: provider primitives (R2)
//     of three clouds, one range each.
//   * Fields 50, 51 and 52 of every primitive message: its per-cloud
//     extension messages, one per cloud.
// THE HELD NUMBERS, MACHINE-READABLE. The lines below are what the welded
// test `test_held_numbers_are_unused` reads: no field of the named message may
// use a held number, and no message may reuse a `reserved` number. A held
// number leaves this list in the same change that declares it.
// held-numbers: Resource 5 6 12 13 15-36 80 90 100-299 300-499 500-699
// held-numbers: Value 4
// held-numbers: Image 4
// held-numbers: Service 13 50-52
// held-numbers: Job 8 50-52
// held-numbers: Bucket 50-52
// Provider primitives and per-cloud extensions carry provider words in their
// names. Declaring any of them changes the promise below that no vendor word
// appears in this schema, so it is a recorded decision, not an addition.
//
// WHAT THIS FILE PROMISES
//   * Every field is a BEHAVIOUR (a port, a scale, a public URL, an expiry),
//     never a part of somebody's product. No vendor word appears in a
//     message, field or enum value name.
//   * The resource types are a CLOSED oneof. There is no kind string, no
//     `google.protobuf.Any` and no provider enum: which cloud a graph runs
//     on comes from the cell the stage deploys to (`--cloud=<id>`), never
//     from this file.
//   * Every field that names another resource is a `Ref`. The only
//     id-bearing string is `Resource.id`. So one walk over `Ref` fields finds
//     every edge of the graph.
//
// WHAT IS NOT HERE YET, ON PURPOSE
//   * Identity, permissions, networks, gateways, load balancers and DNS
//     records as resources of their own. Each is a later primitive at a held
//     number above (or a provider primitive). Until it lands, the cloud
//     adapter creates what a `service` or a `job` needs as that type's own
//     roles, and "this may call that" is one `Uses` line on the consumer.
//   * Stage names. A stage's list of resources lives in the release machine
//     file; no resource carries the name of a stage.
//   * A secret RESOURCE, and secret values. A service or a job receives a
//     secret that already exists BY NAME (`SecretRef`); kci never reads,
//     writes or stores the value. No `Value` ever carries a secret: `Value`
//     field 4 stays held.
//
// RETENTION (`Resource.retention`) says whether a resource's objects are
// deleted when the resource leaves the file or the graph is destroyed. It
// is for DATA primitives only (v1: `bucket`); each such type has a versioned
// default (KEEP for a bucket) that applies while the field is unset. A
// service or a job is always deleted with its resource, and setting
// retention on one is refused when the graph is validated. A third answer,
// "kci cannot delete this", is a capability of a cloud object, not a policy
// an author chooses, so it has no value here.
//
// RESERVED NOW, BUILT LATER (held numbers, not declared; each is an addition
// when it lands): `Resource` 5 a typed per-cloud settings map, `Resource` 6
// `physical_name` (keep an existing cloud name), `Image` 4 an `artifact_ref
// { name, platform, revision }` source arm beside `output`, `Service` 13 and
// `Job` 8 a `source` that may also be a non-image artifact, and `Output` 5
// REVISION (the cloud's own revision of a service, not kci's revision id).
// Per-cloud extensions 50, 51 and 52 are held on `Bucket` as on every
// primitive.
//
// "PLATFORM" MEANS OS + CPU AND NOTHING ELSE (`Image.platform`). The deploy
// target is the cloud, which this file never names.
//
// Field numbers are what is stored. They are pinned as literal wire bytes by
// the welded tests in tests/; renumbering a field is protoc-legal and decodes
// stored data as the wrong field, so the tests are the guard.
syntax = "proto3";

package kci.resource.v1;

import "google/protobuf/descriptor.proto";
import "google/protobuf/duration.proto";

// ---- the catalog's one declared bit ------------------------------------------

// Whether every complete cloud must host a type. PORTABLE: a complete cloud
// implements it or carries a ledgered gap. CLOUD_BOUND: partial coverage is
// legitimate, and applying it on a cloud with no adapter for it is refused
// before anything is created. UNSET is never a legal marking.
enum Portability {
  PORTABILITY_UNSET = 0;
  PORTABLE = 1;
  CLOUD_BOUND = 2;
}

extend google.protobuf.MessageOptions {
  // Marks each resource type message below (v1: `Service`, `Job`, `Bucket`).
  Portability portability = 50001;
  // The outputs a type exposes to a `Ref`. A `Ref` asking a type for an
  // output it does not expose is refused when the graph is loaded.
  repeated Output exposes = 50002;
}

// ---- references ----------------------------------------------------------------

// What a produced value IS, never whose attribute it is. ADDRESS is where a
// client reaches the object (a bucket's URI); NAME is the cloud's own name
// for it. 5 is held for REVISION (the cloud's revision of a service, never
// kci's revision id).
enum Output {
  OUTPUT_UNSET = 0;
  URL = 1;
  HOST = 2;
  ADDRESS = 3;
  NAME = 4;
}

// A reference to another resource of the same list. With neither arm of
// `output` set it names the resource itself (as in `Uses.target`); with
// `standard` set it names one value the resource
// produces at apply time. `named` is reserved for the escape hatch's own
// outputs and is refused for every other producer.
message Ref {
  string resource = 1;
  oneof output {
    Output standard = 2;
    string named = 3;
  }
}

// What a consumer may do to a resource. CALL is accepted by a service and a
// job; READ, WRITE and READ_WRITE by a bucket. 5 and 6 are held for SEND and
// RECEIVE (messaging), 7 for ACT_AS, 8 for DESCRIBE and 9 for MANAGE; none
// is declared until a type accepts it.
enum Access {
  ACCESS_UNSET = 0;
  CALL = 1;
  READ = 2;
  WRITE = 3;
  READ_WRITE = 4;
}

// Whether a data resource's objects are deleted when the resource leaves the
// file or the graph is destroyed. UNSET means the type's versioned default.
enum Retention {
  RETENTION_UNSET = 0;
  DELETE = 1;
  KEEP = 2;
}

// "This resource may do `access` to `target`." The cloud adapter turns it into
// whatever its own permission system needs. `target.output` must be unset:
// access is granted to a resource, not to one of its values.
message Uses {
  Ref target = 1;
  Access access = 2;
}

// A configuration value: a literal, a release machine parameter, or a value
// another resource produces. All three are plain (not secret) values. 4 is
// held; a secret never rides a `Value` (see `SecretRef`).
message Value {
  oneof v {
    string literal = 1;
    string param = 2;
    Ref ref = 3;
  }
}

// An output of an earlier BUILD step of the same run of the release
// machine. A different namespace from `Ref`: resolved before the deploy
// graph exists, and never a graph edge.
message StepOutput {
  string step = 1;
  string name = 2;
}

// What to run: a build step's output, or a literal content digest. Never a
// mutable tag. 4 is held for an `artifact_ref` arm (an artifact of another
// revision).
//
// `platform` is the OS + CPU of the build, an OCI-style string such as
// "linux/amd64": the step output of that platform, or, for a digest, that
// the digest is of that platform's single image (not a multi-platform
// index). It is the same spelling every other kci file uses. Empty means the
// v1 default, "linux/amd64"; that default is fixed, because stored lists
// rely on it. In v1, linux/amd64 is the only platform a reader accepts: any
// other value decodes, and is refused when the graph is validated, before
// anything is created.
message Image {
  oneof source {
    StepOutput output = 1;
    string digest = 2;
  }
  string platform = 3;
}

// A secret that already exists in the cell's secret store, named, never
// valued. kci passes the REFERENCE to the cloud adapter, which makes the
// secret's value available to the container at run time; the value is never
// in this file, in kci's state or in kci's memory. Creating the secret's
// container is bootstrap's job; there is no secret resource in v1. The map
// key of a `secret_env` field is the environment variable the container
// reads it from.
//
// `store` names the secret store (unset: the cell's default store);
// `version` pins one version of the value (unset: the latest). Both have
// presence, so "not written" is never confused with a written empty string.
message SecretRef {
  string name = 1;
  optional string store = 2;
  optional string version = 3;
}

// ---- one entry of a deploy step's list ----------------------------------------

message Resource {
  // Author-chosen and stable: the identity key for state.
  string id = 1;
  repeated Uses uses = 2;
  // Data primitives only (see the file header); unset: the type's default.
  Retention retention = 3;
  // Was a per-resource stage filter in an earlier draft. Stage differences
  // live in the release machine file.
  reserved 4;
  reserved "only_in";
  // 5 is held for a typed per-cloud settings map, 6 for `physical_name`.

  // Typed and closed. Held, not declared (see the file header): 12, 13 and
  // 15 to 36 the later neutral primitives, 80 a composite instance, 90 the
  // escape hatch, 100-299 / 300-499 / 500-699 the provider primitives of
  // three clouds.
  oneof body {
    Service service = 10;
    Job job = 11;
    Bucket bucket = 14;
  }
}

// The resources of one deploy step, in no particular order: ordering is
// derived from the `Ref`s between them.
message ResourceList {
  repeated Resource resource = 1;
}

// ---- shared shapes -------------------------------------------------------------

// Neutral sizes.
message Size {
  uint32 cpu_millis = 1;
  uint32 memory_mb = 2;
}

// Instance bounds. `min = 0` allows scaling to zero; `min` has presence, so
// an explicit 0 is told apart from "not written" (the versioned default).
message Scale {
  optional uint32 min = 1;
  uint32 max = 2;
}

// ---- the v1 types: service and job -------------------------------------------------

// A container that answers requests, scales (to zero if allowed) and may have
// a public URL.
message Service {
  option (portability) = PORTABLE;
  option (exposes) = URL;
  option (exposes) = HOST;

  Image image = 1;
  uint32 port = 2;
  repeated string args = 3;
  map<string, Value> env = 4;
  Size size = 5;
  Scale scale = 6;
  string health_path = 7;
  // Behaviours, not products: an adapter reports a finding when the
  // cloud's ceiling is lower.
  google.protobuf.Duration request_timeout = 8;
  uint32 max_concurrency = 9;

  // "A public URL" is an arm, not a gateway resource.
  oneof exposure {
    Public public = 10;
    Internal internal = 11;
  }

  // Secrets this service receives by reference, keyed by environment
  // variable. A key must not also appear in `env`.
  map<string, SecretRef> secret_env = 12;
  // 13 is held for a `source` that may be a non-image artifact.
  // 50, 51 and 52 are held for the per-cloud extensions (file header).

  // Reachable from outside the graph at a URL.
  message Public {}
  // No public URL; callable by other resources of this graph. Not a
  // statement about networks.
  message Internal {}
}

// A container that runs to completion, on demand or on a schedule.
message Job {
  option (portability) = PORTABLE;

  Image image = 1;
  repeated string args = 2;
  Size size = 3;
  // Presence: an explicit 0 ("never retry") is told apart from "not
  // written" (the versioned default).
  optional uint32 max_retries = 4;
  google.protobuf.Duration timeout = 5;
  // Plain values only, as on `Service.env`: a literal, a parameter or
  // another resource's output. Secrets go in `secret_env`.
  map<string, Value> env = 6;
  // Secrets this job receives by reference, keyed by environment variable.
  // A key must not also appear in `env`.
  map<string, SecretRef> secret_env = 7;
  // 8 is held for a `source` that may be a non-image artifact.
  // 50, 51 and 52 are held for the per-cloud extensions (file header).

  oneof trigger {
    OnDemand on_demand = 10;
    Schedule schedule = 11;
  }

  message OnDemand {}
  // Part of the job, not a second resource.
  message Schedule {
    string cron = 1;
    string timezone = 2;
  }
}

// ---- data: bucket ----------------------------------------------------------------

// Behaviours, not product names: how often objects are read, never a
// provider's storage class.
enum StorageTier {
  STORAGE_TIER_UNSET = 0;
  STANDARD = 1;
  INFREQUENT = 2;
  ARCHIVE = 3;
}

// An object store container. Access is always uniform (granted per
// resource, never per object) and public access is always prevented. Its
// retention default is KEEP: removing a bucket from the file leaves it in
// the cloud unless `retention: DELETE` is written.
message Bucket {
  option (portability) = PORTABLE;
  option (exposes) = NAME;
  option (exposes) = ADDRESS;

  // Days after which an object is deleted. Presence: unset means never; an
  // explicit 0 (expire every object at once) is refused when the graph is
  // validated.
  optional uint32 object_expiry_days = 1;
  // Keep earlier versions of an overwritten or deleted object.
  bool versioning = 2;
  // UNSET means STANDARD.
  StorageTier tier = 3;
  // 50, 51 and 52 are held for the per-cloud extensions (file header).
}
