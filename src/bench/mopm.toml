[package]
name = "komira-ai/bench"
version = "0.1.0"
description = "Microbenchmarks of komira libraries as programs, with the harness they share: the spsc_ring ring benchmark first. Published as source: mopm run --bin bench:spsc_ring."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.1.0", "1.2.0"]

[dependencies]
"komira-ai/atomic_alias" = { path = "../atomic_alias", version = "0.1" }
"komira-ai/spsc_ring" = { path = "../spsc_ring", version = "0.1" }

[targets]
lib = { path = "src/bench" }
bins = [{ name = "spsc_ring", path = "bins/run_spsc_ring.mojo" }]
tests = ["tests"]
