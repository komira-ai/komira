[package]
name = "komira-ai/contacts_proto"
version = "0.1.0"
description = "The resources of a contacts service's JSON API (komira.contacts.v1) as Mojo structs generated from its .proto file, with their proto3 JSON form."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.1.0", "1.2.0"]

[dependencies]
"komira-ai/proto_codec" = { path = "../proto_codec", version = "0.1" }

[targets]
lib = { path = "generated/contacts_proto" }
tests = ["tests"]
