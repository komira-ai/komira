[package]
name = "komira_exec_types"
version = "0.1.0"
description = "The result and error types that cross the operator, scheduler and caller boundary: EngineError, ExecResult, ProcessResult, QueryContext, the byte-budget parser and the PartitionBy output contract."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.0.0"]

[dependencies]
komira_arrow = { path = "../komira_arrow", version = "0.1" }

[targets]
lib = { path = "src/komira_exec_types" }
tests = ["tests"]
