[package]
name = "komira_xml"
version = "0.1.0"
description = "An XML 1.0 codec in Mojo, with no dependencies: a strict namespace-aware parser (every DTD refused), a forward-only pull reader, a streaming writer, an owned tree with a canonical form, and escaping."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.0.0"]

[targets]
lib = { path = "src/komira_xml" }
tests = ["tests"]
