[package]
name = "kci_artifact"
version = "0.1.0"
description = "Reads the reviewed artifacts file, validates it, and renders the argv that builds one artifact."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.0.0"]

[dependencies]
kci_api = { path = "../kci_api", version = "0.1" }
kci_artifact_proto = { path = "../kci_artifact_proto", version = "0.1" }
komira_textproto = { path = "../komira_textproto", version = "0.1" }

[dev-dependencies]
komira_proto_codec = { path = "../komira_proto_codec", version = "0.1" }

[targets]
lib = { path = "src/kci_artifact" }
tests = ["tests"]
