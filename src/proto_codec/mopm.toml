[package]
name = "komira-ai/proto_codec"
version = "0.1.0"
description = "The codec runtime of generated protobuf messages: a message's fields written once encode as protobuf binary or proto3 canonical JSON, the format chosen at compile time."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.1.0", "1.2.0"]

[dependencies]
"komira-ai/encoding" = { path = "../encoding", version = "0.1" }
"komira-ai/json" = { path = "../json", version = "0.1" }
"komira-ai/protobuf" = { path = "../protobuf", version = "0.1" }

[targets]
lib = { path = "src/proto_codec" }
tests = ["tests"]
