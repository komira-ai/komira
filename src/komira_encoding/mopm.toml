[package]
name = "komira_encoding"
version = "0.1.0"
description = "Binary-to-text encodings (base64, base64url, base32, hex) and PEM armor (RFC 7468) in Mojo, with constant-time decoding and strict, canonical-only input."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.0.0"]

[targets]
lib = { path = "src/komira_encoding" }
tests = ["tests"]
