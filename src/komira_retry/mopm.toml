[package]
name = "komira_retry"
version = "0.1.0"
description = "Retry policy for Mojo with no dependencies: exponential backoff with full or banded jitter, an optional retry budget, and a sleeping loop whose clock, sleeper and random source are injected. Which failures to retry is the caller's classifier."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.0.0"]

[targets]
lib = { path = "src/komira_retry" }
tests = ["tests"]
