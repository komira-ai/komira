[package]
name = "komira_kg_spec"
version = "0.1.0"
description = "The build configuration of one knowledge graph (sources, extract config, synthesis binding, trigger), its scope reference, its validation and the fail-safe resolution of its extract mode."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.0.0"]

[dependencies]
komira_kg_mode = { path = "../komira_kg_mode", version = "0.1" }

[targets]
lib = { path = "src/komira_kg_spec" }
tests = ["tests"]
