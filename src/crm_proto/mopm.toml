[package]
name = "komira-ai/crm_proto"
version = "0.1.0"
description = "The resources of a CRM's JSON API (komira.crm.v1) as Mojo structs generated from its .proto file, with their proto3 JSON form."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.1.0", "1.2.0"]

[dependencies]
"komira-ai/proto_codec" = { path = "../proto_codec", version = "0.1" }
"komira-ai/wkt" = { path = "../wkt", version = "0.1" }

[targets]
lib = { path = "generated/crm_proto" }
tests = ["tests"]
