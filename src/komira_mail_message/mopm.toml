[package]
name = "komira_mail_message"
version = "0.1.0"
description = "Email messages over bytes: compose and parse RFC 5322 messages with MIME and RFC 2047 encoded words."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.0.0"]

[dependencies]
komira_buffer = { path = "../komira_buffer", version = "0.1" }
komira_datetime = { path = "../komira_datetime", version = "0.1" }
komira_encoding = { path = "../komira_encoding", version = "0.1" }
komira_mail_address = { path = "../komira_mail_address", version = "0.1" }

[targets]
lib = { path = "src/komira_mail_message" }
tests = ["tests"]
