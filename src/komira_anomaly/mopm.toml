[package]
name = "komira_anomaly"
version = "0.1.0"
description = "Regression detection over an abstract series of ordered numbers in Mojo, with no dependencies: an E-divisive change-point detector with a seeded permutation test, an advisory CUSUM chart, O(1) running bounds, and the series and store seams a producer implements."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.0.0"]

[targets]
lib = { path = "src/komira_anomaly" }
tests = ["tests"]
