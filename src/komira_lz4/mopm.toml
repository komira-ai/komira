[package]
name = "komira_lz4"
version = "0.1.0"
description = "The LZ4 raw block and frame codecs over the system liblz4, opened at run time."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.0.0"]

[native-dependencies]
lz4 = { version = ">=1.9.3,<2", kind = "shared", mode = "load" }

[targets]
lib = { path = "src/komira_lz4" }
tests = ["tests"]
