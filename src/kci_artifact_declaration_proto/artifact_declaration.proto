// The artifact declarations: the one reviewed list of what kci builds and
// publishes, and the build system that builds each.
//
// kci models a build system generically and knows no build tool by name:
// the build system builds, kci only ships. A build system is a program and
// the flags it is always run with; whatever it needs is installed in the
// container kci runs in. There is no list of supported build tools, no
// kind of artifact and no enum anywhere in this file.
//
// THE CONTRACT. For each artifact kci creates an EMPTY output directory and
// runs
//
//   <executable> <build_system.args...> <artifact.args...>
//
// with every occurrence of the literal token `{out_dir}` in any argument
// replaced by that directory's absolute path. `{out_dir}` is the only
// placeholder; any other `{<identifier>}` is refused (a brace not around
// an identifier is passed through as written). The build must leave in that
// directory the artifact files and one kci artifact manifest per artifact
// (the format of //src/kci_artifact_manifest), each named
// `<anything>.kci_manifest.json`. kci ships exactly what those manifests
// describe: the artifact type, name, version, platform, file, sha256 and
// metadata all come from the built manifest, never from this file. A build
// that exits non-zero, or leaves no manifest, is refused.
//
// Buck2 needs no special code: a build system `buck2` with args
// `["build", "--config-file", "/etc/kci/remote.buckconfig"]` and artifact
// args `["//packaging/conda:foo[release]", "--out", "{out_dir}"]`. The
// subcommand belongs in the build system's args because those come first and
// buck2 accepts `--config-file` only after the subcommand. What
// `buck2 build --out <existing dir>` copies is the ONE default output of the
// ONE target named: a single file lands in the directory under its own
// name, the CONTENTS of a directory output land directly in it (files
// already there are kept, which is why kci starts from an empty one), and
// two or more default outputs, or two targets, are refused ("choice of
// output is ambiguous"). So the target's default output must be a DIRECTORY
// holding the artifact and its kci manifest.
//
// Set-level rules (every declared artifact built, versions in lockstep, a
// metapackage published after its members, each package's requirements
// closed over the set and its channel) need the built manifests, so they are
// checked by kci publish over those manifests, not here.
//
// Deliberately absent: a version, a sha256, a file name, a platform and an
// artifact type (the built manifest carries them), credentials and the
// channel's repository (the channels file holds them, by secret name).
//
// Other `.proto` files import it as `kci/release/v1/artifact_declaration.proto`.
syntax = "proto3";

package kci.release.v1;

// A declarations file: the build systems, then every artifact kci may build
// or publish, each once.
message ArtifactDeclarations {
  repeated BuildSystem build_systems = 1;
  repeated ArtifactDeclaration artifacts = 2;
}

// A program kci runs to build an artifact, and the flags it always gets.
message BuildSystem {
  // The name artifacts refer to it by; `[a-z][a-z0-9_]*`, unique among the
  // build systems.
  string name = 1;

  // Required. A program name, resolved on PATH, or an absolute path. No
  // whitespace, and no relative path (`./buck2` would resolve against a
  // working directory the file does not state).
  string executable = 2;

  // Args passed on every invocation, before the artifact's own, e.g.
  // `["build", "--config-file", "/etc/kci/remote.buckconfig"]`. May be empty; no
  // entry may be. `{out_dir}` is substituted here too.
  repeated string args = 3;
}

message ArtifactDeclaration {
  // kci's handle for the artifact (selection, logs, refusals);
  // `[a-z][a-z0-9_]*`, unique among the artifacts. The published name is the
  // built manifest's `name`.
  string name = 1;

  // The release channels (names in the channels file) this artifact may be
  // published to. REQUIRED and non-empty, pending a CEO ruling: without it
  // an internal package would be publishable to a PUBLIC channel by default,
  // so a new declaration goes nowhere until it names a channel. The channel
  // of a run is chosen by the run; this only says which runs may carry it.
  repeated string allowed_channels = 2;

  // The name of a declared BuildSystem.
  string build_system = 3;

  // Appended after the build system's args. Non-empty, no empty entry, and
  // `{out_dir}` must appear in the combined args (build system's and these):
  // otherwise kci cannot know where the outputs are.
  repeated string args = 4;
}
