[package]
name = "komira_bench"
version = "0.1.0"
description = "Microbenchmarks of komira libraries as programs, with the harness they share: the komira_spsc_ring ring benchmark first. Published as source: mopm run --bin komira_bench:spsc_ring."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.0.0"]

[dependencies]
komira_atomic_alias = { path = "../komira_atomic_alias", version = "0.1" }
komira_spsc_ring = { path = "../komira_spsc_ring", version = "0.1" }

[targets]
lib = { path = "src/komira_bench" }
bins = [{ name = "spsc_ring", path = "bins/spsc_ring.mojo" }]
tests = ["tests"]
