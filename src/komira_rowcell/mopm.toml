[package]
name = "komira_rowcell"
version = "0.1.0"
description = "RowCell in Mojo, with no dependencies: one typed table cell over six scalar kinds or a typed NULL, typed constructors, and value equality of cells and rows."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.0.0"]

[targets]
lib = { path = "src/komira_rowcell" }
tests = ["tests"]
