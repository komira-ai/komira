// Cloud Run Admin v2's binding of the google.longrunning.Operations mixin.
//
// The Run API serves the long-running operations its Create, Update, Delete,
// Run and Cancel methods return under its own paths. No .proto states them:
// they are the `http.rules` of the API's service configuration,
// google/cloud/run/v2/run_v2.yaml, at the googleapis pin
// (//tools/vendor/googleapis). This file restates the two of them a caller
// polls with, on the request and response messages of
// google/longrunning/operations.proto, so the REST client generator can
// generate them. tests/test_run_operations_mixin.mojo reads run_v2.yaml at
// the pin and fails if either binding here differs from it.
syntax = "proto3";

package komira.gcp.run.v2;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/longrunning/operations.proto";

service Operations {
  option (google.api.default_host) = "run.googleapis.com";

  rpc GetOperation(google.longrunning.GetOperationRequest)
      returns (google.longrunning.Operation) {
    option (google.api.http) = {
      get: "/v2/{name=projects/*/locations/*/operations/*}"
    };
  }

  rpc WaitOperation(google.longrunning.WaitOperationRequest)
      returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v2/{name=projects/*/locations/*/operations/*}:wait"
      body: "*"
    };
  }
}
