[package]
name = "komira_kafka_server"
version = "0.1.0"
description = "The Kafka wire protocol in pure Mojo: primitive types, framing, the v2 RecordBatch with CRC-32C and the request and response schemas of the handshake, data, consumer-group, topic-admin, idempotent-producer and transactional APIs, with no dependencies."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.0.0"]

[targets]
lib = { path = "src/komira_kafka_server" }
tests = ["tests"]
