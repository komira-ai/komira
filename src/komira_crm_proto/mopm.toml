[package]
name = "komira_crm_proto"
version = "0.1.0"
description = "The resources of a CRM's JSON API (komira.crm.v1) as Mojo structs generated from its .proto file, with their proto3 JSON form."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.0.0"]

[dependencies]
komira_proto_codec = { path = "../komira_proto_codec", version = "0.1" }
komira_wkt = { path = "../komira_wkt", version = "0.1" }

[targets]
lib = { path = "generated/komira_crm_proto_generated" }
tests = ["tests"]
