[package]
name = "komira_content_line"
version = "0.1.0"
description = "The content-line layer vCard and iCalendar share, in Mojo with no dependencies: unfolding with input and line limits and UTF-8 validation, the group/name/parameter/value lexer, folding at 75 octets, and TEXT escaping with split-before-unescape."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.0.0"]

[targets]
lib = { path = "src/komira_content_line" }
tests = ["tests"]
