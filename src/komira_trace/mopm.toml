[package]
name = "komira_trace"
version = "0.1.0"
description = "A span tracer: per-worker span-packet rings, the Tracer, and the JSONL and in-memory span exporters."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.0.0"]

[dependencies]
komira_atomic_alias = { path = "../komira_atomic_alias", version = "0.1" }
komira_clock = { path = "../komira_clock", version = "0.1" }
komira_collections = { path = "../komira_collections", version = "0.1" }
komira_name_registry = { path = "../komira_name_registry", version = "0.1" }
komira_spsc_ring = { path = "../komira_spsc_ring", version = "0.1" }

[dev-dependencies]
komira_fork_join = { path = "../komira_fork_join", version = "0.1" }
komira_runtime_paths = { path = "../komira_runtime_paths", version = "0.1" }

[targets]
lib = { path = "src/komira_trace" }
tests = ["tests"]
