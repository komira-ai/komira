[package]
name = "komira-ai/sync"
version = "0.1.0"
description = "SpinMutex, a mutual-exclusion lock for plain (non-async) code, over one atomic word."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.1.0", "1.2.0"]

[dependencies]
"komira-ai/atomic_alias" = { path = "../atomic_alias", version = "0.1" }

[dev-dependencies]
"komira-ai/fork_join" = { path = "../fork_join", version = "0.1" }

[targets]
lib = { path = "src/sync" }
tests = ["tests"]
