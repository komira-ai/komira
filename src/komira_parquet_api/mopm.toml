[package]
name = "komira_parquet_api"
version = "0.1.0"
description = "The Parquet format's types and footer metadata as plain Mojo values: the Thrift enums, the footer structs and the HyperLogLog key-value encoding, with no dependencies."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.0.0"]

[targets]
lib = { path = "src/komira_parquet_api" }
tests = ["tests"]
