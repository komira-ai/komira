[package]
name = "komira-ai/mail_message"
version = "0.1.0"
description = "Email messages over bytes: compose and parse RFC 5322 messages with MIME and RFC 2047 encoded words."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.1.0", "1.2.0"]

[dependencies]
"komira-ai/byte_buffer" = { path = "../byte_buffer", version = "0.1" }
"komira-ai/datetime" = { path = "../datetime", version = "0.1" }
"komira-ai/encoding" = { path = "../encoding", version = "0.1" }
"komira-ai/mail_address" = { path = "../mail_address", version = "0.1" }

[targets]
lib = { path = "src/mail_message" }
tests = ["tests"]
