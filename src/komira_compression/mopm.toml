[package]
name = "komira_compression"
version = "0.1.0"
description = "The byte-stream codec trait and the snappy, zstd, gzip, LZ4, bzip2 and xz codecs, over the system libraries opened at run time."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.0.0"]

[dependencies]
komira_lz4 = { path = "../komira_lz4", version = "0.1" }
komira_zlib = { path = "../komira_zlib", version = "0.1" }

[native-dependencies]
bz2 = { version = ">=1.0.8,<2", kind = "shared", mode = "load" }
lzma = { version = ">=5.2.5,<6", kind = "shared", mode = "load" }
snappy = { version = ">=1.1.9,<2", kind = "shared", mode = "load" }
zstd = { version = ">=1.5.2,<2", kind = "shared", mode = "load" }

[targets]
lib = { path = "src/komira_compression" }
tests = ["tests"]
