[package]
name = "komira-ai/supervisor_proto"
version = "0.1.0"
description = "The wire contract between a job supervisor and the coordinator it reports to (komira.supervisor.v1) as Mojo structs generated from its .proto file."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.1.0", "1.2.0"]

[dependencies]
"komira-ai/broker_proto" = { path = "../broker_proto", version = "0.1" }
"komira-ai/proto_codec" = { path = "../proto_codec", version = "0.1" }

[targets]
lib = { path = "generated/supervisor_proto" }
tests = ["tests"]
