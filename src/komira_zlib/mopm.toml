[package]
name = "komira_zlib"
version = "0.1.0"
description = "One-shot deflate and inflate, a bounded stream skipper and CRC-32 over the system libz, opened at run time."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.0.0"]

[native-dependencies]
zlib = { version = ">=1.2.13,<2", kind = "shared", mode = "load" }

[targets]
lib = { path = "src/komira_zlib" }
tests = ["tests"]
