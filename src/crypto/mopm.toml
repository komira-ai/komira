[package]
name = "komira-ai/crypto"
version = "0.1.0"
description = "Cryptographic primitives: SHA-1 and SHA-2, BLAKE2b-256, HMAC, HKDF, PBKDF2, AES-GCM, ChaCha20-Poly1305, X25519, Ed25519, ECDSA P-256 and P-384, RSA, a health-tested entropy source and DRBG, and X.509 chain validation, over aws-lc."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.1.0", "1.2.0"]

[dependencies]
"komira-ai/awslc" = { path = "../awslc", version = "0.1" }
"komira-ai/encoding" = { path = "../encoding", version = "0.1" }

[dev-dependencies]
# tests/test_awslc_one_copy.mojo builds one unit from crypto and uuid, which share the one aws-lc archive.
"komira-ai/uuid" = { path = "../uuid", version = "0.1" }

# The wrapper over aws-lc's SHA-256 block functions (they are hidden in aws-lc's assembly, so Mojo reaches them through these entries). aws-lc itself is awslc's archive.
[native.komira_crypto_sha256_hw]
kind = "static"
srcs = ["native/komira_crypto_sha256_hw.c"]
needs = ["libawslc.a"]

[targets]
lib = { path = "src/crypto" }
tests = ["tests"]
