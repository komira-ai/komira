[package]
name = "komira-ai/clock"
version = "0.1.0"
description = "The process clocks: monotonic nanoseconds, wall-clock milliseconds and microseconds, and the calling thread's CPU nanoseconds."
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira"
readme = "README.md"
mojo = ["1.1.0", "1.2.0"]

[dev-dependencies]
"komira-ai/fork_join" = { path = "../fork_join", version = "0.1" }

[targets]
lib = { path = "src/clock" }
tests = ["tests"]
